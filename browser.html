<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNYCODEX-UNIVERSITY-COLLABORATORS-HEAD-START -->
<link rel="stylesheet" href="/css/university-collaborators.css?v=2">
<script src="/js/university-collaborators.js?v=2" defer></script>
<!-- PUNYCODEX-UNIVERSITY-COLLABORATORS-HEAD-END -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUNYCODEX Browser</title>
  <meta name="description" content="A browser shell for the Unicode web, powered by PUNYCODEX.">
  <link rel="canonical" href="https://punycodex.com/browser.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/search-system.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--cn-void); }
  </style>
</head>
<body class="cn-browser">
  <header class="cn-browser-global-header">
    <a href="/" class="cn-browser-wordmark" aria-label="PUNYCODEX home">PUNYCODEX</a>
    <nav class="cn-browser-global-nav">
      <a href="/pantheon/">Pantheon</a>
      <a href="/lexicon/">Lexicon</a>
      <a href="/type/">Type</a>
      <a href="/tiers/">Tiers</a>
    </nav>
  </header>

  <div class="cn-browser-toolbar">
    <button class="cn-browser-btn" id="backBtn" title="Back">←</button>
    <button class="cn-browser-btn" id="forwardBtn" title="Forward">→</button>
    <button class="cn-browser-btn" id="reloadBtn" title="Reload">↻</button>
    <button class="cn-browser-btn" id="homeBtn" title="Home">⌂</button>
    <div class="cn-browser-omnibox-wrap">
      <input type="text" class="cn-browser-omnibox" id="omnibox" placeholder="Search or enter address" autocomplete="off">
    </div>
    <button class="cn-browser-btn" id="sidebarBtn" title="Toggle Scriptorium">☰</button>
    <button class="cn-browser-btn" id="paletteBtn" title="Command palette">⌘</button>
  </div>

  <div class="cn-browser-tabbar" id="tabBar">
    <div class="cn-browser-newtab" id="newTabBtn" title="New tab">+</div>
  </div>

  <div class="cn-browser-workspace">
    <aside class="cn-browser-sidebar" id="sidebar">
      <h3>Scriptorium</h3>
      <div class="cn-browser-sidebar-list" id="sidebarList"></div>
    </aside>
    <main class="cn-browser-content" id="content"></main>
  </div>

  <!-- Command palette -->
  <div class="cn-palette-overlay" id="paletteOverlay">
    <div class="cn-palette">
      <input type="text" class="cn-palette-input" id="paletteInput" placeholder="Type a command, page, or name…" autocomplete="off">
      <div class="cn-palette-results" id="paletteResults"></div>
    </div>
  </div>

  <!-- Shortcuts help -->
  <div class="cn-palette-overlay" id="helpOverlay" style="align-items:center;padding-top:0">
    <div class="cn-palette" style="max-width:480px">
      <div style="padding:1.25rem 1.1rem;border-bottom:1px solid var(--cn-border)">
        <div class="cn-card-title" style="color:var(--cn-gold);margin:0">Keyboard Shortcuts</div>
      </div>
      <div style="padding:0.5rem 0">
        <div class="cn-palette-item"><span>Focus omnibox</span><span class="cn-palette-cmd">/</span></div>
        <div class="cn-palette-item"><span>New tab</span><span class="cn-palette-cmd">t</span></div>
        <div class="cn-palette-item"><span>Close tab</span><span class="cn-palette-cmd">x</span></div>
        <div class="cn-palette-item"><span>Next / previous tab</span><span class="cn-palette-cmd">j / k</span></div>
        <div class="cn-palette-item"><span>Command palette</span><span class="cn-palette-cmd">Ctrl/⌘ K</span></div>
        <div class="cn-palette-item"><span>Toggle sidebar</span><span class="cn-palette-cmd">s</span></div>
        <div class="cn-palette-item"><span>Show shortcuts</span><span class="cn-palette-cmd">?</span></div>
      </div>
      <div style="padding:0.75rem 1.1rem;border-top:1px solid var(--cn-border);text-align:right">
        <button id="closeHelp" class="cn-btn cn-btn-secondary" style="padding:0.4rem 0.9rem">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/px-core.js?v=perf8"></script>
  <script src="/js/search-effects.js"></script>
  <script>
    const contentEl = document.getElementById('content');
    const tabBar = document.getElementById('tabBar');
    const omnibox = document.getElementById('omnibox');
    const sidebar = document.getElementById('sidebar');
    const sidebarList = document.getElementById('sidebarList');
    const paletteOverlay = document.getElementById('paletteOverlay');
    const paletteInput = document.getElementById('paletteInput');
    const paletteResults = document.getElementById('paletteResults');
    const helpOverlay = document.getElementById('helpOverlay');

    let tabs = [];
    let activeTabId = null;
    let tabCounter = 0;
    let historyStack = JSON.parse(localStorage.getItem('punycodex_browser_history') || '[]');
    let savedItems = JSON.parse(localStorage.getItem('punycodex_browser_saved') || '[]');
    let workspaces = JSON.parse(localStorage.getItem('punycodex_workspaces') || '[]');

    const COMMANDS = [
      { id: 'new-tab', title: 'New Tab', action: () => addTab() },
      { id: 'close-tab', title: 'Close Tab', action: () => closeTab(activeTabId) },
      { id: 'reload', title: 'Reload', action: () => reloadTab() },
      { id: 'home', title: 'Go Home', action: () => navigateTab('search-v2.html') },
      { id: 'toggle-sidebar', title: 'Toggle Scriptorium', action: toggleSidebar },
      { id: 'show-shortcuts', title: 'Keyboard Shortcuts', action: toggleHelp },
      { id: 'save-workspace', title: 'Save Workspace', action: saveWorkspace },
      { id: 'clear-history', title: 'Clear History', action: clearHistory },
    ];

    function init() {
      if (tabs.length === 0) addTab('search-v2.html');
      renderTabs();
      renderSidebar();
      setupKeyboard();

      const params = new URLSearchParams(location.search);
      const url = params.get('url');
      const workspace = params.get('workspace');
      if (url) {
        addTab(url);
      } else if (workspace) {
        restoreWorkspace(workspace);
      }
    }

    function addTab(url = null, title = 'New Tab') {
      const id = `tab-${++tabCounter}`;
      const tab = { id, url: url || 'about:newtab', title, favicon: null };
      tabs.push(tab);
      createPane(tab);
      setActiveTab(id);
      if (url) navigateTab(url, id);
      return id;
    }

    function createPane(tab) {
      const pane = document.createElement('div');
      pane.className = 'cn-browser-pane';
      pane.id = `pane-${tab.id}`;
      pane.dataset.tabId = tab.id;
      contentEl.appendChild(pane);
    }

    function setActiveTab(id) {
      activeTabId = id;
      document.querySelectorAll('.cn-browser-pane').forEach(p => p.classList.toggle('active', p.dataset.tabId === id));
      document.querySelectorAll('.cn-browser-tab').forEach(t => t.classList.toggle('active', t.dataset.tabId === id));
      const tab = tabs.find(t => t.id === id);
      if (tab) omnibox.value = tab.url === 'about:newtab' ? '' : tab.url;
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      tabs.splice(idx, 1);
      const pane = document.getElementById(`pane-${id}`);
      if (pane) pane.remove();
      if (activeTabId === id) {
        const next = tabs[Math.min(idx, tabs.length - 1)];
        if (next) setActiveTab(next.id);
      }
      renderTabs();
      if (tabs.length === 0) addTab('search-v2.html');
    }

    function renderTabs() {
      tabBar.querySelectorAll('.cn-browser-tab').forEach(t => t.remove());
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'cn-browser-tab' + (tab.id === activeTabId ? ' active' : '');
        el.dataset.tabId = tab.id;
        el.innerHTML = `<span class="tab-title">${escapeHtml(tab.title)}</span><span class="tab-close" style="margin-left:0.35rem;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background 0.15s">×</span>`;
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab-close')) closeTab(tab.id);
          else setActiveTab(tab.id);
        });
        tabBar.insertBefore(el, document.getElementById('newTabBtn'));
      });
    }

    function navigateTab(urlOrQuery, tabId = activeTabId) {
      const tab = tabs.find(t => t.id === tabId);
      if (!tab) return;

      const resolved = resolveInput(urlOrQuery);
      tab.url = resolved;
      tab.title = resolved;
      omnibox.value = resolved;

      let pane = document.getElementById(`pane-${tabId}`);
      pane.innerHTML = '';

      if (resolved === 'about:newtab' || resolved.startsWith('search-v2.html') || resolved.startsWith('/search.html')) {
        pane.appendChild(buildNewTabPage(resolved));
      } else if (resolved.startsWith('http')) {
        const iframe = document.createElement('iframe');
        iframe.src = resolved;
        iframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
        iframe.title = tab.title;
        pane.appendChild(iframe);
      } else {
        pane.innerHTML = `<div style="padding:2rem;color:var(--cn-text-muted)">Cannot load <code>${escapeHtml(resolved)}</code>. Try a URL or search query.</div>`;
      }

      recordHistory(urlOrQuery);
      renderTabs();
    }

    function resolveInput(input) {
      const trimmed = input.trim();
      if (!trimmed) return 'about:newtab';
      if (trimmed === 'about:newtab') return trimmed;
      if (/^(https?:\/\/|xn--)/i.test(trimmed)) return trimmed;
      if (/^[a-z0-9][\w\-\.]*\.[a-z]{2,}$/i.test(trimmed)) return `https://${trimmed}`;
      if (trimmed.startsWith('/')) return trimmed;
      return `search-v2.html?q=${encodeURIComponent(trimmed)}`;
    }

    function buildNewTabPage(url) {
      const params = new URLSearchParams(url.includes('?') ? url.split('?')[1] : '');
      const q = params.get('q') || '';
      const div = document.createElement('div');
      div.className = 'cn-ntp';
      div.innerHTML = `
        <div class="cn-ntp-logo">PUNYCODEX</div>
        <div class="cn-ntp-search">
          <input type="text" placeholder="Search the Unicode web…" value="${escapeHtml(q)}" id="ntpInput" autocomplete="off">
        </div>
        <div class="cn-ntp-shortcuts">
          <a class="cn-ntp-shortcut" href="search-v2.html" target="_self"><span class="icon">⌕</span>Search</a>
          <a class="cn-ntp-shortcut" href="/pantheon/" target="_self"><span class="icon">🏛</span>Pantheon</a>
          <a class="cn-ntp-shortcut" href="/lexicon/" target="_self"><span class="icon">📖</span>Lexicon</a>
          <a class="cn-ntp-shortcut" href="/type/" target="_self"><span class="icon">⌨</span>Type</a>
          <a class="cn-ntp-shortcut" href="/api/v1/docs/" target="_self"><span class="icon">⚡</span>API</a>
        </div>
      `;
      const input = div.querySelector('#ntpInput');
      input.focus();
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') navigateTab(input.value);
      });
      return div;
    }

    function reloadTab() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) navigateTab(tab.url);
    }

    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }

    function renderSidebar() {
      let html = '';
      html += `<div class="cn-browser-sidebar-item active" onclick="navigateTab('search-v2.html')"><span>⌕</span> Universal Search</div>`;
      html += `<div class="cn-browser-sidebar-item" onclick="navigateTab('/pantheon/')"><span>🏛</span> Pantheon</div>`;
      html += `<div class="cn-browser-sidebar-item" onclick="navigateTab('/lexicon/')"><span>📖</span> Lexicon</div>`;
      html += `<div class="cn-browser-sidebar-item" onclick="navigateTab('/type/')"><span>⌨</span> Type Tool</div>`;
      html += `<div class="cn-browser-sidebar-item" onclick="navigateTab('/tiers/')"><span>🏅</span> Tiers</div>`;
      html += `<h3>Saved</h3>`;
      if (savedItems.length === 0) html += `<div class="cn-browser-sidebar-item" style="opacity:0.6">No saved items</div>`;
      savedItems.forEach(item => {
        html += `<div class="cn-browser-sidebar-item" onclick="navigateTab('${escapeHtml(item.url)}')"><span>🔖</span>${escapeHtml(item.title)}</div>`;
      });
      html += `<h3>Workspaces</h3>`;
      if (workspaces.length === 0) html += `<div class="cn-browser-sidebar-item" style="opacity:0.6">No workspaces</div>`;
      workspaces.forEach(ws => {
        html += `<div class="cn-browser-sidebar-item" onclick="restoreWorkspaceByName('${escapeHtml(ws.name)}')"><span>🗂</span>${escapeHtml(ws.name)}</div>`;
      });
      html += `<h3>Recent</h3>`;
      historyStack.slice(0, 12).forEach(h => {
        html += `<div class="cn-browser-sidebar-item" onclick="navigateTab('${escapeHtml(h)}')" title="${escapeHtml(h)}"><span>🕘</span>${escapeHtml(truncate(h, 26))}</div>`;
      });
      sidebarList.innerHTML = html;
    }

    function recordHistory(url) {
      historyStack = [url, ...historyStack.filter(h => h !== url)].slice(0, 50);
      localStorage.setItem('punycodex_browser_history', JSON.stringify(historyStack));
      renderSidebar();
    }

    function clearHistory() {
      historyStack = [];
      localStorage.removeItem('punycodex_browser_history');
      renderSidebar();
    }

    function saveWorkspace() {
      const name = prompt('Name this workspace:');
      if (!name) return;
      workspaces = workspaces.filter(w => w.name !== name);
      workspaces.unshift({ name, tabs: tabs.map(t => ({ url: t.url, title: t.title })), createdAt: Date.now() });
      localStorage.setItem('punycodex_workspaces', JSON.stringify(workspaces));
      renderSidebar();
      alert(`Workspace “${name}” saved. Share with ?workspace=${encodeURIComponent(name)}`);
    }

    function restoreWorkspaceByName(name) {
      const ws = workspaces.find(w => w.name === name);
      if (!ws) return;
      tabs.forEach(t => document.getElementById(`pane-${t.id}`)?.remove());
      tabs = [];
      ws.tabs.forEach(t => addTab(t.url, t.title));
    }

    function restoreWorkspace(name) {
      restoreWorkspaceByName(name);
    }

    // Command palette
    function openPalette() {
      paletteOverlay.classList.add('open');
      paletteInput.value = '';
      paletteInput.focus();
      renderPalette('');
    }
    function closePalette() { paletteOverlay.classList.remove('open'); }
    function renderPalette(q) {
      const items = [...COMMANDS];
      const lower = q.toLowerCase();
      const filtered = items.filter(c => c.title.toLowerCase().includes(lower));
      paletteResults.innerHTML = filtered.map((c, i) =>
        `<div class="cn-palette-item ${i === 0 ? 'selected' : ''}" data-index="${i}"><span>${escapeHtml(c.title)}</span><span class="cn-palette-cmd">↵</span></div>`
      ).join('') || '<div class="cn-palette-item">No commands found</div>';
    }
    function executeSelected() {
      const selected = paletteResults.querySelector('.cn-palette-item.selected');
      if (!selected) return;
      const idx = parseInt(selected.dataset.index, 10);
      const results = [...COMMANDS].filter(c => c.title.toLowerCase().includes(paletteInput.value.toLowerCase()));
      if (results[idx]) {
        closePalette();
        results[idx].action();
      }
    }

    paletteInput.addEventListener('input', () => renderPalette(paletteInput.value));
    paletteInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeSelected();
      if (e.key === 'Escape') closePalette();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const items = [...paletteResults.querySelectorAll('.cn-palette-item')];
        const current = items.findIndex(el => el.classList.contains('selected'));
        let next = current + (e.key === 'ArrowDown' ? 1 : -1);
        next = Math.max(0, Math.min(items.length - 1, next));
        items.forEach((el, i) => el.classList.toggle('selected', i === next));
        e.preventDefault();
      }
    });
    paletteOverlay.addEventListener('click', (e) => { if (e.target === paletteOverlay) closePalette(); });

    // Toolbar buttons
    document.getElementById('backBtn').addEventListener('click', () => history.back());
    document.getElementById('forwardBtn').addEventListener('click', () => history.forward());
    document.getElementById('reloadBtn').addEventListener('click', reloadTab);
    document.getElementById('homeBtn').addEventListener('click', () => navigateTab('search-v2.html'));
    document.getElementById('newTabBtn').addEventListener('click', () => addTab());
    document.getElementById('sidebarBtn').addEventListener('click', toggleSidebar);
    document.getElementById('paletteBtn').addEventListener('click', openPalette);
    document.getElementById('closeHelp').addEventListener('click', toggleHelp);

    omnibox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigateTab(omnibox.value);
    });

    function setupKeyboard() {
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName;
        const typing = tag === 'INPUT' || tag === 'TEXTAREA';

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openPalette();
          return;
        }
        if (typing) return;

        if (e.key === '/') { e.preventDefault(); omnibox.focus(); }
        if (e.key === 't') { e.preventDefault(); addTab(); }
        if (e.key === 'x') { e.preventDefault(); closeTab(activeTabId); }
        if (e.key === 'j') { e.preventDefault(); cycleTab(1); }
        if (e.key === 'k') { e.preventDefault(); cycleTab(-1); }
        if (e.key === 's') { e.preventDefault(); toggleSidebar(); }
        if (e.key === '?') { e.preventDefault(); toggleHelp(); }
      });
    }

    function cycleTab(dir) {
      const idx = tabs.findIndex(t => t.id === activeTabId);
      const next = (idx + dir + tabs.length) % tabs.length;
      setActiveTab(tabs[next].id);
    }

    function toggleHelp() {
      helpOverlay.classList.toggle('open');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function truncate(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }

    window.navigateTab = navigateTab;
    window.restoreWorkspaceByName = restoreWorkspaceByName;
    window.toggleSidebar = toggleSidebar;

    init();
  </script>

<!-- PUNYCODEX-UNIVERSITY-COLLABORATORS-BODY-START -->
<div id="university-collaborators-strip" role="complementary" aria-label="Academic Collaborators"></div>
<!-- PUNYCODEX-UNIVERSITY-COLLABORATORS-BODY-END -->
</body>
</html>

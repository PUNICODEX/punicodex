<body class="cn-page">

  <header class="cn-header">

        <a href="/" class="cn-logo-row" aria-label="PUNYCODEX home">

            <div class="cn-logo-text">PUNYCODEX</div>

          </div>
        </a>
        <button class="cn-mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="cn-global-nav" id="globalNav">
          <a href="/pantheon/">Pantheon</a>

      </div>
      <div class="cn-search-wrap">
        <div class="cn-search-box search-box">
          <span class="cn-search-icon search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="searchInput" class="cn-search-input" placeholder="Search gods, myths, and curated domains..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="web">Discover</button>
    <button class="mode-tab" data-mode="network">Our Properties</button>
    <button class="mode-tab" data-mode="domains">Available</button>
    <label class="unicode-toggle" title="Only show domains with actual Unicode characters (xn--)">
      <input type="checkbox" id="unicodeOnly" onchange="toggleUnicodeOnly()">
      <span>Unicode Only</span>

  <div class="filter-bar">
    <div class="filter-header">
      <span class="filter-label" style="margin:0">Filters</span>
      <button class="filter-toggle" id="filterToggle" onclick="toggleFilters()">⚙️ Refine</button>
    </div>
    <div class="filter-panel" id="filterPanel">
      <div class="filter-row">
        <span class="filter-label">Type</span>
        <button class="filter-pill active" data-filter="type" data-value="all">All</button>
        <button class="filter-pill" data-filter="type" data-value="gods">Gods</button>
        <button class="filter-pill" data-filter="type" data-value="realms">Realms</button>
        <button class="filter-pill" data-filter="type" data-value="locations">Locations</button>
        <button class="filter-pill" data-filter="type" data-value="businesses">Businesses</button>
        <button class="filter-pill" data-filter="type" data-value="available">Available</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">Tier</span>
        <button class="filter-pill active" data-filter="tier" data-value="">Any</button>
        <button class="filter-pill" data-filter="tier" data-value="dual">Dual</button>
        <button class="filter-pill" data-filter="tier" data-value="1">Tier 1</button>
        <button class="filter-pill" data-filter="tier" data-value="2">Tier 2</button>
        <span class="filter-label" style="margin-left: auto;">Pantheon</span>

          <option value="">All pantheons</option>
        </select>
        <span class="filter-label">Sort</span>
        <select class="filter-select" id="sortFilter" onchange="setSort(this.value)">
          <option value="relevance">Relevance</option>
          <option value="alphabetical">A–Z</option>
          <option value="tier">Tier</option>
          <option value="recently_crawled">Recently crawled</option>
          <option value="confidence">Confidence</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">Concept</span>
        <button class="filter-pill active" data-filter="concept" data-value="">All</button>
        <button class="filter-pill" data-filter="concept" data-value="commerce">Commerce</button>
        <button class="filter-pill" data-filter="concept" data-value="wisdom">Wisdom</button>
        <button class="filter-pill" data-filter="concept" data-value="travel">Travel</button>
        <button class="filter-pill" data-filter="concept" data-value="war">War</button>
        <button class="filter-pill" data-filter="concept" data-value="nature">Nature</button>
        <button class="filter-pill" data-filter="concept" data-value="underworld">Underworld</button>

    </div>
    <div class="oracle-body" id="oracleBody" style="display:none">
      <div class="oracle-ask">
        <input type="text" id="oracleInput" class="oracle-input" placeholder="Ask the Oracle a question…" autocomplete="off">
        <button class="oracle-submit" onclick="submitOracle()" type="button">Ask</button>
      </div>
      <div id="oracleAnswer"></div>
    </div>
  </section>

  <section class="results" id="results">
    <div class="empty">
      <div class="empty-icon">🌐</div>
      <div class="empty-title">Search the Unicode Web</div>
      <div class="empty-sub">Find gods, domains, and sites across the Unicode namespace</div>
    </div>
  </section>

  <script src="/js/px-core.js?v=perf8"></script>
  <script src="/js/search-effects.js"></script>
  <script>
    const API_BASE = '';
    const RESULT_LIMIT = 20;
    let debounceTimer;
    let currentMode = 'web';
    let currentType = 'all';
    let currentTier = '';
    let currentPantheon = '';
    let currentConcept = '';
    let currentSort = 'relevance';
    let currentOffset = 0;
    let currentHasMore = false;
    let isLoadingMore = false;
    let focusedIndex = -1;
    let currentResults = [];
    let activeAutocompleteIndex = -1;

    async function loadPantheons() {
      try {
        const res = await fetch(`${API_BASE}/api/pantheons/`);
        const pantheons = await res.json();
        const select = document.getElementById('pantheonFilter');
        pantheons.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p.charAt(0).toUpperCase() + p.slice(1);
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('Failed to load pantheons', e);
      }
    }
    loadPantheons();

    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const filter = pill.dataset.filter;
        const value = pill.dataset.value;
        document.querySelectorAll(`.filter-pill[data-filter="${filter}"]`).forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        if (filter === 'type') currentType = value;
        if (filter === 'tier') currentTier = value;
        if (filter === 'concept') currentConcept = value;
        renderActiveFilters();
        triggerSearch();
      });
    });

    function setPantheon(value) {
      currentPantheon = value;
      renderActiveFilters();
      triggerSearch();
    }

    function setSort(value) {
      currentSort = value;
      renderActiveFilters();
      triggerSearch();
    }

    function toggleFilters() {
      const panel = document.getElementById('filterPanel');
      panel.classList.toggle('expanded');
    }

    function clearFilters() {
      currentType = 'all';
      currentTier = '';
      currentPantheon = '';
      currentConcept = '';
      currentSort = 'relevance';
      document.getElementById('pantheonFilter').value = '';
      document.getElementById('sortFilter').value = 'relevance';
      document.querySelectorAll('.filter-pill[data-filter="type"]').forEach(p => p.classList.toggle('active', p.dataset.value === 'all'));
      document.querySelectorAll('.filter-pill[data-filter="tier"]').forEach(p => p.classList.toggle('active', p.dataset.value === ''));
      document.querySelectorAll('.filter-pill[data-filter="concept"]').forEach(p => p.classList.toggle('active', p.dataset.value === ''));
      renderActiveFilters();
      triggerSearch();
    }

    function renderActiveFilters() {
      const container = document.getElementById('activeFilters');
      container.innerHTML = '';
      const chips = [];
      if (currentType && currentType !== 'all') chips.push({ label: capitalize(currentType), clear: () => setFilterPill('type', 'all') });
      if (currentTier) chips.push({ label: currentTier === 'dual' ? 'Dual-Tier' : `Tier ${currentTier}`, clear: () => setFilterPill('tier', '') });
      if (currentPantheon) chips.push({ label: capitalize(currentPantheon), clear: () => { document.getElementById('pantheonFilter').value = ''; setPantheon(''); } });
      if (currentConcept) chips.push({ label: capitalize(currentConcept), clear: () => setFilterPill('concept', '') });
      if (currentSort && currentSort !== 'relevance') chips.push({ label: `Sort: ${currentSort.replace('_', ' ')}`, clear: () => { document.getElementById('sortFilter').value = 'relevance'; setSort('relevance'); } });

      if (chips.length === 0) return;

      chips.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'active-filter-chip';
        btn.innerHTML = `${escapeHtml(c.label)} <span class="remove">×</span>`;
        btn.addEventListener('click', c.clear);
        container.appendChild(btn);
      });

      const clearBtn = document.createElement('button');
      clearBtn.className = 'clear-filters';
      clearBtn.textContent = 'Clear all';
      clearBtn.addEventListener('click', clearFilters);
      container.appendChild(clearBtn);
    }

    function setFilterPill(filter, value) {
      const pill = document.querySelector(`.filter-pill[data-filter="${filter}"][data-value="${value}"]`);
      if (pill) pill.click();
    }

    function capitalize(s) {
      if (!s) return '';
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function triggerSearch() {
      if (!searchInput.value.trim()) return;
      if (currentMode === 'domains') searchDomains();
      else searchWeb();
    }

    const modeTabs = document.querySelectorAll('.mode-tab');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const resultsEl = document.getElementById('results');

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const mode = tab.dataset.mode;
        setMode(mode);
      });
    });

    function setMode(mode) {
      currentMode = mode;
      modeTabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      searchInput.placeholder = mode === 'domains' ? 'Find gods, names, meanings...' : 'Search gods, myths, and curated domains...';
      searchInput.focus();
      if (!searchInput.value.trim()) {
        showEmptyState(mode);
      } else {
        if (mode === 'domains') searchDomains();
        else searchWeb();
      }
      window.location.hash = mode;
    }

    if (window.location.hash === '#domains') {
      setMode('domains');
    }

    function showEmptyState(mode) {
      if (mode === 'web') {
        resultsEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🌐</div>
            <div class="empty-title">Discover the Unicode Web</div>
            <div class="empty-sub">Search gods, myths, and curated domains across the Unicode namespace</div>
          </div>
        `;
      } else {
        resultsEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔱</div>
            <div class="empty-title">Find a Domain</div>
            <div class="empty-sub">Search the PUNYCODEX lexicon of 850 Unicode domain names</div>
          </div>
        `;
      }
    }

    searchInput.addEventListener('input', () => {
      searchClear.classList.toggle('visible', searchInput.value.length > 0);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (currentMode === 'web') {
          fetchAutocomplete(searchInput.value.trim());
          searchWeb();
        }
        else searchDomains();
      }, 200);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.remove('visible');
      hideAutocomplete();
      searchInput.focus();
      showEmptyState(currentMode);
    });

    searchInput.addEventListener('keydown', (e) => {
      const dropdown = document.getElementById('autocompleteDropdown');
      const items = dropdown ? dropdown.querySelectorAll('.autocomplete-item') : [];

      if (e.key === 'ArrowDown' && items.length > 0) {
        e.preventDefault();
        activeAutocompleteIndex = Math.min(activeAutocompleteIndex + 1, items.length - 1);
        updateAutocompleteActive(items);
        return;
      }
      if (e.key === 'ArrowUp') {
        if (items.length > 0 && activeAutocompleteIndex >= 0) {
          e.preventDefault();
          activeAutocompleteIndex = Math.max(activeAutocompleteIndex - 1, -1);
          updateAutocompleteActive(items);
        }
        return;
      }
      if (e.key === 'Enter') {
        clearTimeout(debounceTimer);
        if (activeAutocompleteIndex >= 0 && items[activeAutocompleteIndex]) {
          searchInput.value = items[activeAutocompleteIndex].dataset.text;
          activeAutocompleteIndex = -1;
          hideAutocomplete();
          if (currentMode === 'web') searchWeb();
          else searchDomains();
          return;
        }
        hideAutocomplete();
        if (currentMode === 'web') searchWeb();
        else searchDomains();
      }
      if (e.key === 'Escape') {
        activeAutocompleteIndex = -1;
        hideAutocomplete();
      }
    });

    function updateAutocompleteActive(items) {
      items.forEach((item, idx) => {
        item.classList.toggle('keyboard-active', idx === activeAutocompleteIndex);
      });
      if (activeAutocompleteIndex >= 0 && items[activeAutocompleteIndex]) {
        items[activeAutocompleteIndex].scrollIntoView({ block: 'nearest' });
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) hideAutocomplete();
    });

    function isAutocompleteVisible() {
      const dropdown = document.getElementById('autocompleteDropdown');
      return dropdown && dropdown.classList.contains('visible');
    }

    document.addEventListener('keydown', (e) => {
      if (e.target === searchInput) {
        if (e.key === 'ArrowDown' && !isAutocompleteVisible()) {
          e.preventDefault();
          focusResult(0);
        }
        return;
      }

      const results = document.querySelectorAll('.serp-result');
      if (results.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusResult(Math.min(focusedIndex + 1, results.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (focusedIndex <= 0) {
          searchInput.focus();
          focusedIndex = -1;
        } else {
          focusResult(focusedIndex - 1);
        }
      } else if (e.key === 'Escape') {
        searchInput.focus();
        focusedIndex = -1;
      }
    });

    function focusResult(index) {
      const results = document.querySelectorAll('.serp-result');
      focusedIndex = index;
      results.forEach((r, i) => {
        if (i === index) {
          r.focus();
          r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    function showSkeleton(count = 3) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="skeleton-result">
            <div class="skeleton-header">
              <div class="skeleton-favicon skeleton"></div>
              <div class="skeleton-body">
                <div class="skeleton-line short skeleton"></div>
                <div class="skeleton-line title skeleton"></div>
                <div class="skeleton-line medium skeleton"></div>
              </div>
            </div>
          </div>
        `;
      }
      resultsEl.innerHTML = html;
    }

    async function fetchAutocomplete(q) {
      if (!q || q.length < 1) { hideAutocomplete(); return; }
      try {
        const res = await fetch(`${API_BASE}/api/search/suggest/?q=${encodeURIComponent(q)}&limit=8`);
        const data = await res.json();
        renderAutocomplete(data.suggestions);
      } catch { hideAutocomplete(); }
    }

    function renderAutocomplete(suggestions) {
      const dropdown = document.getElementById('autocompleteDropdown');
      activeAutocompleteIndex = -1;
      if (!suggestions.length) { hideAutocomplete(); return; }

      let html = '';
      suggestions.forEach((s, i) => {
        const icon = s.type === 'entry' ? '🔱' : '🌐';
        const meta = s.type === 'entry' ? (s.pantheon || 'entry') : 'site';
        html += `
          <div class="autocomplete-item" data-index="${i}" data-text="${escapeHtml(s.text)}">
            <span class="autocomplete-icon">${icon}</span>
            <span class="autocomplete-text">${escapeHtml(s.text)}</span>
            <span class="autocomplete-meta">${meta}</span>
          </div>
        `;
      });

      dropdown.innerHTML = html;
      dropdown.classList.add('visible');

      dropdown.querySelectorAll('.autocomplete-item').forEach((item, idx) => {
        item.addEventListener('mouseenter', () => {
          activeAutocompleteIndex = idx;
          updateAutocompleteActive(dropdown.querySelectorAll('.autocomplete-item'));
        });
        item.addEventListener('click', () => {
          searchInput.value = item.dataset.text;
          hideAutocomplete();
          searchWeb();
        });
      });
    }

    function hideAutocomplete() {
      activeAutocompleteIndex = -1;
      document.getElementById('autocompleteDropdown').classList.remove('visible');
    }

    let pendingClick = null;
    let pendingClickTimer = null;

    function sendClickEvent(query, siteId, position, dwellTimeMs) {
      fetch('/api/search/click/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, siteId, position, dwellTimeMs })
      }).catch(() => {});
    }

    function trackClick(query, siteId, position) {
      if (pendingClickTimer) clearTimeout(pendingClickTimer);
      pendingClick = { query, siteId, position, clickTime: Date.now() };
      pendingClickTimer = setTimeout(() => {
        if (pendingClick) {
          sendClickEvent(pendingClick.query, pendingClick.siteId, pendingClick.position, 0);
          pendingClick = null;
        }
      }, 30000);
    }

    window.addEventListener('blur', () => {
      if (pendingClick) pendingClick.leftAt = Date.now();
    });

    window.addEventListener('focus', () => {
      if (pendingClick && pendingClick.leftAt) {
        const dwellTimeMs = Math.min(Date.now() - pendingClick.leftAt, 300000);
        sendClickEvent(pendingClick.query, pendingClick.siteId, pendingClick.position, dwellTimeMs);
        pendingClick = null;
        if (pendingClickTimer) clearTimeout(pendingClickTimer);
      }
    });

    function escapeHtmlKeepMarks(str) {
      if (!str) return '';
      const parts = String(str).split(/(<mark>|<\/mark>)/g);
      return parts
        .map((part, idx) => {
          if (idx % 2 === 1) return part;
          return part
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        })
        .join('');
    }

    function buildScoreTooltip(breakdown) {
      if (!breakdown) return '';
      const labels = {
        bm25: 'Text match',
        tier: 'Tier signal',
        flagship: 'Flagship',
        tenant: 'Tenant',
        archetype: 'Archetype',
        freshness: 'Freshness',
        quality: 'Quality',
        pagerank: 'PageRank',
        authority: 'Authority',
        punycode: 'Unicode',
        entity: 'Entity',
        click: 'Clicks',
      };
      let rows = '';
      for (const [key, value] of Object.entries(breakdown)) {
        if (key === 'total' || typeof value !== 'number' || value === 0) continue;
        rows += `<div class="score-tooltip-row"><span class="score-tooltip-label">${labels[key] || key}</span><span class="score-tooltip-value">+${value.toFixed(2)}</span></div>`;
      }
      rows += `<div class="score-tooltip-row"><span class="score-tooltip-label">Total</span><span class="score-tooltip-value">${(breakdown.total || 0).toFixed(2)}</span></div>`;
      return `<div class="score-tooltip">${rows}</div>`;
    }

    function buildResultCard(r, query, index) {
      const tierClass = r.tier === 'dual' ? 'tier-dual' : r.tier === '1' ? 'tier-1' : 'tier-2';
      const tierLabel = r.tier === 'dual' ? 'Dual-Tier' : `Tier ${r.tier}`;

      let html = `<div class="serp-result" tabindex="0" data-index="${index}" data-site-id="${r.id}">`;
      html += `<div class="serp-header">`;

      if (r.faviconPath) {
        html += `<img class="serp-favicon" src="${r.faviconPath}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`;
        html += `<div class="serp-favicon-fallback" style="display:none">🌐</div>`;
      } else {
        html += `<div class="serp-favicon-fallback">🌐</div>`;
      }

      html += `<div class="serp-body">`;

      const breadcrumb = r.title ? r.title.split(/[|\u2013\u2014\u2015-]/)[0].trim().substring(0, 40) : '';
      const displayDomain = r.domain || r.punycode;
      const showPuny = r.isPunycode && r.punycode && r.punycode !== displayDomain;
      html += `
        <div class="serp-url-line">
          <span class="serp-domain">${escapeHtml(displayDomain)}</span>
          ${showPuny ? `<span class="serp-punycode">${escapeHtml(r.punycode)}</span>` : ''}
          ${breadcrumb && breadcrumb !== displayDomain ? `<span class="serp-sep">›</span><span class="serp-breadcrumb">${escapeHtml(breadcrumb)}</span>` : ''}
        </div>
      `;

      html += `<a href="${r.url}" target="_blank" rel="noopener" class="serp-title" onclick="trackClick('${escapeHtml(query)}', ${r.id}, ${index})">${escapeHtml(r.title || displayDomain)}</a>`;

      let snippet = r.snippet || r.description || 'No description available.';
      const datePrefix = r.publishedDate ? formatDate(r.publishedDate) + ' — ' : '';
      html += `<div class="serp-snippet">${datePrefix}${escapeHtmlKeepMarks(snippet)}</div>`;

      if (r.publishedDate) {
        const relDate = formatRelativeDate(r.publishedDate);
        const freshClass = relDate.includes('h') || relDate.includes('d') ? 'recent' : '';
        html += `<div class="serp-freshness ${freshClass}">${relDate}</div>`;
      }

      html += `<div class="serp-meta">`;
      if (r.isFlagship) html += `<span class="serp-badge flagship">🏛️ Flagship</span>`;
      if (r.tier && r.tierLabel) html += `<span class="serp-badge ${tierClass}">${tierLabel}</span>`;
      if (r.pantheon) html += `<span class="serp-badge pantheon">${escapeHtml(r.pantheon)}</span>`;
      if (r.leaseStatus === 'flagship' || r.isFlagship) {
        html += `<span class="lease-badge flagship">👑 Crown Jewel</span>`;
      } else if (r.tenant && r.tenant.name) {
        html += `<span class="lease-badge leased">🔒 Leased</span>`;
      } else if (r.leaseStatus === 'available') {
        html += `<span class="lease-badge available">🔑 Available</span>`;
      }
      if (r.isPunycode) html += `<span class="unicode-badge">🌐 Unicode</span>`;
      if (r.sitemapEntries > 0) html += `<span class="serp-sitemap-badge">📑 ${r.sitemapEntries} pages</span>`;
      if (r.ogVideo) html += `<span class="serp-sitemap-badge">▶️ Video</span>`;
      if (r.scoreBreakdown) {
        html += `<span class="score-breakdown" tabindex="0" aria-label="Ranking signals">⚡ ${r.scoreBreakdown.total.toFixed(2)}${buildScoreTooltip(r.scoreBreakdown)}</span>`;
      }
      if (r.verdict && (r.severity === 'high' || r.severity === 'critical')) {
        html += `<span class="serp-badge trust-warning">⚠️ ${escapeHtml(r.label || r.verdict)}</span>`;
      }
      html += `</div>`;

      if (r.tenant && r.tenant.name) {
        html += `<div class="tenant-card">`;
        html += `<span class="tenant-label">🏪 Tenant</span>`;
        html += `<span class="tenant-name">${escapeHtml(r.tenant.name)}</span>`;
        if (r.tenant.category) html += `<span class="tenant-category">${escapeHtml(r.tenant.category)}</span>`;
        if (r.tenant.frontUrl) {
          html += `<a href="${r.tenant.frontUrl}" target="_blank" rel="noopener" class="tenant-cta">Visit Store →</a>`;
        }
        html += `</div>`;
      }

      if (r.subPages && r.subPages.length > 0) {
        html += `<div class="serp-sitelinks">`;
        r.subPages.forEach(p => {
          const label = p.h1 || p.title || p.url;
          html += `<a href="${p.url}" target="_blank" rel="noopener" class="serp-sitelink">${escapeHtml(label.substring(0, 35))}</a>`;
        });
        html += `</div>`;
      } else if (r.anchorTexts && r.anchorTexts.length > 0) {
        const links = r.anchorTexts.slice(0, 4);
        html += `<div class="serp-sitelinks">`;
        links.forEach(a => {
          const text = typeof a === 'string' ? a : (a.text || '');
          const href = typeof a === 'string' ? r.url : (a.href || r.url);
          if (text) html += `<a href="${href}" target="_blank" rel="noopener" class="serp-sitelink">${escapeHtml(text.substring(0, 30))}</a>`;
        });
        html += `</div>`;
      }

      html += `
        <div class="serp-utilities">
          <a href="${r.url}" target="_blank" rel="noopener" class="serp-utility">Visit ↗</a>
          ${r.lexiconEntryId ? `<a href="entry.html?id=${encodeURIComponent(r.lexiconEntryId)}" class="serp-utility">Lexicon Entry</a>` : ''}
          ${r.isFlagship && r.lexiconEntryId ? `<a href="/sites/${encodeURIComponent(r.lexiconEntryId)}/#spaces" class="serp-utility" style="color:var(--cn-gold);">Advertise here</a>` : ''}
          <button class="serp-utility" onclick="copyToClipboard('${escapeHtml(r.punycode)}')">Copy</button>
          <button class="serp-utility" onclick="showSimilar('${escapeHtml(r.punycode)}')">Similar</button>
        </div>
      `;

      html += `</div>`;
      if (r.ogImagePath) {
        html += `<div class="serp-thumbnail-wrap"><img class="serp-thumbnail" src="${r.ogImagePath}" alt="" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;
      }
      html += `</div></div>`;
      return html;
    }

    async function searchWeb(options = {}) {
      const q = searchInput.value.trim();
      if (!q) { showEmptyState(currentMode); return; }
      const append = options.append === true;
      if (!append) {
        currentOffset = 0;
        showSkeleton();
      } else {
        isLoadingMore = true;
        const btn = document.getElementById('loadMoreBtn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="load-more-spinner"></span> Loading...';
        }
      }

      const apiMode = currentMode === 'network' ? 'network' : 'all';

      const params = new URLSearchParams();
      params.set('q', q);
      params.set('limit', String(RESULT_LIMIT));
      params.set('offset', String(currentOffset));
      params.set('mode', apiMode);
      if (currentType !== 'all') params.set('type', currentType);
      if (currentTier) params.set('tier', currentTier);
      if (currentPantheon) params.set('pantheon', currentPantheon);
      const sort = currentMode === 'web' && currentSort === 'confidence' ? 'relevance' : currentSort;
      if (sort) params.set('sort', sort);
      if (document.getElementById('unicodeOnly')?.checked) params.set('unicodeOnly', 'true');
      if (currentConcept) params.set('concept', currentConcept);

      try {
        const requests = [
          fetch(`${API_BASE}/api/search/web/?${params}`),
          fetch(`${API_BASE}/api/search/didyoumean/?q=${encodeURIComponent(q)}&limit=3`),
          fetch(`${API_BASE}/api/search/related/?q=${encodeURIComponent(q)}&limit=6`),
        ];
        if (!append) {
          requests.push(
            fetch(`${API_BASE}/api/search/knowledge/?q=${encodeURIComponent(q)}`).catch(() => ({ ok: false })),
            fetch(`${API_BASE}/api/search/paa/?q=${encodeURIComponent(q)}&limit=4`).catch(() => ({ ok: false }))
          );
        }
        const [searchRes, dymRes, relatedRes, knowledgeRes, paaRes] = await Promise.all(requests);

        const data = await searchRes.json();
        const dymData = await dymRes.json();
        const relatedData = await relatedRes.json();
        let knowledgeData = null;
        if (!append && knowledgeRes && knowledgeRes.ok) {
          try { knowledgeData = await knowledgeRes.json(); } catch { /* ignore */ }
        }
        let paaData = null;
        if (!append && paaRes && paaRes.ok) {
          try { paaData = await paaRes.json(); } catch { /* ignore */ }
        }

        currentHasMore = data.hasMore || false;
        if (append) {
          currentResults = currentResults.concat(data.results);
          appendWebResults(data, relatedData.related);
        } else {
          currentResults = data.results;
          renderWebResults(data, dymData.suggestions, relatedData.related, knowledgeData, paaData?.questions);
          if (looksLikeQuestion(q)) {
            if (oracleCollapsed) toggleOracle();
            updateOracle(q);
          }
        }
      } catch (e) {
        if (!append) {
          resultsEl.innerHTML = `<div class="empty"><div class="empty-title">Error</div><div class="empty-sub">${e.message}</div></div>`;
        }
      } finally {
        isLoadingMore = false;
      }
    }

    async function loadMoreResults() {
      if (isLoadingMore || !currentHasMore) return;
      currentOffset += RESULT_LIMIT;
      await searchWeb({ append: true });
    }

    function renderWebResults(data, didYouMean, related, knowledgePanel, paaQuestions) {

        html += `<div class="kp-actions">`;

            html += `<div class="kp-lore-text">${escapeHtml(lore.summary)}</div>`;

            html += `<div class="kp-lore-text">${escapeHtml(lore.pronunciation.guide)}</div>`;
            html += `</div>`;
          }
          if (lore.mythology && lore.mythology.summary) {

            html += `<div class="kp-lore-cta"><a href="/sites/${e.id}/lore.html" target="_blank" rel="noopener">Read full lore →</a></div>`;

        if (knowledgePanel.sites && knowledgePanel.sites.length) {

          knowledgePanel.sites.forEach(s => {

              html += `<img class="kp-site-favicon" src="${s.favicon_path}" alt="" loading="lazy" onerror="this.style.display='none'">`;
            }
            html += `<span class="kp-site-domain">${escapeHtml(s.punycode)}</span>`;
            if (s.title) html += `<span class="kp-site-title">${escapeHtml(s.title)}</span>`;
            html += `</a>`;

        if (knowledgePanel.tenant) {

          html += `<div class="kp-tenant">`;
          html += `<div class="kp-tenant-header"><span class="kp-tenant-label">${t.isFlagship ? '👑 Crown Jewel' : '🏪 Tenant'}</span></div>`;
          html += `<div class="kp-tenant-name">${escapeHtml(t.name)}${t.category ? ` — ${escapeHtml(t.category)}` : ''}</div>`;
          if (t.punycode) html += `<div class="kp-tenant-category">${escapeHtml(t.punycode)}</div>`;
          html += `<div class="kp-tenant-actions">`;
          if (t.frontUrl) html += `<a href="${t.frontUrl}" target="_blank" rel="noopener" class="kp-tenant-btn primary">Visit Store →</a>`;
          html += `<a href="entry.html?id=${knowledgePanel.entry.id}" class="kp-tenant-btn secondary">Lexicon Entry</a>`;
          html += `</div></div>`;
        }

        if (knowledgePanel.related && knowledgePanel.related.length) {
          html += `<div class="kp-related"><div class="kp-sites-title">Related</div><div class="kp-related-grid">`;
          knowledgePanel.related.forEach(r => {
            const label = r.unicode || r.ascii;
            html += `<button class="kp-related-chip" onclick="searchFor('${escapeHtml(label)}')">${escapeHtml(label)}</button>`;
          });
          html += `</div></div>`;
        }

        html += `</div>`;
      }

      if (data.results.length === 0) {
        let html = `
          <div class="empty">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No results for "${escapeHtml(data.query)}"</div>
            <div class="empty-sub">We're building the Unicode web index. Try a broader search.</div>
        `;
        if (didYouMean && didYouMean.length) {
          html += `<div class="did-you-mean">Did you mean: ${didYouMean.map(s => `<button class="serp-utility" onclick="searchFor('${escapeHtml(s.text)}')" style="color:var(--cn-gold);font-weight:600">${escapeHtml(s.text)}</button>`).join(', ')}?</div>`;
        }
        html += `
            <div class="build-cta">
              <h3>🚧 Index Under Construction</h3>
              <p>Have a Unicode domain to share?</p>
              <a href="admin.html" class="site-link primary">Submit a Domain</a>
            </div>
          </div>
        `;
        resultsEl.innerHTML = html;
        return;
      }

      if (didYouMean && didYouMean.length && didYouMean[0].text.toLowerCase() !== data.query.toLowerCase()) {
        html += `<div class="did-you-mean">Did you mean: ${didYouMean.map(s => `<button class="serp-utility" onclick="searchFor('${escapeHtml(s.text)}')" style="color:var(--cn-gold);font-weight:600">${escapeHtml(s.text)}</button>`).join(', ')}?</div>`;
      }

      if (paaQuestions && paaQuestions.length) {
        html += `<div class="paa-section">`;
        html += `<div class="paa-title">People Also Ask</div>`;
        paaQuestions.forEach((qa, idx) => {
          html += `<div class="paa-item" onclick="togglePaa(this)">`;
          html += `<div class="paa-question">${escapeHtml(qa.question)}<span class="paa-chevron">▼</span></div>`;
          html += `<div class="paa-answer">${escapeHtml(qa.answer)}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      const semanticBadge = data.isSemanticFallback ? `<span style="color:var(--cn-blue);margin-left:0.5rem;font-size:0.75rem">🧠 semantic match</span>` : '';
      html += `<div class="result-count">About ${data.total || data.results.length} results (${data.timing}s)${semanticBadge}</div>`;
      if (data.queryTrust && (data.queryTrust.severity === 'high' || data.queryTrust.severity === 'critical')) {
        html += `<div class="query-trust-banner query-trust-${data.queryTrust.severity}">⚠️ ${escapeHtml(data.queryTrust.label || data.queryTrust.verdict)} — ${escapeHtml(data.queryTrust.reason || '')}</div>`;
      }
      html += `<div class="serp-results-list">`;

      data.results.forEach((r, i) => {
        html += buildResultCard(r, data.query, i);
      });
      html += `</div>`;

      html += `<div class="load-more-wrap" id="loadMoreWrap">`;
      if (data.hasMore) {
        html += `<button id="loadMoreBtn" class="load-more-btn" onclick="loadMoreResults()">Load more results</button>`;
      }
      html += `</div>`;

      if (related && related.length) {
        html += `
          <div class="related-searches">
            <div class="related-title">Related Searches</div>
            <div class="related-grid">
              ${related.map(r => `<button class="related-chip" onclick="searchFor('${escapeHtml(r.unicode || r.ascii)}')">${escapeHtml(r.unicode || r.ascii)}</button>`).join('')}
            </div>
          </div>
        `;
      }

      if (data.availability && data.availability.length) {
        html += `<div class="availability-section">`;
        html += `<div class="availability-title">🔑 Available for Registration</div>`;
        data.availability.forEach(avail => {
          const tierClass = avail.tier === 'dual' ? 'tier-dual' : avail.tier === '1' ? 'tier-1' : 'tier-2';
          const tierLabel = avail.tier === 'dual' ? 'Dual-Tier' : `Tier ${avail.tier}`;
          const puny = avail.punycode || avail.unicode + '.com';
          html += `<div class="avail-card">`;
          html += `<div>`;
          html += `<div class="avail-domain">${escapeHtml(avail.unicode || puny)}</div>`;
          html += `<div class="avail-meaning">${escapeHtml(puny)}${avail.meaning ? ' — ' + escapeHtml(avail.meaning) : ''} <span class="serp-badge ${tierClass}">${tierLabel}</span></div>`;
          html += `</div>`;
          html += `<div class="avail-actions">`;
          html += `<a href="https://www.godaddy.com/domainsearch/find?domainToCheck=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="avail-action" title="Check on GoDaddy">GoDaddy</a>`;
          html += `<a href="https://www.namecheap.com/domains/registration/results/?domain=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="avail-action" title="Check on Namecheap">Namecheap</a>`;
          html += `<a href="https://porkbun.com/checkout/search?q=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="avail-action" title="Check on Porkbun">Porkbun</a>`;
          html += `<a href="entry.html?id=${encodeURIComponent(avail.id || '')}" class="avail-action" title="View lexicon entry">Entry</a>`;
          html += `</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      resultsEl.innerHTML = html;
      focusedIndex = -1;
      if (window.PunyCodexEffects) {
        window.PunyCodexEffects.initSpotlight('.serp-result');
      }
    }

    function appendWebResults(data, related) {
      const list = resultsEl.querySelector('.serp-results-list');
      const countEl = resultsEl.querySelector('.result-count');
      const startIndex = currentResults.length - data.results.length;

      if (list) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = data.results.map((r, i) => buildResultCard(r, data.query, startIndex + i)).join('');
        while (wrapper.firstChild) list.appendChild(wrapper.firstChild);
      }

      if (countEl) {
        const semanticBadge = data.isSemanticFallback ? `<span style="color:var(--cn-blue);margin-left:0.5rem;font-size:0.75rem">🧠 semantic match</span>` : '';
        countEl.innerHTML = `About ${data.total || currentResults.length} results (${data.timing}s)${semanticBadge}`;
      }

      const oldWrap = document.getElementById('loadMoreWrap');
      if (oldWrap) oldWrap.remove();
      const relatedEl = resultsEl.querySelector('.related-searches');
      const availEl = resultsEl.querySelector('.availability-section');
      const newWrap = document.createElement('div');
      newWrap.className = 'load-more-wrap';
      newWrap.id = 'loadMoreWrap';
      if (data.hasMore) {
        newWrap.innerHTML = `<button id="loadMoreBtn" class="load-more-btn" onclick="loadMoreResults()">Load more results</button>`;
      }
      if (relatedEl) relatedEl.before(newWrap);
      else if (availEl) availEl.before(newWrap);
      else resultsEl.appendChild(newWrap);

      focusedIndex = -1;
      if (window.PunyCodexEffects) {
        window.PunyCodexEffects.initSpotlight('.serp-result');
      }
    }

    function searchFor(text) {
      searchInput.value = text;
      searchWeb();
    }

    async function copyToClipboard(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast(`Copied ${text}`);
      } catch {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast(`Copied ${text}`);
      }
    }

    function showToast(message) {
      const t = document.createElement('div');
      t.textContent = message;
      t.style.cssText = 'position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--cn-surface);color:var(--cn-gold);border:1px solid var(--cn-gold);padding:0.55rem 1.1rem;border-radius:999px;font-size:0.82rem;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:200;';
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 1800);
    }

    function toggleUnicodeOnly() {
      currentOffset = 0;
      searchWeb();
    }

    function togglePaa(el) {
      el.classList.toggle('expanded');
    }

    async function showSimilar(punycode) {
      try {
        const res = await fetch(`${API_BASE}/api/sites/duplicates/?threshold=3`);
        const data = await res.json();
        const cluster = data.clusters.find(c => c.sites.some(s => s.punycode === punycode));
        if (cluster && cluster.sites.length > 1) {
          const others = cluster.sites.filter(s => s.punycode !== punycode);
          const list = others.map(s => `• ${s.punycode}${s.title ? ' — ' + s.title : ''}`).join('\n');
          alert(`Similar pages (${cluster.count - 1} found):\n\n${list}`);
        } else {
          alert('No similar pages found in the index.');
        }
      } catch (e) {
        alert('Could not fetch similar pages.');
      }
    }

    async function searchDomains() {
      const q = searchInput.value.trim();
      if (!q) { showEmptyState('domains'); return; }

      resultsEl.innerHTML = '<div class="empty"><div class="empty-sub">Searching the lexicon...</div></div>';

      try {
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (currentType !== 'all') params.set('type', currentType);
        if (currentTier) params.set('tier', currentTier);
        if (currentPantheon) params.set('pantheon', currentPantheon);
        if (currentSort) params.set('sort', currentSort);
        const res = await fetch(`${API_BASE}/api/search/?${params}`);
        const data = await res.json();
        renderDomainResults(data);
      } catch (e) {
        resultsEl.innerHTML = `<div class="empty"><div class="empty-title">Error</div><div class="empty-sub">${e.message}</div></div>`;
      }
    }

        const cardClass = hasSite ? 'has-site' : (entry.availability ? 'available' : '');

        html += `<div class="entry-card ${cardClass}">`;

        html += `
          <a href="entry.html?id=${entry.id}" style="text-decoration:none;color:inherit;display:block;">

              <span class="entry-unicode">${entry.unicode}</span>
              ${entry.greek && entry.greek !== '-' ? `<span class="entry-greek">${entry.greek}</span>` : ''}
              <span class="tier-badge ${tierClass}">${tierLabel}</span>
              <span class="pantheon-badge">${entry.pantheon}</span>
            </div>
            <div class="entry-meta">${entry.meaning || ''}</div>

        if (hasSite) {
          const site = entry.site;
          html += `

              <div class="business-card-header">
                <span class="live-indicator"></span>
                <span class="live-label">Live Site</span>
              </div>
              <div class="site-domain">${site.punycode}</div>
              ${site.title ? `<div class="site-title">${escapeHtml(site.title)}</div>` : ''}
              ${site.description ? `<div class="site-description">${escapeHtml(site.description)}</div>` : ''}
              <div class="site-actions">
                <a href="https://${site.punycode}" target="_blank" rel="noopener" class="site-link primary">Visit ↗</a>
                <a href="entry.html?id=${entry.id}" class="site-link">Lexicon Entry</a>
              </div>
            </div>
          `;
        }
        else if (entry.availability) {
          const domain = entry.domain || entry.unicode + '.com';
          html += `
            <div class="availability-card">
              <div class="available-badge">Available</div>
              <div class="site-domain">${escapeHtml(domain)}</div>
              <div class="site-description">This Unicode domain name may be available for registration.</div>
              <div class="site-actions">
                <a href="entry.html?id=${entry.id}" class="site-link">View Entry</a>
              </div>
              <div class="registrar-grid">
                <a href="https://www.godaddy.com/domainsearch/find?domainToCheck=${encodeURIComponent(domain)}" target="_blank" rel="noopener" class="registrar-link">GoDaddy</a>
                <a href="https://www.namecheap.com/domains/registration/results/?domain=${encodeURIComponent(domain)}" target="_blank" rel="noopener" class="registrar-link">Namecheap</a>
                <a href="https://porkbun.com/checkout/search?q=${encodeURIComponent(domain)}" target="_blank" rel="noopener" class="registrar-link">Porkbun</a>
                <a href="https://www.dynadot.com/domain/search.html?domain=${encodeURIComponent(domain)}" target="_blank" rel="noopener" class="registrar-link">Dynadot</a>
              </div>
            </div>
          `;
        }

        html += `</div>`;
      });

      resultsEl.innerHTML = html;
      if (window.PunyCodexEffects) {
        window.PunyCodexEffects.initSpotlight('.entry-card');
      }
    }

    let oracleCollapsed = true;

    function looksLikeQuestion(q) {
      return /^(who|what|where|when|why|how|which|is|are|was|were|tell me|explain|describe|what does|meaning of|etymology of|pronunciation of|mythology of)/i.test(q.trim());
    }

    function toggleOracle() {
      const body = document.getElementById('oracleBody');
      oracleCollapsed = !oracleCollapsed;
      body.style.display = oracleCollapsed ? 'none' : 'block';
    }

    function submitOracle() {
      const input = document.getElementById('oracleInput');
      const q = input?.value.trim() || '';
      if (!q) return;
      if (oracleCollapsed) {
        toggleOracle();
      }
      updateOracle(q);
      input.value = '';
    }

    async function updateOracle(q) {
      const answerEl = document.getElementById('oracleAnswer');
      if (!q) {
        answerEl.innerHTML = '<div class="oracle-empty">The Oracle is waiting for a question.</div>';
        return;
      }
      answerEl.innerHTML = '<div class="oracle-loading"><span>🔮</span><span>The Oracle is consulting the archives...</span></div>';
      try {
        const res = await fetch(`${API_BASE}/api/oracle/?q=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error('Oracle unavailable');
        const data = await res.json();
        renderOracle(data);
      } catch (err) {
        answerEl.innerHTML = `<div class="oracle-error">The Oracle is resting: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderOracle(data) {
      const answerEl = document.getElementById('oracleAnswer');
      let html = '';

      if (data.answer) {
        // Answer is already sanitized HTML generated from curated sources.
        html += `<div class="oracle-answer">${data.answer}</div>`;
      }

      if (data.citations && data.citations.length) {
        html += `<div class="oracle-citations-title">Sources</div>`;
        html += `<div class="oracle-citations">`;
        for (const c of data.citations) {
          const label = escapeHtml(c.label);
          const url = escapeHtml(c.url);
          const isExternal = url.startsWith('http');
          html += `<a href="${url}" class="oracle-citation" ${isExternal ? 'target="_blank" rel="noopener"' : ''}>${label}</a>`;
        }
        html += `</div>`;
      }

      answerEl.innerHTML = html || '<div class="oracle-empty">The Oracle has no answer for that yet.</div>';
    }

    document.getElementById('oracleInput')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitOracle();
    });

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(isoString) {
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '';
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      } catch { return ''; }
    }

    function formatRelativeDate(isoString) {
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '';
        const now = new Date();
        const diffMs = now - d;
        const diffSec = Math.floor(diffMs / 1000);
        const diffMin = Math.floor(diffSec / 60);
        const diffHr = Math.floor(diffMin / 60);
        const diffDay = Math.floor(diffHr / 24);
        const diffWeek = Math.floor(diffDay / 7);
        const diffMonth = Math.floor(diffDay / 30);
        const diffYear = Math.floor(diffDay / 365);

        if (diffSec < 60) return 'just now';
        if (diffMin < 60) return `${diffMin}m ago`;
        if (diffHr < 24) return `${diffHr}h ago`;
        if (diffDay < 7) return `${diffDay}d ago`;
        if (diffWeek < 4) return `${diffWeek}w ago`;
        if (diffMonth < 12) return `${diffMonth}mo ago`;
        return `${diffYear}y ago`;
      } catch { return ''; }
    }

    // Mobile nav toggle
    const mobileMenuToggle = document.getElementById('mobileMenuToggle');
    const globalNav = document.getElementById('globalNav');
    if (mobileMenuToggle && globalNav) {
      mobileMenuToggle.addEventListener('click', () => {
        const isOpen = globalNav.classList.toggle('mobile-open');
        mobileMenuToggle.setAttribute('aria-expanded', String(isOpen));
      });
      globalNav.querySelectorAll('a').forEach((link) => {
        link.addEventListener('click', () => {
          globalNav.classList.remove('mobile-open');
          mobileMenuToggle.setAttribute('aria-expanded', 'false');
        });
      });
      document.addEventListener('click', (e) => {
        if (!mobileMenuToggle.contains(e.target) && !globalNav.contains(e.target)) {
          globalNav.classList.remove('mobile-open');
          mobileMenuToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }
  </script>

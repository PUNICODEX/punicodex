name: punycodex_authenticity
description: Flutter wrapper for the PÚNYCODEX Name Authenticity Shield.
version: 2.0.0
homepage: https://punycodex.com

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_js: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.punycodex.authenticity
        pluginClass: PunycodexAuthenticityPlugin
      ios:
        pluginClass: PunycodexAuthenticityPlugin

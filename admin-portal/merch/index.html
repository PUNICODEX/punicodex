<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin Portal — Creator Merch | PuniCodex</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="../portal.css">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/02-favicons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/02-favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/02-favicons/favicon-16x16.png">
    <link rel="icon" href="/assets/brand/02-favicons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/assets/brand/02-favicons/apple-touch-icon.png">
    <link rel="mask-icon" href="/assets/brand/02-favicons/mask-icon.svg" color="#D4AF37">
    <link rel="manifest" href="/assets/brand/06-code/site.webmanifest">
</head>
<body data-page="merch" data-depth="1">
    <a class="skip-link" href="#portal-main">Skip to content</a>
    <div id="portal-header"></div>

    <main id="portal-main" class="portal-main">
        <div class="portal-page-head">
            <h1>Creator Merch</h1>
            <p>Merch oversight for verified student works — product catalog, revenue-split ledger totals, and takedowns. Withdrawals are audit-logged and remove the product from the public store immediately.</p>
        </div>

        <section aria-label="Merch statistics">
            <div class="stat-grid" id="merch-stats">
                <div class="state-block">Loading merch stats…</div>
            </div>
        </section>

        <section class="panel" aria-label="Product catalog">
            <div class="panel-head">
                <h2 class="panel-title">Products</h2>
                <button type="button" class="btn btn-secondary btn-sm" id="merch-refresh">Refresh</button>
            </div>
            <div id="merch-table">
                <div class="state-block">Loading products…</div>
            </div>
        </section>
    </main>

    <script src="../portal.js"></script>
    <script>
    (function () {
        var canLease = false;

        function statCard(value, label, hint) {
            return (
                '<div class="stat-card"><div class="stat-card-value">' + value + '</div>' +
                '<div class="stat-card-label">' + Portal.escapeHtml(label) + '</div>' +
                (hint ? '<div class="stat-card-hint">' + Portal.escapeHtml(hint) + '</div>' : '') +
                '</div>'
            );
        }

        function renderStats(data) {
            var counts = data.productCounts || {};
            var ledger = data.ledger || {};
            document.getElementById('merch-stats').innerHTML =
                statCard(Portal.fmtNumber(counts.live), 'Live Products', '') +
                statCard(Portal.fmtNumber(counts.pending), 'Pending', '') +
                statCard(Portal.fmtNumber(counts.withdrawn), 'Withdrawn', '') +
                statCard(Portal.fmtNumber(ledger.orders), 'Orders', ledger.refundedOrders ? Portal.fmtNumber(ledger.refundedOrders) + ' refunded' : 'none refunded') +
                statCard(Portal.fmtDollars(ledger.grossCents), 'Gross', 'refunds excluded') +
                statCard(Portal.fmtDollars(ledger.creatorShareCents), 'Creator Share', '50% of net margin') +
                statCard(Portal.fmtDollars(ledger.platformShareCents), 'Platform Share', '');
        }

        function renderTable(data) {
            var wrap = document.getElementById('merch-table');
            var items = data.products || [];
            if (!items.length) {
                wrap.innerHTML = '<div class="state-block">No creator products yet. Products appear here when consented student works are approved in the Creative Marketplace.</div>';
                return;
            }
            var rows = items
                .map(function (p) {
                    var actions = '<span class="cell-sub">—</span>';
                    if (canLease && p.status === 'live') {
                        actions = '<button type="button" class="btn btn-sm btn-danger" data-action="withdraw" data-id="' + p.id + '">Withdraw</button>';
                    }
                    return (
                        '<tr>' +
                        '<td><div class="cell-title">' + Portal.escapeHtml(p.title || '—') + '</div>' +
                        '<div class="cell-sub">' + Portal.escapeHtml(p.product_type || '') + ' · asset #' + Portal.escapeHtml(String(p.creative_asset_id)) + '</div></td>' +
                        '<td><div class="cell-title">' + Portal.escapeHtml(p.creator_name || '—') + '</div>' +
                        '<div class="cell-sub">' + Portal.escapeHtml(p.creator_university || '') + '</div></td>' +
                        '<td>' + Portal.fmtDollars(p.price_cents) + '</td>' +
                        '<td>' + Portal.fmtDollars(p.base_cost_cents) + '</td>' +
                        '<td>' + Portal.statusBadge(p.status) + '</td>' +
                        '<td>' + Portal.escapeHtml(Portal.fmtDate(p.created_at)) + '</td>' +
                        '<td><div class="cell-actions">' + actions + '</div></td>' +
                        '</tr>'
                    );
                })
                .join('');
            wrap.innerHTML =
                '<div class="table-wrap"><table class="portal-table">' +
                '<thead><tr><th>Product</th><th>Creator</th><th>Price</th><th>Base Cost</th><th>Status</th><th>Listed</th><th>Actions</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div>';
        }

        function render(data) {
            renderStats(data);
            renderTable(data);
        }

        async function load(promise) {
            document.getElementById('merch-table').innerHTML = '<div class="state-block">Loading products…</div>';
            try {
                render(await (promise || Portal.api('/api/admin/portal/merch/')));
            } catch (err) {
                var block = '<div class="state-block error">' + Portal.escapeHtml(err.message) + '</div>';
                document.getElementById('merch-table').innerHTML = block;
                document.getElementById('merch-stats').innerHTML = block;
            }
        }

        async function withdraw(id) {
            if (!window.confirm('Force-withdraw product #' + id + '? It leaves the public store immediately. This is audit-logged.')) return;
            try {
                await Portal.api('/api/admin/portal/merch/' + id + '/withdraw/', {
                    method: 'POST',
                    body: {},
                });
                Portal.toast('Product withdrawn', 'success');
                load();
            } catch (err) {
                Portal.toast('Withdraw failed: ' + err.message, 'error');
            }
        }

        async function init() {
            // Fire the overview fetch in parallel with the shell's /me round
            // trip instead of waiting for the shell first.
            var firstLoad = Portal.api('/api/admin/portal/merch/');
            var ctx = await Portal.initShell('merch');
            if (!ctx) {
                firstLoad.catch(function () {});
                return;
            }
            canLease = Portal.can('leasing');

            document.getElementById('merch-refresh').addEventListener('click', function () { load(); });
            document.getElementById('merch-table').addEventListener('click', function (e) {
                var btn = e.target.closest('button[data-action="withdraw"]');
                if (!btn) return;
                withdraw(btn.getAttribute('data-id'));
            });

            load(firstLoad);
        }

        init();
    })();
    </script>
</body>
</html>

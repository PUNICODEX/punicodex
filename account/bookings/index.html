<body data-page="bookings">
  <header class="sb-topbar" id="sandbox-topbar"></header>

  <main class="sb-main">
    <div class="sb-page-head">
      <div>
        <h1>Bookings</h1>
        <p class="sb-page-sub">Every sponsorship and patron spot linked to your account.</p>
      </div>
    </div>

    <section class="sb-section" id="adspace-section" aria-labelledby="bookings-heading" style="margin-top:0;">

        <h2 id="bookings-heading">Ad Space</h2>
        <p class="sb-section-note">Dashboard links open the advertiser dashboard on the temple</p>
      </div>
      <div id="bookings-list">
        <div class="sb-state">Loading your bookings…</div>
      </div>
    </section>

    <section class="sb-section" id="patrons-section" aria-labelledby="patrons-heading">
      <div class="sb-section-head">
        <h2 id="patrons-heading">Patron Spots</h2>
      </div>
      <div id="patrons-list">
        <div class="sb-state">Loading patron spots…</div>
      </div>
    </section>

    <!-- Both rosters empty → one shared state, not two empty tables -->
    <div id="bookings-empty" hidden></div>
  </main>

  <footer class="sb-footer">
    <p>© 2026 PuniCodex · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a> · <a href="/contact/">Contact</a></p>

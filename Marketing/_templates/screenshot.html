<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Cinzel Decorative';
    src: url('file:///C:/projects/punicodex/assets/fonts/cinzel-decorative-900-normal-latin.woff2') format('woff2');
    font-weight: 900;
  }
  @font-face {
    font-family: 'Cinzel';
    src: url('file:///C:/projects/punicodex/assets/fonts/cinzel-400-normal-latin.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Cormorant';
    src: url('file:///C:/projects/punicodex/assets/fonts/cormorant-garamond-600-normal-latin.woff2') format('woff2');
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --w: 1080px; --h: 1920px; --scale: 1; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background: #050505;
    font-family: 'Cinzel', serif;
    color: #fff;
  }
  /* Scaled stage: fixed 1080x1920 design, transformed to fit any canvas */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1080px; height: 1920px;
    transform: translate(-50%, -50%) scale(var(--scale));
  }
  /* Temple art backdrop, heavily darkened */
  .backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center 20%;
    filter: blur(14px) brightness(0.5) saturate(0.9);
    opacity: 0.35;
  }
  .veil {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 50% 30%, rgba(212,175,55,0.14), transparent 65%),
      linear-gradient(180deg, rgba(5,5,5,0.75) 0%, rgba(5,5,5,0.55) 45%, rgba(5,5,5,0.92) 100%);
  }
  /* Greek key (meander) bands — viewport-level so they span any canvas */
  .meander {
    position: absolute; left: 0; right: 0; height: 14px;
    background:
      repeating-linear-gradient(90deg,
        #d4af37 0 26px, transparent 26px 34px,
        #d4af37 34px 44px, #d4af37 44px 48px, transparent 48px 60px,
        #d4af37 60px 66px, transparent 66px 92px);
    opacity: 0.55;
    z-index: 5;
  }
  .meander.top { top: 46px; }
  .meander.bottom { bottom: 46px; }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 96px 72px 130px;
  }
  .kicker {
    font-size: 30px; letter-spacing: 0.42em; color: #d4af37;
    text-transform: uppercase; text-align: center;
    margin-bottom: 26px; font-weight: 400;
    text-shadow: 0 0 24px rgba(212,175,55,0.4);
  }
  .headline {
    font-family: 'Cinzel Decorative', 'Segoe UI Symbol', 'Noto Sans Symbols', serif;
    font-weight: 900;
    font-size: 76px; line-height: 1.14; text-align: center;
    background: linear-gradient(180deg, #f7ecc0 0%, #e8c96a 38%, #d4af37 62%, #8a6d1c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 4px 22px rgba(212,175,55,0.25));
    margin-bottom: 20px;
    max-width: 940px;
  }
  .sub {
    font-family: 'Cormorant', serif;
    font-size: 40px; color: #cfc6ae; text-align: center;
    margin-bottom: 44px; max-width: 860px; line-height: 1.3;
  }
  .phone {
    position: relative;
    width: 456px; height: 1000px;
    border-radius: 52px;
    padding: 12px;
    background: linear-gradient(160deg, #3a3a3a 0%, #161616 40%, #0c0c0c 100%);
    box-shadow:
      0 40px 90px rgba(0,0,0,0.85),
      0 0 120px rgba(212,175,55,0.13),
      inset 0 0 0 2px rgba(212,175,55,0.28);
  }
  /* Tablet frame: slimmer bezel, wider screen, camera dot */
  .phone.tablet {
    width: 620px; height: 930px;
    border-radius: 36px;
    padding: 14px;
  }
  .phone.tablet .screen { border-radius: 26px; }
  .phone .cam {
    display: none;
    position: absolute; top: 7px; left: 50%; margin-left: -4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #1e1e1e; box-shadow: inset 0 0 2px #000;
  }
  .phone.tablet .cam { display: block; }
  .screen {
    width: 100%; height: 100%;
    border-radius: 42px; overflow: hidden;
    background: #000;
  }
  .screen img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
    display: block;
  }
  /* contain fit: show the FULL screenshot, never crop (side bars blend into
   * the black app theme) — for shots where horizontal cut is unacceptable */
  .screen.contain img { object-fit: contain; object-position: center center; }
  .footer {
    position: absolute; bottom: 84px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .footer img { height: 34px; opacity: 0.95; }
  .footer .domain {
    font-size: 26px; letter-spacing: 0.34em; color: #b99b45;
    text-transform: uppercase;
  }
  .spark {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,201,106,0.9), transparent 70%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="backdrop" id="backdrop"></div>
    <div class="veil"></div>
    <div class="content">
      <div class="kicker" id="kicker"></div>
      <div class="headline" id="headline"></div>
      <div class="sub" id="sub"></div>
      <div class="phone" id="phone">
      <div class="cam"></div>
      <div class="screen" id="screen"><img id="shot"></div>
    </div>
    </div>
    <div class="footer">
      <img id="lockup" src="file:///C:/projects/punicodex/assets/brand/01-logos/punicodex-lockup-horizontal-gold.webp">
      <div class="domain">punicodex.com</div>
    </div>
  </div>
  <div class="meander top"></div>
  <div class="meander bottom"></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('kicker').textContent = q.get('kicker') || '';
    document.getElementById('headline').textContent = q.get('headline') || '';
    document.getElementById('sub').textContent = q.get('sub') || '';
    document.getElementById('shot').src = q.get('shot');
    document.getElementById('backdrop').style.backgroundImage = `url('${q.get('backdrop')}')`;
    if (q.get('frame') === 'tablet') document.getElementById('phone').classList.add('tablet');
    if (q.get('fit') === 'contain') document.getElementById('screen').classList.add('contain');
    // Canvas size: default 1080x1920 (phone); tablets scale the stage to fit.
    const w = Number(q.get('w') || 1080);
    const h = Number(q.get('h') || 1920);
    const scale = Math.min(w / 1080, h / 1920);
    document.documentElement.style.setProperty('--w', w + 'px');
    document.documentElement.style.setProperty('--h', h + 'px');
    document.documentElement.style.setProperty('--scale', String(scale));
  </script>
</body>
</html>

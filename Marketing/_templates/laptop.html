<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Cinzel Decorative';
    src: url('file:///C:/projects/punicodex/assets/fonts/cinzel-decorative-900-normal-latin.woff2') format('woff2');
    font-weight: 900;
  }
  @font-face {
    font-family: 'Cinzel';
    src: url('file:///C:/projects/punicodex/assets/fonts/cinzel-400-normal-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant';
    src: url('file:///C:/projects/punicodex/assets/fonts/cormorant-garamond-600-normal-latin.woff2') format('woff2');
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background: #050505;
    font-family: 'Cinzel', serif;
    color: #fff;
  }
  .backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center 20%;
    filter: blur(16px) brightness(0.5);
    opacity: 0.32;
  }
  .veil {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 1000px 620px at 50% 42%, rgba(212,175,55,0.13), transparent 65%),
      linear-gradient(180deg, rgba(5,5,5,0.72), rgba(5,5,5,0.5) 45%, rgba(5,5,5,0.9));
  }
  .meander {
    position: absolute; left: 0; right: 0; height: 12px;
    background:
      repeating-linear-gradient(90deg,
        #d4af37 0 22px, transparent 22px 29px,
        #d4af37 29px 37px, #d4af37 37px 40px, transparent 40px 51px,
        #d4af37 51px 56px, transparent 56px 78px);
    opacity: 0.55;
  }
  .meander.top { top: 34px; }
  .meander.bottom { bottom: 34px; }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 78px 90px 96px;
  }
  .kicker {
    font-size: 26px; letter-spacing: 0.42em; color: #d4af37;
    text-transform: uppercase; margin-bottom: 18px;
    text-shadow: 0 0 22px rgba(212,175,55,0.4);
  }
  .headline {
    font-family: 'Cinzel Decorative', 'Segoe UI Symbol', serif;
    font-weight: 900; font-size: 62px; line-height: 1.12; text-align: center;
    background: linear-gradient(180deg, #f7ecc0 0%, #e8c96a 38%, #d4af37 62%, #8a6d1c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(212,175,55,0.25));
    margin-bottom: 14px; max-width: 1500px;
  }
  .sub {
    font-family: 'Cormorant', serif;
    font-size: 30px; color: #cfc6ae; text-align: center; margin-bottom: 34px;
  }
  /* Laptop mockup */
  .laptop { position: relative; }
  .lid {
    width: 1180px; border-radius: 18px 18px 0 0; padding: 12px 12px 0 12px;
    background: linear-gradient(180deg, #2e2e2e, #101010);
    box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 100px rgba(212,175,55,0.12),
      inset 0 0 0 2px rgba(212,175,55,0.22);
  }
  .browser {
    border-radius: 10px 10px 0 0; overflow: hidden; background: #0d0d0f;
  }
  .browser .bar {
    height: 44px; display: flex; align-items: center; gap: 14px;
    background: #161618; padding: 0 16px;
    border-bottom: 1px solid #232324;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #5a3a3a; } .dot.y { background: #5a5236; } .dot.g { background: #3a4a3a; }
  .url {
    flex: 1; height: 28px; border-radius: 14px; background: #0d0d0f;
    color: #b99b45; font-size: 15px; display: flex; align-items: center;
    padding: 0 16px; font-family: 'Cormorant', serif; letter-spacing: 0.04em;
  }
  .browser .viewport { height: 620px; overflow: hidden; background: #000; }
  .browser .viewport img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .base {
    width: 1320px; height: 26px; margin-left: -70px;
    background: linear-gradient(180deg, #3a3a3a, #0a0a0a);
    border-radius: 4px 4px 16px 16px;
    box-shadow: 0 24px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .notch {
    width: 180px; height: 10px; margin: 0 auto;
    background: #050505; border-radius: 0 0 10px 10px;
  }
  .footer {
    position: absolute; bottom: 64px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .footer img { height: 30px; width: 30px; }
  .footer .domain { font-size: 22px; letter-spacing: 0.34em; color: #b99b45; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="backdrop" style="background-image:url('file:///C:/projects/punicodex/assets/og/zeus.jpg')"></div>
  <div class="veil"></div>
  <div class="meander top"></div>
  <div class="meander bottom"></div>
  <div class="content">
    <div class="kicker">Also on the Web</div>
    <div class="headline">punicodex.com — the full type temple</div>
    <div class="sub">Every name, every temple, every domain — free in the browser.</div>
    <div class="laptop">
      <div class="lid">
        <div class="browser">
          <div class="bar">
            <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
            <div class="url">punicodex.com/type/</div>
          </div>
          <div class="viewport"><img src="file:///C:/projects/punicodex/marketing/_work/desktop_type.png"></div>
        </div>
      </div>
      <div class="base"><div class="notch"></div></div>
    </div>
  </div>
  <div class="footer">
    <img src="file:///C:/projects/punicodex/assets/brand/01-logos/punicodex-emblem-gold.png">
    <div class="domain">punicodex.com</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Cinzel Decorative';
    src: url('file:///C:/projects/punicodex/assets/fonts/cinzel-decorative-900-normal-latin.woff2') format('woff2');
    font-weight: 900;
  }
  @font-face {
    font-family: 'Cinzel';
    src: url('file:///C:/projects/punicodex/assets/fonts/cinzel-400-normal-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cormorant';
    src: url('file:///C:/projects/punicodex/assets/fonts/cormorant-garamond-600-normal-latin.woff2') format('woff2');
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background: #07070a;
    font-family: 'Cinzel', serif;
    color: #fff;
  }
  /* ChromeOS-style dark wallpaper */
  .wallpaper {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 1400px 900px at 70% 30%, rgba(212,175,55,0.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 20% 80%, rgba(70,90,160,0.10), transparent 65%),
      linear-gradient(160deg, #0a0a10 0%, #060608 55%, #0b0a08 100%);
  }
  /* shelf (taskbar) */
  .shelf {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background: rgba(12,12,16,0.92);
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; padding: 0 28px; gap: 18px;
  }
  .shelf .icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(160deg, #2a2a32, #15151a);
    border: 1px solid rgba(212,175,55,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #d4af37;
  }
  .shelf .spacer { flex: 1; }
  .shelf .clock { font-size: 14px; color: #9a9a9a; letter-spacing: 0.08em; font-family: 'Cormorant', serif; }
  /* copy block */
  .copy {
    position: absolute; left: 96px; top: 0; bottom: 64px; width: 780px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-size: 24px; letter-spacing: 0.42em; color: #d4af37;
    text-transform: uppercase; margin-bottom: 18px;
    text-shadow: 0 0 22px rgba(212,175,55,0.4);
  }
  .headline {
    font-family: 'Cinzel Decorative', 'Segoe UI Symbol', serif;
    font-weight: 900; font-size: 60px; line-height: 1.12;
    background: linear-gradient(180deg, #f7ecc0 0%, #e8c96a 38%, #d4af37 62%, #8a6d1c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(212,175,55,0.22));
    margin-bottom: 16px; max-width: 760px;
  }
  .sub {
    font-family: 'Cormorant', serif;
    font-size: 28px; color: #cfc6ae; line-height: 1.3; max-width: 640px; margin-bottom: 26px;
  }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; max-width: 700px; }
  .chip {
    font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #e8c96a; border: 1px solid rgba(212,175,55,0.55);
    padding: 7px 13px; border-radius: 999px;
    background: rgba(212,175,55,0.07); white-space: nowrap;
  }
  /* app window — how Android apps look on ChromeOS */
  .window {
    position: absolute; right: 150px; top: 96px;
    width: 480px; border-radius: 14px; overflow: hidden;
    background: #0d0d0f;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.8),
      0 0 90px rgba(212,175,55,0.10),
      0 0 0 1px rgba(255,255,255,0.07);
  }
  .window .titlebar {
    height: 42px; display: flex; align-items: center; gap: 12px;
    background: #16161a; padding: 0 16px;
    border-bottom: 1px solid #222226;
  }
  .window .titlebar img { width: 22px; height: 22px; border-radius: 6px; }
  .window .titlebar .name { font-size: 14px; color: #d8d8d8; letter-spacing: 0.08em; font-family: 'Cinzel', serif; }
  .window .titlebar .winbtns { margin-left: auto; display: flex; gap: 14px; }
  .window .titlebar .winbtns span {
    width: 12px; height: 12px; border-radius: 50%; background: #3a3a42;
  }
  .window .app {
    height: 790px; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .window .app img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
</style>
</head>
<body>
  <div class="wallpaper"></div>
  <div class="copy">
    <div class="kicker" id="kicker"></div>
    <div class="headline" id="headline"></div>
    <div class="sub" id="sub"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="window">
    <div class="titlebar">
      <img src="file:///C:/projects/punicodex/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png"
           onerror="this.src='file:///C:/projects/punicodex/assets/images/icon512.png'">
      <div class="name">PuniCodex</div>
      <div class="winbtns"><span></span><span></span><span></span></div>
    </div>
    <div class="app"><img id="shot"></div>
  </div>
  <div class="shelf">
    <div class="icon">⌂</div>
    <div class="icon" style="border-color:#d4af37;background:linear-gradient(160deg,#3a3120,#1c1710)">Ω</div>
    <div class="icon">✉</div>
    <div class="spacer"></div>
    <div class="clock">PuniCodex · ChromeOS</div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('kicker').textContent = q.get('kicker') || '';
    document.getElementById('headline').textContent = q.get('headline') || '';
    document.getElementById('sub').textContent = q.get('sub') || '';
    document.getElementById('shot').src = q.get('shot');
    const chips = (q.get('chips') || '').split('|').filter(Boolean);
    document.getElementById('chips').innerHTML = chips.map((c) => '<div class="chip">' + c + '</div>').join('');
  </script>
</body>
</html>

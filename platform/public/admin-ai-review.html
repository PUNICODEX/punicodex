<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNICODEX-ANALYTICS-START -->
<script src="/js/analytics-beacon.js" defer></script>
<!-- PUNICODEX-ANALYTICS-END -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Níkē Admin — AI Review</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <style>
        :root {
            --bg: #080e19;
            --bg-elevated: #0e1a2b;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
            --text: #e8e4dc;
            --text-muted: #7a8a9e;
            --danger: #ff6b6b;
            --success: #4ade80;
            --warning: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem;
        }
        .login-box {
            background: var(--bg-elevated); border: 1px solid var(--gold-dim);
            border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 360px;
        }
        .login-box h1 { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 1.5rem; text-align: center; }
        .login-box input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--gold-dim);
            border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-size: 0.95rem;
            margin-bottom: 1rem; outline: none;
        }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button {
            width: 100%; background: var(--gold); color: #000; border: none; border-radius: 8px;
            padding: 0.75rem; font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.85rem; cursor: pointer;
        }
        .admin-header {
            background: var(--bg-elevated); border-bottom: 1px solid var(--gold-dim);
            padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
        }
        .admin-header h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold); }
        .admin-nav { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .admin-nav a {
            color: var(--text-muted); text-decoration: none; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            padding: 0.35rem 0.75rem; border: 1px solid var(--gold-dim); border-radius: 100px;
            transition: all 0.2s;
        }
        .admin-nav a:hover, .admin-nav a.active { color: var(--gold); border-color: var(--gold); }
        .admin-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat-value { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .admin-filters {
            padding: 1rem 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .filter-btn {
            background: transparent; border: 1px solid var(--gold-dim); color: var(--text-muted);
            padding: 0.4rem 1rem; border-radius: 100px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .entries-grid {
            padding: 1.5rem 2rem; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem;
        }
        .entry-card {
            background: var(--bg-elevated); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden;
        }
        .entry-card-header {
            padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; align-items: center; justify-content: space-between;
        }
        .entry-name { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1rem; color: var(--gold); }
        .entry-status {
            font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
            padding: 0.25rem 0.75rem; border-radius: 100px;
        }
        .status-pending { background: rgba(251,191,36,0.1); color: var(--warning); }
        .status-approved { background: rgba(74,222,128,0.1); color: var(--success); }
        .status-rejected { background: rgba(255,107,107,0.1); color: var(--danger); }
        .entry-card-body { padding: 1rem; }
        .field { margin-bottom: 1rem; }
        .field-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.35rem; }
        .field textarea {
            width: 100%; min-height: 80px; background: rgba(255,255,255,0.03); border: 1px solid var(--gold-dim);
            border-radius: 8px; padding: 0.6rem 0.75rem; color: var(--text); font-size: 0.85rem; font-family: inherit;
            resize: vertical; outline: none;
        }
        .field textarea:focus { border-color: var(--gold); }
        .field.short textarea { min-height: 44px; }
        .entry-actions { padding: 0 1rem 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .action-btn {
            flex: 1; min-width: 80px; padding: 0.5rem; border-radius: 6px; font-size: 0.75rem;
            font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.85; }
        .btn-approve { background: var(--success); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-regenerate { background: var(--gold); color: #000; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const API_BASE = window.location.origin;
        let adminToken = localStorage.getItem('nike_admin_token');
        let currentFilter = 'pending';
        let allEntries = [];

        async function api(path, opts = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-token': adminToken,
                    ...opts.headers,
                },
            });
            return res.json();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-screen">
                    <div class="login-box">
                        <h1>Níkē Admin</h1>
                        <input type="password" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
                        <button onclick="doLogin()">Enter</button>
                    </div>
                </div>
            `;
        }

        async function doLogin() {
            const pass = document.getElementById('admin-pass').value;
            const data = await api('/api/admin/login/', { method: 'POST', body: JSON.stringify({ password: pass }) });
            if (data.success) {
                adminToken = data.token;
                localStorage.setItem('nike_admin_token', adminToken);
                loadEntries();
            } else {
                alert('Invalid password');
            }
        }

        async function loadEntries() {
            const [data, stats] = await Promise.all([
                api(`/api/admin/ai-review/?status=${currentFilter}`),
                api('/api/admin/ai-review/stats/')
            ]);
            if (data.error) {
                localStorage.removeItem('nike_admin_token');
                renderLogin();
                return;
            }
            allEntries = data.entries || [];
            renderDashboard(allEntries, stats);
        }

        function renderDashboard(entries, stats) {
            const filters = ['pending', 'approved', 'rejected', 'all'];
            document.getElementById('app').innerHTML = `
                <div class="admin-header">
                    <h1>AI Content Review</h1>
                    <nav class="admin-nav">
                        <a href="admin-bookings.html">Bookings</a>
                        <a href="admin-curator.html">Curator</a>
                        <a href="admin-ai-review.html" class="active">AI Review</a>
                        <a href="admin-api-keys.html">API Keys</a>
                        <a href="admin-tenants.html">Tenants</a>
                        <a href="admin.html">Crawler</a>
                        <a href="admin-analytics.html">Analytics</a>
                    </nav>
                    <div class="admin-stats">
                        <div class="stat"><div class="stat-value">${stats.pending}</div><div class="stat-label">Pending</div></div>
                        <div class="stat"><div class="stat-value">${stats.approved}</div><div class="stat-label">Approved</div></div>
                        <div class="stat"><div class="stat-value">${stats.rejected}</div><div class="stat-label">Rejected</div></div>
                    </div>
                </div>
                <div class="admin-filters">
                    ${filters.map(f => `
                        <button class="filter-btn ${f === currentFilter ? 'active' : ''}" onclick="setFilter('${f}')">${f}</button>
                    `).join('')}
                </div>
                <div class="entries-grid">
                    ${entries.length === 0 ? '<div class="empty-state">No entries in this category.</div>' : entries.map(e => renderCard(e)).join('')}
                </div>
            `;
        }

        function renderCard(e) {
            return `
                <div class="entry-card" id="card-${e.id}">
                    <div class="entry-card-header">
                        <span class="entry-name">${e.unicode || e.ascii}</span>
                        <span class="entry-status status-${e.ai_review_status}">${e.ai_review_status}</span>
                    </div>
                    <div class="entry-card-body">
                        <div class="field"><div class="field-label">Summary</div><textarea id="summary-${e.id}">${escapeHtml(e.ai_summary || '')}</textarea></div>
                        <div class="field short"><div class="field-label">Symbols</div><textarea id="symbols-${e.id}">${escapeHtml(e.ai_symbols || '')}</textarea></div>
                        <div class="field short"><div class="field-label">Pronunciation</div><textarea id="pron-${e.id}">${escapeHtml(e.ai_pronunciation || '')}</textarea></div>
                        <div class="field"><div class="field-label">Etymology</div><textarea id="ety-${e.id}">${escapeHtml(e.ai_etymology_narrative || '')}</textarea></div>
                        <div class="field"><div class="field-label">Relevance Today</div><textarea id="rel-${e.id}">${escapeHtml(e.ai_relevance_today || '')}</textarea></div>
                    </div>
                    <div class="entry-actions">
                        <button class="action-btn btn-approve" onclick="updateEntry('${e.id}', 'approved')">Approve</button>
                        <button class="action-btn btn-reject" onclick="updateEntry('${e.id}', 'rejected')">Reject</button>
                        <button class="action-btn btn-regenerate" onclick="updateEntry('${e.id}', 'regenerate')">Regenerate</button>
                    </div>
                </div>
            `;
        }

        function setFilter(f) {
            currentFilter = f;
            loadEntries();
        }

        async function updateEntry(id, status) {
            const body = { status };
            if (status !== 'regenerate') {
                body.summary = document.getElementById(`summary-${id}`).value;
                body.symbols = document.getElementById(`symbols-${id}`).value;
                body.pronunciation = document.getElementById(`pron-${id}`).value;
                body.etymologyNarrative = document.getElementById(`ety-${id}`).value;
                body.relevanceToday = document.getElementById(`rel-${id}`).value;
            }
            const btn = event.target;
            const original = btn.textContent;
            btn.textContent = status === 'regenerate' ? 'Generating...' : 'Saving...';
            try {
                const data = await api(`/api/admin/ai-review/${id}`, { method: 'POST', body: JSON.stringify(body) });
                if (data.error) throw new Error(data.error);
                btn.textContent = 'Done';
                if (status === 'regenerate') {
                    // Replace card content
                    const idx = allEntries.findIndex(x => x.id === id);
                    if (idx >= 0) {
                        allEntries[idx] = data.entry;
                        renderDashboard(allEntries, await api('/api/admin/ai-review/stats/'));
                    }
                }
                setTimeout(() => {
                    if (status !== 'regenerate') btn.textContent = original;
                    loadEntries();
                }, 600);
            } catch (err) {
                alert(err.message);
                btn.textContent = original;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        if (adminToken) loadEntries();
        else renderLogin();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNICODEX-ANALYTICS-START -->
<script src="/js/analytics-beacon.js" defer></script>
<!-- PUNICODEX-ANALYTICS-END -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuniCodex Admin — API Keys</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080e19;
            --bg-elevated: #0e1a2b;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
            --text: #e8e4dc;
            --text-muted: #7a8a9e;
            --danger: #ff6b6b;
            --success: #4ade80;
            --warning: #fbbf24;
            --info: #60a5fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .login-box {
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 360px;
        }
        .login-box h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
        }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .admin-header {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--gold-dim);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .admin-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
        }
        .admin-nav {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .admin-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--gold-dim);
            border-radius: 100px;
            transition: all 0.2s;
        }
        .admin-nav a:hover, .admin-nav a.active {
            color: var(--gold);
            border-color: var(--gold);
        }
        .admin-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .admin-toolbar {
            padding: 1rem 2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .action-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--gold); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #000; }
        .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.7rem; }
        .keys-container {
            padding: 1.5rem 2rem;
        }
        .keys-table-wrap {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            padding: 0.9rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        td { color: var(--text); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .tier-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .tier-free { background: rgba(255,255,255,0.08); color: var(--text); }
        .tier-hobby { background: rgba(96,165,250,0.15); color: var(--info); }
        .tier-pro { background: rgba(212,175,55,0.15); color: var(--gold); }
        .tier-enterprise { background: rgba(74,222,128,0.15); color: var(--success); }
        .scope-chip {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
            font-size: 0.65rem;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            margin-right: 0.3rem;
            margin-bottom: 0.2rem;
        }
        .status-active { color: var(--success); font-weight: 600; }
        .status-revoked { color: var(--danger); font-weight: 600; }
        .key-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 2rem;
        }
        .modal {
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 1rem;
        }
        .modal label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            margin-top: 0.75rem;
        }
        .modal input, .modal select {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        .modal input:focus, .modal select:focus { border-color: var(--gold); }
        .modal .checkbox-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .modal .checkbox-row input {
            width: auto;
        }
        .modal .checkbox-row label {
            margin: 0;
            color: var(--text);
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }
        .modal-actions button { flex: 1; }
        .key-reveal {
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            word-break: break-all;
        }
        .key-reveal code {
            font-family: 'Courier New', monospace;
            color: var(--success);
            font-size: 0.9rem;
        }
        .usage-panel {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 1.25rem;
            margin-top: 1.5rem;
        }
        .usage-panel h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 0.35rem;
            height: 120px;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 1rem;
            position: relative;
        }
        .bar {
            flex: 1;
            background: var(--gold);
            border-radius: 3px 3px 0 0;
            min-height: 2px;
            position: relative;
            opacity: 0.85;
        }
        .bar:hover { opacity: 1; }
        .bar-label {
            position: absolute;
            bottom: -1.25rem;
            left: 50%;
            transform: translateX(-50%) rotate(-45deg);
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-left: 3px solid var(--gold);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.8rem;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const API_BASE = window.location.origin;
        let adminToken = localStorage.getItem('nike_admin_token');
        let keysData = [];
        let expandedKeyId = null;

        async function api(path, opts = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-token': adminToken,
                    ...opts.headers,
                },
            });
            return res.json();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-screen">
                    <div class="login-box">
                        <h1>PuniCodex Admin</h1>
                        <input type="password" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
                        <button onclick="doLogin()">Enter</button>
                    </div>
                </div>
            `;
        }

        async function doLogin() {
            const pass = document.getElementById('admin-pass').value;
            const data = await api('/api/admin/login/', {
                method: 'POST',
                body: JSON.stringify({ password: pass }),
            });
            if (data.success || data.token) {
                adminToken = data.token;
                localStorage.setItem('nike_admin_token', adminToken);
                loadKeys();
            } else {
                alert(data.error || 'Invalid password');
            }
        }

        async function loadKeys() {
            const data = await api('/api/admin/api-keys/');
            if (data.error) {
                localStorage.removeItem('nike_admin_token');
                renderLogin();
                return;
            }
            keysData = data.keys || [];
            renderDashboard(data.keys, data.stats);
        }

        function renderDashboard(keys, stats) {
            document.getElementById('app').innerHTML = `
                <div class="admin-header">
                    <h1>API Keys</h1>
                    <nav class="admin-nav">
                        <a href="/admin-portal/">Portal</a>
                        <a href="admin-bookings.html">Bookings</a>
                        <a href="admin-curator.html">Curator</a>
                        <a href="admin-ai-review.html">AI Review</a>
                        <a href="admin-api-keys.html" class="active">API Keys</a>
                        <a href="admin-tenants.html">Tenants</a>
                        <a href="admin.html">Crawler</a>
                        <a href="admin-analytics.html">Analytics</a>
                    </nav>
                    <div class="admin-stats">
                        <div class="stat"><div class="stat-value">${stats.total}</div><div class="stat-label">Total</div></div>
                        <div class="stat"><div class="stat-value">${stats.active}</div><div class="stat-label">Active</div></div>
                        <div class="stat"><div class="stat-value">${stats.revoked}</div><div class="stat-label">Revoked</div></div>
                        <div class="stat"><div class="stat-value">${stats.requestsToday}</div><div class="stat-label">Today</div></div>
                    </div>
                </div>
                <div class="admin-toolbar">
                    <button class="action-btn btn-primary" onclick="showCreateModal()">+ Create Key</button>
                    <button class="action-btn btn-secondary" onclick="loadKeys()">Refresh</button>
                </div>
                <div class="keys-container">
                    <div class="keys-table-wrap">
                        ${keys.length === 0
                            ? '<div class="empty-state">No API keys yet.</div>'
                            : `<table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Tier</th>
                                        <th>Scopes</th>
                                        <th>Requests</th>
                                        <th>Rate Limit</th>
                                        <th>Status</th>
                                        <th>Last Used</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${keys.map(k => renderKeyRow(k)).join('')}
                                </tbody>
                            </table>`}
                    </div>
                    ${expandedKeyId ? renderUsagePanel(expandedKeyId) : ''}
                </div>
            `;
        }

        function renderKeyRow(k) {
            const tierClass = `tier-${k.tier}`;
            const statusClass = k.isRevoked ? 'status-revoked' : 'status-active';
            const statusText = k.isRevoked ? 'Revoked' : 'Active';
            const lastUsed = k.lastUsedAt ? new Date(k.lastUsedAt).toLocaleString() : 'Never';
            const created = new Date(k.createdAt).toLocaleDateString();
            const scopeChips = k.scopes.map(s => `<span class="scope-chip">${s}</span>`).join('');
            return `
                <tr>
                    <td>
                        <div style="font-weight:600;">${k.name || 'Unnamed'}</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">Created ${created}</div>
                    </td>
                    <td><span class="tier-badge ${tierClass}">${k.tier}</span></td>
                    <td>${scopeChips}</td>
                    <td>${k.requestCount.toLocaleString()}</td>
                    <td>${k.rateLimit.toLocaleString()}/day</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>${lastUsed}</td>
                    <td>
                        <div class="key-actions">
                            <button class="action-btn btn-sm btn-secondary" onclick="toggleUsage(${k.id})">${expandedKeyId === k.id ? 'Hide' : 'Usage'}</button>
                            <button class="action-btn btn-sm btn-secondary" onclick="showEditModal(${k.id})">Edit</button>
                            ${k.isRevoked
                                ? `<button class="action-btn btn-sm btn-success" onclick="unrevokeKey(${k.id})">Unrevoke</button>`
                                : `<button class="action-btn btn-sm btn-danger" onclick="revokeKey(${k.id})">Revoke</button>`}
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderUsagePanel(keyId) {
            const key = keysData.find(k => k.id === keyId);
            if (!key) return '';
            return `
                <div class="usage-panel" id="usage-panel-${keyId}">
                    <h3>Usage — ${key.name || 'Unnamed'}</h3>
                    <div class="bar-chart" id="usage-chart-${keyId}">
                        <div style="color:var(--text-muted);font-size:0.8rem;">Loading…</div>
                    </div>
                    <div id="usage-recent-${keyId}"></div>
                </div>
            `;
        }

        async function toggleUsage(keyId) {
            expandedKeyId = expandedKeyId === keyId ? null : keyId;
            loadKeys();
            if (expandedKeyId) {
                await loadUsage(keyId);
            }
        }

        async function loadUsage(keyId) {
            const usage = await api(`/api/admin/api-keys/${keyId}/usage?days=7`);
            const chart = document.getElementById(`usage-chart-${keyId}`);
            const recentWrap = document.getElementById(`usage-recent-${keyId}`);
            if (!chart || !recentWrap) return;

            const max = Math.max(...usage.daily.map(d => d.requests), 1);
            chart.innerHTML = usage.daily.length === 0
                ? '<div style="color:var(--text-muted);font-size:0.8rem;">No requests in the last 7 days.</div>'
                : usage.daily.map(d => {
                    const pct = (d.requests / max) * 100;
                    return `<div class="bar" style="height:${pct}%;" title="${d.day}: ${d.requests}">
                        <span class="bar-label">${d.day.slice(5)}</span>
                    </div>`;
                }).reverse().join('');

            recentWrap.innerHTML = usage.recent.length === 0
                ? ''
                : `<table style="margin-top:1rem;font-size:0.75rem;">
                    <thead><tr><th>Time</th><th>Method</th><th>Path</th><th>Status</th><th>Duration</th></tr></thead>
                    <tbody>
                        ${usage.recent.map(r => `
                            <tr>
                                <td>${new Date(r.created_at).toLocaleString()}</td>
                                <td>${r.method}</td>
                                <td>${r.path}</td>
                                <td>${r.status_code}</td>
                                <td>${r.duration_ms}ms</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function showCreateModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'key-modal';
            modal.innerHTML = `
                <div class="modal">
                    <h3>Create API Key</h3>
                    <label for="key-name">Name / Label</label>
                    <input type="text" id="key-name" placeholder="e.g. Acme Games Production">
                    <label for="key-tier">Tier</label>
                    <select id="key-tier">
                        <option value="free">Free — 100/day</option>
                        <option value="hobby">Hobby — 1,000/day</option>
                        <option value="pro">Pro — 10,000/day</option>
                        <option value="enterprise">Enterprise — 100,000/day</option>
                    </select>
                    <label for="key-rate">Custom Rate Limit (optional)</label>
                    <input type="number" id="key-rate" placeholder="Leave blank for tier default">
                    <label>Scopes</label>
                    <div class="checkbox-row"><input type="checkbox" id="scope-read" checked><label for="scope-read">names:read</label></div>
                    <div class="checkbox-row"><input type="checkbox" id="scope-write"><label for="scope-write">names:write</label></div>
                    <div class="checkbox-row"><input type="checkbox" id="scope-admin"><label for="scope-admin">admin</label></div>
                    <div class="modal-actions">
                        <button class="action-btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button class="action-btn btn-primary" onclick="submitCreate()">Create</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showEditModal(keyId) {
            const key = keysData.find(k => k.id === keyId);
            if (!key) return;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'key-modal';
            modal.innerHTML = `
                <div class="modal">
                    <h3>Edit API Key</h3>
                    <label for="key-name">Name / Label</label>
                    <input type="text" id="key-name" value="${escapeHtml(key.name || '')}">
                    <label for="key-tier">Tier</label>
                    <select id="key-tier">
                        <option value="free" ${key.tier === 'free' ? 'selected' : ''}>Free</option>
                        <option value="hobby" ${key.tier === 'hobby' ? 'selected' : ''}>Hobby</option>
                        <option value="pro" ${key.tier === 'pro' ? 'selected' : ''}>Pro</option>
                        <option value="enterprise" ${key.tier === 'enterprise' ? 'selected' : ''}>Enterprise</option>
                    </select>
                    <label for="key-rate">Custom Rate Limit</label>
                    <input type="number" id="key-rate" value="${key.rateLimit}">
                    <label>Scopes</label>
                    <div class="checkbox-row"><input type="checkbox" id="scope-read" ${key.scopes.includes('names:read') ? 'checked' : ''}><label for="scope-read">names:read</label></div>
                    <div class="checkbox-row"><input type="checkbox" id="scope-write" ${key.scopes.includes('names:write') ? 'checked' : ''}><label for="scope-write">names:write</label></div>
                    <div class="checkbox-row"><input type="checkbox" id="scope-admin" ${key.scopes.includes('admin') ? 'checked' : ''}><label for="scope-admin">admin</label></div>
                    <div class="modal-actions">
                        <button class="action-btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button class="action-btn btn-primary" onclick="submitEdit(${key.id})">Save</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeModal() {
            const modal = document.getElementById('key-modal');
            if (modal) modal.remove();
        }

        function getScopesFromModal() {
            const scopes = [];
            if (document.getElementById('scope-read').checked) scopes.push('names:read');
            if (document.getElementById('scope-write').checked) scopes.push('names:write');
            if (document.getElementById('scope-admin').checked) scopes.push('admin');
            return scopes;
        }

        async function submitCreate() {
            const name = document.getElementById('key-name').value.trim();
            const tier = document.getElementById('key-tier').value;
            const rateInput = document.getElementById('key-rate').value.trim();
            const rateLimit = rateInput ? parseInt(rateInput, 10) : undefined;
            const scopes = getScopesFromModal();

            if (scopes.length === 0) return alert('Select at least one scope');

            const btn = event.target;
            btn.textContent = 'Creating…';
            try {
                const data = await api('/api/admin/api-keys/', {
                    method: 'POST',
                    body: JSON.stringify({ name, tier, scopes, rateLimit }),
                });
                if (data.error) throw new Error(data.error);
                closeModal();
                showCreatedKey(data.key);
            } catch (err) {
                alert(err.message);
                btn.textContent = 'Create';
            }
        }

        async function submitEdit(keyId) {
            const name = document.getElementById('key-name').value.trim();
            const tier = document.getElementById('key-tier').value;
            const rateLimit = parseInt(document.getElementById('key-rate').value, 10);
            const scopes = getScopesFromModal();

            if (scopes.length === 0) return alert('Select at least one scope');

            const btn = event.target;
            btn.textContent = 'Saving…';
            try {
                const data = await api(`/api/admin/api-keys/${keyId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ name, tier, scopes, rateLimit }),
                });
                if (data.error) throw new Error(data.error);
                closeModal();
                loadKeys();
                toast('Key updated');
            } catch (err) {
                alert(err.message);
                btn.textContent = 'Save';
            }
        }

        function showCreatedKey(key) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'key-modal';
            modal.innerHTML = `
                <div class="modal">
                    <h3>API Key Created</h3>
                    <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:1rem;">Copy this key now. It will never be shown again.</p>
                    <div class="key-reveal"><code>${key.plaintext}</code></div>
                    <div class="modal-actions">
                        <button class="action-btn btn-secondary" onclick="closeModal();loadKeys();">Close</button>
                        <button class="action-btn btn-primary" onclick="copyToClipboard('${key.plaintext}')">Copy Key</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function revokeKey(keyId) {
            if (!confirm('Revoke this key? It will immediately stop working.')) return;
            const data = await api(`/api/admin/api-keys/${keyId}/revoke`, { method: 'POST', body: JSON.stringify({}) });
            if (data.error) return alert(data.error);
            loadKeys();
            toast('Key revoked');
        }

        async function unrevokeKey(keyId) {
            const data = await api(`/api/admin/api-keys/${keyId}/unrevoke`, { method: 'POST', body: JSON.stringify({}) });
            if (data.error) return alert(data.error);
            loadKeys();
            toast('Key unrevoked');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
        }

        function toast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Init
        if (adminToken) loadKeys();
        else renderLogin();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUNYCODEX — Curated Unicode Real Estate</title>
  <style>
    :root {
      --bg: #0d0d12;
      --surface: #14141c;
      --surface-2: #1c1c28;
      --surface-hover: #222230;
      --text: #e8e6f0;
      --text-dim: #8a87a0;
      --text-muted: #5a5870;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.12);
      --border: #2a2a3a;
      --link-blue: #8ab4f8;
      --link-green: #a5d6a7;
      --gold: #c9a96e;
      --tier-dual: #c9a96e;
      --tier-1: #7ec9a0;
      --tier-2: #87aee8;
      --available: #7ec9a0;
      --live: #87c9e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== HEADER ====== */
    header {
      padding: 1.5rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-inner {
      max-width: 700px;
      margin: 0 auto;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .logo-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ====== SEARCH BOX ====== */
    .search-box {
      position: relative;
      margin-bottom: 0.75rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      font-size: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box .search-clear {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: none;
      font-size: 1.1rem;
    }

    .search-box .search-clear.visible {
      display: block;
    }

    /* ====== AUTOCOMPLETE ====== */
    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 100;
      max-height: 320px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-dropdown.visible {
      display: block;
    }

    .autocomplete-item {
      padding: 0.65rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid rgba(42,42,58,0.5);
      transition: background 0.15s;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--surface-hover);
    }

    .autocomplete-item:first-child {
      border-radius: 12px 12px 0 0;
    }

    .autocomplete-item:last-child {
      border-radius: 0 0 12px 12px;
    }

    .autocomplete-icon {
      font-size: 0.9rem;
      width: 1.2rem;
      text-align: center;
    }

    .autocomplete-text {
      flex: 1;
      font-size: 0.9rem;
      color: var(--text);
    }

    .autocomplete-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* ====== DID YOU MEAN ====== */
    .did-you-mean {
      padding: 0.6rem 1rem;
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      margin: 0.5rem 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
    }

    .did-you-mean a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .did-you-mean a:hover {
      text-decoration: underline;
    }

    /* ====== RELATED SEARCHES ====== */
    .related-searches {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .related-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .related-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .related-chip {
      padding: 0.4rem 0.8rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .related-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ====== MODE TABS ====== */
    .mode-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 1rem;
    }

    .mode-tab {
      padding: 0.6rem 1.25rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.01em;
      margin-bottom: -1px;
    }

    .mode-tab:hover {
      color: var(--text);
    }

    .unicode-toggle {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      padding: 0 0.5rem;
    }

    .unicode-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .unicode-badge {
      font-size: 0.65rem;
      padding: 0.1rem 0.35rem;
      background: rgba(201, 169, 110, 0.15);
      color: var(--accent);
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mode-tab.active {
      color: var(--link-blue);
      border-bottom-color: var(--link-blue);
    }

    /* ====== FILTER BAR ====== */
    .filter-bar {
      max-width: 700px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-right: 0.3rem;
    }
    .filter-pill {
      font-size: 0.8rem;
      padding: 0.35rem 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-pill.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-select {
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }
    .filter-select:focus { border-color: var(--accent); }

    /* ====== RESULTS AREA ====== */
    .results {
      max-width: 700px;
      margin: 0 auto;
      padding: 0.75rem 1rem 2rem;
      min-height: 300px;
    }

    .result-count {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0;
    }

    /* ====== SERP RESULT ====== */
    .serp-result {
      padding: 0.85rem 0.5rem;
      border-radius: 8px;
      margin: 0 -0.5rem;
      transition: background 0.15s;
      outline: none;
    }

    .serp-result:hover,
    .serp-result:focus {
      background: var(--surface-2);
    }

    .serp-result:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .serp-header {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .serp-favicon {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 1px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .serp-favicon-fallback {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .serp-body {
      flex: 1;
      min-width: 0;
    }

    .serp-url-line {
      font-size: 0.78rem;
      line-height: 1.4;
      margin-bottom: 0.15rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .serp-domain {
      color: var(--link-green);
      font-weight: 400;
    }

    .serp-sep {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .serp-breadcrumb {
      color: var(--text-muted);
    }

    .serp-title {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--link-blue);
      text-decoration: none;
      display: block;
      margin-bottom: 0.25rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .serp-title:hover {
      text-decoration: underline;
    }

    .serp-title mark {
      background: transparent;
      color: inherit;
      font-weight: 600;
    }

    .serp-snippet {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.55;
      max-width: 100%;
      word-break: break-word;
    }

    .serp-snippet mark {
      background: rgba(201, 169, 110, 0.2);
      color: var(--accent);
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 500;
    }

    .serp-date {
      color: var(--text-muted);
    }

    .serp-thumbnail-wrap {
      margin-left: auto;
      padding-left: 0.75rem;
      flex-shrink: 0;
    }

    .serp-thumbnail {
      width: 92px;
      height: 92px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .serp-meta {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .serp-badge {
      font-size: 0.68rem;
      padding: 0.12rem 0.45rem;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .serp-badge.flagship {
      background: rgba(201, 169, 110, 0.1);
      color: var(--accent);
      border: 1px solid rgba(201, 169, 110, 0.15);
    }

    .serp-badge.tier-dual { background: rgba(201, 169, 110, 0.08); color: var(--tier-dual); }
    .serp-badge.tier-1 { background: rgba(126, 201, 160, 0.08); color: var(--tier-1); }
    .serp-badge.tier-2 { background: rgba(135, 174, 232, 0.08); color: var(--tier-2); }

    .serp-badge.pantheon {
      background: var(--surface);
      color: var(--text-dim);
      text-transform: capitalize;
      border: 1px solid var(--border);
    }

    .serp-utilities {
      display: flex;
      gap: 0.85rem;
      margin-top: 0.35rem;
      padding-left: 0;
    }

    .serp-utility {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
    }

    .serp-utility:hover {
      color: var(--link-blue);
      text-decoration: underline;
    }

    .serp-unicode-domain {
      font-size: 0.78rem;
      color: var(--accent);
      font-family: 'SF Mono', monospace;
      margin-top: 0.2rem;
      opacity: 0.7;
    }

    /* ====== LOADING SKELETON ====== */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-hover) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: skeleton 1.5s ease-in-out infinite;
      border-radius: 4px;
    }

    @keyframes skeleton {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-result {
      padding: 0.85rem 0.5rem;
      margin: 0 -0.5rem;
    }

    .skeleton-header {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .skeleton-favicon {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
    }

    .skeleton-body {
      flex: 1;
    }

    .skeleton-line {
      height: 0.7rem;
      margin-bottom: 0.5rem;
    }

    .skeleton-line.short {
      width: 40%;
    }

    .skeleton-line.medium {
      width: 70%;
    }

    .skeleton-line.title {
      height: 1.1rem;
      width: 55%;
      margin-bottom: 0.4rem;
    }

    /* ====== EMPTY STATE ====== */
    .empty {
      text-align: center;
      color: var(--text-dim);
      padding: 3rem 1rem;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .empty-title {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .empty-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .build-cta {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
    }

    .build-cta h3 {
      color: var(--accent);
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }

    .build-cta p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }

    /* ====== KNOWLEDGE PANEL ====== */
    .knowledge-panel {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .knowledge-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--tier-dual), var(--tier-1), var(--tier-2));
      opacity: 0.6;
    }

    .kp-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .kp-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .kp-greek {
      font-size: 1rem;
      color: var(--accent);
      font-family: 'Georgia', 'Times New Roman', serif;
      margin-top: 0.2rem;
    }

    .kp-meaning {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
    }

    .kp-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .kp-badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kp-badge.tier-dual { background: rgba(201, 169, 110, 0.12); color: var(--tier-dual); }
    .kp-badge.tier-1 { background: rgba(126, 201, 160, 0.12); color: var(--tier-1); }
    .kp-badge.tier-2 { background: rgba(135, 174, 232, 0.12); color: var(--tier-2); }
    .kp-badge.pantheon { background: var(--surface-hover); color: var(--text-dim); border: 1px solid var(--border); text-transform: capitalize; }

    .kp-lore {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .kp-lore-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .kp-lore-text {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text);
    }

    .kp-lore-text p {
      margin: 0 0 0.5rem;
    }

    .kp-lore-text p:last-child {
      margin-bottom: 0;
    }

    .kp-lore-cta {
      margin-top: 0.6rem;
    }

    .kp-lore-cta a {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }

    .kp-lore-cta a:hover {
      text-decoration: underline;
    }

    .kp-sites {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .kp-sites-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .kp-site-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .kp-site-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }

    .kp-site-item:hover {
      background: var(--surface-hover);
    }

    .kp-site-favicon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: cover;
      background: var(--surface);
    }

    .kp-site-domain {
      font-size: 0.85rem;
      color: var(--link-green);
      font-weight: 500;
    }

    .kp-site-title {
      font-size: 0.8rem;
      color: var(--text-dim);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kp-related {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .kp-related-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .kp-related-chip {
      padding: 0.25rem 0.6rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 0.8rem;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .kp-related-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .serp-freshness {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .serp-freshness.recent {
      color: var(--tier-1);
    }

    /* ====== PEOPLE ALSO ASK ====== */
    .paa-section {
      margin: 1rem 0 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .paa-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      padding: 0.9rem 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    .paa-item {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .paa-item:last-child {
      border-bottom: none;
    }

    .paa-question {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      transition: background 0.15s;
    }

    .paa-question:hover {
      background: var(--surface-hover);
    }

    .paa-chevron {
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .paa-item.expanded .paa-chevron {
      transform: rotate(180deg);
    }

    .paa-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, padding 0.25s ease;
      padding: 0 1rem;
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .paa-item.expanded .paa-answer {
      max-height: 300px;
      padding: 0 1rem 0.9rem;
    }

    .serp-sitelinks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.35rem;
      padding-left: 0;
    }

    .serp-sitelink {
      font-size: 0.78rem;
      color: var(--link-blue);
      text-decoration: none;
      cursor: pointer;
    }

    .serp-sitelink:hover {
      text-decoration: underline;
    }

    .serp-sitelink::before {
      content: '› ';
      color: var(--text-muted);
    }

    .serp-video-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .serp-sitemap-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-top: 0.25rem;
    }

    /* ====== LEASE STATUS BADGES ====== */
    .lease-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-left: 0.4rem;
    }
    .lease-badge.flagship {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #451a03;
    }
    .lease-badge.leased {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #064e3b;
    }
    .lease-badge.available {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      color: #1e3a8a;
    }

    /* ====== TENANT CARD ====== */
    .tenant-card {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      padding: 0.4rem 0.6rem;
      background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(16,185,129,0.03));
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .tenant-card .tenant-label {
      color: var(--text-dim);
      font-size: 0.72rem;
    }
    .tenant-card .tenant-name {
      color: #10b981;
      font-weight: 600;
    }
    .tenant-card .tenant-category {
      color: var(--text-muted);
      font-size: 0.72rem;
      margin-left: auto;
    }

    /* ====== AVAILABILITY CARDS ====== */
    .availability-section {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .availability-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .avail-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      margin-bottom: 0.5rem;
    }
    .avail-card .avail-domain {
      font-weight: 600;
      color: var(--link-blue);
      font-size: 0.9rem;
    }
    .avail-card .avail-meaning {
      color: var(--text-dim);
      font-size: 0.78rem;
    }
    .avail-card .avail-action {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 600;
      color: #3b82f6;
      background: rgba(59,130,246,0.1);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      text-decoration: none;
    }
    .avail-card .avail-action:hover {
      background: rgba(59,130,246,0.2);
    }

    /* ====== DOMAIN DISCOVERY CARDS ====== */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 0.75rem;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .entry-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .entry-card.has-site {
      border-left: 3px solid var(--live);
    }

    .entry-card.available {
      border-left: 3px solid var(--available);
    }

    .entry-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1rem 0.4rem;
      flex-wrap: wrap;
    }

    .entry-unicode {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .entry-greek {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .tier-badge {
      font-size: 0.6rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tier-dual { background: rgba(201, 169, 110, 0.12); color: var(--tier-dual); }
    .tier-1 { background: rgba(126, 201, 160, 0.12); color: var(--tier-1); }
    .tier-2 { background: rgba(135, 174, 232, 0.12); color: var(--tier-2); }

    .pantheon-badge {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: capitalize;
    }

    .entry-meta {
      padding: 0 1rem 0.6rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .business-card, .availability-card {
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      padding: 0.85rem 1rem;
    }

    .business-card-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }

    .live-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 6px var(--live);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .live-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--live);
      font-weight: 600;
    }

    .site-domain {
      font-family: 'SF Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 0.2rem;
      word-break: break-all;
    }

    .site-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .site-description {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .site-actions {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .site-link {
      font-size: 0.78rem;
      color: var(--text);
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .site-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .site-link.primary {
      background: var(--accent);
      color: #0a0a0f;
      border-color: var(--accent);
      font-weight: 600;
    }

    .site-link.primary:hover {
      background: #d4b87e;
    }

    .available-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--available);
      background: rgba(126, 201, 160, 0.08);
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      margin-bottom: 0.4rem;
    }

    .available-badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--available);
    }

    .registrar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.4rem;
      margin-top: 0.6rem;
    }

    .registrar-link {
      font-size: 0.74rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: 0.35rem 0.5rem;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.2s;
    }

    .registrar-link:hover {
      border-color: var(--available);
      color: var(--available);
    }

    /* ====== FILTERS ====== */
    .filters {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
      padding: 0 0.5rem;
    }

    .filters select {
      padding: 0.4rem 0.75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .filters select:focus {
      border-color: var(--accent);
    }

    /* ====== UTILITIES ====== */
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .serp-thumbnail-wrap { display: none; }
      .serp-title { font-size: 1.05rem; }
      .serp-snippet { font-size: 0.85rem; }
      .logo { font-size: 1.2rem; }
      .registrar-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Availability layer */
    .availability-section { margin-top:24px; padding:20px; background: linear-gradient(135deg, rgba(201,169,110,0.08) 0%, rgba(201,169,110,0.02) 100%); border:1px solid var(--gold); border-radius:12px; }
    .availability-title { font-family:'Cinzel',serif; font-size:15px; font-weight:600; color:var(--gold); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .avail-card { display:flex; justify-content:space-between; align-items:center; background:var(--surface); padding:14px 16px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px; transition:all .2s; }
    .avail-card:hover { border-color:var(--gold); background:var(--surface-2); }
    .avail-card:last-child { margin-bottom:0; }
    .avail-domain { font-family:'Cinzel',serif; font-size:15px; color:var(--text); }
    .avail-meaning { font-size:12px; color:var(--text-muted); margin-top:3px; }
    .avail-action { color:var(--gold); font-size:13px; font-weight:500; white-space:nowrap; padding:6px 14px; border:1px solid var(--gold); border-radius:6px; transition:all .2s; text-decoration:none; }
    .avail-action:hover { background:var(--gold); color:#0a0a0a; }

    /* ====== ASK THE ORACLE ====== */
    .oracle-panel {
      max-width: 700px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .oracle-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .oracle-header:hover { background: var(--surface-hover); }
    .oracle-icon { font-size: 1.1rem; }
    .oracle-title { font-weight: 600; font-size: 0.95rem; color: var(--accent); }
    .oracle-sub { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); }
    .oracle-body { padding: 1rem; }
    .oracle-answer {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .oracle-answer a { color: var(--link-blue); text-decoration: none; }
    .oracle-answer a:hover { text-decoration: underline; }
    .oracle-citations-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .oracle-citations {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .oracle-citation {
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.2s;
    }
    .oracle-citation:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .oracle-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem 0;
    }
    .oracle-loading {
      color: var(--text-muted);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .oracle-error {
      color: #ff8a8a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo-row">
        <div class="logo">PUNYCODEX</div>
        <div class="logo-sub">Curated Unicode Real Estate Platform</div>
      </div>
      <div class="search-box">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="searchInput" placeholder="Search gods, myths, and curated domains..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="search-clear" id="searchClear">×</button>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>
    </div>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="web">Discover</button>
    <button class="mode-tab" data-mode="network">Our Properties</button>
    <button class="mode-tab" data-mode="domains">Available</button>
    <label class="unicode-toggle" title="Only show domains with actual Unicode characters (xn--)">
      <input type="checkbox" id="unicodeOnly" onchange="toggleUnicodeOnly()">
      <span>Unicode Only</span>
    </label>
  </div>

  <div class="filter-bar">
    <div class="filter-row">
      <span class="filter-label">Type</span>
      <button class="filter-pill active" data-filter="type" data-value="all">All</button>
      <button class="filter-pill" data-filter="type" data-value="gods">Gods</button>
      <button class="filter-pill" data-filter="type" data-value="realms">Realms</button>
      <button class="filter-pill" data-filter="type" data-value="locations">Locations</button>
      <button class="filter-pill" data-filter="type" data-value="businesses">Businesses</button>
      <button class="filter-pill" data-filter="type" data-value="available">Available</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">Tier</span>
      <button class="filter-pill active" data-filter="tier" data-value="">Any</button>
      <button class="filter-pill" data-filter="tier" data-value="dual">Dual</button>
      <button class="filter-pill" data-filter="tier" data-value="1">Tier 1</button>
      <button class="filter-pill" data-filter="tier" data-value="2">Tier 2</button>
      <span class="filter-label" style="margin-left: auto;">Pantheon</span>
      <select class="filter-select" id="pantheonFilter" onchange="setPantheon(this.value)">
        <option value="">All pantheons</option>
      </select>
      <span class="filter-label">Sort</span>
      <select class="filter-select" id="sortFilter" onchange="setSort(this.value)">
        <option value="relevance">Relevance</option>
        <option value="alphabetical">A–Z</option>
        <option value="tier">Tier</option>
        <option value="recently_crawled">Recently crawled</option>
        <option value="confidence">Confidence</option>
      </select>
    </div>
  </div>

  <section class="oracle-panel" id="oraclePanel">
    <div class="oracle-header" onclick="toggleOracle()">
      <span class="oracle-icon">🔮</span>
      <span class="oracle-title">Ask the Oracle</span>
      <span class="oracle-sub" id="oracleSub">AI-curated answer</span>
    </div>
    <div class="oracle-body" id="oracleBody">
      <div class="oracle-empty">Type a question above and the Oracle will answer from the PUNYCODEX knowledge base.</div>
    </div>
  </section>

  <section class="results" id="results">
    <div class="empty">
      <div class="empty-icon">🌐</div>
      <div class="empty-title">Search the Unicode Web</div>
      <div class="empty-sub">Find gods, domains, and sites across the Unicode namespace</div>
    </div>
  </section>

  <script>
    const API_BASE = '';
    let debounceTimer;
    let currentMode = 'web';
    let currentType = 'all';
    let currentTier = '';
    let currentPantheon = '';
    let currentSort = 'relevance';
    let focusedIndex = -1;
    let currentResults = [];

    // ====== FILTERS ======
    async function loadPantheons() {
      try {
        const res = await fetch(`${API_BASE}/api/pantheons/`);
        const pantheons = await res.json();
        const select = document.getElementById('pantheonFilter');
        pantheons.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p.charAt(0).toUpperCase() + p.slice(1);
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('Failed to load pantheons', e);
      }
    }
    loadPantheons();

    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const filter = pill.dataset.filter;
        const value = pill.dataset.value;
        document.querySelectorAll(`.filter-pill[data-filter="${filter}"]`).forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        if (filter === 'type') currentType = value;
        if (filter === 'tier') currentTier = value;
        triggerSearch();
      });
    });

    function setPantheon(value) {
      currentPantheon = value;
      triggerSearch();
    }

    function setSort(value) {
      currentSort = value;
      triggerSearch();
    }

    function triggerSearch() {
      if (!searchInput.value.trim()) return;
      if (currentMode === 'domains') searchDomains();
      else searchWeb();
    }

    // ====== MODE SWITCHING ======
    const modeTabs = document.querySelectorAll('.mode-tab');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const resultsEl = document.getElementById('results');

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const mode = tab.dataset.mode;
        setMode(mode);
      });
    });

    function setMode(mode) {
      currentMode = mode;
      modeTabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      searchInput.placeholder = mode === 'domains' ? 'Find gods, names, meanings...' : 'Search gods, myths, and curated domains...';
      searchInput.focus();
      
      if (!searchInput.value.trim()) {
        showEmptyState(mode);
      } else {
        if (mode === 'domains') searchDomains();
        else searchWeb();
      }
      
      window.location.hash = mode;
    }

    if (window.location.hash === '#domains') {
      setMode('domains');
    }

    function showEmptyState(mode) {
      if (mode === 'web') {
        resultsEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🌐</div>
            <div class="empty-title">Discover the Unicode Web</div>
            <div class="empty-sub">Search gods, myths, and curated domains across the Unicode namespace</div>
          </div>
        `;
      } else {
        resultsEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔱</div>
            <div class="empty-title">Find a Domain</div>
            <div class="empty-sub">Search the PUNYCODEX lexicon of 850 Unicode domain names</div>
          </div>
        `;
      }
    }

    // ====== SEARCH INPUT ======
    searchInput.addEventListener('input', () => {
      searchClear.classList.toggle('visible', searchInput.value.length > 0);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (currentMode === 'web') {
          fetchAutocomplete(searchInput.value.trim());
          searchWeb();
        }
        else searchDomains();
      }, 200);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.remove('visible');
      hideAutocomplete();
      searchInput.focus();
      showEmptyState(currentMode);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(debounceTimer);
        hideAutocomplete();
        if (currentMode === 'web') searchWeb();
        else searchDomains();
      }
    });

    // Hide autocomplete on click outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) hideAutocomplete();
    });

    // ====== KEYBOARD NAVIGATION ======
    document.addEventListener('keydown', (e) => {
      if (e.target === searchInput) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          focusResult(0);
        }
        return;
      }
      
      const results = document.querySelectorAll('.serp-result');
      if (results.length === 0) return;
      
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusResult(Math.min(focusedIndex + 1, results.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (focusedIndex <= 0) {
          searchInput.focus();
          focusedIndex = -1;
        } else {
          focusResult(focusedIndex - 1);
        }
      } else if (e.key === 'Escape') {
        searchInput.focus();
        focusedIndex = -1;
      }
    });

    function focusResult(index) {
      const results = document.querySelectorAll('.serp-result');
      focusedIndex = index;
      results.forEach((r, i) => {
        if (i === index) {
          r.focus();
          r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    // ====== LOADING SKELETON ======
    function showSkeleton(count = 3) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="skeleton-result">
            <div class="skeleton-header">
              <div class="skeleton-favicon skeleton"></div>
              <div class="skeleton-body">
                <div class="skeleton-line short skeleton"></div>
                <div class="skeleton-line title skeleton"></div>
                <div class="skeleton-line medium skeleton"></div>
              </div>
            </div>
          </div>
        `;
      }
      resultsEl.innerHTML = html;
    }

    // ====== AUTOCOMPLETE ======
    async function fetchAutocomplete(q) {
      if (!q || q.length < 1) { hideAutocomplete(); return; }
      try {
        const res = await fetch(`${API_BASE}/api/search/suggest?q=${encodeURIComponent(q)}&limit=8`);
        const data = await res.json();
        renderAutocomplete(data.suggestions);
      } catch { hideAutocomplete(); }
    }

    function renderAutocomplete(suggestions) {
      const dropdown = document.getElementById('autocompleteDropdown');
      if (!suggestions.length) { hideAutocomplete(); return; }

      let html = '';
      suggestions.forEach((s, i) => {
        const icon = s.type === 'entry' ? '🔱' : '🌐';
        const meta = s.type === 'entry' ? (s.pantheon || 'entry') : 'site';
        html += `
          <div class="autocomplete-item" data-index="${i}" data-text="${escapeHtml(s.text)}">
            <span class="autocomplete-icon">${icon}</span>
            <span class="autocomplete-text">${escapeHtml(s.text)}</span>
            <span class="autocomplete-meta">${meta}</span>
          </div>
        `;
      });

      dropdown.innerHTML = html;
      dropdown.classList.add('visible');

      dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('click', () => {
          searchInput.value = item.dataset.text;
          hideAutocomplete();
          searchWeb();
        });
      });
    }

    function hideAutocomplete() {
      document.getElementById('autocompleteDropdown').classList.remove('visible');
    }

    // ====== WEB SEARCH ======
    // ====== CLICK TRACKING WITH DWELL TIME ======
    // Sends exactly ONE event per click: with actual dwell time if user returns,
    // or dwellTime=0 if they don't return within 30 seconds.
    let pendingClick = null;
    let pendingClickTimer = null;

    function sendClickEvent(query, siteId, position, dwellTimeMs) {
      fetch('/api/search/click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, siteId, position, dwellTimeMs })
      }).catch(() => {}); // Silent fail
    }

    function trackClick(query, siteId, position) {
      // Cancel any previous pending click
      if (pendingClickTimer) clearTimeout(pendingClickTimer);

      pendingClick = { query, siteId, position, clickTime: Date.now() };

      // If user never returns, send with dwellTime=0 after 30s
      pendingClickTimer = setTimeout(() => {
        if (pendingClick) {
          sendClickEvent(pendingClick.query, pendingClick.siteId, pendingClick.position, 0);
          pendingClick = null;
        }
      }, 30000);
    }

    window.addEventListener('blur', () => {
      if (pendingClick) pendingClick.leftAt = Date.now();
    });

    window.addEventListener('focus', () => {
      if (pendingClick && pendingClick.leftAt) {
        const dwellTimeMs = Math.min(Date.now() - pendingClick.leftAt, 300000);
        sendClickEvent(pendingClick.query, pendingClick.siteId, pendingClick.position, dwellTimeMs);
        pendingClick = null;
        if (pendingClickTimer) clearTimeout(pendingClickTimer);
      }
    });

    async function searchWeb() {
      const q = searchInput.value.trim();
      if (!q) { showEmptyState(currentMode); return; }

      showSkeleton();

      const apiMode = currentMode === 'network' ? 'network' : 'all';
      // Update the Oracle in parallel with search results.
      updateOracle(q);

      const params = new URLSearchParams();
      params.set('q', q);
      params.set('limit', '20');
      params.set('mode', apiMode);
      if (currentType !== 'all') params.set('type', currentType);
      if (currentTier) params.set('tier', currentTier);
      if (currentPantheon) params.set('pantheon', currentPantheon);
      const sort = currentMode === 'web' && currentSort === 'confidence' ? 'relevance' : currentSort;
      if (sort) params.set('sort', sort);

      try {
        const [searchRes, dymRes, relatedRes, knowledgeRes, paaRes] = await Promise.all([
          fetch(`${API_BASE}/api/search/web?${params}`),
          fetch(`${API_BASE}/api/search/didyoumean?q=${encodeURIComponent(q)}&limit=3`),
          fetch(`${API_BASE}/api/search/related?q=${encodeURIComponent(q)}&limit=6`),
          fetch(`${API_BASE}/api/search/knowledge?q=${encodeURIComponent(q)}`).catch(() => ({ ok: false })),
          fetch(`${API_BASE}/api/search/paa?q=${encodeURIComponent(q)}&limit=4`).catch(() => ({ ok: false }))
        ]);

        const data = await searchRes.json();
        const dymData = await dymRes.json();
        const relatedData = await relatedRes.json();
        let knowledgeData = null;
        if (knowledgeRes.ok) {
          try { knowledgeData = await knowledgeRes.json(); } catch { /* ignore */ }
        }
        let paaData = null;
        if (paaRes.ok) {
          try { paaData = await paaRes.json(); } catch { /* ignore */ }
        }

        currentResults = data.results;
        renderWebResults(data, dymData.suggestions, relatedData.related, knowledgeData, paaData?.questions);
      } catch (e) {
        resultsEl.innerHTML = `<div class="empty"><div class="empty-title">Error</div><div class="empty-sub">${e.message}</div></div>`;
      }
    }

    async function showSimilar(punycode) {
      try {
        const res = await fetch(`${API_BASE}/api/sites/duplicates?threshold=3`);
        const data = await res.json();
        // Find cluster containing this punycode
        const cluster = data.clusters.find(c => c.sites.some(s => s.punycode === punycode));
        if (cluster && cluster.sites.length > 1) {
          const others = cluster.sites.filter(s => s.punycode !== punycode);
          const list = others.map(s => `• ${s.punycode}${s.title ? ' — ' + s.title : ''}`).join('\n');
          alert(`Similar pages (${cluster.count - 1} found):\n\n${list}`);
        } else {
          alert('No similar pages found in the index.');
        }
      } catch (e) {
        alert('Could not fetch similar pages.');

    // ====== ASK THE ORACLE ======

    function toggleOracle() {
      const body = document.getElementById('oracleBody');

      body.style.display = oracleCollapsed ? 'none' : 'block';
    }

    async function updateOracle(q) {
      const body = document.getElementById('oracleBody');
      if (!q) {
        body.innerHTML = '<div class="oracle-empty">Type a question above and the Oracle will answer from the PUNYCODEX knowledge base.</div>';
        return;
      }
      body.innerHTML = '<div class="oracle-loading"><span>🔮</span><span>The Oracle is consulting the archives...</span></div>';
      try {
        const res = await fetch(`${API_BASE}/api/oracle/?q=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error('Oracle unavailable');
        const data = await res.json();
        renderOracle(data);
      } catch (err) {
        body.innerHTML = `<div class="oracle-error">The Oracle is resting: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderOracle(data) {
      const body = document.getElementById('oracleBody');
      let html = '';

      if (data.answer) {
        html += `<div class="oracle-answer">${linkifyOracleAnswer(escapeHtml(data.answer))}</div>`;
      }

      if (data.citations && data.citations.length) {
        html += `<div class="oracle-citations-title">Sources</div>`;
        html += `<div class="oracle-citations">`;
        for (const c of data.citations) {
          const label = escapeHtml(c.label);
          const url = escapeHtml(c.url);
          const isExternal = url.startsWith('http');
          html += `<a href="${url}" class="oracle-citation" ${isExternal ? 'target="_blank" rel="noopener"' : ''}>${label}</a>`;
        }
        html += `</div>`;
      }

      body.innerHTML = html || '<div class="oracle-empty">The Oracle has no answer for that yet.</div>';
    }

    function linkifyOracleAnswer(text) {
      // Convert **bold** to <strong>
      let out = text.replace(/\*\*(.+?)\*\*/g, (_, m) => `<strong>${m}</strong>`);
      // Convert [label](url) to links
      out = out.replace(/\[(.+?)\]\((.+?)\)/g, (_, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
      return out;
    }

    // ====== UTILITIES ======
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(isoString) {
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '';
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      } catch { return ''; }
    }

    function formatRelativeDate(isoString) {
      try {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '';
        const now = new Date();
        const diffMs = now - d;
        const diffSec = Math.floor(diffMs / 1000);
        const diffMin = Math.floor(diffSec / 60);
        const diffHr = Math.floor(diffMin / 60);
        const diffDay = Math.floor(diffHr / 24);
        const diffWeek = Math.floor(diffDay / 7);
        const diffMonth = Math.floor(diffDay / 30);
        const diffYear = Math.floor(diffDay / 365);

        if (diffSec < 60) return 'just now';
        if (diffMin < 60) return `${diffMin}m ago`;
        if (diffHr < 24) return `${diffHr}h ago`;
        if (diffDay < 7) return `${diffDay}d ago`;
        if (diffWeek < 4) return `${diffWeek}w ago`;
        if (diffMonth < 12) return `${diffMonth}mo ago`;
        return `${diffYear}y ago`;
      } catch { return ''; }
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUNYCODEX — Search the Unicode Web</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a26;
      --surface-hover: #1e1e2e;
      --text: #e8e6f0;
      --text-dim: #8a87a0;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.15);
      --border: #2a2a3a;
      --tier-dual: #c9a96e;
      --tier-1: #7ec9a0;
      --tier-2: #87aee8;
      --available: #7ec9a0;
      --live: #87c9e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
    }

    .tagline {
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-top: 0.5rem;
      letter-spacing: 0.05em;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .search-section {
      max-width: 850px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .search-box input::placeholder {
      color: var(--text-dim);
    }

    .filters {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .filters select {
      padding: 0.5rem 1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    .filters select:focus {
      border-color: var(--accent);
    }

    .results {
      max-width: 850px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .result-count {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-count .filter-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* ====== ENTRY CARD ====== */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .entry-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .entry-card.has-site {
      border-left: 3px solid var(--live);
    }

    .entry-card.available {
      border-left: 3px solid var(--available);
    }

    .entry-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem 0.5rem;
    }

    .entry-unicode {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .entry-greek {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .tier-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .tier-dual { background: rgba(201, 169, 110, 0.15); color: var(--tier-dual); }
    .tier-1 { background: rgba(126, 201, 160, 0.15); color: var(--tier-1); }
    .tier-2 { background: rgba(135, 174, 232, 0.15); color: var(--tier-2); }

    .pantheon-badge {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: capitalize;
    }

    .entry-meta {
      padding: 0 1.25rem 0.75rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    /* ====== BUSINESS CARD (LIVE SITE) ====== */
    .business-card {
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }

    .business-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .live-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 8px var(--live);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .live-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--live);
      font-weight: 600;
    }

    .site-domain {
      font-family: 'SF Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
      word-break: break-all;
    }

    .site-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .site-description {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .site-snippet {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: var(--bg);
      border-radius: 6px;
      border-left: 2px solid var(--border);
      font-style: italic;
    }

    .site-actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .site-link {
      font-size: 0.8rem;
      color: var(--text);
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .site-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .site-link.primary {
      background: var(--accent);
      color: #0a0a0f;
      border-color: var(--accent);
      font-weight: 600;
    }

    .site-link.primary:hover {
      background: #d4b87e;
    }

    /* ====== AVAILABILITY CARD ====== */
    .availability-card {
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }

    .available-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--available);
      background: rgba(126, 201, 160, 0.1);
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .available-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--available);
    }

    .registrar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .registrar-link {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.2s;
    }

    .registrar-link:hover {
      border-color: var(--available);
      color: var(--available);
    }

    .loading, .empty {
      text-align: center;
      color: var(--text-dim);
      padding: 3rem;
    }

    @media (max-width: 600px) {
      .logo { font-size: 1.8rem; }
      .entry-unicode { font-size: 1.2rem; }
      .stats-bar { gap: 1.5rem; }
      .registrar-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">PUNYCODEX</div>
    <div class="tagline">Search Engine for the Unicode Web</div>
    <div class="stats-bar" id="statsBar">
      <div class="stat"><div class="stat-value" id="statEntries">—</div><div class="stat-label">Entries</div></div>
      <div class="stat"><div class="stat-value" id="statSites">—</div><div class="stat-label">Sites Indexed</div></div>
      <div class="stat"><div class="stat-value" id="statAvailable">—</div><div class="stat-label">Available</div></div>
    </div>
  </header>

  <section class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search gods, names, meanings..." autocomplete="off">
    </div>
    <div class="filters">
      <select id="pantheonFilter">
        <option value="">All Pantheons</option>
      </select>
      <select id="tierFilter">
        <option value="">All Tiers</option>
        <option value="dual">Dual-Tier</option>
        <option value="1">Tier 1</option>
        <option value="2">Tier 2</option>
      </select>
      <select id="siteFilter">
        <option value="">All</option>
        <option value="true">With Site</option>
        <option value="false">Available</option>
      </select>
    </div>
  </section>

  <section class="results" id="results">
    <div class="empty">Type to search the Unicode web...</div>
  </section>

  <script>
    const API_BASE = '';
    let debounceTimer;

    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        const data = await res.json();
        document.getElementById('statEntries').textContent = data.total;
        document.getElementById('statSites').textContent = data.sites?.active || 0;
        document.getElementById('statAvailable').textContent = data.sites?.available || 0;
      } catch (e) {
        console.error('Stats load failed', e);
      }
    }

    async function loadPantheons() {
      try {
        const res = await fetch(`${API_BASE}/api/pantheons`);
        const pantheons = await res.json();
        const select = document.getElementById('pantheonFilter');
        pantheons.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('Pantheons load failed', e);
      }
    }

    async function search() {
      const q = document.getElementById('searchInput').value;
      const pantheon = document.getElementById('pantheonFilter').value;
      const tier = document.getElementById('tierFilter').value;
      const hasSite = document.getElementById('siteFilter').value;
      const resultsEl = document.getElementById('results');

      if (!q && !pantheon && !tier && !hasSite) {
        resultsEl.innerHTML = '<div class="empty">Type to search the Unicode web...</div>';
        return;
      }

      resultsEl.innerHTML = '<div class="loading">Searching the index...</div>';

      try {
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (pantheon) params.set('pantheon', pantheon);
        if (tier) params.set('tier', tier);
        if (hasSite) params.set('hasSite', hasSite);

        const res = await fetch(`${API_BASE}/api/search?${params}`);
        const data = await res.json();
        renderResults(data);
      } catch (e) {
        resultsEl.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
      }
    }

    function renderResults(data) {
      const resultsEl = document.getElementById('results');

      if (data.entries.length === 0) {
        resultsEl.innerHTML = '<div class="empty">No results found.</div>';
        return;
      }

      let html = `
        <div class="result-count">
          <span>${data.total} result${data.total !== 1 ? 's' : ''}</span>
          <span class="filter-hint">Sort: Tier &rarr; Unicode</span>
        </div>
      `;

      data.entries.forEach(entry => {
        const tierClass = entry.tier === 'dual' ? 'tier-dual' : entry.tier === '1' ? 'tier-1' : 'tier-2';
        const tierLabel = entry.tier === 'dual' ? 'Dual-Tier' : `Tier ${entry.tier}`;
        const hasSite = !!entry.site;
        const cardClass = hasSite ? 'has-site' : (entry.availability ? 'available' : '');

        html += `<div class="entry-card ${cardClass}">`;
        
        // Header (clickable)
        html += `
          <a href="entry.html?id=${entry.id}" style="text-decoration:none;color:inherit;display:block;">
            <div class="entry-header">
              <span class="entry-unicode">${entry.unicode}</span>
              ${entry.greek && entry.greek !== '-' ? `<span class="entry-greek">${entry.greek}</span>` : ''}
              <span class="tier-badge ${tierClass}">${tierLabel}</span>
              <span class="pantheon-badge">${entry.pantheon}</span>
            </div>
            <div class="entry-meta">${entry.meaning || ''}</div>
          </a>
        `;

        // Business card (live site)
        if (hasSite) {
          const site = entry.site;
          html += `
            <div class="business-card">
              <div class="business-card-header">
                <span class="live-indicator"></span>
                <span class="live-label">Live Site</span>
              </div>
              <div class="site-domain">${site.punycode} <span style="color:var(--text-dim)">(${site.domain})</span></div>
              ${site.title ? `<div class="site-title">${escapeHtml(site.title)}</div>` : ''}
              ${site.description ? `<div class="site-description">${escapeHtml(site.description)}</div>` : ''}
              ${site.snippet ? `<div class="site-snippet">${escapeHtml(site.snippet)}</div>` : ''}
              <div class="site-actions">
                <a href="https://${site.punycode}" target="_blank" rel="noopener" class="site-link primary">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                  Visit Site
                </a>
                <a href="entry.html?id=${entry.id}" class="site-link">Lexicon Entry</a>
              </div>
            </div>
          `;
        }

        // Availability card (no live site)
        else if (entry.availability) {
          const puny = entry.punycode || entry.ascii + '.com';
          const unicode = entry.unicode + '.com';
          html += `
            <div class="availability-card">
              <div class="available-badge">Available</div>
              <div class="site-domain">${puny} <span style="color:var(--text-dim)">(${unicode})</span></div>
              <div class="site-description">No indexed site found. This Unicode domain name may be available for registration.</div>
              <div class="site-actions" style="margin-top:0.75rem;">
                <a href="entry.html?id=${entry.id}" class="site-link">View Entry</a>
              </div>
              <div class="registrar-grid">
                <a href="https://www.godaddy.com/domainsearch/find?domainToCheck=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">GoDaddy</a>
                <a href="https://www.namecheap.com/domains/registration/results/?domain=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">Namecheap</a>
                <a href="https://porkbun.com/checkout/search?q=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">Porkbun</a>
                <a href="https://www.dynadot.com/domain/search.html?domain=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">Dynadot</a>
              </div>
            </div>
          `;
        }

        html += `</div>`;
      });

      resultsEl.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(search, 150);
    });

    document.getElementById('pantheonFilter').addEventListener('change', search);
    document.getElementById('tierFilter').addEventListener('change', search);
    document.getElementById('siteFilter').addEventListener('change', search);

    loadStats();
    loadPantheons();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNICODEX-ANALYTICS-START -->
<script src="/js/analytics-beacon.js?v=1" defer></script>
<!-- PUNICODEX-ANALYTICS-END -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuniCodex Admin — Site Analytics</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <style>
        :root {
            --bg: #080e19;
            --bg-elevated: #0e1a2b;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
            --text: #e8e4dc;
            --text-muted: #9aaab8;
            --danger: #ff6b6b;
            --success: #4ade80;
            --warning: #fbbf24;
            --info: #60a5fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .login-box {
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 360px;
        }
        .login-box h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
        }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .admin-header {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--gold-dim);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .admin-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
        }
        .admin-nav {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .admin-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--gold-dim);
            border-radius: 100px;
            transition: all 0.2s;
        }
        .admin-nav a:hover, .admin-nav a.active {
            color: var(--gold);
            border-color: var(--gold);
        }
        .admin-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .admin-toolbar {
            padding: 1rem 2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .action-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--gold); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
        .btn-period { background: transparent; color: var(--text-muted); border: 1px solid var(--gold-dim); border-radius: 100px; }
        .btn-period.active { color: var(--gold); border-color: var(--gold); }
        .panel-container {
            padding: 1.5rem 2rem;
            display: grid;
            gap: 1.5rem;
        }
        .panel {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .panel h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        #traffic-chart {
            width: 100%;
            height: 220px;
            display: block;
        }
        .chart-legend {
            display: flex;
            gap: 1.25rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .legend-swatch {
            display: inline-block;
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 2px;
            margin-right: 0.35rem;
            vertical-align: middle;
        }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            padding: 0.7rem 0.9rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        td { color: var(--text); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        td a { color: var(--gold); text-decoration: none; }
        td a:hover { text-decoration: underline; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .filter-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 0.5rem 0.9rem;
            color: var(--text);
            font-size: 0.8rem;
            outline: none;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 320px;
        }
        .filter-input:focus { border-color: var(--gold); }
        .device-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .device-name {
            width: 70px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .device-bar-track {
            flex: 1;
            height: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
            overflow: hidden;
        }
        .device-bar-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 100px;
        }
        .device-val {
            width: 90px;
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-left: 3px solid var(--gold);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.8rem;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        @media (max-width: 640px) {
            .admin-header { padding: 1rem; flex-direction: column; align-items: flex-start; }
            .admin-nav { width: 100%; }
            .admin-stats { width: 100%; justify-content: space-between; gap: 1rem; }
            .admin-toolbar { padding: 1rem; }
            .panel-container { padding: 1rem; }
            .panel-grid { grid-template-columns: 1fr; }
            .device-name { width: 60px; }
            .device-val { width: 80px; }
            #traffic-chart { height: 180px; }
        }
    </style>
</head>
<body>
    <h1 style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">PuniCodex Admin — Analytics</h1>
    <div id="app"></div>

    <script>
        const API_BASE = window.location.origin;
        let adminToken = localStorage.getItem('nike_admin_token');
        let periodDays = 30;
        let overviewData = null;
        let templeFilter = '';

        async function api(path, opts = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-token': adminToken,
                    ...opts.headers,
                },
            });
            return res.json();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-screen">
                    <div class="login-box">
                        <h1>PuniCodex Admin</h1>
                        <input type="password" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
                        <button onclick="doLogin()">Enter</button>
                    </div>
                </div>
            `;
        }

        async function doLogin() {
            const pass = document.getElementById('admin-pass').value;
            const data = await api('/api/admin/login/', {
                method: 'POST',
                body: JSON.stringify({ password: pass }),
            });
            if (data.success || data.token) {
                adminToken = data.token;
                localStorage.setItem('nike_admin_token', adminToken);
                loadOverview();
            } else {
                alert(data.error || 'Invalid password');
            }
        }

        async function loadOverview() {
            const res = await api(`/api/analytics/overview/?days=${periodDays}`);
            if (res.error) {
                localStorage.removeItem('nike_admin_token');
                renderLogin();
                return;
            }
            overviewData = res.data;
            renderDashboard();
        }

        function setPeriod(days) {
            periodDays = days;
            loadOverview();
        }

        function renderDashboard() {
            const d = overviewData;
            if (!d) return;
            const t = d.totals;
            document.getElementById('app').innerHTML = `
                <div class="admin-header">
                    <h1>Site Analytics</h1>
                    <nav class="admin-nav">
                        <a href="/admin-portal/">Portal</a>
                        <a href="admin-bookings.html">Bookings</a>
                        <a href="admin-api-keys.html">API Keys</a>
                        <a href="/admin.html">Crawler</a>
                        <a href="admin-analytics.html" class="active">Analytics</a>
                    </nav>
                    <div class="admin-stats">
                        <div class="stat"><div class="stat-value">${t.humanViews.toLocaleString()}</div><div class="stat-label">Human Views</div></div>
                        <div class="stat"><div class="stat-value">${t.botViews.toLocaleString()}</div><div class="stat-label">Bot Views</div></div>
                        <div class="stat"><div class="stat-value">${t.botPct}%</div><div class="stat-label">Bot %</div></div>
                        <div class="stat"><div class="stat-value">${t.uniqueSessions.toLocaleString()}</div><div class="stat-label">Unique Sessions</div></div>
                    </div>
                </div>
                <div class="admin-toolbar">
                    <button class="action-btn btn-period ${periodDays === 7 ? 'active' : ''}" onclick="setPeriod(7)">7 days</button>
                    <button class="action-btn btn-period ${periodDays === 30 ? 'active' : ''}" onclick="setPeriod(30)">30 days</button>
                    <button class="action-btn btn-period ${periodDays === 90 ? 'active' : ''}" onclick="setPeriod(90)">90 days</button>
                    <button class="action-btn btn-secondary" onclick="loadOverview()">Refresh</button>
                </div>
                <div class="panel-container">
                    <div class="panel">
                        <h3>Views per Day — last ${d.periodDays} days</h3>
                        <canvas id="traffic-chart"></canvas>
                        <div class="chart-legend">
                            <span><span class="legend-swatch" style="background:var(--gold);"></span>Human</span>
                            <span><span class="legend-swatch" style="background:#ff6b6b;"></span>Bot</span>
                        </div>
                    </div>
                    <div class="panel">
                        <h3>Top Temples</h3>
                        <input class="filter-input" id="temple-filter" placeholder="Filter temples…" value="${escapeHtml(templeFilter)}" oninput="templeFilter=this.value;renderTempleTable()">
                        <div class="table-wrap" id="temple-table"></div>
                    </div>
                    <div class="panel-grid">
                        <div class="panel">
                            <h3>Devices</h3>
                            <div id="device-split"></div>
                        </div>
                        <div class="panel">
                            <h3>Top Referrers (human)</h3>
                            <div class="table-wrap" id="referrer-table"></div>
                        </div>
                        <div class="panel">
                            <h3>Bot Categories</h3>
                            <div class="table-wrap" id="botcat-table"></div>
                        </div>
                    </div>
                </div>
            `;
            drawChart(d.byDay);
            renderTempleTable();
            renderDevices(d.devices);
            renderReferrers(d.topReferrers);
            renderBotCategories(d.botCategories);
        }

        function drawChart(byDay) {
            const canvas = document.getElementById('traffic-chart');
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, width, height);

            const padBottom = 18;
            const padTop = 8;
            const chartH = height - padBottom - padTop;
            const max = Math.max(...byDay.map(d => d.human + d.bot), 1);
            const slot = width / Math.max(byDay.length, 1);
            const barW = Math.max(1, Math.min(10, (slot - 2) / 2));

            ctx.font = '9px Montserrat, sans-serif';
            const labelEvery = Math.max(1, Math.ceil(byDay.length / 12));

            byDay.forEach((d, i) => {
                const x = i * slot + (slot - barW * 2 - 1) / 2;
                const hHuman = (d.human / max) * chartH;
                const hBot = (d.bot / max) * chartH;
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(x, padTop + chartH - hHuman, barW, Math.max(hHuman, d.human > 0 ? 1 : 0));
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(x + barW + 1, padTop + chartH - hBot, barW, Math.max(hBot, d.bot > 0 ? 1 : 0));
                if (i % labelEvery === 0) {
                    ctx.fillStyle = '#7a8a9e';
                    ctx.textAlign = 'center';
                    ctx.fillText(d.day.slice(5), i * slot + slot / 2, height - 4);
                }
            });
        }

        function renderTempleTable() {
            const wrap = document.getElementById('temple-table');
            if (!wrap || !overviewData) return;
            const filter = templeFilter.trim().toLowerCase();
            const rows = overviewData.topTemples.filter(t => !filter || t.templeId.includes(filter));
            wrap.innerHTML = rows.length === 0
                ? '<div class="empty-state">No temple traffic in this period.</div>'
                : `<table>
                    <thead>
                        <tr><th>Temple</th><th class="num">Human</th><th class="num">Bot</th><th class="num">Uniques</th></tr>
                    </thead>
                    <tbody>
                        ${rows.map(t => `
                            <tr>
                                <td><a href="/${encodeURIComponent(t.templeId)}/">${escapeHtml(t.templeId)}</a></td>
                                <td class="num">${t.human.toLocaleString()}</td>
                                <td class="num">${t.bot.toLocaleString()}</td>
                                <td class="num">${t.uniques.toLocaleString()}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function renderDevices(devices) {
            const wrap = document.getElementById('device-split');
            if (!wrap) return;
            const total = devices.mobile + devices.tablet + devices.desktop;
            const rows = [
                ['Mobile', devices.mobile],
                ['Tablet', devices.tablet],
                ['Desktop', devices.desktop],
            ];
            wrap.innerHTML = total === 0
                ? '<div class="empty-state">No device data in this period.</div>'
                : rows.map(([name, count]) => {
                    const pct = Math.round((count / total) * 1000) / 10;
                    return `<div class="device-row">
                        <div class="device-name">${name}</div>
                        <div class="device-bar-track"><div class="device-bar-fill" style="width:${pct}%;"></div></div>
                        <div class="device-val">${count.toLocaleString()} · ${pct}%</div>
                    </div>`;
                }).join('');
        }

        function renderReferrers(referrers) {
            const wrap = document.getElementById('referrer-table');
            if (!wrap) return;
            wrap.innerHTML = referrers.length === 0
                ? '<div class="empty-state">No referrer data in this period.</div>'
                : `<table>
                    <thead><tr><th>Referrer</th><th class="num">Views</th></tr></thead>
                    <tbody>
                        ${referrers.map(r => `
                            <tr><td>${escapeHtml(r.referrer)}</td><td class="num">${r.count.toLocaleString()}</td></tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function renderBotCategories(categories) {
            const wrap = document.getElementById('botcat-table');
            if (!wrap) return;
            wrap.innerHTML = categories.length === 0
                ? '<div class="empty-state">No bot traffic in this period.</div>'
                : `<table>
                    <thead><tr><th>Category</th><th class="num">Views</th></tr></thead>
                    <tbody>
                        ${categories.map(c => `
                            <tr><td>${escapeHtml(c.category)}</td><td class="num">${c.count.toLocaleString()}</td></tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Init
        if (adminToken) loadOverview();
        else renderLogin();
    </script>
</body>
</html>

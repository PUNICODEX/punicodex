<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Níkē Admin — Bookings</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #080e19;
            --bg-elevated: #0e1a2b;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
            --text: #e8e4dc;
            --text-muted: #7a8a9e;
            --danger: #ff6b6b;
            --success: #4ade80;
            --warning: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .login-box {
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 360px;
        }
        .login-box h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
        }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .admin-header {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--gold-dim);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .admin-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
        }
        .admin-nav {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .admin-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--gold-dim);
            border-radius: 100px;
            transition: all 0.2s;
        }
        .admin-nav a:hover, .admin-nav a.active {
            color: var(--gold);
            border-color: var(--gold);
        }
        .admin-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .admin-filters {
            padding: 1rem 2rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .revenue-section {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .revenue-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }
        .revenue-chart-wrap {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 1rem;
            height: 260px;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .bookings-grid {
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .booking-card {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .booking-card-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .booking-card-slot {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gold);
        }
        .booking-card-status {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
        }
        .status-pending_payment { background: rgba(251,191,36,0.1); color: var(--warning); }
        .status-pending_upload { background: rgba(96,165,250,0.1); color: #60a5fa; }
        .status-pending_approval { background: rgba(212,175,55,0.1); color: var(--gold); }
        .status-approved { background: rgba(74,222,128,0.1); color: var(--success); }
        .status-live { background: rgba(74,222,128,0.15); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
        .status-rejected { background: rgba(255,107,107,0.1); color: var(--danger); }
        .status-ended { background: rgba(255,255,255,0.05); color: var(--text-muted); }
        .bundle-badge-admin {
            display: inline-block;
            background: var(--gold);
            color: #000;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        .booking-card-body {
            padding: 1rem;
        }
        .booking-card-thumb {
            width: 100%;
            height: 160px;
            background: linear-gradient(145deg, rgba(14,26,43,0.92), rgba(8,15,25,0.97));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .booking-card-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .booking-card-thumb.placeholder {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .booking-detail {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .booking-detail strong {
            color: var(--text);
        }
        .booking-actions {
            padding: 0 1rem 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .action-btn {
            flex: 1;
            min-width: 80px;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.85; }
        .btn-approve { background: var(--success); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-golive { background: var(--gold); color: #000; }
        .btn-end { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
        .reject-note {
            width: 100%;
            margin-top: 0.5rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 6px;
            padding: 0.5rem;
            color: var(--text);
            font-size: 0.8rem;
            outline: none;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 2rem;
        }
        .modal {
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }
        .modal h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 1rem;
        }
        .modal input, .modal select {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            outline: none;
        }
        .modal input:focus, .modal select:focus { border-color: var(--gold); }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .modal-actions button { flex: 1; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const API_BASE = window.location.origin;
        let adminToken = localStorage.getItem('nike_admin_token');
        let currentFilter = 'all';
        let allBookings = [];

        async function api(path, opts = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-token': adminToken,
                    ...opts.headers,
                },
            });
            return res.json();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-screen">
                    <div class="login-box">
                        <h1>Níkē Admin</h1>
                        <input type="password" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
                        <button onclick="doLogin()">Enter</button>
                    </div>
                </div>
            `;
        }

        async function doLogin() {
            const pass = document.getElementById('admin-pass').value;
            const data = await api('/api/admin/login/', {
                method: 'POST',
                body: JSON.stringify({ password: pass }),
            });
            if (data.success) {
                adminToken = data.token;
                localStorage.setItem('nike_admin_token', adminToken);
                loadBookings();
            } else {
                alert('Invalid password');
            }
        }

        async function loadBookings() {
            const data = await api(`/api/admin/bookings${currentFilter !== 'all' ? '?status=' + currentFilter : ''}`);
            if (data.error) {
                localStorage.removeItem('nike_admin_token');
                renderLogin();
                return;
            }
            renderDashboard(data.bookings, data.stats);
        }

        function renderDashboard(bookings, stats) {
            allBookings = bookings;
            const filters = ['all', 'pending_application', 'pending_payment', 'pending_upload', 'pending_approval', 'approved', 'live', 'rejected', 'ended'];
            const filterLabels = {
                all: 'All',
                pending_application: 'Application',
                pending_payment: 'Pending Payment',
                pending_upload: 'Pending Upload',
                pending_approval: 'Pending Approval',
                approved: 'Approved',
                live: 'Live',
                rejected: 'Rejected',
                ended: 'Ended',
            };

            document.getElementById('app').innerHTML = `
                <div class="admin-header">
                    <h1>Níkē Bookings</h1>
                    <nav class="admin-nav">
                        <a href="/admin-portal/">Portal</a>
                        <a href="admin-bookings.html" class="active">Bookings</a>
                        <a href="admin-curator.html">Curator</a>
                        <a href="admin-ai-review.html">AI Review</a>
                        <a href="admin-api-keys.html">API Keys</a>
                        <a href="admin-tenants.html">Tenants</a>
                        <a href="admin.html">Crawler</a>
                        <a href="admin-analytics.html">Analytics</a>
                    </nav>
                    <div class="admin-stats">
                        <div class="stat"><div class="stat-value">${stats.totalLive}</div><div class="stat-label">Live</div></div>
                        <div class="stat"><div class="stat-value">${stats.totalPending}</div><div class="stat-label">Pending</div></div>
                        <div class="stat"><div class="stat-value">${stats.totalTrialing || 0}</div><div class="stat-label">Trialing</div></div>
                        <div class="stat"><div class="stat-value">$${stats.revenueDollars}</div><div class="stat-label">Revenue</div></div>
                    </div>
                    <button class="action-btn btn-golive" onclick="runTrialReminders()" style="flex:none;min-width:auto;padding:0.5rem 1rem;">Run Trial Reminders</button>
                    <button class="action-btn btn-golive" onclick="showCreateForm()" style="flex:none;min-width:auto;padding:0.5rem 1rem;">New Trial</button>
                </div>
                <div class="admin-filters">
                    ${filters.map(f => `
                        <button class="filter-btn ${f === currentFilter ? 'active' : ''}" onclick="setFilter('${f}')">${filterLabels[f]}</button>
                    `).join('')}
                </div>
                <div class="revenue-section">
                    <h2>Revenue — Last 30 Days</h2>
                    <div class="revenue-chart-wrap">
                        <canvas id="revenue-chart"></canvas>
                    </div>
                </div>
                <div class="bookings-grid">
                    ${bookings.length === 0 ? '<div class="empty-state">No bookings in this category.</div>' : bookings.map(b => renderCard(b)).join('')}
                </div>
            `;
            loadRevenueChart();
        }

        async function loadRevenueChart() {
            if (typeof Chart === 'undefined') return;
            try {
                const data = await api('/api/admin/revenue/');
                if (!data.daily) return;
                const ctx = document.getElementById('revenue-chart');
                if (!ctx) return;
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.daily.map(d => d.day.slice(5)),
                        datasets: [{
                            label: 'Revenue ($)',
                            data: data.daily.map(d => parseFloat(d.revenueDollars)),
                            borderColor: '#d4af37',
                            backgroundColor: 'rgba(212,175,55,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { color: '#7a8a9e' }, grid: { color: 'rgba(255,255,255,0.04)' } },
                            y: { ticks: { color: '#7a8a9e' }, grid: { color: 'rgba(255,255,255,0.04)' }, beginAtZero: true },
                        },
                    },
                });
            } catch (err) {
                console.error('Revenue chart failed:', err);
            }
        }

        function renderCard(b) {
            const thumb = b.creative_path
                ? `<img src="${API_BASE}${b.creative_path}" alt="Creative">`
                : `<div class="booking-card-thumb placeholder">No creative uploaded</div>`;
            const showThumb = b.creative_path ? thumb : '';
            const thumbClass = b.creative_path ? '' : ' placeholder';
            const bundleBadge = b.is_bundle ? '<span class="bundle-badge-admin">Bundle</span>' : '';
            const trialBadge = (b.trial_months || 0) > 0 ? '<span class="bundle-badge-admin" style="background:#4ade80;color:#000;">Trial</span>' : '';
            const trialInfo = (b.trial_months || 0) > 0 && b.trial_ends_at
              ? `<div class="booking-detail" style="color:#4ade80;">Trial ends ${new Date(b.trial_ends_at).toLocaleDateString()}</div>`
              : '';

            let actions = '';
            if (b.status === 'pending_application') {
                actions = `<button class="action-btn btn-golive" onclick="approveApplication(${b.id})">Approve Application</button>`;
            } else if (b.status === 'pending_approval') {
                actions = `
                    <input type="text" class="reject-note" id="note-${b.id}" placeholder="Rejection reason (optional)">
                    <button class="action-btn btn-approve" onclick="approve(${b.id})">Approve</button>
                    <button class="action-btn btn-reject" onclick="reject(${b.id})">Reject</button>
                `;
            } else if (b.status === 'approved') {
                actions = `<button class="action-btn btn-golive" onclick="goLive(${b.id})">Go Live</button>`;
            } else if (b.status === 'live') {
                actions = `
                    <button class="action-btn btn-golive" onclick="sendReport(${b.id})">Send Report</button>
                    <button class="action-btn btn-end" onclick="endBooking(${b.id})">End</button>
                `;
            } else if (b.status === 'rejected') {
                actions = `<button class="action-btn btn-approve" onclick="approve(${b.id})">Approve Anyway</button>`;
            }

            return `
                <div class="booking-card">
                    <div class="booking-card-header">
                        <span class="booking-card-slot">${b.slot_name}${bundleBadge}${trialBadge}</span>
                        <span class="booking-card-status status-${b.status}">${b.status.replace(/_/g, ' ')}</span>
                    </div>
                    <div class="booking-card-body">
                        <div class="booking-card-thumb${thumbClass}">${showThumb || thumb}</div>
                        <div class="booking-detail"><strong>${b.company_name || 'No company name'}</strong></div>
                        <div class="booking-detail">${b.email}</div>
                        <div class="booking-detail">${b.website_url || 'No website'}</div>
                        ${b.custom_heading ? `<div class="booking-detail" style="color:var(--gold);">Heading: ${b.custom_heading}</div>` : ''}
                        ${b.custom_subtitle ? `<div class="booking-detail" style="color:var(--gold);">Subtitle: ${b.custom_subtitle}</div>` : ''}
                        <div class="booking-detail">$${(b.amount_paid_cents / 100).toFixed(2)} &middot; ${b.width}×${b.height} &middot; ${b.lease_months || 1} month${(b.lease_months || 1) > 1 ? 's' : ''}${(b.trial_months || 0) > 0 ? ` (first ${b.trial_months} free)` : ''}</div>
                        ${trialInfo}
                        ${b.admin_note ? `<div class="booking-detail" style="color:#ff6b6b;">Note: ${b.admin_note}</div>` : ''}
                    </div>
                    <div class="booking-actions">
                        ${actions}
                    </div>
                </div>
            `;
        }

        function setFilter(f) {
            currentFilter = f;
            loadBookings();
        }

        async function approve(id) {
            await api(`/api/admin/bookings/${id}/approve`, { method: 'POST', body: JSON.stringify({}) });
            loadBookings();
        }

        async function approveApplication(id) {
            const btn = event.target;
            btn.textContent = 'Sending...';
            try {
                await api(`/api/admin/bookings/${id}/approve-application`, { method: 'POST', body: JSON.stringify({}) });
                loadBookings();
            } catch (err) {
                btn.textContent = 'Failed';
                setTimeout(() => btn.textContent = 'Approve Application', 2000);
            }
        }

        async function reject(id) {
            const note = document.getElementById(`note-${id}`)?.value || '';
            await api(`/api/admin/bookings/${id}/reject`, { method: 'POST', body: JSON.stringify({ note }) });
            loadBookings();
        }

        async function goLive(id) {
            const booking = allBookings.find(b => b.id === id);
            const msg = booking && booking.is_bundle
                ? 'Go live with Total Conquest? This will activate ALL 13 slots at once.'
                : 'Go live with this booking?';
            if (!confirm(msg)) return;
            await api(`/api/admin/bookings/${id}/golive`, { method: 'POST', body: JSON.stringify({}) });
            loadBookings();
        }

        async function endBooking(id) {
            const booking = allBookings.find(b => b.id === id);
            const msg = booking && booking.is_bundle
                ? 'End Total Conquest? This will free ALL 13 slots at once.'
                : 'End this booking? The slot will become available again.';
            if (!confirm(msg)) return;
            await api(`/api/admin/bookings/${id}/end`, { method: 'POST', body: JSON.stringify({}) });
            loadBookings();
        }

        async function sendReport(id) {
            const btn = event.target;
            btn.textContent = 'Sending...';
            try {
                await api(`/api/admin/bookings/${id}/report`, { method: 'POST', body: JSON.stringify({}) });
                btn.textContent = 'Sent!';
                setTimeout(() => btn.textContent = 'Send Report', 2000);
            } catch (err) {
                btn.textContent = 'Failed';
                setTimeout(() => btn.textContent = 'Send Report', 2000);
            }
        }

        async function runTrialReminders() {
            const btn = event.target;
            const original = btn.textContent;
            btn.textContent = 'Running...';
            try {
                const data = await api('/api/admin/trial-reminders/', { method: 'POST', body: JSON.stringify({}) });
                btn.textContent = `Sent ${data.sent7 + data.sent1}`;
                setTimeout(() => { btn.textContent = original; loadBookings(); }, 2000);
            } catch (err) {
                btn.textContent = 'Failed';
                setTimeout(() => btn.textContent = original, 2000);
            }
        }

        function showCreateForm() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'create-modal';
            modal.innerHTML = `
                <div class="modal">
                    <h3>Create Trial Lease</h3>
                    <select id="create-slot"></select>
                    <input type="email" id="create-email" placeholder="Tenant email">
                    <input type="text" id="create-company" placeholder="Company name">
                    <input type="url" id="create-website" placeholder="Website URL">
                    <select id="create-lease"><option value="12">12 months</option><option value="1">1 month</option></select>
                    <select id="create-trial"><option value="3">3 months free</option><option value="6">6 months free</option><option value="0">No trial</option></select>
                    <div class="modal-actions">
                        <button class="action-btn btn-end" onclick="closeCreateForm()">Cancel</button>
                        <button class="action-btn btn-golive" onclick="submitCreateForm()">Create</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            loadCreateSlots();
        }

        function closeCreateForm() {
            const modal = document.getElementById('create-modal');
            if (modal) modal.remove();
        }

        async function loadCreateSlots() {
            const select = document.getElementById('create-slot');
            const data = await api('/api/slots/');
            select.innerHTML = (data.slots || []).map(s => `<option value="${s.id}">${s.name} (${s.site_slug}) — $${(s.price_cents/100).toFixed(2)}/mo</option>`).join('');
        }

        async function submitCreateForm() {
            const slotId = parseInt(document.getElementById('create-slot').value, 10);
            const email = document.getElementById('create-email').value.trim();
            const companyName = document.getElementById('create-company').value.trim();
            const websiteUrl = document.getElementById('create-website').value.trim();
            const leaseMonths = parseInt(document.getElementById('create-lease').value, 10);
            const trialMonths = parseInt(document.getElementById('create-trial').value, 10);
            if (!email || !email.includes('@')) return alert('Valid email required');
            if (trialMonths >= leaseMonths) return alert('Trial must be shorter than lease');

            const btn = event.target;
            btn.textContent = 'Creating...';
            try {
                const data = await api('/api/admin/bookings/', {
                    method: 'POST',
                    body: JSON.stringify({ slotId, email, companyName, websiteUrl, leaseMonths, trialMonths }),
                });
                if (data.error) throw new Error(data.error);
                closeCreateForm();
                loadBookings();
            } catch (err) {
                alert(err.message);
                btn.textContent = 'Create';
            }
        }

        // Init
        if (adminToken) loadBookings();
        else renderLogin();
    </script>

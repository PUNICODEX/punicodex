                <a href="/search/">Search</a>
                <a href="/tiers/">Tiers</a>
                <a href="/about/">About</a>
            </div>
        </div>
    </div>

    <header class="admin-hero">
        <div class="admin-eyebrow">PUNICODEX Scholarly Edition</div>
        <h1 class="admin-title">Curator Admin</h1>
        <p class="admin-subtitle">Oversee the Scholarly Edition. Manage institutions, sponsorships, users, and review activity.</p>
    </header>

    <main class="admin-container" id="app">
        <noscript>
            <div class="admin-error">This curator dashboard requires JavaScript to communicate with the Scholarly Edition API.</div>
        </noscript>
    </main>

    <script>
    (function() {
        const apiBase = '/api/v1/scholars';
        const container = document.getElementById('app');

        function getSessionId() {
            return localStorage.getItem('scholars_session');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatDateShort(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        async function api(path, options) {
            options = options || {};
            const sessionId = getSessionId();
            const headers = {
                'Content-Type': 'application/json',
                ...(sessionId ? { 'x-scholars-session': sessionId } : {}),
                ...(options.headers || {}),
            };
            const res = await fetch(apiBase + path, {
                ...options,
                headers,
            });
            const data = await res.json().catch(function() { return { success: false, error: 'Invalid response' }; });
            return { ok: res.ok, status: res.status, data: data };
        }

        function renderLoginPrompt() {
            container.innerHTML = `
                <div class="admin-login">
                    <h2>Curator Access Required</h2>
                    <p>This dashboard is restricted to curators. Sign in with your curator email and password.</p>
                    <form class="admin-login-form" id="login-form">
                        <label for="curator-email">Email</label>
                        <input type="email" id="curator-email" placeholder="you@university.edu" required>
                        <label for="curator-password">Password</label>
                        <input type="password" id="curator-password" placeholder="••••••••" required>
                        <button type="submit" class="admin-btn primary">Sign In</button>
                    </form>
                    <div class="admin-login-message" id="login-message"></div>
                </div>
            `;

            const form = document.getElementById('login-form');
            const message = document.getElementById('login-message');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('curator-email').value.trim();
                const password = document.getElementById('curator-password').value;
                message.className = 'admin-login-message';
                message.textContent = 'Signing in…';

                const { ok, data } = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email: email, password: password }),
                });

                if (ok && data && data.success && data.data && data.data.token) {
                    localStorage.setItem('scholars_session', data.data.token);
                    window.location.reload();
                } else {
                    message.className = 'admin-login-message error';
                    message.textContent = (data && data.error) || 'Sign in failed.';
                }
            });
        }

        function renderError(message) {
            container.innerHTML = '<div class="admin-error">' + escapeHtml(message) + '</div>';
        }

        let currentUser = null;
        let institutionsData = [];
        let usersData = [];
        let analyticsData = null;

        async function renderDashboard() {
            container.innerHTML = `
                <div class="admin-toolbar">
                    <div>
                        <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${escapeHtml(currentUser.email)} <span class="admin-role-badge">${escapeHtml(currentUser.role)}</span></span>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="admin-btn" id="refresh-dashboard">Refresh</button>
                        <button class="admin-btn" id="logout-btn">Sign out</button>
                    </div>
                </div>

                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Institutions</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Active Sponsorships</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Users</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Pending Edits</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Published Sections</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Total Temples</div></div>
                </div>

                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="applications">Applications</button>
                    <button class="admin-tab" data-tab="institutions">Institutions</button>
                    <button class="admin-tab" data-tab="users">Users</button>
                    <button class="admin-tab" data-tab="overview">Overview</button>
                </div>

                <div class="admin-panel active" id="panel-applications"></div>
                <div class="admin-panel" id="panel-institutions"></div>
                <div class="admin-panel" id="panel-users"></div>
                <div class="admin-panel" id="panel-overview"></div>
            `;

            document.getElementById('logout-btn').addEventListener('click', async function() {
                await api('/auth/logout', { method: 'POST' });
                localStorage.removeItem('scholars_session');
                window.location.reload();
            });

            document.getElementById('refresh-dashboard').addEventListener('click', loadDashboard);

            document.querySelectorAll('.admin-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
                    document.querySelectorAll('.admin-panel').forEach(function(p) { p.classList.remove('active'); });
                    tab.classList.add('active');
                    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                });
            });

            await loadDashboard();
        }

        async function loadDashboard() {
            const [statsRes, analyticsRes, institutionsRes, usersRes] = await Promise.all([
                api('/stats'),
                api('/analytics?days=30'),
                api('/institutions'),
                api('/users'),
            ]);

            const stats = statsRes.ok && statsRes.data && statsRes.data.data ? statsRes.data.data : {};
            analyticsData = analyticsRes.ok && analyticsRes.data && analyticsRes.data.data ? analyticsRes.data.data : null;

            const activeSponsorships = stats && stats.totalInstitutions
                ? (institutionsRes.ok && institutionsRes.data && institutionsRes.data.data
                    ? institutionsRes.data.data.filter(function(i) { return i.sponsorship_status === 'active'; }).length
                    : '—')
                : '—';

            const values = [
                stats.totalInstitutions,
                activeSponsorships,
                stats.totalUsers,
                stats.pendingEdits,
                stats.publishedSections,
                stats.totalTemples,
            ];
            document.querySelectorAll('#stats-grid .stat-value').forEach(function(el, i) {
                el.textContent = typeof values[i] === 'number' ? values[i].toLocaleString() : '—';
            });

            institutionsData = institutionsRes.ok && institutionsRes.data && institutionsRes.data.data ? institutionsRes.data.data : [];
            usersData = usersRes.ok && usersRes.data && usersRes.data.data ? usersRes.data.data : [];

            renderApplicationsPanel();
            renderInstitutionsPanel(institutionsData);
            renderUsersPanel(usersData);
            renderOverviewPanel(stats);
        }

        // ---- Sponsorship Applications ----
        const applicationsState = {
            status: 'pending',
            items: [],
            total: 0,
            pendingCount: 0,
            offset: 0,
            limit: 20,
        };

        function handleUnauthorized() {
            localStorage.removeItem('scholars_session');
            renderLoginPrompt();
        }

        function copyText(text, btn) {
            function markDone() {
                btn.textContent = 'Copied';
                setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
            }
            function fallback() {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (err) { /* no-op */ }
                ta.remove();
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(markDone).catch(function() {
                    fallback();
                    markDone();
                });
            } else {
                fallback();
                markDone();
            }
        }

        function setApplicationsMessage(text, type) {
            const el = document.getElementById('applications-message');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'admin-message' + (text ? ' ' + (type || 'error') : '');
        }

        function updatePendingBadge() {
            const badge = document.getElementById('applications-pending-badge');
            if (badge) badge.textContent = applicationsState.pendingCount + ' pending';
        }

        function applicationsEmptyText() {
            if (applicationsState.status === 'pending') return { title: 'No pending applications', text: 'New sponsorship applications will appear here for review.' };
            if (applicationsState.status === 'approved') return { title: 'No approved applications', text: 'Approved sponsorship applications will appear here.' };
            if (applicationsState.status === 'rejected') return { title: 'No rejected applications', text: 'Rejected sponsorship applications will appear here.' };
            return { title: 'No applications yet', text: 'Sponsorship applications from universities will appear here.' };
        }

        function appendReviewInfo(card, item) {
            const fields = card.querySelector('.app-fields');
            if (!fields) return;
            let html = '';
            if (item.review_comment) {
                html += '<div class="app-field"><div class="app-field-label">Review Comment</div><div class="app-field-value">' + escapeHtml(item.review_comment) + '</div></div>';
            }
            if (item.reviewed_at) {
                html += '<div class="app-field"><div class="app-field-label">Reviewed</div><div class="app-field-value">' + escapeHtml(formatDate(item.reviewed_at)) + '</div></div>';
            }
            fields.insertAdjacentHTML('beforeend', html);
        }

        function transformCardApproved(card, item, payload) {
            const badge = card.querySelector('.admin-card-header .admin-status');
            if (badge) {
                badge.textContent = 'approved';
                badge.className = 'admin-status app-approved';
            }
            const footer = card.querySelector('.admin-card-footer');
            if (footer) footer.remove();
            const statusEl = card.querySelector('.app-card-status');
            if (statusEl) {
                statusEl.textContent = '';
                statusEl.className = 'app-card-status';
            }
            appendReviewInfo(card, item);

            const reveal = document.createElement('div');
            reveal.className = 'credential-reveal';
            reveal.innerHTML = `
                <div class="credential-warning">Shown once — relay these credentials to the university out-of-band. They cannot be retrieved again.</div>
                <div class="credential-row">
                    <span class="credential-label">Admin Email</span>
                    <code class="credential-value">${escapeHtml(payload.adminEmail || '')}</code>
                    <button type="button" class="admin-btn credential-copy" data-copy="${escapeHtml(payload.adminEmail || '')}">Copy</button>
                </div>
                <div class="credential-row">
                    <span class="credential-label">Temporary Password</span>
                    <code class="credential-value">${escapeHtml(payload.adminPassword || '')}</code>
                    <button type="button" class="admin-btn credential-copy" data-copy="${escapeHtml(payload.adminPassword || '')}">Copy</button>
                </div>
                <div class="credential-note">Application approved — the institution and its admin account have been created.</div>
            `;
            card.appendChild(reveal);

            reveal.querySelectorAll('.credential-copy').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    copyText(btn.dataset.copy, btn);
                });
            });
        }

        function transformCardRejected(card, item) {
            const badge = card.querySelector('.admin-card-header .admin-status');
            if (badge) {
                badge.textContent = 'rejected';
                badge.className = 'admin-status app-rejected';
            }
            const footer = card.querySelector('.admin-card-footer');
            if (footer) footer.remove();
            const statusEl = card.querySelector('.app-card-status');
            if (statusEl) {
                statusEl.textContent = '';
                statusEl.className = 'app-card-status';
            }
            appendReviewInfo(card, item);
        }

        function createApplicationCard(item) {
            const card = document.createElement('div');
            card.className = 'admin-card app-card';
            card.dataset.applicationId = item.id;

            const status = item.status || 'pending';
            const departments = String(item.department_focus || '')
                .split(',')
                .map(function(d) { return d.trim(); })
                .filter(Boolean);
            const message = String(item.message || '').trim();
            const isLongMessage = message.length > 280;
            const excerpt = isLongMessage ? message.slice(0, 280).trimEnd() + '…' : message;

            card.innerHTML = `
                <div class="admin-card-header">
                    <div>
                        <div class="admin-card-title">${escapeHtml(item.institution_name || 'Unknown institution')}</div>
                        <div class="admin-card-meta">${escapeHtml(item.domain || '—')}</div>
                    </div>
                    <span class="admin-status app-${escapeHtml(status)}">${escapeHtml(status)}</span>
                </div>
                <div class="admin-card-body">
                    <div class="app-fields">
                        <div class="app-field">
                            <div class="app-field-label">Contact</div>
                            <div class="app-field-value">
                                ${escapeHtml(item.contact_name || '—')} ·
                                <a href="mailto:${escapeHtml(item.contact_email || '')}">${escapeHtml(item.contact_email || '—')}</a>
                            </div>
                        </div>
                        <div class="app-field">
                            <div class="app-field-label">Submitted</div>
                            <div class="app-field-value">${formatDate(item.created_at)}</div>
                        </div>
                        ${departments.length ? `
                            <div class="app-field">
                                <div class="app-field-label">Department Focus</div>
                                <div class="allowlist-tags">${departments.map(function(d) { return '<span class="allowlist-tag">' + escapeHtml(d) + '</span>'; }).join('')}</div>
                            </div>
                        ` : ''}
                        ${message ? `
                            <div class="app-field">
                                <div class="app-field-label">Message</div>
                                <div class="app-field-value app-message-text">${escapeHtml(excerpt)}</div>
                                ${isLongMessage ? '<button type="button" class="app-expand-btn">Show full message</button>' : ''}
                            </div>
                        ` : ''}
                        ${status !== 'pending' && item.review_comment ? `
                            <div class="app-field">
                                <div class="app-field-label">Review Comment</div>
                                <div class="app-field-value">${escapeHtml(item.review_comment)}</div>
                            </div>
                        ` : ''}
                        ${status !== 'pending' && item.reviewed_at ? `
                            <div class="app-field">
                                <div class="app-field-label">Reviewed</div>
                                <div class="app-field-value">${formatDate(item.reviewed_at)}${item.reviewed_by ? ' by ' + escapeHtml(String(item.reviewed_by)) : ''}</div>
                            </div>
                        ` : ''}
                    </div>
                </div>
                ${status === 'pending' ? `
                    <div class="admin-card-footer">
                        <input type="text" class="app-comment-input" placeholder="Optional review comment…" maxlength="500">
                        <button type="button" class="admin-btn success app-approve-btn">Approve</button>
                        <button type="button" class="admin-btn danger app-reject-btn">Reject</button>
                    </div>
                ` : ''}
                <div class="app-card-status" aria-live="polite"></div>
            `;

            const expandBtn = card.querySelector('.app-expand-btn');
            if (expandBtn) {
                expandBtn.addEventListener('click', function() {
                    const textEl = card.querySelector('.app-message-text');
                    const expanded = expandBtn.dataset.expanded === 'true';
                    textEl.textContent = expanded ? excerpt : message;
                    expandBtn.textContent = expanded ? 'Show full message' : 'Show less';
                    expandBtn.dataset.expanded = expanded ? 'false' : 'true';
                });
            }

            const approveBtn = card.querySelector('.app-approve-btn');
            const rejectBtn = card.querySelector('.app-reject-btn');
            const commentInput = card.querySelector('.app-comment-input');
            const cardStatus = card.querySelector('.app-card-status');

            if (approveBtn) {
                approveBtn.addEventListener('click', async function() {
                    const comment = commentInput ? commentInput.value.trim() : '';
                    approveBtn.disabled = true;
                    rejectBtn.disabled = true;
                    cardStatus.textContent = 'Approving…';
                    cardStatus.className = 'app-card-status processing';

                    const { ok, status: resStatus, data } = await api('/sponsorship/applications/' + encodeURIComponent(item.id) + '/approve', {
                        method: 'POST',
                        body: JSON.stringify(comment ? { reviewComment: comment } : {}),
                    });

                    if (resStatus === 401) {
                        handleUnauthorized();
                        return;
                    }

                    if (ok && data && data.data && data.data.approved === true) {
                        item.status = 'approved';
                        item.review_comment = comment || item.review_comment;
                        item.reviewed_at = new Date().toISOString();
                        applicationsState.pendingCount = Math.max(0, applicationsState.pendingCount - 1);
                        updatePendingBadge();
                        transformCardApproved(card, item, data.data);
                    } else {
                        cardStatus.textContent = (data && data.error) || 'Approval failed.';
                        cardStatus.className = 'app-card-status error';
                        approveBtn.disabled = false;
                        rejectBtn.disabled = false;
                    }
                });
            }

            if (rejectBtn) {
                rejectBtn.addEventListener('click', async function() {
                    if (!confirm('Reject this sponsorship application?')) return;
                    const comment = commentInput ? commentInput.value.trim() : '';
                    approveBtn.disabled = true;
                    rejectBtn.disabled = true;
                    cardStatus.textContent = 'Rejecting…';
                    cardStatus.className = 'app-card-status processing';

                    const { ok, status: resStatus, data } = await api('/sponsorship/applications/' + encodeURIComponent(item.id) + '/reject', {
                        method: 'POST',
                        body: JSON.stringify(comment ? { reviewComment: comment } : {}),
                    });

                    if (resStatus === 401) {
                        handleUnauthorized();
                        return;
                    }

                    if (ok && data && data.data && data.data.rejected === true) {
                        item.status = 'rejected';
                        item.review_comment = comment || item.review_comment;
                        item.reviewed_at = new Date().toISOString();
                        applicationsState.pendingCount = Math.max(0, applicationsState.pendingCount - 1);
                        updatePendingBadge();
                        transformCardRejected(card, item);
                    } else {
                        cardStatus.textContent = (data && data.error) || 'Rejection failed.';
                        cardStatus.className = 'app-card-status error';
                        approveBtn.disabled = false;
                        rejectBtn.disabled = false;
                    }
                });
            }

            return card;
        }

        async function loadApplications(reset) {
            const list = document.getElementById('applications-list');
            const loadMoreBtn = document.getElementById('applications-load-more');
            if (!list) return;

            setApplicationsMessage('', '');

            if (reset) {
                applicationsState.offset = 0;
                applicationsState.items = [];
                list.innerHTML = '<div class="admin-empty"><p>Loading applications…</p></div>';
            }

            const params = new URLSearchParams();
            if (applicationsState.status) params.set('status', applicationsState.status);
            params.set('limit', String(applicationsState.limit));
            params.set('offset', String(applicationsState.offset));

            const { ok, status, data } = await api('/sponsorship/applications?' + params.toString());

            if (status === 401) {
                handleUnauthorized();
                return;
            }

            if (!ok) {
                if (reset) {
                    list.innerHTML = `
                        <div class="admin-empty">
                            <h2>Could not load applications</h2>
                            <p>${escapeHtml((data && data.error) || 'Failed to load sponsorship applications.')}</p>
                            <p style="margin-top: 1rem;"><button type="button" class="admin-btn" id="applications-retry">Retry</button></p>
                        </div>
                    `;
                    document.getElementById('applications-retry').addEventListener('click', function() {
                        loadApplications(true);
                    });
                } else {
                    setApplicationsMessage((data && data.error) || 'Failed to load more applications.', 'error');
                }
                return;
            }

            const payload = data && data.data ? data.data : {};
            const items = Array.isArray(payload.items) ? payload.items : [];
            applicationsState.total = Number(payload.total) || items.length;
            applicationsState.pendingCount = Number(payload.pendingCount) || 0;
            applicationsState.offset += items.length;
            applicationsState.items = applicationsState.items.concat(items);

            updatePendingBadge();

            if (reset) list.innerHTML = '';

            if (applicationsState.items.length === 0) {
                const empty = applicationsEmptyText();
                list.innerHTML = '<div class="admin-empty"><h2>' + escapeHtml(empty.title) + '</h2><p>' + escapeHtml(empty.text) + '</p></div>';
            } else {
                const placeholder = list.querySelector('.admin-empty');
                if (placeholder) placeholder.remove();
                items.forEach(function(item) {
                    list.appendChild(createApplicationCard(item));
                });
            }

            if (loadMoreBtn) {
                loadMoreBtn.style.display = applicationsState.offset < applicationsState.total ? '' : 'none';
            }
        }

        function renderApplicationsPanel() {
            const panel = document.getElementById('panel-applications');
            panel.innerHTML = `
                <div class="admin-toolbar">
                    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                        <span class="admin-card-title" style="font-size: 1.05rem;">Sponsorship Applications</span>
                        <span class="app-count-badge" id="applications-pending-badge">— pending</span>
                    </div>
                    <div class="app-pills" role="group" aria-label="Filter applications by status">
                        <button type="button" class="app-pill" data-status="pending">Pending</button>
                        <button type="button" class="app-pill" data-status="approved">Approved</button>
                        <button type="button" class="app-pill" data-status="rejected">Rejected</button>
                        <button type="button" class="app-pill" data-status="">All</button>
                    </div>
                </div>
                <div id="applications-message" class="admin-message" role="alert" aria-live="polite"></div>
                <div id="applications-list"></div>
                <div style="text-align: center; margin-top: 1rem;">
                    <button type="button" class="admin-btn" id="applications-load-more" style="display: none;">Load More</button>
                </div>
            `;

            panel.querySelectorAll('.app-pill').forEach(function(pill) {
                pill.classList.toggle('active', pill.dataset.status === applicationsState.status);
                pill.addEventListener('click', function() {
                    if (applicationsState.status === pill.dataset.status) return;
                    applicationsState.status = pill.dataset.status;
                    panel.querySelectorAll('.app-pill').forEach(function(p) {
                        p.classList.toggle('active', p === pill);
                    });
                    loadApplications(true);
                });
            });

            panel.querySelector('#applications-load-more').addEventListener('click', function() {
                loadApplications(false);
            });

            loadApplications(true);
        }

        function renderInstitutionsPanel(institutions) {
            const panel = document.getElementById('panel-institutions');
            panel.innerHTML = `
                <div class="admin-toolbar">
                    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
                        <input type="search" class="admin-search" id="institution-search" placeholder="Search institutions…">
                        <select class="admin-select" id="institution-sponsorship-filter">
                            <option value="">All sponsorships</option>
                            <option value="active">Active</option>
                            <option value="pending">Pending</option>
                            <option value="expired">Expired</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="admin-btn primary" id="create-institution-btn">Create Institution</button>
                        <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${institutions.length} institutions</span>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="admin-table" id="institutions-table">
                        <thead>
                            <tr>
                                <th>Institution</th>
                                <th>Slug</th>
                                <th>Domain</th>
                                <th>Status</th>
                                <th>Sponsorship</th>
                                <th>Expires</th>
                                <th>Allowlist</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="institution-message" class="admin-message" style="margin-top: 1rem;"></div>
            `;

            const tbody = panel.querySelector('#institutions-table tbody');

            function renderTable(filter, sponsorshipFilter) {
                const term = filter.toLowerCase();
                const filtered = institutions.filter(function(i) {
                    const matchesTerm =
                        (i.name || '').toLowerCase().includes(term) ||
                        (i.slug || '').toLowerCase().includes(term) ||
                        (i.domain || '').toLowerCase().includes(term) ||
                        (i.accreditation || '').toLowerCase().includes(term);
                    const matchesSponsorship = !sponsorshipFilter || i.sponsorship_status === sponsorshipFilter;
                    return matchesTerm && matchesSponsorship;
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No institutions match.</td></tr>';
                    return;
                }

                tbody.innerHTML = filtered.map(function(i) {
                    const allowlist = Array.isArray(i.department_allowlist) ? i.department_allowlist : [];
                    const allowlistTags = allowlist.length
                        ? allowlist.map(function(d) { return '<span class="allowlist-tag">' + escapeHtml(d) + '</span>'; }).join('')
                        : '<em style="color: var(--admin-white-dim);">None</em>';
                    return `
                        <tr data-id="${i.id}">
                            <td>
                                <strong>${escapeHtml(i.name)}</strong><br>
                                <span style="font-size: 0.8rem; color: var(--admin-white-dim);">${escapeHtml(i.accreditation || '—')}</span>
                            </td>
                            <td>${escapeHtml(i.slug)}</td>
                            <td>${escapeHtml(i.domain || '—')}</td>
                            <td><span class="admin-status ${'sponsorship-' + (i.status || 'pending')}">${escapeHtml(i.status || 'pending')}</span></td>
                            <td><span class="admin-status ${'sponsorship-' + (i.sponsorship_status || 'pending')}">${escapeHtml(i.sponsorship_status || 'pending')}</span></td>
                            <td>${formatDateShort(i.sponsorship_expires_at)}</td>
                            <td><div class="allowlist-tags" style="max-width: 240px;">${allowlistTags}</div></td>
                            <td>
                                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                    ${i.sponsorship_status === 'active'
                                        ? '<button class="admin-btn danger sponsorship-btn" data-action="deactivate">Deactivate</button>'
                                        : '<button class="admin-btn success sponsorship-btn" data-action="activate">Activate</button>'}
                                    <button class="admin-btn allowlist-btn">Edit allowlist</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                tbody.querySelectorAll('.sponsorship-btn').forEach(function(btn) {
                    btn.addEventListener('click', async function() {
                        const row = btn.closest('tr');
                        const id = Number(row.dataset.id);
                        const action = btn.dataset.action;
                        // Deactivate must record 'expired', not 'pending':
                        // a formerly active institution is not a fresh applicant.
                        const newStatus = action === 'activate' ? 'active' : 'expired';
                        btn.disabled = true;
                        const msg = document.getElementById('institution-message');
                        msg.className = 'admin-message';
                        msg.textContent = 'Updating…';

                        const expiresAt = action === 'activate'
                            ? new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString()
                            : null;

                        const { ok, data } = await api('/institutions/' + id + '/sponsorship', {
                            method: 'PATCH',
                            body: JSON.stringify({
                                sponsorshipStatus: newStatus,
                                sponsorshipExpiresAt: expiresAt,
                            }),
                        });

                        if (ok) {
                            msg.className = 'admin-message success';
                            msg.textContent = 'Sponsorship updated.';
                            await loadDashboard();
                        } else {
                            msg.className = 'admin-message error';
                            msg.textContent = (data && data.error) || 'Update failed.';
                            btn.disabled = false;
                        }
                    });
                });

                tbody.querySelectorAll('.allowlist-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const row = btn.closest('tr');
                        const id = Number(row.dataset.id);
                        const institution = institutions.find(function(i) { return i.id === id; });
                        openAllowlistModal(institution);
                    });
                });
            }

            function updateView() {
                const filter = panel.querySelector('#institution-search').value;
                const sponsorshipFilter = panel.querySelector('#institution-sponsorship-filter').value;
                renderTable(filter, sponsorshipFilter);
            }

            updateView();
            panel.querySelector('#institution-search').addEventListener('input', updateView);
            panel.querySelector('#institution-sponsorship-filter').addEventListener('change', updateView);
            panel.querySelector('#create-institution-btn').addEventListener('click', openCreateInstitutionModal);
        }

        function openAllowlistModal(institution) {
            const overlay = document.createElement('div');
            overlay.className = 'admin-modal-overlay open';
            const allowlist = Array.isArray(institution.department_allowlist) ? institution.department_allowlist.slice() : [];
            overlay.innerHTML = `
                <div class="admin-modal">
                    <div class="admin-modal-header">
                        <span class="admin-modal-title">Edit Allowlist — ${escapeHtml(institution.name)}</span>
                        <button class="admin-modal-close" type="button">&times;</button>
                    </div>
                    <div class="admin-modal-body">
                        <div class="admin-form-group">
                            <label for="allowlist-input">Departments (press Enter to add)</label>
                            <input type="text" id="allowlist-input" placeholder="e.g. Classics">
                            <div class="allowlist-tags" id="allowlist-tags"></div>
                        </div>
                        <div id="allowlist-message" class="admin-message"></div>
                    </div>
                    <div class="admin-modal-footer">
                        <button class="admin-btn" type="button" id="allowlist-cancel">Cancel</button>
                        <button class="admin-btn primary" type="button" id="allowlist-save">Save Allowlist</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const input = overlay.querySelector('#allowlist-input');
            const tagsContainer = overlay.querySelector('#allowlist-tags');
            const message = overlay.querySelector('#allowlist-message');

            function renderTags() {
                tagsContainer.innerHTML = allowlist.map(function(d, idx) {
                    return '<span class="allowlist-tag">' + escapeHtml(d) + ' <button type="button" data-idx="' + idx + '">&times;</button></span>';
                }).join('');
                tagsContainer.querySelectorAll('button').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        allowlist.splice(Number(btn.dataset.idx), 1);
                        renderTags();
                    });
                });
            }

            renderTags();

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = input.value.trim();
                    if (value && !allowlist.includes(value)) {
                        allowlist.push(value);
                        input.value = '';
                        renderTags();
                    }
                }
            });

            function close() {
                overlay.remove();
            }

            overlay.querySelector('.admin-modal-close').addEventListener('click', close);
            overlay.querySelector('#allowlist-cancel').addEventListener('click', close);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) close();
            });

            overlay.querySelector('#allowlist-save').addEventListener('click', async function() {
                const saveBtn = overlay.querySelector('#allowlist-save');
                saveBtn.disabled = true;
                message.className = 'admin-message';
                message.textContent = 'Saving…';

                const { ok, data } = await api('/institutions/' + institution.id + '/allowlist', {
                    method: 'PATCH',
                    body: JSON.stringify({ departmentAllowlist: allowlist }),
                });

                if (ok) {
                    message.className = 'admin-message success';
                    message.textContent = 'Allowlist saved.';
                    await loadDashboard();
                    setTimeout(close, 500);
                } else {
                    message.className = 'admin-message error';
                    message.textContent = (data && data.error) || 'Save failed.';
                    saveBtn.disabled = false;
                }
            });
        }

        function openCreateInstitutionModal() {
            const overlay = document.createElement('div');
            overlay.className = 'admin-modal-overlay open';
            overlay.innerHTML = `
                <div class="admin-modal">
                    <div class="admin-modal-header">
                        <span class="admin-modal-title">Create Institution</span>
                        <button class="admin-modal-close" type="button">&times;</button>
                    </div>
                    <div class="admin-modal-body">
                        <div class="admin-form-grid">
                            <div class="admin-form-group">
                                <label for="inst-name">Institution name *</label>
                                <input type="text" id="inst-name" required>
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-slug">Slug *</label>
                                <input type="text" id="inst-slug" required>
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-domain">Domain</label>
                                <input type="text" id="inst-domain" placeholder="university.edu">
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-accreditation">Accreditation</label>
                                <input type="text" id="inst-accreditation" placeholder="e.g. R1">
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-admin-email">Initial admin email *</label>
                                <input type="email" id="inst-admin-email" required>
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-admin-password">Initial admin password</label>
                                <input type="text" id="inst-admin-password" placeholder="Leave blank for generated password">
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-admin-name">Admin display name</label>
                                <input type="text" id="inst-admin-name">
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-admin-department">Admin department</label>
                                <input type="text" id="inst-admin-department">
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-sponsorship">Sponsorship status</label>
                                <select class="admin-select" id="inst-sponsorship" style="width: 100%;">
                                    <option value="pending">Pending</option>
                                    <option value="active">Active</option>
                                    <option value="expired">Expired</option>
                                </select>
                            </div>
                            <div class="admin-form-group">
                                <label for="inst-expires">Sponsorship expires</label>
                                <input type="date" id="inst-expires">
                            </div>
                        </div>
                        <div class="admin-form-group" style="margin-top: 1rem;">
                            <label for="inst-allowlist-input">Department allowlist (press Enter to add)</label>
                            <input type="text" id="inst-allowlist-input" placeholder="e.g. Classics">
                            <div class="allowlist-tags" id="inst-allowlist-tags"></div>
                        </div>
                        <div id="create-inst-message" class="admin-message"></div>
                    </div>
                    <div class="admin-modal-footer">
                        <button class="admin-btn" type="button" id="create-inst-cancel">Cancel</button>
                        <button class="admin-btn primary" type="button" id="create-inst-save">Create</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const allowlist = [];
            const input = overlay.querySelector('#inst-allowlist-input');
            const tagsContainer = overlay.querySelector('#inst-allowlist-tags');
            const message = overlay.querySelector('#create-inst-message');

            function renderTags() {
                tagsContainer.innerHTML = allowlist.map(function(d, idx) {
                    return '<span class="allowlist-tag">' + escapeHtml(d) + ' <button type="button" data-idx="' + idx + '">&times;</button></span>';
                }).join('');
                tagsContainer.querySelectorAll('button').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        allowlist.splice(Number(btn.dataset.idx), 1);
                        renderTags();
                    });
                });
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = input.value.trim();
                    if (value && !allowlist.includes(value)) {
                        allowlist.push(value);
                        input.value = '';
                        renderTags();
                    }
                }
            });

            function close() {
                overlay.remove();
            }

            overlay.querySelector('.admin-modal-close').addEventListener('click', close);
            overlay.querySelector('#create-inst-cancel').addEventListener('click', close);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) close();
            });

            overlay.querySelector('#create-inst-save').addEventListener('click', async function() {
                const saveBtn = overlay.querySelector('#create-inst-save');
                saveBtn.disabled = true;
                message.className = 'admin-message';
                message.textContent = 'Creating…';

                const payload = {
                    name: document.getElementById('inst-name').value.trim(),
                    slug: document.getElementById('inst-slug').value.trim(),
                    domain: document.getElementById('inst-domain').value.trim() || undefined,
                    accreditation: document.getElementById('inst-accreditation').value.trim() || undefined,
                    adminEmail: document.getElementById('inst-admin-email').value.trim(),
                    adminPassword: document.getElementById('inst-admin-password').value || undefined,
                    adminDisplayName: document.getElementById('inst-admin-name').value.trim() || undefined,
                    adminDepartment: document.getElementById('inst-admin-department').value.trim() || undefined,
                    sponsorshipStatus: document.getElementById('inst-sponsorship').value,
                    sponsorshipExpiresAt: document.getElementById('inst-expires').value
                        ? new Date(document.getElementById('inst-expires').value).toISOString()
                        : null,
                    departmentAllowlist: allowlist,
                };

                const { ok, data } = await api('/institutions', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                });

                if (ok) {
                    message.className = 'admin-message success';
                    const generated = data && data.data && data.data.adminPassword
                        ? ' Generated admin password: ' + escapeHtml(data.data.adminPassword) + '.'
                        : '';
                    message.innerHTML = 'Institution created.' + generated;
                    await loadDashboard();
                    setTimeout(close, 1200);
                } else {
                    message.className = 'admin-message error';
                    message.textContent = (data && data.error) || 'Creation failed.';
                    saveBtn.disabled = false;
                }
            });
        }

        function renderUsersPanel(users) {
            const panel = document.getElementById('panel-users');
            panel.innerHTML = `
                <div class="admin-toolbar">
                    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
                        <input type="search" class="admin-search" id="user-search" placeholder="Search users…">
                        <select class="admin-select" id="user-role-filter">
                            <option value="">All roles</option>
                            <option value="student">Student</option>
                            <option value="reviewer">Reviewer</option>
                            <option value="dept_admin">Dept Admin</option>
                            <option value="inst_admin">Inst Admin</option>
                            <option value="curator">Curator</option>
                        </select>
                        <select class="admin-select" id="user-status-filter">
                            <option value="">All statuses</option>
                            <option value="active">Active</option>
                            <option value="disabled">Disabled</option>
                            <option value="pending">Pending</option>
                        </select>
                        <select class="admin-select" id="user-institution-filter">
                            <option value="">All institutions</option>
                            ${institutionsData.map(function(i) {
                                return '<option value="' + i.id + '">' + escapeHtml(i.name) + '</option>';
                            }).join('')}
                        </select>
                    </div>
                    <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${users.length} users</span>
                </div>
                <div style="overflow-x: auto;">
                    <table class="admin-table" id="users-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Institution</th>
                                <th>Department</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="user-message" class="admin-message" style="margin-top: 1rem;"></div>
            `;

            const tbody = panel.querySelector('#users-table tbody');

            function renderTable(filter, roleFilter, statusFilter, institutionFilter) {
                const term = filter.toLowerCase();
                const filtered = users.filter(function(u) {
                    const matchesTerm =
                        (u.email || '').toLowerCase().includes(term) ||
                        (u.display_name || '').toLowerCase().includes(term) ||
                        (u.department || '').toLowerCase().includes(term);
                    const matchesRole = !roleFilter || u.role === roleFilter;
                    const matchesStatus = !statusFilter || u.account_status === statusFilter;
                    const matchesInstitution = !institutionFilter || String(u.institution_id) === institutionFilter;
                    return matchesTerm && matchesRole && matchesStatus && matchesInstitution;
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No users match.</td></tr>';
                    return;
                }

                tbody.innerHTML = filtered.map(function(u) {
                    return `
                        <tr data-id="${u.id}">
                            <td>${escapeHtml(u.email)}</td>
                            <td>${escapeHtml(u.display_name || '—')}</td>
                            <td><span class="admin-role-badge">${escapeHtml(u.role)}</span></td>
                            <td>${escapeHtml(u.institution_name || '—')}</td>
                            <td>${escapeHtml(u.department || '—')}</td>
                            <td><span class="admin-status account-${u.account_status || 'pending'}">${escapeHtml(u.account_status || 'pending')}</span></td>
                            <td>${formatDate(u.created_at)}</td>
                            <td>
                                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                                    <select class="admin-select role-select" data-id="${u.id}" style="min-width: 120px;">
                                        <option value="student" ${u.role === 'student' ? 'selected' : ''}>Student</option>
                                        <option value="reviewer" ${u.role === 'reviewer' ? 'selected' : ''}>Reviewer</option>
                                        <option value="dept_admin" ${u.role === 'dept_admin' ? 'selected' : ''}>Dept Admin</option>
                                        <option value="inst_admin" ${u.role === 'inst_admin' ? 'selected' : ''}>Inst Admin</option>
                                        <option value="curator" ${u.role === 'curator' ? 'selected' : ''}>Curator</option>
                                    </select>
                                    ${u.account_status === 'active'
                                        ? '<button class="admin-btn danger status-btn" data-action="disable">Disable</button>'
                                        : '<button class="admin-btn success status-btn" data-action="enable">Enable</button>'}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                tbody.querySelectorAll('.role-select').forEach(function(select) {
                    select.addEventListener('change', async function() {
                        const id = Number(select.dataset.id);
                        const newRole = select.value;
                        const originalRole = users.find(function(u) { return u.id === id; }).role;
                        select.disabled = true;
                        const msg = document.getElementById('user-message');
                        msg.className = 'admin-message';
                        msg.textContent = 'Updating role…';

                        const { ok, data } = await api('/users/' + id + '/role', {
                            method: 'PATCH',
                            body: JSON.stringify({ role: newRole }),
                        });

                        if (ok) {
                            msg.className = 'admin-message success';
                            msg.textContent = 'Role updated.';
                            const user = users.find(function(u) { return u.id === id; });
                            if (user) user.role = newRole;
                        } else {
                            msg.className = 'admin-message error';
                            msg.textContent = (data && data.error) || 'Role update failed.';
                            select.value = originalRole;
                        }
                        select.disabled = false;
                    });
                });

                tbody.querySelectorAll('.status-btn').forEach(function(btn) {
                    btn.addEventListener('click', async function() {
                        const id = Number(btn.closest('tr').dataset.id);
                        const action = btn.dataset.action;
                        const newStatus = action === 'enable' ? 'active' : 'disabled';
                        btn.disabled = true;
                        const msg = document.getElementById('user-message');
                        msg.className = 'admin-message';
                        msg.textContent = 'Updating status…';

                        const { ok, data } = await api('/users/' + id + '/status', {
                            method: 'PATCH',
                            body: JSON.stringify({ accountStatus: newStatus }),
                        });

                        if (ok) {
                            msg.className = 'admin-message success';
                            msg.textContent = 'Status updated.';
                            const user = users.find(function(u) { return u.id === id; });
                            if (user) user.account_status = newStatus;
                            updateView();
                        } else {
                            msg.className = 'admin-message error';
                            msg.textContent = (data && data.error) || 'Status update failed.';
                            btn.disabled = false;
                        }
                    });
                });
            }

            function updateView() {
                const filter = panel.querySelector('#user-search').value;
                const roleFilter = panel.querySelector('#user-role-filter').value;
                const statusFilter = panel.querySelector('#user-status-filter').value;
                const institutionFilter = panel.querySelector('#user-institution-filter').value;
                renderTable(filter, roleFilter, statusFilter, institutionFilter);
            }

            updateView();
            panel.querySelector('#user-search').addEventListener('input', updateView);
            panel.querySelector('#user-role-filter').addEventListener('change', updateView);
            panel.querySelector('#user-status-filter').addEventListener('change', updateView);
            panel.querySelector('#user-institution-filter').addEventListener('change', updateView);
        }

        function renderOverviewPanel(stats) {
            const panel = document.getElementById('panel-overview');
            const periodDays = analyticsData && analyticsData.periodDays ? analyticsData.periodDays : 30;
            const editsByDay = analyticsData && analyticsData.editsByDay ? analyticsData.editsByDay : [];
            const approvalsByDay = analyticsData && analyticsData.approvalsByDay ? analyticsData.approvalsByDay : [];
            const topInstitutions = analyticsData && analyticsData.topInstitutions ? analyticsData.topInstitutions : [];
            const topTemples = analyticsData && analyticsData.topTemples ? analyticsData.topTemples : [];

            panel.innerHTML = `
                <div class="admin-card">
                    <div class="admin-card-header">
                        <div class="admin-card-title">Scholarly Edition Overview</div>
                    </div>
                    <div class="admin-card-body">
                        <p>Total temples: <strong>${(stats && stats.totalTemples) || '—'}</strong> ·
                        Total sections: <strong>${(stats && stats.totalSections) || '—'}</strong> ·
                        Published sections: <strong>${(stats && stats.publishedSections) || '—'}</strong> ·
                        Pending edits: <strong>${(stats && stats.pendingEdits) || '—'}</strong></p>
                    </div>
                </div>

                <div class="admin-card">
                    <div class="admin-card-header">
                        <div class="admin-card-title">Top Contributing Institutions (${periodDays} days)</div>
                    </div>
                    <div class="admin-card-body">
                        ${topInstitutions.length
                            ? '<ul>' + topInstitutions.map(function(i) {
                                return '<li>' + escapeHtml(i.name) + ' — ' + (i.edit_count || 0) + ' edits</li>';
                            }).join('') + '</ul>'
                            : '<p>No contribution data for this period.</p>'}
                    </div>
                </div>

                <div class="admin-card">
                    <div class="admin-card-header">
                        <div class="admin-card-title">Most Edited Temples (${periodDays} days)</div>
                    </div>
                    <div class="admin-card-body">
                        ${topTemples.length
                            ? '<ul>' + topTemples.map(function(t) {
                                return '<li><a href=\'/' + escapeHtml(t.entry_id) + '/scholars/\' target="_blank">' + escapeHtml(t.name || t.entry_id) + '</a> — ' + (t.edit_count || 0) + ' edits</li>';
                            }).join('') + '</ul>'
                            : '<p>No edit data for this period.</p>'}
                    </div>
                </div>

                <div class="admin-card">
                    <div class="admin-card-header">
                        <div class="admin-card-title">Activity (${periodDays} days)</div>
                    </div>
                    <div class="admin-card-body">
                        <p>Edits submitted: <strong>${editsByDay.reduce(function(a, b) { return a + (b.count || 0); }, 0)}</strong></p>
                        <p>Edits approved: <strong>${approvalsByDay.reduce(function(a, b) { return a + (b.count || 0); }, 0)}</strong></p>
                    </div>
                </div>
            `;
        }

        async function init() {
            const sessionId = getSessionId();
            if (!sessionId) {
                renderLoginPrompt();
                return;
            }

            const { ok: sessionOk, data: sessionData } = await api('/auth/session');
            const user = sessionData && sessionData.data ? sessionData.data.user : null;

            if (!sessionOk || !user) {
                localStorage.removeItem('scholars_session');
                renderLoginPrompt();
                return;
            }

            if (user.role !== 'curator') {
                renderError('Account ' + user.email + ' has role "' + user.role + '". Curator access is required.');
                return;
            }

            currentUser = user;
            await renderDashboard();
        }

        init();
    })();
    </script>
</body>
</html>

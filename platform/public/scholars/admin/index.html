<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarly Edition — Curator Admin | PUNYCODEX</title>
    <meta name="description" content="Curator administration dashboard for the PÚNYCODEX Scholarly Edition. Oversee temples, edits, users, and institutions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Lato:wght@300;400;700&family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/temple-base.css?v=perf7">

    <style>
        :root {
            --admin-primary: #D4AF37;
            --admin-primary-dim: #8B7355;
            --admin-void: #0A0A0A;
            --admin-void-raised: #111111;
            --admin-white: #F5F5F5;
            --admin-white-dim: #A0A0A0;
            --admin-white-faint: rgba(255, 255, 255, 0.06);
            --admin-success: #7fd67f;
            --admin-danger: #ff7f7f;
            --admin-warn: #f0d878;
            --admin-info: #7fb8d6;
            --admin-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--admin-void);
            color: var(--admin-white);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .global-strip {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--admin-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .global-strip-inner {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0.75rem clamp(1rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .global-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--admin-white);
            text-decoration: none;
        }

        .global-brand span {
            color: var(--admin-primary);
        }

        .global-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .global-links a {
            color: var(--admin-white-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .global-links a:hover {
            color: var(--admin-primary);
        }

        .admin-hero {
            padding: 4rem 0 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--admin-border);
        }

        .admin-eyebrow {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--admin-primary);
            margin-bottom: 1rem;
        }

        .admin-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--admin-white);
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
        }

        .admin-subtitle {
            color: var(--admin-white-dim);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .admin-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2.5rem clamp(1rem, 5vw, 3rem) 5rem;
        }

        .admin-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .admin-role-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--admin-primary);
            vertical-align: middle;
        }

        .admin-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--admin-border);
            background: transparent;
            color: var(--admin-white);
            transition: all 0.2s;
        }

        .admin-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .admin-btn.primary {
            background: var(--admin-primary);
            color: #000;
            border-color: var(--admin-primary);
        }

        .admin-btn.primary:hover {
            background: var(--admin-warn);
            border-color: var(--admin-warn);
        }

        .admin-btn.danger {
            background: rgba(255, 127, 127, 0.12);
            color: var(--admin-danger);
            border-color: rgba(255, 127, 127, 0.35);
        }

        .admin-btn.danger:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .admin-btn.success {
            background: rgba(127, 214, 127, 0.12);
            color: var(--admin-success);
            border-color: rgba(127, 214, 127, 0.35);
        }

        .admin-btn.success:hover {
            background: rgba(127, 214, 127, 0.22);
        }

        .admin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--admin-primary);
            margin-bottom: 0.35rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--admin-white-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .admin-tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--admin-border);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 0.75rem 1.25rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--admin-white-dim);
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-tab:hover {
            color: var(--admin-white);
        }

        .admin-tab.active {
            color: var(--admin-primary);
            border-bottom-color: var(--admin-primary);
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-empty {
            text-align: center;
            padding: 4rem 1rem;
            border: 1px dashed var(--admin-border);
            border-radius: 12px;
        }

        .admin-empty h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--admin-white);
            margin-bottom: 0.5rem;
        }

        .admin-empty p {
            color: var(--admin-white-dim);
        }

        .admin-card {
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .admin-card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--admin-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        .admin-card-title {
            font-family: var(--font-display);
            color: var(--admin-white);
            font-size: 1rem;
            letter-spacing: 0.03em;
        }

        .admin-card-meta {
            color: var(--admin-white-dim);
            font-size: 0.85rem;
        }

        .admin-card-body {
            padding: 1.25rem;
            color: var(--admin-white-dim);
            line-height: 1.7;
        }

        .admin-card-footer {
            padding: 0.75rem 1.25rem;
            border-top: 1px solid var(--admin-border);
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .admin-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--admin-white-dim);
        }

        .admin-status.frozen {
            background: rgba(255, 127, 127, 0.12);
            color: var(--admin-danger);
        }

        .admin-status.active {
            background: rgba(127, 214, 127, 0.12);
            color: var(--admin-success);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .admin-table th,
        .admin-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--admin-border);
        }

        .admin-table th {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
            font-weight: 400;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table td {
            color: var(--admin-white-dim);
        }

        .admin-table a {
            color: var(--admin-white);
            text-decoration: none;
        }

        .admin-table a:hover {
            color: var(--admin-primary);
        }

        .admin-login {
            max-width: 420px;
            margin: 4rem auto;
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .admin-login h2 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            color: var(--admin-white);
            margin-bottom: 0.75rem;
        }

        .admin-login p {
            color: var(--admin-white-dim);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        .admin-login-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
        }

        .admin-login-form label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
        }

        .admin-login-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .admin-login-form input:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .admin-login-form .admin-btn {
            align-self: flex-start;
        }

        .admin-login-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .admin-login-message.success {
            color: var(--admin-success);
        }

        .admin-login-message.error {
            color: var(--admin-danger);
        }

        .admin-error {
            max-width: var(--container-max);
            margin: 2rem auto 0;
            padding: 0 clamp(1rem, 5vw, 3rem);
            color: var(--admin-danger);
            background: rgba(255, 127, 127, 0.08);
            border: 1px solid rgba(255, 127, 127, 0.25);
            border-radius: 8px;
            padding: 1rem;
        }

        .admin-search {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .admin-search:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .admin-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
        }

        .admin-message.success {
            color: var(--admin-success);
        }

        .admin-message.error {
            color: var(--admin-danger);
        }

        @media (max-width: 640px) {
            .admin-card-header {
                grid-template-columns: 1fr;
            }

            .admin-toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .global-strip-inner {
                flex-direction: column;
                gap: 0.5rem;
            }

            .admin-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="global-strip">
        <div class="global-strip-inner">
            <a href="/" class="global-brand">P<span>U</span>NYCODEX</a>
            <div class="global-links">
                <a href="/pantheon/">Pantheon</a>
                <a href="/lexicon/">Lexicon</a>
                <a href="/type/">Type</a>
                <a href="/search.html">Search</a>
                <a href="/tiers/">Tiers</a>
                <a href="/about/">About</a>
            </div>
        </div>
    </div>

    <header class="admin-hero">
        <div class="admin-eyebrow">PUNYCODEX Scholarly Edition</div>
        <h1 class="admin-title">Curator Admin</h1>
        <p class="admin-subtitle">Oversee the Scholarly Edition. Manage temples, monitor pending edits, and govern users and institutions.</p>
    </header>

    <main class="admin-container" id="app">
        <noscript>
            <div class="admin-error">This curator dashboard requires JavaScript to communicate with the Scholarly Edition API.</div>
        </noscript>
    </main>

    <script>
    (function() {
        const apiBase = '/api/v1/scholars';
        const container = document.getElementById('app');
        const sessionId = localStorage.getItem('scholars_session');

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function api(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(sessionId ? { 'x-scholars-session': sessionId } : {}),
                ...(options.headers || {}),
            };
            const res = await fetch(apiBase + path, {
                ...options,
                headers,
            });
            const data = await res.json().catch(() => ({ success: false, error: 'Invalid response' }));
            return { ok: res.ok, status: res.status, data };
        }

        function renderLoginPrompt() {
            container.innerHTML = `
                <div class="admin-login">
                    <h2>Curator Access Required</h2>
                    <p>This dashboard is restricted to curators. Sign in with a verified curator email, or paste a session ID to load the dashboard.</p>
                    <form class="admin-login-form" id="magic-link-form">
                        <label for="curator-email">Curator email</label>
                        <input type="email" id="curator-email" placeholder="you@university.edu" required>
                        <button type="submit" class="admin-btn primary">Send Magic Link</button>
                    </form>
                    <div style="margin: 1.25rem 0; border-top: 1px solid var(--admin-border);"></div>
                    <form class="admin-login-form" id="session-form">
                        <label for="session-id">Or paste session ID</label>
                        <input type="text" id="session-id" placeholder="scholars_session token" required>
                        <button type="submit" class="admin-btn">Load Dashboard</button>
                    </form>
                    <div class="admin-login-message" id="login-message"></div>
                </div>
            `;

            const form = document.getElementById('magic-link-form');
            const sessionForm = document.getElementById('session-form');
            const message = document.getElementById('login-message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('curator-email').value.trim();
                message.className = 'admin-login-message';
                message.textContent = 'Sending…';
                const { ok, data } = await api('/auth/magic-link', {
                    method: 'POST',
                    body: JSON.stringify({ email }),
                });
                if (ok) {
                    message.className = 'admin-login-message success';
                    message.innerHTML = 'Magic link generated. In development, the verification URL is logged to the server console; paste it into the browser to set <code>scholars_session</code> in localStorage.';
                } else {
                    message.className = 'admin-login-message error';
                    message.textContent = data?.error || 'Failed to request magic link.';
                }
            });

            sessionForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const sessionId = document.getElementById('session-id').value.trim();
                if (sessionId) {
                    localStorage.setItem('scholars_session', sessionId);
                    window.location.reload();
                }
            });
        }

        function renderError(message) {
            container.innerHTML = `<div class="admin-error">${escapeHtml(message)}</div>`;
        }

        let currentUser = null;
        let templesData = [];
        let editsData = [];
        let usersData = [];
        let institutionsData = [];

        async function renderDashboard() {
            container.innerHTML = `
                <div class="admin-toolbar">
                    <div>
                        <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${escapeHtml(currentUser.email)} <span class="admin-role-badge">${escapeHtml(currentUser.role)}</span></span>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="admin-btn" id="refresh-dashboard">Refresh</button>
                        <button class="admin-btn" id="logout-btn">Sign out</button>
                    </div>
                </div>

                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Temples</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Sections</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Published</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Pending Edits</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Users</div></div>
                    <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Institutions</div></div>
                </div>

                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="temples">Temples</button>
                    <button class="admin-tab" data-tab="edits">Pending Edits</button>
                    <button class="admin-tab" data-tab="users">Users</button>
                    <button class="admin-tab" data-tab="institutions">Institutions</button>
                </div>

                <div class="admin-panel active" id="panel-temples"></div>
                <div class="admin-panel" id="panel-edits"></div>
                <div class="admin-panel" id="panel-users"></div>
                <div class="admin-panel" id="panel-institutions"></div>
            `;

            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('scholars_session');
                window.location.reload();
            });

            document.getElementById('refresh-dashboard').addEventListener('click', loadDashboard);

            document.querySelectorAll('.admin-tab').forEach((tab) => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach((t) => t.classList.remove('active'));
                    document.querySelectorAll('.admin-panel').forEach((p) => p.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                });
            });

            await loadDashboard();
        }

        async function loadDashboard() {
            const statsRes = await api('/stats');
            if (statsRes.ok && statsRes.data?.data) {
                const stats = statsRes.data.data;
                const values = [
                    stats.totalTemples,
                    stats.totalSections,
                    stats.publishedSections,
                    stats.pendingEdits,
                    stats.totalUsers,
                    stats.totalInstitutions,
                ];
                document.querySelectorAll('#stats-grid .stat-value').forEach((el, i) => {
                    el.textContent = typeof values[i] === 'number' ? values[i].toLocaleString() : '—';
                });
            }

            const [templesRes, editsRes, usersRes, institutionsRes] = await Promise.all([
                api('/temples'),
                api('/edits/pending?limit=200'),
                api('/users'),
                api('/institutions'),
            ]);

            templesData = templesRes.ok ? (templesRes.data?.data || []) : [];
            editsData = editsRes.ok ? (editsRes.data?.data || []) : [];
            usersData = usersRes.ok ? (usersRes.data?.data || []) : [];
            institutionsData = institutionsRes.ok ? (institutionsRes.data?.data || []) : [];

            renderTemplesPanel(templesData);
            renderEditsPanel(editsData);
            renderUsersPanel(usersData);
            renderInstitutionsPanel(institutionsData);
        }

        function renderTemplesPanel(temples) {
            const panel = document.getElementById('panel-temples');
            if (temples.length === 0) {
                panel.innerHTML = `<div class="admin-empty"><h2>No Temples</h2><p>There are no scholarly temples in the database yet.</p></div>`;
                return;
            }

            panel.innerHTML = `
                <div class="admin-toolbar">
                    <input type="search" class="admin-search" id="temple-search" placeholder="Search temples…">
                    <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${temples.length} temples</span>
                </div>
                <div id="temples-list"></div>
            `;

            const list = document.getElementById('temples-list');

            function renderList(filter = '') {
                const term = filter.toLowerCase();
                const filtered = temples.filter((t) =>
                    (t.name || '').toLowerCase().includes(term) ||
                    (t.entry_id || '').toLowerCase().includes(term) ||
                    (t.pantheon || '').toLowerCase().includes(term)
                );

                if (filtered.length === 0) {
                    list.innerHTML = `<div class="admin-empty"><p>No temples match your search.</p></div>`;
                    return;
                }

                list.innerHTML = filtered.map((t) => `
                    <div class="admin-card" data-entry="${escapeHtml(t.entry_id)}">
                        <div class="admin-card-header">
                            <div>
                                <div class="admin-card-title">${escapeHtml(t.name || t.entry_id)}</div>
                                <div class="admin-card-meta">${escapeHtml(t.entry_id)} · ${escapeHtml(t.pantheon)} · ${escapeHtml(t.tier)}</div>
                            </div>
                            <span class="admin-status ${t.is_frozen ? 'frozen' : 'active'}">${t.is_frozen ? 'Frozen' : 'Active'}</span>
                        </div>
                        <div class="admin-card-footer">
                            <a class="admin-btn" href="/sites/${escapeHtml(t.entry_id)}/scholars/" target="_blank">Open Scholars Page</a>
                            <button class="admin-btn ${t.is_frozen ? 'success' : 'danger'} freeze-btn" data-entry="${escapeHtml(t.entry_id)}" data-frozen="${t.is_frozen ? '1' : '0'}">
                                ${t.is_frozen ? 'Unfreeze Temple' : 'Freeze Temple'}
                            </button>
                            <span class="admin-message" id="msg-${escapeHtml(t.entry_id)}"></span>
                        </div>
                    </div>
                `).join('');

                list.querySelectorAll('.freeze-btn').forEach((btn) => {
                    btn.addEventListener('click', async () => {
                        const entryId = btn.dataset.entry;
                        const isFrozen = btn.dataset.frozen !== '1';
                        btn.disabled = true;
                        const msg = document.getElementById('msg-' + entryId);
                        if (msg) { msg.className = 'admin-message'; msg.textContent = 'Saving…'; }

                        const { ok, data } = await api(`/temples/${entryId}/freeze`, {
                            method: 'POST',
                            body: JSON.stringify({ isFrozen }),
                        });

                        if (ok) {
                            const card = list.querySelector(`[data-entry="${CSS.escape(entryId)}"]`);
                            if (card) {
                                const status = card.querySelector('.admin-status');
                                status.className = 'admin-status ' + (isFrozen ? 'frozen' : 'active');
                                status.textContent = isFrozen ? 'Frozen' : 'Active';
                                btn.className = 'admin-btn ' + (isFrozen ? 'success' : 'danger') + ' freeze-btn';
                                btn.dataset.frozen = isFrozen ? '1' : '0';
                                btn.textContent = isFrozen ? 'Unfreeze Temple' : 'Freeze Temple';
                            }
                            if (msg) { msg.className = 'admin-message success'; msg.textContent = isFrozen ? 'Temple frozen.' : 'Temple unfrozen.'; }
                        } else {
                            if (msg) { msg.className = 'admin-message error'; msg.textContent = data?.error || 'Action failed.'; }
                        }
                        btn.disabled = false;
                    });
                });
            }

            renderList();
            document.getElementById('temple-search').addEventListener('input', (e) => renderList(e.target.value));
        }

        function renderEditsPanel(edits) {
            const panel = document.getElementById('panel-edits');
            if (edits.length === 0) {
                panel.innerHTML = `<div class="admin-empty"><h2>Queue Clear</h2><p>There are no pending scholarly edits awaiting review.</p></div>`;
                return;
            }

            panel.innerHTML = `
                <div class="admin-toolbar">
                    <input type="search" class="admin-search" id="edit-search" placeholder="Search edits…">
                    <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${edits.length} pending</span>
                </div>
                <div id="edits-list"></div>
            `;

            const list = document.getElementById('edits-list');

            function renderList(filter = '') {
                const term = filter.toLowerCase();
                const filtered = edits.filter((e) =>
                    (e.email || '').toLowerCase().includes(term) ||
                    (e.entry_id || '').toLowerCase().includes(term) ||
                    (e.section_label || '').toLowerCase().includes(term) ||
                    (e.proposed_body || '').toLowerCase().includes(term)
                );

                if (filtered.length === 0) {
                    list.innerHTML = `<div class="admin-empty"><p>No edits match your search.</p></div>`;
                    return;
                }

                list.innerHTML = filtered.map((e) => `
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <div>
                                <div class="admin-card-title">${escapeHtml(e.entry_id)} · ${escapeHtml(e.section_label || e.section_key)}</div>
                                <div class="admin-card-meta">By ${escapeHtml(e.email || 'Unknown')} · ${formatDate(e.created_at)}</div>
                            </div>
                            <span class="admin-status active">Pending</span>
                        </div>
                        <div class="admin-card-body">
                            <p>${escapeHtml((e.proposed_body || '').slice(0, 280))}${(e.proposed_body || '').length > 280 ? '…' : ''}</p>
                        </div>
                        <div class="admin-card-footer">
                            <a class="admin-btn" href="/sites/${escapeHtml(e.entry_id)}/scholars/" target="_blank">View Temple</a>
                            <a class="admin-btn" href="../review/index.html" target="_blank">Open Review Queue</a>
                        </div>
                    </div>
                `).join('');
            }

            renderList();
            document.getElementById('edit-search').addEventListener('input', (e) => renderList(e.target.value));
        }

        function renderUsersPanel(users) {
            const panel = document.getElementById('panel-users');
            if (users.length === 0) {
                panel.innerHTML = `<div class="admin-empty"><h2>No Users</h2><p>There are no scholarly users in the database yet.</p></div>`;
                return;
            }

            panel.innerHTML = `
                <div class="admin-toolbar">
                    <input type="search" class="admin-search" id="user-search" placeholder="Search users…">
                    <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${users.length} users</span>
                </div>
                <div style="overflow-x: auto;">
                    <table class="admin-table" id="users-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Institution</th>
                                <th>Status</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            `;

            const tbody = document.querySelector('#users-table tbody');

            function renderTable(filter = '') {
                const term = filter.toLowerCase();
                const filtered = users.filter((u) =>
                    (u.email || '').toLowerCase().includes(term) ||
                    (u.display_name || '').toLowerCase().includes(term) ||
                    (u.role || '').toLowerCase().includes(term) ||
                    (u.institution_name || '').toLowerCase().includes(term)
                );

                tbody.innerHTML = filtered.map((u) => `
                    <tr>
                        <td>${escapeHtml(u.email)}</td>
                        <td>${escapeHtml(u.display_name || '—')}</td>
                        <td><span class="admin-role-badge">${escapeHtml(u.role)}</span></td>
                        <td>${escapeHtml(u.institution_name || '—')}</td>
                        <td>${escapeHtml(u.status || 'active')}</td>
                        <td>${formatDate(u.created_at)}</td>
                    </tr>
                `).join('');
            }

            renderTable();
            document.getElementById('user-search').addEventListener('input', (e) => renderTable(e.target.value));
        }

        function renderInstitutionsPanel(institutions) {
            const panel = document.getElementById('panel-institutions');
            if (institutions.length === 0) {
                panel.innerHTML = `<div class="admin-empty"><h2>No Institutions</h2><p>There are no institutions in the database yet.</p></div>`;
                return;
            }

            panel.innerHTML = `
                <div class="admin-toolbar">
                    <input type="search" class="admin-search" id="institution-search" placeholder="Search institutions…">
                    <span style="color: var(--admin-white-dim); font-size: 0.85rem;">${institutions.length} institutions</span>
                </div>
                <div style="overflow-x: auto;">
                    <table class="admin-table" id="institutions-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Slug</th>
                                <th>Domain</th>
                                <th>Accreditation</th>
                                <th>Status</th>
                                <th>Created</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            `;

            const tbody = document.querySelector('#institutions-table tbody');

            function renderTable(filter = '') {
                const term = filter.toLowerCase();
                const filtered = institutions.filter((i) =>
                    (i.name || '').toLowerCase().includes(term) ||
                    (i.slug || '').toLowerCase().includes(term) ||
                    (i.domain || '').toLowerCase().includes(term) ||
                    (i.accreditation || '').toLowerCase().includes(term)
                );

                tbody.innerHTML = filtered.map((i) => `
                    <tr>
                        <td>${escapeHtml(i.name)}</td>
                        <td>${escapeHtml(i.slug)}</td>
                        <td>${escapeHtml(i.domain || '—')}</td>
                        <td>${escapeHtml(i.accreditation || '—')}</td>
                        <td>${escapeHtml(i.status)}</td>
                        <td>${formatDate(i.created_at)}</td>
                    </tr>
                `).join('');
            }

            renderTable();
            document.getElementById('institution-search').addEventListener('input', (e) => renderTable(e.target.value));
        }

        async function init() {
            if (!sessionId) {
                renderLoginPrompt();
                return;
            }

            const { ok: sessionOk, data: sessionData } = await api('/auth/session');
            const user = sessionData?.data?.user;

            if (!sessionOk || !user) {
                localStorage.removeItem('scholars_session');
                renderLoginPrompt();
                return;
            }

            if (user.role !== 'curator') {
                renderError(`Account ${user.email} has role "${user.role}". Curator access is required.`);
                return;
            }

            currentUser = user;
            await renderDashboard();
        }

        init();
    })();
    </script>
</body>
</html>

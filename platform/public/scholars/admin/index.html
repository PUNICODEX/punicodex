<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarly Edition — Curator Admin | PUNICODEX</title>
    <meta name="description" content="Curator administration dashboard for the PuniCodex Scholarly Edition. Manage institutions, users, and sponsorships.">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/css/temple-base.css?v=perf22">

    <style>
        :root {
            --admin-primary: #D4AF37;
            --admin-primary-dim: #A98F66;
            --admin-void: #0A0A0A;
            --admin-void-raised: #111111;
            --admin-white: #F5F5F5;
            --admin-white-dim: #A0A0A0;
            --admin-white-faint: rgba(255, 255, 255, 0.06);
            --admin-success: #7fd67f;
            --admin-danger: #ff7f7f;
            --admin-warn: #f0d878;
            --admin-info: #7fb8d6;
            --admin-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--admin-void);
            color: var(--admin-white);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .global-strip {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--admin-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .global-strip-inner {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0.75rem clamp(1rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .global-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--admin-white);
            text-decoration: none;
        }

        .global-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .global-links a {
            color: var(--admin-white-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .global-links a:hover {
            color: var(--admin-primary);
        }

        .admin-hero {
            padding: 4rem 0 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--admin-border);
        }

        .admin-eyebrow {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--admin-primary);
            margin-bottom: 1rem;
        }

        .admin-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--admin-white);
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
        }

        .admin-subtitle {
            color: var(--admin-white-dim);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .admin-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2.5rem clamp(1rem, 5vw, 3rem) 5rem;
        }

        .admin-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .admin-role-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--admin-primary);
            vertical-align: middle;
        }

        .admin-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--admin-border);
            background: transparent;
            color: var(--admin-white);
            transition: all 0.2s;
        }

        .admin-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .admin-btn.primary {
            background: var(--admin-primary);
            color: #000;
            border-color: var(--admin-primary);
        }

        .admin-btn.primary:hover {
            background: var(--admin-warn);
            border-color: var(--admin-warn);
        }

        .admin-btn.danger {
            background: rgba(255, 127, 127, 0.12);
            color: var(--admin-danger);
            border-color: rgba(255, 127, 127, 0.35);
        }

        .admin-btn.danger:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .admin-btn.success {
            background: rgba(127, 214, 127, 0.12);
            color: var(--admin-success);
            border-color: rgba(127, 214, 127, 0.35);
        }

        .admin-btn.success:hover {
            background: rgba(127, 214, 127, 0.22);
        }

        .admin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--admin-primary);
            margin-bottom: 0.35rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--admin-white-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .admin-tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--admin-border);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 0.75rem 1.25rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--admin-white-dim);
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-tab:hover {
            color: var(--admin-white);
        }

        .admin-tab.active {
            color: var(--admin-primary);
            border-bottom-color: var(--admin-primary);
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-empty {
            text-align: center;
            padding: 4rem 1rem;
            border: 1px dashed var(--admin-border);
            border-radius: 12px;
        }

        .admin-empty h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--admin-white);
            margin-bottom: 0.5rem;
        }

        .admin-empty p {
            color: var(--admin-white-dim);
        }

        .admin-card {
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .admin-card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--admin-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        .admin-card-title {
            font-family: var(--font-display);
            color: var(--admin-white);
            font-size: 1rem;
            letter-spacing: 0.03em;
        }

        .admin-card-meta {
            color: var(--admin-white-dim);
            font-size: 0.85rem;
        }

        .admin-card-body {
            padding: 1.25rem;
            color: var(--admin-white-dim);
            line-height: 1.7;
        }

        .admin-card-footer {
            padding: 0.75rem 1.25rem;
            border-top: 1px solid var(--admin-border);
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .admin-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--admin-white-dim);
        }

        .admin-status.active,
        .admin-status.sponsorship-active {
            background: rgba(127, 214, 127, 0.12);
            color: var(--admin-success);
        }

        .admin-status.frozen,
        .admin-status.sponsorship-expired,
        .admin-status.sponsorship-pending {
            background: rgba(255, 127, 127, 0.12);
            color: var(--admin-danger);
        }

        .admin-status.account-active {
            background: rgba(127, 214, 127, 0.12);
            color: var(--admin-success);
        }

        .admin-status.account-disabled,
        .admin-status.account-pending {
            background: rgba(255, 127, 127, 0.12);
            color: var(--admin-danger);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .admin-table th,
        .admin-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--admin-border);
            vertical-align: top;
        }

        .admin-table th {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
            font-weight: 400;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table td {
            color: var(--admin-white-dim);
        }

        .admin-table a {
            color: var(--admin-white);
            text-decoration: none;
        }

        .admin-table a:hover {
            color: var(--admin-primary);
        }

        .admin-login {
            max-width: 420px;
            margin: 4rem auto;
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .admin-login h2 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            color: var(--admin-white);
            margin-bottom: 0.75rem;
        }

        .admin-login p {
            color: var(--admin-white-dim);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        .admin-login-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
        }

        .admin-login-form label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
        }

        .admin-login-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .admin-login-form input:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .admin-login-form .admin-btn {
            align-self: flex-start;
        }

        .admin-login-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .admin-login-message.success {
            color: var(--admin-success);
        }

        .admin-login-message.error {
            color: var(--admin-danger);
        }

        .admin-error {
            max-width: var(--container-max);
            margin: 2rem auto 0;
            padding: 0 clamp(1rem, 5vw, 3rem);
            color: var(--admin-danger);
            background: rgba(255, 127, 127, 0.08);
            border: 1px solid rgba(255, 127, 127, 0.25);
            border-radius: 8px;
            padding: 1rem;
        }

        .admin-search {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .admin-search:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .admin-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .admin-select:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .admin-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
        }

        .admin-message.success {
            color: var(--admin-success);
        }

        .admin-message.error {
            color: var(--admin-danger);
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }

        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .admin-form-group label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
        }

        .admin-form-group input,
        .admin-form-group select,
        .admin-form-group textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .admin-form-group input:focus,
        .admin-form-group select:focus,
        .admin-form-group textarea:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .admin-form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .admin-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 1rem;
        }

        .admin-modal-overlay.open {
            display: flex;
        }

        .admin-modal {
            background: var(--admin-void-raised);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .admin-modal-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--admin-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-modal-title {
            font-family: var(--font-display);
            color: var(--admin-white);
            font-size: 1.1rem;
        }

        .admin-modal-close {
            background: transparent;
            border: none;
            color: var(--admin-white-dim);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .admin-modal-close:hover {
            color: var(--admin-danger);
        }

        .admin-modal-body {
            padding: 1.25rem;
        }

        .admin-modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--admin-border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .allowlist-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .allowlist-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(212, 175, 55, 0.12);
            color: var(--admin-primary);
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            font-size: 0.8rem;
        }

        .allowlist-tag button {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .pagination button {
            min-width: 2rem;
            padding: 0.4rem 0.65rem;
        }

        .app-count-badge {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--admin-primary);
            border: 1px solid rgba(212, 175, 55, 0.35);
        }

        .app-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .app-pill {
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            border: 1px solid var(--admin-border);
            background: transparent;
            color: var(--admin-white-dim);
            font-family: var(--font-display);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .app-pill:hover {
            color: var(--admin-white);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .app-pill:focus-visible {
            outline: 2px solid var(--admin-primary);
            outline-offset: 2px;
        }

        .app-pill.active {
            background: var(--admin-primary);
            border-color: var(--admin-primary);
            color: #000;
        }

        .admin-status.app-pending {
            background: rgba(240, 216, 120, 0.12);
            color: var(--admin-warn);
        }

        .admin-status.app-approved {
            background: rgba(127, 214, 127, 0.12);
            color: var(--admin-success);
        }

        .admin-status.app-rejected {
            background: rgba(255, 127, 127, 0.12);
            color: var(--admin-danger);
        }

        .app-fields {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .app-field-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
            margin-bottom: 0.3rem;
        }

        .app-field-value {
            color: var(--admin-white);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .app-field-value a {
            color: var(--admin-primary);
            text-decoration: none;
        }

        .app-field-value a:hover {
            text-decoration: underline;
        }

        .app-expand-btn {
            margin-top: 0.4rem;
            background: transparent;
            border: 1px solid var(--admin-border);
            color: var(--admin-white-dim);
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .app-expand-btn:hover {
            color: var(--admin-primary);
            border-color: var(--admin-primary);
        }

        .app-comment-input {
            flex: 1 1 220px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            color: var(--admin-white);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .app-comment-input:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .app-card-status {
            padding: 0 1.25rem;
            font-size: 0.85rem;
        }

        .app-card-status.processing {
            color: var(--admin-warn);
            padding-bottom: 1rem;
        }

        .app-card-status.error {
            color: var(--admin-danger);
            padding-bottom: 1rem;
        }

        .credential-reveal {
            margin: 0 1.25rem 1.25rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .credential-warning {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--admin-warn);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .credential-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .credential-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--admin-primary-dim);
            min-width: 150px;
        }

        .credential-value {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--admin-white);
            word-break: break-all;
            flex: 1;
        }

        .credential-note {
            color: var(--admin-white-dim);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 640px) {
            .admin-card-header {
                grid-template-columns: 1fr;
            }

            .admin-toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .global-strip-inner {
                flex-direction: column;
                gap: 0.5rem;
            }

            .admin-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>

        <div class="global-strip-inner">
            <a href="/" class="global-brand"><img src="/assets/brand/01-logos/punicodex-wordmark-gold-solid.png" alt="PuniCodex" width="130" height="14"></a>

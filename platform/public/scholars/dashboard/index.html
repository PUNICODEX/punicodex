    <style>
        :root {
            --dash-primary: #D4AF37;
            --dash-primary-dim: #8B7355;
            --dash-primary-bright: #F0D878;
            --dash-void: #0A0A0A;
            --dash-void-raised: #111111;
            --dash-white: #F5F5F5;
            --dash-white-dim: #A0A0A0;
            --dash-border: rgba(255, 255, 255, 0.08);
            --dash-success: #7fd67f;
            --dash-danger: #ff7f7f;
        }

        body {
            background: var(--dash-void);
            color: var(--dash-white);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .global-strip {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--dash-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .global-strip-inner {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0.75rem clamp(1rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .global-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--dash-white);
            text-decoration: none;
        }

        .global-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .global-links a {
            color: var(--dash-white-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .global-links a:hover {
            color: var(--dash-primary);
        }

        .dash-hero {
            padding: 4rem 0 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--dash-border);
        }

        .dash-eyebrow {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--dash-primary);
            margin-bottom: 1rem;
        }

        .dash-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--dash-white);
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
        }

        .dash-subtitle {
            color: var(--dash-white-dim);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .dash-subtitle strong {
            color: var(--dash-white);
            font-weight: 600;
        }

        .dash-role-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--dash-primary);
            margin-left: 0.35rem;
            vertical-align: middle;
        }

        .dash-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2.5rem clamp(1rem, 5vw, 3rem) 5rem;
        }

        .dash-nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--dash-border);
        }

        .dash-nav a {
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            border: 1px solid transparent;
            color: var(--dash-white-dim);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .dash-nav a:hover {
            color: var(--dash-primary);
        }

        .dash-nav a:focus-visible {
            outline: 2px solid var(--dash-primary);
            outline-offset: 2px;
        }

        .dash-nav a.active {
            color: var(--dash-primary);
            border-color: rgba(212, 175, 55, 0.35);
            background: rgba(212, 175, 55, 0.08);
        }

        .dash-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .dash-stat {
            background: var(--dash-void-raised);
            border: 1px solid var(--dash-border);
            border-radius: 12px;
            padding: 1.25rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .dash-stat::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--dash-primary), transparent);
        }

        .dash-stat-label {
            font-family: var(--font-display);
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dash-primary-dim);
            margin-bottom: 0.4rem;
        }

        .dash-stat-value {
            font-family: var(--font-display);
            font-size: 1.75rem;
            color: var(--dash-primary);
            letter-spacing: 0.03em;
        }

        .dash-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .dash-pill {
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            border: 1px solid var(--dash-border);
            background: transparent;
            color: var(--dash-white-dim);
            font-family: var(--font-display);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dash-pill:hover {
            color: var(--dash-white);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .dash-pill:focus-visible {
            outline: 2px solid var(--dash-primary);
            outline-offset: 2px;
        }

        .dash-pill.active {
            background: var(--dash-primary);
            border-color: var(--dash-primary);
            color: #000;
        }

        .dash-card {
            background: var(--dash-void-raised);
            border: 1px solid var(--dash-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .dash-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--dash-primary), transparent);
        }

        .dash-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .dash-card-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 0.03em;
            color: var(--dash-white);
        }

        .dash-card-title a {
            color: var(--dash-white);
            text-decoration: none;
        }

        .dash-card-title a:hover {
            color: var(--dash-primary);
        }

        .dash-card-section {
            color: var(--dash-white-dim);
            font-size: 0.88rem;
            margin-top: 0.25rem;
        }

        .dash-status {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            white-space: nowrap;
        }

        .dash-status.pending {
            background: rgba(212, 175, 55, 0.12);
            color: var(--dash-primary);
        }

        .dash-status.approved {
            background: rgba(127, 214, 127, 0.12);
            color: var(--dash-success);
        }

        .dash-status.rejected {
            background: rgba(255, 127, 127, 0.12);
            color: var(--dash-danger);
        }

        .dash-status.needs_revision {
            background: rgba(240, 216, 120, 0.12);
            color: var(--dash-primary-bright);
        }

        .dash-status.withdrawn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--dash-white-dim);
        }

        .dash-card-excerpt {
            color: var(--dash-white-dim);
            line-height: 1.7;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        .dash-comment {
            margin-top: 1rem;
            background: rgba(240, 216, 120, 0.05);
            border: 1px solid rgba(240, 216, 120, 0.18);
            border-radius: 8px;
            padding: 0.85rem 1rem;
        }

        .dash-comment-label {
            font-family: var(--font-display);
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dash-primary-bright);
            margin-bottom: 0.35rem;
        }

        .dash-comment p {
            color: var(--dash-white-dim);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }

        .dash-card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1.25rem;
            flex-wrap: wrap;
        }

        .dash-date {
            color: var(--dash-white-dim);
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }

        .dash-withdraw {
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            background: rgba(255, 127, 127, 0.12);
            color: var(--dash-danger);
            border: 1px solid rgba(255, 127, 127, 0.35);
            transition: all 0.2s;
        }

        .dash-withdraw:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .dash-withdraw:focus-visible {
            outline: 2px solid var(--dash-danger);
            outline-offset: 2px;
        }

        .dash-withdraw:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .dash-card-message {
            font-size: 0.85rem;
            line-height: 1.5;
            margin-top: 0.75rem;
        }

        .dash-card-message:empty {
            margin-top: 0;
        }

        .dash-card-message.error {
            color: var(--dash-danger);
        }

        .dash-skeleton {
            background: var(--dash-void-raised);
            border: 1px solid var(--dash-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .skel-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
            animation: dash-shimmer 1.4s infinite;
            margin-bottom: 0.75rem;
        }

        .skel-line:last-child {
            margin-bottom: 0;
        }

        @keyframes dash-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skel-line {
                animation: none;
            }
        }

        .dash-empty {
            text-align: center;
            padding: 4rem 1rem;
            border: 1px dashed var(--dash-border);
            border-radius: 12px;
        }

        .dash-empty h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--dash-white);
            margin-bottom: 0.5rem;
        }

        .dash-empty p {
            color: var(--dash-white-dim);
            margin-bottom: 1.25rem;
            line-height: 1.7;
        }

        .dash-cta {
            display: inline-block;
            padding: 0.65rem 1.25rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: var(--dash-primary);
            color: #000;
            text-decoration: none;
            border: 1px solid var(--dash-primary);
            transition: all 0.2s;
        }

        .dash-cta:hover {
            background: var(--dash-primary-bright);
            border-color: var(--dash-primary-bright);
        }

        .dash-cta:focus-visible {
            outline: 2px solid var(--dash-primary-bright);
            outline-offset: 2px;
        }

        .dash-error {
            text-align: center;
            padding: 3rem 1rem;
            border: 1px solid rgba(255, 127, 127, 0.25);
            background: rgba(255, 127, 127, 0.06);
            border-radius: 12px;
            color: var(--dash-danger);
        }

        .dash-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--dash-border);
            background: transparent;
            color: var(--dash-white);
            transition: all 0.2s;
        }

        .dash-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .dash-btn:focus-visible {
            outline: 2px solid var(--dash-primary);
            outline-offset: 2px;
        }

        .dash-error .dash-btn {
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .global-strip-inner {
                flex-direction: column;
                gap: 0.5rem;
            }

            .global-links {
                gap: 0.75rem;
            }

            .dash-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .dash-card-head {
                flex-direction: column;
            }
        }
    </style>

    <header class="dash-hero">

        <p class="dash-subtitle" id="dash-subtitle">Your scholarly contributions, from first draft to final decision.</p>

    <main class="dash-container">
        <nav class="dash-nav" aria-label="Scholars portal">
            <a href="/scholars/dashboard/" class="active" aria-current="page">My Submissions</a>

        <section class="dash-stats" aria-label="Submission statistics">
            <div class="dash-stat">
                <div class="dash-stat-label">Submitted</div>
                <div class="dash-stat-value" id="stat-total">—</div>
            </div>
            <div class="dash-stat">
                <div class="dash-stat-label">Pending</div>
                <div class="dash-stat-value" id="stat-pending">—</div>
            </div>
            <div class="dash-stat">
                <div class="dash-stat-label">Approved</div>
                <div class="dash-stat-value" id="stat-approved">—</div>
            </div>
            <div class="dash-stat">
                <div class="dash-stat-label">Needs Revision</div>
                <div class="dash-stat-value" id="stat-needs-revision">—</div>
            </div>
            <div class="dash-stat">
                <div class="dash-stat-label">Rejected</div>
                <div class="dash-stat-value" id="stat-rejected">—</div>
            </div>

                <div class="dash-stat-label">Withdrawn</div>
                <div class="dash-stat-value" id="stat-withdrawn">—</div>
            </div>

        <div class="dash-pills" role="group" aria-label="Filter submissions by status">
            <button type="button" class="dash-pill active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="dash-pill" data-filter="pending" aria-pressed="false">Pending</button>
            <button type="button" class="dash-pill" data-filter="approved" aria-pressed="false">Approved</button>
            <button type="button" class="dash-pill" data-filter="needs_revision" aria-pressed="false">Needs Revision</button>
            <button type="button" class="dash-pill" data-filter="rejected" aria-pressed="false">Rejected</button>
            <button type="button" class="dash-pill" data-filter="withdrawn" aria-pressed="false">Withdrawn</button>

        <div id="dash-list" aria-live="polite"></div>

    <script>
    (function() {
        const apiBase = '/api/v1/scholars/';
        const listEl = document.getElementById('dash-list');
        const subtitleEl = document.getElementById('dash-subtitle');

        const state = {
            user: null,
            edits: [],
            filter: 'all',
        };

        const STATUS_LABELS = {
            pending: 'Pending',
            approved: 'Approved',
            rejected: 'Rejected',
            needs_revision: 'Needs Revision',
            withdrawn: 'Withdrawn',
        };

        function getSessionId() {
            return localStorage.getItem('scholars_session');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        async function api(path, options) {
            options = options || {};
            const sessionId = getSessionId();
            const headers = {
                'Content-Type': 'application/json',
                ...(sessionId ? { 'x-scholars-session': sessionId } : {}),
                ...(options.headers || {}),
            };
            const res = await fetch(apiBase + path, {
                ...options,
                headers,
            });
            const data = await res.json().catch(function() { return { success: false, error: 'Invalid response' }; });
            return { ok: res.ok, status: res.status, data: data };
        }

        function redirectToLogin() {
            localStorage.removeItem('scholars_session');
            window.location.href = '/scholars/login/?redirect=/scholars/dashboard/';
        }

        function statusLabel(status) {
            return STATUS_LABELS[status] || status || 'Unknown';
        }

        function renderSkeleton() {
            listEl.innerHTML = [0, 1, 2].map(function() {
                return `
                    <div class="dash-skeleton" aria-hidden="true">
                        <div class="skel-line" style="width: 40%;"></div>
                        <div class="skel-line" style="width: 25%;"></div>
                        <div class="skel-line" style="width: 90%;"></div>
                        <div class="skel-line" style="width: 70%;"></div>
                    </div>
                `;
            }).join('');
        }

        function excerpt(body) {
            const text = String(body || '').replace(/\s+/g, ' ').trim();
            if (!text) return '';
            return text.length > 200 ? text.slice(0, 200).trimEnd() + '…' : text;
        }

        function renderStats() {
            const counts = { pending: 0, approved: 0, rejected: 0, needs_revision: 0, withdrawn: 0 };
            state.edits.forEach(function(edit) {
                if (Object.prototype.hasOwnProperty.call(counts, edit.status)) {
                    counts[edit.status] += 1;
                }
            });
            document.getElementById('stat-total').textContent = state.edits.length;
            document.getElementById('stat-pending').textContent = counts.pending;
            document.getElementById('stat-approved').textContent = counts.approved;
            document.getElementById('stat-needs-revision').textContent = counts.needs_revision;
            document.getElementById('stat-rejected').textContent = counts.rejected;
            document.getElementById('stat-withdrawn').textContent = counts.withdrawn;
        }

        function cardHtml(edit) {
            const entryId = edit.entry_id || '';
            const templeName = edit.temple_name || entryId || 'Unknown temple';
            const section = edit.section_label || edit.section_key || '—';
            const bodyExcerpt = excerpt(edit.proposed_body);
            const comment = String(edit.comment || '').trim();
            const canWithdraw = edit.status === 'pending' || edit.status === 'needs_revision';
            const status = edit.status || 'pending';

            return `
                <article class="dash-card" data-edit-id="${escapeHtml(String(edit.id))}">
                    <div class="dash-card-head">
                        <div class="dash-card-heading">
                            <h3 class="dash-card-title">${entryId
                                ? `<a href="/sites/${escapeHtml(entryId)}/scholars/">${escapeHtml(templeName)}</a>`
                                : escapeHtml(templeName)}</h3>
                            <div class="dash-card-section">${escapeHtml(section)}</div>
                        </div>
                        <span class="dash-status ${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</span>
                    </div>
                    ${bodyExcerpt ? `<p class="dash-card-excerpt">${escapeHtml(bodyExcerpt)}</p>` : ''}
                    ${comment ? `
                        <div class="dash-comment">
                            <div class="dash-comment-label">Reviewer Comment</div>
                            <p>${escapeHtml(comment)}</p>
                        </div>` : ''}
                    <div class="dash-card-foot">
                        <span class="dash-date">Submitted ${escapeHtml(formatDate(edit.created_at))}</span>
                        ${canWithdraw ? `<button type="button" class="dash-withdraw" data-id="${escapeHtml(String(edit.id))}">Withdraw</button>` : ''}
                    </div>
                    <div class="dash-card-message" aria-live="polite"></div>
                </article>
            `;
        }

        function renderList() {
            if (state.edits.length === 0) {
                listEl.innerHTML = `
                    <div class="dash-empty">
                        <h2>No submissions yet</h2>
                        <p>Every temple in the pantheon awaits its scholar. Choose an entry and propose your first edit.</p>
                        <a class="dash-cta" href="/pantheon/">Browse the Pantheon</a>
                    </div>
                `;
                return;
            }

            const filtered = state.filter === 'all'
                ? state.edits
                : state.edits.filter(function(edit) { return edit.status === state.filter; });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="dash-empty">
                        <h2>Nothing here</h2>
                        <p>You have no ${escapeHtml(statusLabel(state.filter).toLowerCase())} submissions.</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filtered.map(cardHtml).join('');
        }

        async function loadEdits() {
            renderSkeleton();

            const { ok, status, data } = await api('/edits/mine');

            if (status === 401) {
                redirectToLogin();
                return;
            }

            if (!ok) {
                listEl.innerHTML = `
                    <div class="dash-error" role="alert">
                        <p>${escapeHtml((data && data.error) || 'Failed to load your submissions.')}</p>
                        <button type="button" class="dash-btn" id="dash-retry">Retry</button>
                    </div>
                `;
                document.getElementById('dash-retry').addEventListener('click', loadEdits);
                return;
            }

            state.edits = Array.isArray(data && data.data) ? data.data : [];
            renderStats();
            renderList();
        }

        document.querySelectorAll('.dash-pill').forEach(function(pill) {
            pill.addEventListener('click', function() {
                if (state.filter === pill.dataset.filter) return;
                state.filter = pill.dataset.filter;
                document.querySelectorAll('.dash-pill').forEach(function(p) {
                    const isActive = p === pill;
                    p.classList.toggle('active', isActive);
                    p.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                });
                renderList();
            });
        });

        listEl.addEventListener('click', async function(e) {
            const btn = e.target.closest('.dash-withdraw');
            if (!btn) return;

            const card = btn.closest('.dash-card');
            const msgEl = card ? card.querySelector('.dash-card-message') : null;
            const edit = state.edits.find(function(x) { return String(x.id) === String(btn.dataset.id); });
            if (!edit) return;

            if (!confirm('Withdraw this submission? Reviewers will no longer consider it.')) return;

            btn.disabled = true;
            btn.textContent = 'Withdrawing…';
            if (msgEl) {
                msgEl.textContent = '';
                msgEl.className = 'dash-card-message';
            }

            const { ok, status, data } = await api('/edits/' + encodeURIComponent(edit.id) + '/withdraw', { method: 'POST' });

            if (status === 401) {
                redirectToLogin();
                return;
            }

            if (ok && data && data.data && data.data.withdrawn) {
                edit.status = 'withdrawn';
                edit.updated_at = new Date().toISOString();
                renderStats();
                renderList();
                return;
            }

            btn.disabled = false;
            btn.textContent = 'Withdraw';
            if (msgEl) {
                msgEl.textContent = (data && data.error) || 'Withdrawal failed. Please try again.';
                msgEl.className = 'dash-card-message error';
            }
        });

        async function init() {
            renderSkeleton();

            const { ok, data } = await api('/auth/session');
            const user = data && data.data ? data.data.user : null;

            if (!ok || !user) {
                redirectToLogin();
                return;
            }

            state.user = user;
            const display = user.display_name || user.email || 'Scholar';
            subtitleEl.innerHTML = 'Signed in as <strong>' + escapeHtml(display) + '</strong>'
                + '<span class="dash-role-badge">' + escapeHtml(user.role || 'student') + '</span>';

            await loadEdits();
        }

        init();
    })();
    </script>

<div id="university-collaborators-strip" role="complementary" aria-label="Academic Collaborators"></div>

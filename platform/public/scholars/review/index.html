<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarly Edition — Review Queue | PUNYCODEX</title>
    <meta name="description" content="Reviewer dashboard for the PÚNYCODEX Scholarly Edition. Review, approve, reject, or request revisions for pending scholarly edits.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Lato:wght@300;400;700&family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/temple-base.css?v=perf7">

    <style>
        :root {
            --review-primary: #D4AF37;
            --review-primary-dim: #8B7355;
            --review-void: #0A0A0A;
            --review-void-raised: #111111;
            --review-white: #F5F5F5;
            --review-white-dim: #A0A0A0;
            --review-white-faint: rgba(255, 255, 255, 0.06);
            --review-success: #7fd67f;
            --review-danger: #ff7f7f;
            --review-warn: #f0d878;
            --review-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--review-void);
            color: var(--review-white);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .global-strip {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--review-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .global-strip-inner {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0.75rem clamp(1rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .global-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--review-white);
            text-decoration: none;
        }

        .global-brand span {
            color: var(--review-primary);
        }

        .global-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .global-links a {
            color: var(--review-white-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .global-links a:hover {
            color: var(--review-primary);
        }

        .review-hero {
            padding: 4rem 0 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--review-border);
        }

        .review-eyebrow {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--review-primary);
            margin-bottom: 1rem;
        }

        .review-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--review-white);
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
        }

        .review-subtitle {
            color: var(--review-white-dim);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .review-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2.5rem clamp(1rem, 5vw, 3rem) 5rem;
        }

        .review-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .review-count {
            color: var(--review-white-dim);
            font-size: 0.95rem;
        }

        .review-count strong {
            color: var(--review-primary);
        }

        .review-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .review-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--review-border);
            background: transparent;
            color: var(--review-white);
            transition: all 0.2s;
        }

        .review-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .review-btn.primary {
            background: var(--review-primary);
            color: #000;
            border-color: var(--review-primary);
        }

        .review-btn.primary:hover {
            background: var(--review-warn);
            border-color: var(--review-warn);
        }

        .review-empty {
            text-align: center;
            padding: 4rem 1rem;
            border: 1px dashed var(--review-border);
            border-radius: 12px;
        }

        .review-empty h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--review-white);
            margin-bottom: 0.5rem;
        }

        .review-empty p {
            color: var(--review-white-dim);
        }

        .review-card {
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .review-card-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--review-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: start;
        }

        .review-card-meta {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .review-card-author {
            font-family: var(--font-display);
            color: var(--review-primary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .review-card-target {
            color: var(--review-white);
            font-size: 1.05rem;
        }

        .review-card-target a {
            color: var(--review-white);
            text-decoration: none;
        }

        .review-card-target a:hover {
            color: var(--review-primary);
        }

        .review-card-section {
            color: var(--review-white-dim);
            font-size: 0.9rem;
        }

        .review-card-date {
            color: var(--review-white-dim);
            font-size: 0.8rem;
            white-space: nowrap;
            font-family: var(--font-mono);
        }

        .review-card-body {
            padding: 1.5rem;
        }

        .review-card-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--review-primary-dim);
            margin-bottom: 0.5rem;
        }

        .review-proposed-body {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--review-border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--review-white);
            line-height: 1.8;
            font-size: 0.98rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .review-proposed-body p {
            margin-bottom: 0.75rem;
        }

        .review-proposed-body p:last-child {
            margin-bottom: 0;
        }

        .review-sources {
            margin-top: 1.25rem;
        }

        .review-sources ol {
            padding-left: 1.25rem;
            color: var(--review-white-dim);
        }

        .review-sources li {
            margin-bottom: 0.35rem;
        }

        .review-card-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--review-border);
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .review-card-footer .review-comment {
            flex: 1 1 100%;
            margin-bottom: 0.5rem;
        }

        .review-comment input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--review-border);
            border-radius: 6px;
            padding: 0.6rem 0.75rem;
            color: var(--review-white);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .review-comment input:focus {
            outline: none;
            border-color: var(--review-primary);
        }

        .review-decision-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--review-border);
            transition: all 0.2s;
        }

        .review-decision-btn.approve {
            background: rgba(127, 214, 127, 0.12);
            color: var(--review-success);
            border-color: rgba(127, 214, 127, 0.35);
        }

        .review-decision-btn.approve:hover {
            background: rgba(127, 214, 127, 0.22);
        }

        .review-decision-btn.revision {
            background: rgba(240, 216, 120, 0.12);
            color: var(--review-warn);
            border-color: rgba(240, 216, 120, 0.35);
        }

        .review-decision-btn.revision:hover {
            background: rgba(240, 216, 120, 0.22);
        }

        .review-decision-btn.reject {
            background: rgba(255, 127, 127, 0.12);
            color: var(--review-danger);
            border-color: rgba(255, 127, 127, 0.35);
        }

        .review-decision-btn.reject:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .review-decision-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .review-status {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--review-white-dim);
        }

        .review-status.processing {
            color: var(--review-warn);
        }

        .review-status.done {
            color: var(--review-success);
        }

        .review-status.error {
            color: var(--review-danger);
        }

        .review-login {
            max-width: 420px;
            margin: 4rem auto;
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .review-login h2 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            color: var(--review-white);
            margin-bottom: 0.75rem;
        }

        .review-login p {
            color: var(--review-white-dim);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        .review-login .review-btn {
            display: inline-block;
        }

        .review-login-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
        }

        .review-login-form label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--review-primary-dim);
        }

        .review-login-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--review-border);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
            color: var(--review-white);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .review-login-form input:focus {
            outline: none;
            border-color: var(--review-primary);
        }

        .review-login-form .review-btn {
            align-self: flex-start;
        }

        .review-login-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .review-login-message.success {
            color: var(--review-success);
        }

        .review-login-message.error {
            color: var(--review-danger);
        }

        .review-error {
            max-width: var(--container-max);
            margin: 2rem auto 0;
            padding: 0 clamp(1rem, 5vw, 3rem);
            color: var(--review-danger);
            background: rgba(255, 127, 127, 0.08);
            border: 1px solid rgba(255, 127, 127, 0.25);
            border-radius: 8px;
            padding: 1rem;
        }

        .review-role-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--review-primary);
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .notifications-wrap {
            position: relative;
        }

        .notifications-bell {
            background: transparent;
            border: 1px solid var(--review-border);
            border-radius: 6px;
            color: var(--review-white);
            padding: 0.45rem 0.65rem;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            position: relative;
        }

        .notifications-bell:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .notifications-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--review-danger);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 2px var(--review-void);
        }

        .notifications-panel {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            width: min(360px, calc(100vw - 2rem));
            max-height: 420px;
            overflow-y: auto;
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: none;
        }

        .notifications-panel.open {
            display: block;
        }

        .notifications-header {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--review-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notifications-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--review-primary);
        }

        .notifications-empty {
            padding: 1.5rem 1rem;
            text-align: center;
            color: var(--review-white-dim);
            font-size: 0.9rem;
        }

        .notifications-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .notification-item {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--review-border);
            display: grid;
            gap: 0.35rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .notification-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .notification-item.unread {
            background: rgba(212, 175, 55, 0.06);
        }

        .notification-title {
            font-size: 0.9rem;
            color: var(--review-white);
            line-height: 1.35;
        }

        .notification-body {
            font-size: 0.8rem;
            color: var(--review-white-dim);
            line-height: 1.4;
        }

        .notification-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.15rem;
        }

        .notification-time {
            font-size: 0.7rem;
            color: var(--review-white-dim);
            font-family: var(--font-mono);
        }

        .notification-dismiss {
            background: transparent;
            border: none;
            color: var(--review-white-dim);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0.15rem 0.35rem;
        }

        .notification-dismiss:hover {
            color: var(--review-danger);
        }

        @media (max-width: 640px) {
            .review-card-header {
                grid-template-columns: 1fr;
            }

            .review-card-date {
                white-space: normal;
            }

            .review-toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .global-strip-inner {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="global-strip">
        <div class="global-strip-inner">
            <a href="/" class="global-brand">P<span>U</span>NYCODEX</a>
            <div class="global-links">
                <a href="/pantheon/">Pantheon</a>
                <a href="/lexicon/">Lexicon</a>
                <a href="/type/">Type</a>
                <a href="/search.html">Search</a>
                <a href="/tiers/">Tiers</a>
                <a href="/about/">About</a>
            </div>
        </div>
    </div>

    <header class="review-hero">
        <div class="review-eyebrow">PUNYCODEX Scholarly Edition</div>
        <h1 class="review-title">Reviewer Queue</h1>
        <p class="review-subtitle">Evaluate pending scholarly contributions. Every approved edit is attributed, versioned, and preserved in the immutable history.</p>
    </header>

    <main class="review-container" id="app">
        <noscript>
            <div class="review-error">This reviewer dashboard requires JavaScript to communicate with the Scholarly Edition API.</div>
        </noscript>
    </main>

    <script>
    (function() {
        const apiBase = '/api/v1/scholars';
        const container = document.getElementById('app');
        const sessionId = localStorage.getItem('scholars_session');

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function api(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(sessionId ? { 'x-scholars-session': sessionId } : {}),
                ...(options.headers || {}),
            };
            const res = await fetch(apiBase + path, {
                ...options,
                headers,
            });
            const data = await res.json().catch(() => ({ success: false, error: 'Invalid response' }));
            return { ok: res.ok, status: res.status, data };
        }

        function renderLoginPrompt() {
            container.innerHTML = `
                <div class="review-login">
                    <h2>Reviewer Access Required</h2>
                    <p>This dashboard loads pending edits from the Scholarly Edition API. Sign in with a verified reviewer email to review scholarly edits.</p>
                    <form class="review-login-form" id="magic-link-form">
                        <label for="reviewer-email">Reviewer email</label>
                        <input type="email" id="reviewer-email" placeholder="you@university.edu" required>
                        <button type="submit" class="review-btn primary">Send Magic Link</button>
                    </form>
                    <div class="review-login-divider" style="margin: 1.25rem 0; border-top: 1px solid var(--review-border);"></div>
                    <form class="review-login-form" id="session-form">
                        <label for="session-id">Or paste session ID</label>
                        <input type="text" id="session-id" placeholder="scholars_session token" required>
                        <button type="submit" class="review-btn">Load Dashboard</button>
                    </form>
                    <div class="review-login-message" id="login-message"></div>
                </div>
            `;

            const form = document.getElementById('magic-link-form');
            const sessionForm = document.getElementById('session-form');
            const message = document.getElementById('login-message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('reviewer-email').value.trim();
                message.className = 'review-login-message';
                message.textContent = 'Sending…';
                const { ok, data } = await api('/auth/magic-link', {
                    method: 'POST',
                    body: JSON.stringify({ email }),
                });
                if (ok) {
                    message.className = 'review-login-message success';
                    message.innerHTML = 'Magic link generated. In development, the verification URL is logged to the server console; paste it into the browser to set <code>scholars_session</code> in localStorage.';
                } else {
                    message.className = 'review-login-message error';
                    message.textContent = data?.error || 'Failed to request magic link.';
                }
            });

            sessionForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const sessionId = document.getElementById('session-id').value.trim();
                if (sessionId) {
                    localStorage.setItem('scholars_session', sessionId);
                    window.location.reload();
                }
            });
        }

        function renderError(message) {
            container.innerHTML = `<div class="review-error">${escapeHtml(message)}</div>` + container.innerHTML;
        }

        function renderBody(body) {
            if (!body) return '<p><em>No proposed body.</em></p>';
            return escapeHtml(body)
                .split(/\n\n+/)
                .map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderSources(sources) {
            if (!sources || sources.length === 0) return '';
            const items = sources.map((s) => {
                const text = typeof s === 'string' ? s : (s.citation || s.name || JSON.stringify(s));
                return `<li>${escapeHtml(text)}</li>`;
            }).join('');
            return `
                <div class="review-sources">
                    <div class="review-card-label">Proposed Sources</div>
                    <ol>${items}</ol>
                </div>
            `;
        }

        function createCard(edit) {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.dataset.editId = edit.id;
            card.innerHTML = `
                <div class="review-card-header">
                    <div class="review-card-meta">
                        <div class="review-card-author">${escapeHtml(edit.email || 'Unknown author')}</div>
                        <div class="review-card-target">
                            <a href="/sites/${escapeHtml(edit.entry_id)}/scholars/" target="_blank">${escapeHtml(edit.entry_id)}</a>
                        </div>
                        <div class="review-card-section">${escapeHtml(edit.section_label || edit.section_key || 'unknown section')} <span class="review-role-badge">${escapeHtml(edit.section_key || '')}</span></div>
                    </div>
                    <div class="review-card-date">${formatDate(edit.created_at)}</div>
                </div>
                <div class="review-card-body">
                    <div class="review-card-label">Proposed Body</div>
                    <div class="review-proposed-body">${renderBody(edit.proposed_body)}</div>
                    ${renderSources(edit.proposed_sources)}
                </div>
                <div class="review-card-footer">
                    <div class="review-comment">
                        <input type="text" class="reviewer-comment" placeholder="Optional comment for the contributor…" maxlength="500">
                    </div>
                    <button class="review-decision-btn approve" data-action="approve">Approve</button>
                    <button class="review-decision-btn revision" data-action="revision">Needs Revision</button>
                    <button class="review-decision-btn reject" data-action="reject">Reject</button>
                    <span class="review-status"></span>
                </div>
            `;

            const buttons = card.querySelectorAll('.review-decision-btn');
            const status = card.querySelector('.review-status');
            const commentInput = card.querySelector('.reviewer-comment');

            buttons.forEach((btn) => {
                btn.addEventListener('click', async () => {
                    const action = btn.dataset.action;
                    const comment = commentInput.value.trim();
                    const endpoint = action === 'revision' ? `/edits/${edit.id}/reject` : `/edits/${edit.id}/${action}`;
                    const payload = action === 'revision' ? JSON.stringify({ comment, status: 'needs_revision' }) : JSON.stringify({ comment });

                    buttons.forEach((b) => { b.disabled = true; });
                    status.textContent = 'Processing…';
                    status.className = 'review-status processing';

                    const { ok, data } = await api(endpoint, { method: 'POST', body: payload });

                    if (ok) {
                        status.textContent = action === 'revision' ? 'Revision requested.' : `${action.charAt(0).toUpperCase() + action.slice(1)}ed.`;
                        status.className = 'review-status done';
                        card.style.opacity = '0.6';
                        setTimeout(() => {
                            card.remove();
                            updateCount();
                        }, 900);
                    } else {
                        status.textContent = data?.error || 'Action failed.';
                        status.className = 'review-status error';
                        buttons.forEach((b) => { b.disabled = false; });
                    }
                });
            });

            return card;
        }

        function updateCount() {
            const count = container.querySelectorAll('.review-card').length;
            const counter = document.getElementById('pending-count');
            if (counter) counter.textContent = count;
            if (count === 0 && !container.querySelector('.review-empty')) {
                container.innerHTML = `
                    <div class="review-empty">
                        <h2>Queue Clear</h2>
                        <p>There are no pending scholarly edits awaiting review.</p>
                    </div>
                `;
            }
        }

        async function loadNotifications() {
            const { ok, data } = await api('/notifications?limit=20');
            if (!ok) return;
            renderNotifications(data?.data?.notifications || [], data?.data?.unreadCount || 0);
        }

        function renderNotifications(notifications, unreadCount) {
            const badge = document.getElementById('notifications-badge');
            const content = document.getElementById('notifications-content');
            if (!badge || !content) return;

            badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            badge.style.display = unreadCount > 0 ? 'flex' : 'none';

            if (notifications.length === 0) {
                content.innerHTML = '<div class="notifications-empty">No notifications yet.</div>';
                return;
            }

            const list = document.createElement('ul');
            list.className = 'notifications-list';
            for (const n of notifications) {
                const item = document.createElement('li');
                item.className = 'notification-item' + (n.is_read ? '' : ' unread');
                item.dataset.id = n.id;
                item.innerHTML = `
                    <div class="notification-title">${escapeHtml(n.title)}</div>
                    <div class="notification-body">${escapeHtml(n.body)}</div>
                    <div class="notification-meta">
                        <span class="notification-time">${formatDate(n.created_at)}</span>
                        <button class="notification-dismiss" title="Dismiss">×</button>
                    </div>
                `;
                item.addEventListener('click', async (e) => {
                    if (e.target.classList.contains('notification-dismiss')) {
                        e.stopPropagation();
                        await dismissNotification(n.id, item);
                        return;
                    }
                    if (!n.is_read) {
                        await markNotificationRead(n.id, item);
                    }
                });
                list.appendChild(item);
            }
            content.innerHTML = '';
            content.appendChild(list);
        }

        async function markNotificationRead(id, itemEl) {
            const { ok } = await api(`/notifications/${id}/read`, { method: 'POST' });
            if (ok) {
                itemEl.classList.remove('unread');
                const badge = document.getElementById('notifications-badge');
                if (badge) {
                    const current = parseInt(badge.textContent, 10) || 0;
                    badge.textContent = current > 1 ? current - 1 : 0;
                    badge.style.display = current > 1 ? 'flex' : 'none';
                }
            }
        }

        async function dismissNotification(id, itemEl) {
            const { ok } = await api(`/notifications/${id}/dismiss`, { method: 'POST' });
            if (ok) {
                const wasUnread = itemEl.classList.contains('unread');
                itemEl.remove();
                if (wasUnread) {
                    const badge = document.getElementById('notifications-badge');
                    if (badge) {
                        const current = parseInt(badge.textContent, 10) || 0;
                        badge.textContent = current > 1 ? current - 1 : 0;
                        badge.style.display = current > 1 ? 'flex' : 'none';
                    }
                }
                const content = document.getElementById('notifications-content');
                if (content && content.children.length === 0) {
                    content.innerHTML = '<div class="notifications-empty">No notifications yet.</div>';
                }
            }
        }

        async function init() {
            if (!sessionId) {
                renderLoginPrompt();
                return;
            }

            const { ok: sessionOk, data: sessionData } = await api('/auth/session');
            const user = sessionData?.data?.user;

            if (!sessionOk || !user) {
                localStorage.removeItem('scholars_session');
                renderLoginPrompt();
                return;
            }

            const isReviewer = ['reviewer', 'dept_admin', 'inst_admin', 'curator'].includes(user.role);
            if (!isReviewer) {
                renderError(`Account ${user.email} has role "${user.role}". Reviewer access is required.`);
                return;
            }

            const toolbar = document.createElement('div');
            toolbar.className = 'review-toolbar';
            toolbar.innerHTML = `
                <div class="review-count">Pending edits: <strong id="pending-count">—</strong></div>
                <div class="review-actions">
                    <span style="color: var(--review-white-dim); font-size: 0.85rem;">${escapeHtml(user.email)} <span class="review-role-badge">${escapeHtml(user.role)}</span></span>
                    <div class="notifications-wrap" id="notifications-wrap">
                        <button class="notifications-bell" id="notifications-bell" aria-label="Notifications" title="Notifications">
                            🔔
                            <span class="notifications-badge" id="notifications-badge" style="display: none;">0</span>
                        </button>
                        <div class="notifications-panel" id="notifications-panel">
                            <div class="notifications-header">
                                <span class="notifications-title">Notifications</span>
                            </div>
                            <div id="notifications-content"></div>
                        </div>
                    </div>
                    <button class="review-btn" id="refresh-queue">Refresh</button>
                    <button class="review-btn" id="logout-btn">Sign out</button>
                </div>
            `;

            const list = document.createElement('div');
            list.id = 'review-list';

            container.innerHTML = '';
            container.appendChild(toolbar);
            container.appendChild(list);

            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('scholars_session');
                window.location.reload();
            });

            document.getElementById('refresh-queue').addEventListener('click', () => {
                loadQueue();
            });

            const bell = document.getElementById('notifications-bell');
            const panel = document.getElementById('notifications-panel');
            if (bell && panel) {
                bell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    panel.classList.toggle('open');
                });
                panel.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
                document.addEventListener('click', () => {
                    panel.classList.remove('open');
                });
            }

            await loadQueue();
            await loadNotifications();
        }

        async function loadQueue() {
            const list = document.getElementById('review-list') || container;
            list.innerHTML = '<div class="review-empty"><p>Loading pending edits…</p></div>';

            const { ok, data } = await api('/edits/pending');

            if (!ok) {
                list.innerHTML = '';
                renderError(data?.error || `Failed to load queue (HTTP ${data?.code || 'unknown'}).`);
                return;
            }

            const edits = data?.data || [];
            list.innerHTML = '';

            if (edits.length === 0) {
                list.innerHTML = `
                    <div class="review-empty">
                        <h2>Queue Clear</h2>
                        <p>There are no pending scholarly edits awaiting review.</p>
                    </div>
                `;
            } else {
                for (const edit of edits) {
                    list.appendChild(createCard(edit));
                }
            }

            const counter = document.getElementById('pending-count');
            if (counter) counter.textContent = edits.length;
        }

        init();
    })();
    </script>
</body>
</html>

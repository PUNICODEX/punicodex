    <link rel="stylesheet" href="/assets/fonts/fonts.css">

    <style>
        :root {
            --review-primary: #D4AF37;
            --review-primary-dim: #8B7355;
            --review-void: #0A0A0A;
            --review-void-raised: #111111;
            --review-white: #F5F5F5;
            --review-white-dim: #A0A0A0;
            --review-white-faint: rgba(255, 255, 255, 0.06);
            --review-success: #7fd67f;
            --review-danger: #ff7f7f;
            --review-warn: #f0d878;
            --review-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--review-void);
            color: var(--review-white);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .global-strip {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--review-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .global-strip-inner {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0.75rem clamp(1rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .global-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--review-white);
            text-decoration: none;
        }

        .global-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .global-links a {
            color: var(--review-white-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .global-links a:hover {
            color: var(--review-primary);
        }

        .review-hero {
            padding: 4rem 0 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--review-border);
        }

        .review-eyebrow {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--review-primary);
            margin-bottom: 1rem;
        }

        .review-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--review-white);
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
        }

        .review-subtitle {
            color: var(--review-white-dim);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .review-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2.5rem clamp(1rem, 5vw, 3rem) 5rem;
        }

        .review-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .review-count {
            color: var(--review-white-dim);
            font-size: 0.95rem;
        }

        .review-count strong {
            color: var(--review-primary);
        }

        .review-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .review-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--review-border);
            background: transparent;
            color: var(--review-white);
            transition: all 0.2s;
        }

        .review-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .review-btn.primary {
            background: var(--review-primary);
            color: #000;
            border-color: var(--review-primary);
        }

        .review-btn.primary:hover {
            background: var(--review-warn);
            border-color: var(--review-warn);
        }

        .review-btn.danger {
            background: rgba(255, 127, 127, 0.12);
            color: var(--review-danger);
            border-color: rgba(255, 127, 127, 0.35);
        }

        .review-btn.danger:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .review-btn.success {
            background: rgba(127, 214, 127, 0.12);
            color: var(--review-success);
            border-color: rgba(127, 214, 127, 0.35);
        }

        .review-btn.success:hover {
            background: rgba(127, 214, 127, 0.22);
        }

        .review-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .review-empty {
            text-align: center;
            padding: 4rem 1rem;
            border: 1px dashed var(--review-border);
            border-radius: 12px;
        }

        .review-empty h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--review-white);
            margin-bottom: 0.5rem;
        }

        .review-empty p {
            color: var(--review-white-dim);
        }

        .review-card {
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .review-card-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--review-border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: start;
        }

        .review-card-meta {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .review-card-author {
            font-family: var(--font-display);
            color: var(--review-primary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .review-card-target {
            color: var(--review-white);
            font-size: 1.05rem;
        }

        .review-card-target a {
            color: var(--review-white);
            text-decoration: none;
        }

        .review-card-target a:hover {
            color: var(--review-primary);
        }

        .review-card-section {
            color: var(--review-white-dim);
            font-size: 0.9rem;
        }

        .review-card-institution {
            color: var(--review-white-dim);
            font-size: 0.85rem;
        }

        .review-card-date {
            color: var(--review-white-dim);
            font-size: 0.8rem;
            white-space: nowrap;
            font-family: var(--font-mono);
        }

        .review-card-body {
            padding: 1.5rem;
        }

        .review-card-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--review-primary-dim);
            margin-bottom: 0.5rem;
        }

        .review-proposed-body {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--review-border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--review-white);
            line-height: 1.8;
            font-size: 0.98rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .review-proposed-body p {
            margin-bottom: 0.75rem;
        }

        .review-proposed-body p:last-child {
            margin-bottom: 0;
        }

        .review-sources {
            margin-top: 1.25rem;
        }

        .review-sources ol {
            padding-left: 1.25rem;
            color: var(--review-white-dim);
        }

        .review-sources li {
            margin-bottom: 0.35rem;
        }

        .review-card-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--review-border);
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .review-card-footer .review-comment {
            flex: 1 1 100%;
            margin-bottom: 0.5rem;
        }

        .review-comment input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--review-border);
            border-radius: 6px;
            padding: 0.6rem 0.75rem;
            color: var(--review-white);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .review-comment input:focus {
            outline: none;
            border-color: var(--review-primary);
        }

        .review-decision-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--review-border);
            transition: all 0.2s;
        }

        .review-decision-btn.approve {
            background: rgba(127, 214, 127, 0.12);
            color: var(--review-success);
            border-color: rgba(127, 214, 127, 0.35);
        }

        .review-decision-btn.approve:hover {
            background: rgba(127, 214, 127, 0.22);
        }

        .review-decision-btn.reject {
            background: rgba(255, 127, 127, 0.12);
            color: var(--review-danger);
            border-color: rgba(255, 127, 127, 0.35);
        }

        .review-decision-btn.reject:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .review-decision-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .review-status {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--review-white-dim);
        }

        .review-status.processing {
            color: var(--review-warn);
        }

        .review-status.done {
            color: var(--review-success);
        }

        .review-status.error {
            color: var(--review-danger);
        }

        .review-login {
            max-width: 420px;
            margin: 4rem auto;
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .review-login h2 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            color: var(--review-white);
            margin-bottom: 0.75rem;
        }

        .review-login p {
            color: var(--review-white-dim);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        .review-login .review-btn {
            display: inline-block;
        }

        .review-login-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;
        }

        .review-login-form label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--review-primary-dim);
        }

        .review-login-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--review-border);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
            color: var(--review-white);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .review-login-form input:focus {
            outline: none;
            border-color: var(--review-primary);
        }

        .review-login-form .review-btn {
            align-self: flex-start;
        }

        .review-login-message {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .review-login-message.success {
            color: var(--review-success);
        }

        .review-login-message.error {
            color: var(--review-danger);
        }

        .review-error {
            max-width: var(--container-max);
            margin: 2rem auto 0;
            padding: 0 clamp(1rem, 5vw, 3rem);
            color: var(--review-danger);
            background: rgba(255, 127, 127, 0.08);
            border: 1px solid rgba(255, 127, 127, 0.25);
            border-radius: 8px;
            padding: 1rem;
        }

        .review-role-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--review-primary);
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .review-filters {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .review-filter {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--review-border);
            border-radius: 6px;
            padding: 0.55rem 0.75rem;
            color: var(--review-white);
            font-family: inherit;
            font-size: 0.9rem;
            min-width: 160px;
        }

        .review-filter:focus {
            outline: none;
            border-color: var(--review-primary);
        }

        .review-diff {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--review-border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            color: var(--review-white-dim);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .review-diff-empty {
            font-style: italic;
            color: var(--review-white-dim);
        }

        .review-expand-btn {
            background: transparent;
            border: 1px solid var(--review-border);
            color: var(--review-white-dim);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .review-expand-btn:hover {
            color: var(--review-primary);
            border-color: var(--review-primary);
        }

        .notifications-wrap {
            position: relative;
        }

        .notifications-bell {
            background: transparent;
            border: 1px solid var(--review-border);
            border-radius: 6px;
            color: var(--review-white);
            padding: 0.45rem 0.65rem;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            position: relative;
        }

        .notifications-bell:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .notifications-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--review-danger);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 2px var(--review-void);
        }

        .notifications-panel {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            width: min(360px, calc(100vw - 2rem));
            max-height: 420px;
            overflow-y: auto;
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: none;
        }

        .notifications-panel.open {
            display: block;
        }

        .notifications-header {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--review-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notifications-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--review-primary);
        }

        .notifications-empty {
            padding: 1.5rem 1rem;
            text-align: center;
            color: var(--review-white-dim);
            font-size: 0.9rem;
        }

        .notifications-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .notification-item {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--review-border);
            display: grid;
            gap: 0.35rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .notification-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .notification-item.unread {
            background: rgba(212, 175, 55, 0.06);
        }

        .notification-title {
            font-size: 0.9rem;
            color: var(--review-white);
            line-height: 1.35;
        }

        .notification-body {
            font-size: 0.8rem;
            color: var(--review-white-dim);
            line-height: 1.4;
        }

        .notification-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.15rem;
        }

        .notification-time {
            font-size: 0.7rem;
            color: var(--review-white-dim);
            font-family: var(--font-mono);
        }

        .notification-dismiss {
            background: transparent;
            border: none;
            color: var(--review-white-dim);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0.15rem 0.35rem;
        }

        .notification-dismiss:hover {
            color: var(--review-danger);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .pagination button {
            min-width: 2rem;
            padding: 0.4rem 0.65rem;
        }

        .pagination-info {
            color: var(--review-white-dim);
            font-size: 0.9rem;
        }

        .media-section {
            margin-top: 3.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--review-border);
        }

        .media-section-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--review-primary);
            margin-bottom: 1.5rem;
        }

        .media-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .media-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .media-pill {
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            border: 1px solid var(--review-border);
            background: transparent;
            color: var(--review-white-dim);
            font-family: var(--font-display);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .media-pill:hover {
            color: var(--review-white);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .media-pill:focus-visible {
            outline: 2px solid var(--review-primary);
            outline-offset: 2px;
        }

        .media-pill.active {
            background: var(--review-primary);
            border-color: var(--review-primary);
            color: #000;
        }

        .media-message {
            display: none;
            margin-bottom: 1.25rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .media-message.visible {
            display: block;
        }

        .media-message.error {
            color: var(--review-danger);
            background: rgba(255, 127, 127, 0.08);
            border: 1px solid rgba(255, 127, 127, 0.25);
        }

        .media-message.success {
            color: var(--review-success);
            background: rgba(127, 214, 127, 0.08);
            border: 1px solid rgba(127, 214, 127, 0.25);
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.25rem;
        }

        .media-card {
            background: var(--review-void-raised);
            border: 1px solid var(--review-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s, transform 0.4s;
        }

        .media-card.removing {
            opacity: 0;
            transform: scale(0.97);
        }

        .media-preview {
            aspect-ratio: 4 / 3;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--review-border);
            overflow: hidden;
        }

        .media-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .media-file-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 2rem;
            color: var(--review-white-dim);
        }

        .media-file-icon span {
            font-size: 0.7rem;
            font-family: var(--font-mono);
        }

        .media-info {
            padding: 1rem 1.1rem 0;
            flex: 1;
        }

        .media-caption {
            color: var(--review-white);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        .media-meta {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-bottom: 0.5rem;
        }

        .media-meta span {
            color: var(--review-white-dim);
            font-size: 0.78rem;
        }

        .media-file {
            color: var(--review-white-dim);
            font-size: 0.75rem;
            font-family: var(--font-mono);
            word-break: break-all;
        }

        .media-date {
            color: var(--review-white-dim);
            font-size: 0.75rem;
            font-family: var(--font-mono);
            margin-top: 0.15rem;
        }

        .media-actions {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.1rem 1.1rem;
        }

        .media-actions .review-decision-btn {
            flex: 1;
        }

        .media-card-status {
            padding: 0 1.1rem;
            font-size: 0.8rem;
        }

        .media-card-status.processing {
            color: var(--review-warn);
            padding-bottom: 1rem;
        }

        .media-card-status.done {
            color: var(--review-success);
            padding-bottom: 1rem;
        }

        .media-card-status.error {
            color: var(--review-danger);
            padding-bottom: 1rem;
        }

        .media-empty {
            grid-column: 1 / -1;
        }

        .media-load-more-wrap {
            text-align: center;
            margin-top: 1.5rem;
        }

        @media (max-width: 640px) {
            .review-card-header {
                grid-template-columns: 1fr;
            }

            .review-card-date {
                white-space: normal;
            }

            .review-toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .review-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .review-filter {
                width: 100%;
            }

            .global-strip-inner {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/02-favicons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/02-favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/02-favicons/favicon-16x16.png">
    <link rel="icon" href="/assets/brand/02-favicons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/assets/brand/02-favicons/apple-touch-icon.png">
    <link rel="mask-icon" href="/assets/brand/02-favicons/mask-icon.svg" color="#D4AF37">
    <link rel="manifest" href="/assets/brand/06-code/site.webmanifest">
    <meta name="theme-color" content="#0A0A0C">
</head>
<body>
    <div class="global-strip">
        <div class="global-strip-inner">
            <a href="/" class="global-brand"><img src="/assets/brand/01-logos/punicodex-wordmark-gold-solid.png" alt="PuniCodex" width="130" height="14"></a>
            <div class="global-links">
                <a href="/pantheon/">Pantheon</a>
                <a href="/lexicon/">Lexicon</a>
                <a href="/type/">Type</a>
                <a href="/search.html">Search</a>
                <a href="/tiers/">Tiers</a>
                <a href="/about/">About</a>
            </div>
        </div>
    </div>

    <header class="review-hero">
        <div class="review-eyebrow">PUNICODEX Scholarly Edition</div>
        <h1 class="review-title">Reviewer Queue</h1>
        <p class="review-subtitle">Evaluate pending scholarly contributions. Every approved edit is attributed, versioned, and preserved in the immutable history.</p>
    </header>

    <main class="review-container" id="app">
        <noscript>
            <div class="review-error">This reviewer dashboard requires JavaScript to communicate with the Scholarly Edition API.</div>
        </noscript>
    </main>

    <script>
    (function() {
        const apiBase = '/api/v1/scholars/';
        const container = document.getElementById('app');

        function getSessionId() {
            return localStorage.getItem('scholars_session');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function api(path, options) {
            options = options || {};
            const sessionId = getSessionId();
            const headers = {
                'Content-Type': 'application/json',
                ...(sessionId ? { 'x-scholars-session': sessionId } : {}),
                ...(options.headers || {}),
            };
            const res = await fetch(apiBase + path, {
                ...options,
                headers,
            });
            const data = await res.json().catch(function() { return { success: false, error: 'Invalid response' }; });
            return { ok: res.ok, status: res.status, data: data };
        }

        function renderLoginPrompt() {
            container.innerHTML = `
                <div class="review-login">
                    <h2>Reviewer Access Required</h2>
                    <p>This dashboard is restricted to reviewers and curators. Sign in with your email and password.</p>
                    <form class="review-login-form" id="login-form">
                        <label for="reviewer-email">Email</label>
                        <input type="email" id="reviewer-email" placeholder="you@university.edu" required>
                        <label for="reviewer-password">Password</label>
                        <input type="password" id="reviewer-password" placeholder="••••••••" required>
                        <button type="submit" class="review-btn primary">Sign In</button>
                    </form>
                    <div class="review-login-message" id="login-message"></div>
                </div>
            `;

            const form = document.getElementById('login-form');
            const message = document.getElementById('login-message');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('reviewer-email').value.trim();
                const password = document.getElementById('reviewer-password').value;
                message.className = 'review-login-message';
                message.textContent = 'Signing in…';

                const { ok, data } = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email: email, password: password }),
                });

                if (ok && data && data.success && data.data && data.data.token) {
                    localStorage.setItem('scholars_session', data.data.token);
                    window.location.reload();
                } else {
                    message.className = 'review-login-message error';
                    message.textContent = (data && data.error) || 'Sign in failed.';
                }
            });
        }

        function renderError(message) {
            container.innerHTML = '<div class="review-error">' + escapeHtml(message) + '</div>' + container.innerHTML;
        }

        function renderBody(body) {
            if (!body) return '<p><em>No proposed body.</em></p>';
            return escapeHtml(body)
                .split(/\n\n+/)
                .map(function(p) { return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; })
                .join('');
        }

        function renderSources(sources) {
            if (!sources || sources.length === 0) return '';
            const items = sources.map(function(s) {
                const text = typeof s === 'string' ? s : (s.citation || s.name || JSON.stringify(s));
                return '<li>' + escapeHtml(text) + '</li>';
            }).join('');
            return `
                <div class="review-sources">
                    <div class="review-card-label">Proposed Sources</div>
                    <ol>${items}</ol>
                </div>
            `;
        }

        let institutionsMap = {};
        let currentFilters = {
            institutionId: '',
            section: '',
            status: 'pending',
        };
        let pagination = {
            limit: 20,
            offset: 0,
            total: 0,
        };

        async function loadInstitutions() {
            const { ok, data } = await api('/institutions');
            if (!ok || !data || !data.data) return;
            institutionsMap = {};
            data.data.forEach(function(i) {
                institutionsMap[i.id] = i;
            });
        }

        function getInstitutionName(id) {
            return institutionsMap[id] ? institutionsMap[id].name : (id ? 'Institution #' + id : '—');
        }

        function createCard(edit) {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.dataset.editId = edit.id;
            card.innerHTML = `
                <div class="review-card-header">
                    <div class="review-card-meta">
                        <div class="review-card-author">${escapeHtml(edit.display_name || edit.email || 'Unknown author')}</div>
                        <div class="review-card-target">
                            <a href="/sites/${escapeHtml(edit.entry_id)}/scholars/" target="_blank">${escapeHtml(edit.entry_id)}</a>
                        </div>
                        <div class="review-card-section">${escapeHtml(edit.section_label || edit.section_key || 'unknown section')} <span class="review-role-badge">${escapeHtml(edit.section_key || '')}</span></div>
                        <div class="review-card-institution">${escapeHtml(getInstitutionName(edit.institution_id))}</div>
                    </div>
                    <div class="review-card-date">${formatDate(edit.created_at)}</div>
                </div>
                <div class="review-card-body">
                    <div class="review-card-label">Proposed Body</div>
                    <div class="review-proposed-body">${renderBody(edit.proposed_body)}</div>
                    ${renderSources(edit.proposed_sources)}
                    <div class="review-diff" id="diff-${edit.id}" style="display: none;">
                        <div class="review-card-label">Proposed Content</div>
                        <div class="review-diff-empty">Loading…</div>
                    </div>
                </div>
                <div class="review-card-footer">
                    <button class="review-expand-btn" id="expand-${edit.id}">Show diff</button>
                    <div class="review-comment">
                        <input type="text" class="reviewer-comment" placeholder="Reason or comment for the contributor…" maxlength="500">
                    </div>
                    <button class="review-decision-btn approve" data-action="approve">Approve</button>
                    <button class="review-decision-btn reject" data-action="reject">Reject</button>
                    <span class="review-status"></span>
                </div>
            `;

            const buttons = card.querySelectorAll('.review-decision-btn');
            const status = card.querySelector('.review-status');
            const commentInput = card.querySelector('.reviewer-comment');
            const expandBtn = card.querySelector('.review-expand-btn');
            const diffPanel = card.querySelector('#diff-' + edit.id);

            expandBtn.addEventListener('click', async function() {
                const isHidden = diffPanel.style.display === 'none';
                if (isHidden) {
                    diffPanel.style.display = 'block';
                    expandBtn.textContent = 'Hide diff';
                    if (diffPanel.querySelector('.review-diff-empty')) {
                        await loadDiff(edit.id, diffPanel);
                    }
                } else {
                    diffPanel.style.display = 'none';
                    expandBtn.textContent = 'Show diff';
                }
            });

            buttons.forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    const action = btn.dataset.action;
                    const comment = commentInput.value.trim();

                    buttons.forEach(function(b) { b.disabled = true; });
                    status.textContent = 'Processing…';
                    status.className = 'review-status processing';

                    const { ok, data } = await api('/edits/' + edit.id + '/' + action, {
                        method: 'POST',
                        body: JSON.stringify({ comment: comment }),
                    });

                    if (ok) {
                        status.textContent = action.charAt(0).toUpperCase() + action.slice(1) + 'ed.';
                        status.className = 'review-status done';
                        card.style.opacity = '0.6';
                        setTimeout(function() {
                            card.remove();
                            updateCount();
                        }, 900);
                    } else {
                        status.textContent = (data && data.error) || 'Action failed.';
                        status.className = 'review-status error';
                        buttons.forEach(function(b) { b.disabled = false; });
                    }
                });
            });

            return card;
        }

        async function loadDiff(editId, containerEl) {
            const { ok, data } = await api('/edits/' + editId);
            if (!ok || !data || !data.data) {
                containerEl.innerHTML = '<div class="review-diff-empty">Unable to load diff.</div>';
                return;
            }
            const edit = data.data;
            const proposed = edit.proposed_body || '';
            containerEl.innerHTML = `
                <div class="review-card-label">Proposed Content</div>
                <div style="white-space: pre-wrap;">${escapeHtml(proposed)}</div>
            `;
        }

        function updateCount() {
            const count = container.querySelectorAll('.review-card').length;
            const counter = document.getElementById('pending-count');
            if (counter) counter.textContent = count;
            if (count === 0 && !container.querySelector('.review-empty')) {
                const list = document.getElementById('review-list');
                if (list) {
                    list.innerHTML = `
                        <div class="review-empty">
                            <h2>Queue Clear</h2>
                            <p>There are no pending scholarly edits awaiting review.</p>
                        </div>
                    `;
                }
            }
        }

        async function loadNotifications() {
            const { ok, data } = await api('/notifications?limit=20');
            if (!ok) return;
            renderNotifications(
                data && data.data && data.data.notifications ? data.data.notifications : [],
                data && data.data && data.data.unreadCount ? data.data.unreadCount : 0
            );
        }

        function renderNotifications(notifications, unreadCount) {
            const badge = document.getElementById('notifications-badge');
            const content = document.getElementById('notifications-content');
            if (!badge || !content) return;

            badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            badge.style.display = unreadCount > 0 ? 'flex' : 'none';

            if (notifications.length === 0) {
                content.innerHTML = '<div class="notifications-empty">No notifications yet.</div>';
                return;
            }

            const list = document.createElement('ul');
            list.className = 'notifications-list';
            for (const n of notifications) {
                const item = document.createElement('li');
                item.className = 'notification-item' + (n.is_read ? '' : ' unread');
                item.dataset.id = n.id;
                item.innerHTML = `
                    <div class="notification-title">${escapeHtml(n.title)}</div>
                    <div class="notification-body">${escapeHtml(n.body)}</div>
                    <div class="notification-meta">
                        <span class="notification-time">${formatDate(n.created_at)}</span>
                        <button class="notification-dismiss" title="Dismiss">×</button>
                    </div>
                `;
                item.addEventListener('click', async function(e) {
                    if (e.target.classList.contains('notification-dismiss')) {
                        e.stopPropagation();
                        await dismissNotification(n.id, item);
                        return;
                    }
                    if (!n.is_read) {
                        await markNotificationRead(n.id, item);
                    }
                });
                list.appendChild(item);
            }
            content.innerHTML = '';
            content.appendChild(list);
        }

        async function markNotificationRead(id, itemEl) {
            const { ok } = await api('/notifications/' + id + '/read', { method: 'POST' });
            if (ok) {
                itemEl.classList.remove('unread');
                const badge = document.getElementById('notifications-badge');
                if (badge) {
                    const current = parseInt(badge.textContent, 10) || 0;
                    badge.textContent = current > 1 ? current - 1 : 0;
                    badge.style.display = current > 1 ? 'flex' : 'none';
                }
            }
        }

        async function dismissNotification(id, itemEl) {
            const { ok } = await api('/notifications/' + id + '/dismiss', { method: 'POST' });
            if (ok) {
                const wasUnread = itemEl.classList.contains('unread');
                itemEl.remove();
                if (wasUnread) {
                    const badge = document.getElementById('notifications-badge');
                    if (badge) {
                        const current = parseInt(badge.textContent, 10) || 0;
                        badge.textContent = current > 1 ? current - 1 : 0;
                        badge.style.display = current > 1 ? 'flex' : 'none';
                    }
                }
                const content = document.getElementById('notifications-content');
                if (content && content.children.length === 0) {
                    content.innerHTML = '<div class="notifications-empty">No notifications yet.</div>';
                }
            }
        }

        // ---- Media Review ----
        const mediaState = {
            status: 'pending',
            items: [],
            total: 0,
            offset: 0,
            limit: 24,
        };

        function formatBytes(bytes) {
            const n = Number(bytes);
            if (!Number.isFinite(n) || n <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            let value = n;
            while (value >= 1024 && i < units.length - 1) {
                value /= 1024;
                i += 1;
            }
            return (i === 0 ? String(value) : value.toFixed(1)) + ' ' + units[i];
        }

        function buildMediaSection() {
            const section = document.createElement('section');
            section.className = 'media-section';
            section.id = 'media-section';
            section.setAttribute('aria-labelledby', 'media-section-title');
            section.innerHTML = `
                <h2 class="media-section-title" id="media-section-title">Media Review</h2>
                <div class="media-toolbar">
                    <div class="media-pills" role="group" aria-label="Filter media by status">
                        <button type="button" class="media-pill active" data-status="pending" aria-pressed="true">Pending</button>
                        <button type="button" class="media-pill" data-status="approved" aria-pressed="false">Approved</button>
                        <button type="button" class="media-pill" data-status="rejected" aria-pressed="false">Rejected</button>
                    </div>
                    <div class="review-count" id="media-count"></div>
                </div>
                <div class="media-message" id="media-message" role="alert" aria-live="polite"></div>
                <div class="media-grid" id="media-grid"></div>
                <div class="media-load-more-wrap">
                    <button type="button" class="review-btn" id="media-load-more" style="display: none;">Load More</button>
                </div>
            `;

            section.querySelectorAll('.media-pill').forEach(function(pill) {
                pill.addEventListener('click', function() {
                    if (mediaState.status === pill.dataset.status) return;
                    mediaState.status = pill.dataset.status;
                    section.querySelectorAll('.media-pill').forEach(function(p) {
                        const isActive = p === pill;
                        p.classList.toggle('active', isActive);
                        p.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                    });
                    loadMedia(true);
                });
            });

            section.querySelector('#media-load-more').addEventListener('click', function() {
                loadMedia(false);
            });

            return section;
        }

        function setMediaMessage(text, type) {
            const el = document.getElementById('media-message');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'media-message' + (text ? ' visible ' + (type || 'error') : '');
        }

        function mediaEmptyText() {
            if (mediaState.status === 'pending') return 'There is no media awaiting review.';
            if (mediaState.status === 'approved') return 'No media has been approved yet.';
            return 'No media has been rejected.';
        }

        function updateMediaCount() {
            const el = document.getElementById('media-count');
            if (!el) return;
            el.innerHTML = 'Total ' + escapeHtml(mediaState.status) + ': <strong>' + mediaState.total + '</strong>';
        }

        function maybeShowMediaEmpty() {
            const grid = document.getElementById('media-grid');
            if (grid && grid.children.length === 0) {
                grid.innerHTML = '<div class="review-empty media-empty"><p>' + escapeHtml(mediaEmptyText()) + '</p></div>';
            }
        }

        function createMediaCard(item) {
            const card = document.createElement('div');
            card.className = 'media-card';

            const isImage = String(item.mime_type || '').indexOf('image/') === 0;
            const caption = item.caption || item.filename || 'Untitled media';

            card.innerHTML = `
                <div class="media-preview"></div>
                <div class="media-info">
                    <div class="media-caption">${escapeHtml(caption)}</div>
                    <div class="media-meta">
                        ${item.creator ? '<span>Creator: ' + escapeHtml(item.creator) + '</span>' : ''}
                        ${item.license ? '<span>License: ' + escapeHtml(item.license) + '</span>' : ''}
                        ${item.source ? '<span>Source: ' + escapeHtml(item.source) + '</span>' : ''}
                        ${item.uploaded_by ? '<span>Uploaded by: ' + escapeHtml(item.uploaded_by) + '</span>' : ''}
                    </div>
                    <div class="media-file">${escapeHtml(item.filename || '—')} · ${formatBytes(item.size_bytes)}</div>
                    <div class="media-date">${formatDate(item.created_at)}</div>
                </div>
                <div class="media-actions">
                    <button type="button" class="review-decision-btn approve" data-action="approve">Approve</button>
                    <button type="button" class="review-decision-btn reject" data-action="reject">Reject</button>
                </div>
                <div class="media-card-status" aria-live="polite"></div>
            `;

            // Build the preview via DOM APIs so no dynamic URL ever appears in
            // markup strings (also keeps the static link checker happy).
            const previewWrap = card.querySelector('.media-preview');
            if (isImage && item.url) {
                const img = document.createElement('img');
                img.alt = caption;
                img.loading = 'lazy';
                img.src = item.url;
                previewWrap.appendChild(img);
            } else {
                const fileIcon = document.createElement('div');
                fileIcon.className = 'media-file-icon';
                fileIcon.setAttribute('aria-hidden', 'true');
                fileIcon.textContent = '📄';
                const mimeLabel = document.createElement('span');
                mimeLabel.textContent = item.mime_type || 'file';
                fileIcon.appendChild(mimeLabel);
                previewWrap.appendChild(fileIcon);
            }

            const buttons = card.querySelectorAll('.review-decision-btn');
            const statusEl = card.querySelector('.media-card-status');

            buttons.forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    const action = btn.dataset.action;

                    buttons.forEach(function(b) { b.disabled = true; });
                    statusEl.textContent = 'Processing…';
                    statusEl.className = 'media-card-status processing';

                    const { ok, data } = await api('/media/' + encodeURIComponent(item.id) + '/' + action, { method: 'POST' });

                    if (ok && data && data.data && (data.data.approved === true || data.data.rejected === true)) {
                        card.classList.add('removing');
                        mediaState.items = mediaState.items.filter(function(m) { return m.id !== item.id; });
                        mediaState.total = Math.max(0, mediaState.total - 1);
                        updateMediaCount();
                        setTimeout(function() {
                            card.remove();
                            maybeShowMediaEmpty();
                        }, 400);
                    } else {
                        statusEl.textContent = (data && data.error) || 'Action failed.';
                        statusEl.className = 'media-card-status error';
                        buttons.forEach(function(b) { b.disabled = false; });
                    }
                });
            });

            return card;
        }

        async function loadMedia(reset) {
            const grid = document.getElementById('media-grid');
            const loadMoreBtn = document.getElementById('media-load-more');
            if (!grid) return;

            setMediaMessage('', '');

            if (reset) {
                mediaState.offset = 0;
                mediaState.items = [];
                grid.innerHTML = '<div class="review-empty media-empty"><p>Loading media…</p></div>';
            }

            const params = new URLSearchParams();
            params.set('status', mediaState.status);
            params.set('limit', String(mediaState.limit));
            params.set('offset', String(mediaState.offset));

            const { ok, data } = await api('/media?' + params.toString());

            if (!ok) {
                if (reset) grid.innerHTML = '';
                setMediaMessage((data && data.error) || 'Failed to load media.', 'error');
                return;
            }

            const payload = data && data.data ? data.data : {};
            const items = Array.isArray(payload.items) ? payload.items : [];
            mediaState.total = Number(payload.total) || items.length;
            mediaState.offset += items.length;
            mediaState.items = mediaState.items.concat(items);

            if (reset) grid.innerHTML = '';

            if (mediaState.items.length === 0) {
                maybeShowMediaEmpty();
            } else {
                const placeholder = grid.querySelector('.media-empty');
                if (placeholder) placeholder.remove();
                items.forEach(function(item) {
                    grid.appendChild(createMediaCard(item));
                });
            }

            updateMediaCount();

            if (loadMoreBtn) {
                loadMoreBtn.style.display = mediaState.offset < mediaState.total ? '' : 'none';
            }
        }

        async function init() {
            const sessionId = getSessionId();
            if (!sessionId) {
                renderLoginPrompt();
                return;
            }

            const { ok: sessionOk, data: sessionData } = await api('/auth/session');
            const user = sessionData && sessionData.data ? sessionData.data.user : null;

            if (!sessionOk || !user) {
                localStorage.removeItem('scholars_session');
                renderLoginPrompt();
                return;
            }

            const isReviewer = ['reviewer', 'dept_admin', 'inst_admin', 'curator'].includes(user.role);
            if (!isReviewer) {
                renderError('Account ' + user.email + ' has role "' + user.role + '". Reviewer access is required.');
                return;
            }

            const isCurator = user.role === 'curator';
            if (isCurator) {
                await loadInstitutions();
            }

            const toolbar = document.createElement('div');
            toolbar.className = 'review-toolbar';
            toolbar.innerHTML = `
                <div class="review-count">Pending edits: <strong id="pending-count">—</strong></div>
                <div class="review-actions">
                    <span style="color: var(--review-white-dim); font-size: 0.85rem;">${escapeHtml(user.email)} <span class="review-role-badge">${escapeHtml(user.role)}</span></span>
                    <div class="notifications-wrap" id="notifications-wrap">
                        <button class="notifications-bell" id="notifications-bell" aria-label="Notifications" title="Notifications">
                            🔔
                            <span class="notifications-badge" id="notifications-badge" style="display: none;">0</span>
                        </button>
                        <div class="notifications-panel" id="notifications-panel">
                            <div class="notifications-header">
                                <span class="notifications-title">Notifications</span>
                            </div>
                            <div id="notifications-content"></div>
                        </div>
                    </div>
                    <button class="review-btn" id="refresh-queue">Refresh</button>
                    <button class="review-btn" id="logout-btn">Sign out</button>
                </div>
            `;

            const filters = document.createElement('div');
            filters.className = 'review-filters';
            filters.innerHTML = `
                ${isCurator
                    ? '<select class="review-filter" id="filter-institution"><option value="">All institutions</option>' +
                      Object.values(institutionsMap).map(function(i) {
                          return '<option value="' + i.id + '">' + escapeHtml(i.name) + '</option>';
                      }).join('') +
                      '</select>'
                    : ''}
                <input type="search" class="review-filter" id="filter-section" placeholder="Filter by section…">
                <select class="review-filter" id="filter-status">
                    <option value="pending">Pending</option>
                </select>
                <button class="review-btn" id="apply-filters">Apply Filters</button>
            `;

            const list = document.createElement('div');
            list.id = 'review-list';

            const paginationEl = document.createElement('div');
            paginationEl.className = 'pagination';
            paginationEl.id = 'review-pagination';

            container.innerHTML = '';
            container.appendChild(toolbar);
            container.appendChild(filters);
            container.appendChild(list);
            container.appendChild(paginationEl);
            container.appendChild(buildMediaSection());

            document.getElementById('logout-btn').addEventListener('click', async function() {
                await api('/auth/logout', { method: 'POST' });
                localStorage.removeItem('scholars_session');
                window.location.reload();
            });

            document.getElementById('refresh-queue').addEventListener('click', function() {
                pagination.offset = 0;
                loadQueue();
            });

            document.getElementById('apply-filters').addEventListener('click', function() {
                const institutionSelect = document.getElementById('filter-institution');
                currentFilters.institutionId = institutionSelect ? institutionSelect.value : '';
                currentFilters.section = document.getElementById('filter-section').value.trim().toLowerCase();
                pagination.offset = 0;
                loadQueue();
            });

            const bell = document.getElementById('notifications-bell');
            const panel = document.getElementById('notifications-panel');
            if (bell && panel) {
                bell.addEventListener('click', function(e) {
                    e.stopPropagation();
                    panel.classList.toggle('open');
                });
                panel.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
                document.addEventListener('click', function() {
                    panel.classList.remove('open');
                });
            }

            await loadQueue();
            await loadNotifications();
            await loadMedia(true);
        }

        async function loadQueue() {
            const list = document.getElementById('review-list') || container;
            list.innerHTML = '<div class="review-empty"><p>Loading pending edits…</p></div>';

            const params = new URLSearchParams();
            params.set('limit', String(pagination.limit));
            params.set('offset', String(pagination.offset));

            const { ok, data } = await api('/edits/pending?' + params.toString());

            if (!ok) {
                list.innerHTML = '';
                renderError((data && data.error) || 'Failed to load queue.');
                return;
            }

            let edits = data && data.data ? data.data : [];
            const hasMore = edits.length === pagination.limit;

            if (currentFilters.section) {
                edits = edits.filter(function(e) {
                    return (e.section_label || '').toLowerCase().includes(currentFilters.section) ||
                           (e.section_key || '').toLowerCase().includes(currentFilters.section);
                });
            }

            if (currentFilters.institutionId) {
                edits = edits.filter(function(e) {
                    return String(e.institution_id) === currentFilters.institutionId;
                });
            }

            list.innerHTML = '';

            if (edits.length === 0) {
                list.innerHTML = `
                    <div class="review-empty">
                        <h2>Queue Clear</h2>
                        <p>There are no pending scholarly edits awaiting review.</p>
                    </div>
                `;
            } else {
                for (const edit of edits) {
                    list.appendChild(createCard(edit));
                }
            }

            const counter = document.getElementById('pending-count');
            if (counter) counter.textContent = edits.length;

            renderPagination(hasMore);
        }

        function renderPagination(hasMore) {
            const paginationEl = document.getElementById('review-pagination');
            if (!paginationEl) return;

            const hasPrev = pagination.offset > 0;
            const hasNext = hasMore === true;

            paginationEl.innerHTML = `
                <button class="review-btn" id="page-prev" ${hasPrev ? '' : 'disabled'}>Previous</button>
                <span class="pagination-info">Offset ${pagination.offset}</span>
                <button class="review-btn" id="page-next" ${hasNext ? '' : 'disabled'}>Next</button>
            `;

            document.getElementById('page-prev').addEventListener('click', function() {
                pagination.offset = Math.max(0, pagination.offset - pagination.limit);
                loadQueue();
            });

            document.getElementById('page-next').addEventListener('click', function() {
                pagination.offset += pagination.limit;
                loadQueue();
            });
        }

        init();
    })();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>

<!-- PUNYCODEX-UNIVERSITY-COLLABORATORS-HEAD-START -->
<link rel="stylesheet" href="/css/university-collaborators.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PÚNYCODEX Admin — Tenants</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080e19;
      --bg-elevated: #0e1a2b;
      --gold: #d4af37;
      --gold-dim: rgba(212,175,55,0.15);
      --text: #e8e4dc;
      --text-muted: #7a8a9e;
      --danger: #ff6b6b;
      --success: #4ade80;
      --warning: #fbbf24;
      --info: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .login-box {
      background: var(--bg-elevated);
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 360px;
    }
    .login-box h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .admin-header {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--gold-dim);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .admin-header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--gold);
    }
    .admin-nav {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .admin-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--gold-dim);
      border-radius: 100px;
      transition: all 0.2s;
    }
    .admin-nav a:hover, .admin-nav a.active {
      color: var(--gold);
      border-color: var(--gold);
    }
    .admin-stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-value {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .admin-toolbar {
      padding: 1rem 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      align-items: center;
    }
    .admin-toolbar input, .admin-toolbar select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 0.55rem 0.85rem;
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
    }
    .admin-toolbar input:focus, .admin-toolbar select:focus { border-color: var(--gold); }
    .admin-toolbar input { min-width: 220px; }
    .action-btn {
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--gold); color: #000; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #000; }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.7rem; }
    .tenants-container {
      padding: 1.5rem 2rem;
    }
    .tenants-table-wrap {
      background: var(--bg-elevated);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 0.9rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    td { color: var(--text); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .tenant-name { font-weight: 600; }
    .tenant-meta { font-size: 0.7rem; color: var(--text-muted); }
    .domain-cell { font-family: 'SF Mono', monospace; }
    .domain-cell .unicode { color: var(--gold); }
    .domain-cell .puny { color: var(--text-muted); font-size: 0.75rem; }
    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .score-high { background: rgba(74,222,128,0.12); color: var(--success); }
    .score-mid { background: rgba(251,191,36,0.12); color: var(--warning); }
    .score-low { background: rgba(255,107,107,0.12); color: var(--danger); }
    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-leased { background: rgba(74,222,128,0.12); color: var(--success); }
    .status-flagship { background: rgba(212,175,55,0.15); color: var(--gold); }
    .status-available { background: rgba(96,165,250,0.12); color: var(--info); }
    .status-pending { background: rgba(251,191,36,0.12); color: var(--warning); }
    .tenant-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .detail-panel {
      background: var(--bg-elevated);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }
    .detail-panel h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .signals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .signal-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 0.75rem;
    }
    .signal-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    .signal-value {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold);
    }
    .concepts-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }
    .concept-chip {
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      padding: 0.15rem 0.5rem;
      border-radius: 100px;
      font-size: 0.7rem;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 2rem;
    }
    .modal {
      background: var(--bg-elevated);
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      margin-bottom: 1rem;
    }
    .modal label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      margin-top: 0.75rem;
    }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--gold); }
    .modal textarea { min-height: 80px; resize: vertical; }
    .autocomplete-list {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 0.25rem;
    }
    .autocomplete-item {
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .autocomplete-item:hover { background: rgba(255,255,255,0.05); }
    .autocomplete-item:last-child { border-bottom: none; }
    .preview-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .preview-box h4 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .preview-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .preview-row:last-child { border-bottom: none; }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .modal-actions button { flex: 1; }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--gold-dim);
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.8rem;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .toast.error { border-left-color: var(--danger); }
    .toast.success { border-left-color: var(--success); }
    @media (max-width: 768px) {
      .admin-header { flex-direction: column; align-items: flex-start; }
      .admin-toolbar input { width: 100%; }
      table { min-width: 800px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const API_BASE = window.location.origin;
    let adminToken = localStorage.getItem('nike_admin_token');
    let tenantsData = [];
    let expandedEntryId = null;
    let previewData = null;
    let entrySearchTimer = null;
    let entrySearchResults = [];

    async function api(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'x-admin-token': adminToken,
          ...opts.headers,
        },
      });
      return res.json();
    }

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="login-screen">
          <div class="login-box">
            <h1>PÚNYCODEX Admin</h1>
            <input type="password" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">Enter</button>
          </div>
        </div>
      `;
    }

    async function doLogin() {
      const pass = document.getElementById('admin-pass').value;
      const data = await api('/api/admin/login/', {
        method: 'POST',
        body: JSON.stringify({ password: pass }),
      });
      if (data.success || data.token) {
        adminToken = data.token;
        localStorage.setItem('nike_admin_token', adminToken);
        loadTenants();
      } else {
        alert(data.error || 'Invalid password');
      }
    }

    async function loadTenants() {
      const status = document.getElementById('statusFilter')?.value || '';
      const q = document.getElementById('searchInput')?.value.trim() || '';
      const data = await api(`/api/tenants/?status=${encodeURIComponent(status)}&limit=200`);
      if (data.error) {
        localStorage.removeItem('nike_admin_token');
        renderLogin();
        return;
      }
      tenantsData = data.tenants || [];
      if (q) {
        const low = q.toLowerCase();
        tenantsData = tenantsData.filter(t =>
          (t.tenant_name || '').toLowerCase().includes(low) ||
          (t.entry_unicode || '').toLowerCase().includes(low) ||
          (t.entry_ascii || '').toLowerCase().includes(low) ||
          (t.tenant_category || '').toLowerCase().includes(low) ||
          (t.domain || '').toLowerCase().includes(low) ||
          (t.punycode || '').toLowerCase().includes(low)
        );
      }
      renderDashboard();
    }

    function renderDashboard() {
      const total = tenantsData.length;
      const active = tenantsData.filter(t => t.lease_status === 'leased').length;
      const flagship = tenantsData.filter(t => t.lease_status === 'flagship').length;
      const avgScore = total
        ? (tenantsData.reduce((sum, t) => sum + (t.archetype_score || 0), 0) / total).toFixed(2)
        : '0.00';

      document.getElementById('app').innerHTML = `
        <div class="admin-header">
          <h1>Tenants</h1>
          <nav class="admin-nav">
            <a href="admin-bookings.html">Bookings</a>
            <a href="admin-curator.html">Curator</a>
            <a href="admin-ai-review.html">AI Review</a>
            <a href="admin-api-keys.html">API Keys</a>
            <a href="admin-tenants.html" class="active">Tenants</a>
            <a href="admin.html">Crawler</a>
            <a href="admin-analytics.html">Analytics</a>
          </nav>
          <div class="admin-stats">
            <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
            <div class="stat"><div class="stat-value">${active}</div><div class="stat-label">Leased</div></div>
            <div class="stat"><div class="stat-value">${flagship}</div><div class="stat-label">Flagship</div></div>
            <div class="stat"><div class="stat-value">${avgScore}</div><div class="stat-label">Avg Score</div></div>
          </div>
        </div>
        <div class="admin-toolbar">
          <button class="action-btn btn-primary" onclick="showCreateModal()">+ Create Tenant</button>
          <select id="statusFilter" onchange="loadTenants()">
            <option value="">All Tenants</option>
            <option value="leased">Leased</option>
            <option value="flagship">Flagship</option>
            <option value="available">Available</option>
            <option value="pending">Pending</option>
          </select>
          <input type="text" id="searchInput" placeholder="Search tenants, entries, domains..." oninput="debounceLoad()">
          <button class="action-btn btn-secondary" onclick="loadTenants()">Refresh</button>
        </div>
        <div class="tenants-container">
          <div class="tenants-table-wrap">
            ${tenantsData.length === 0
              ? '<div class="empty-state">No tenants found.</div>'
              : `<table>
                  <thead>
                    <tr>
                      <th>Entry</th>
                      <th>Domain</th>
                      <th>Company</th>
                      <th>Category</th>
                      <th>Archetype</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tenantsData.map(t => renderTenantRow(t)).join('')}
                  </tbody>
                </table>`}
          </div>
          ${expandedEntryId ? renderDetailPanel(expandedEntryId) : ''}
        </div>
      `;
      const sf = document.getElementById('statusFilter');
      if (sf) sf.value = document.getElementById('statusFilter')?.dataset?.value || '';
    }

    function debounceLoad() {
      clearTimeout(entrySearchTimer);
      entrySearchTimer = setTimeout(loadTenants, 250);
    }

    function renderTenantRow(t) {
      const score = t.archetype_score || 0;
      const scoreClass = score >= 0.6 ? 'score-high' : score >= 0.3 ? 'score-mid' : 'score-low';
      const statusClass = `status-${t.lease_status || 'available'}`;
      return `
        <tr>
          <td>
            <div class="tenant-name">${escapeHtml(t.entry_unicode || t.lexicon_entry_id || '—')}</div>
            <div class="tenant-meta">${escapeHtml(t.entry_ascii || '')} · ${escapeHtml(t.entry_pantheon || '')}</div>
          </td>
          <td class="domain-cell">
            <div class="unicode">${escapeHtml(t.domain || '')}</div>
            <div class="puny">${escapeHtml(t.punycode || '')}</div>
          </td>
          <td>
            <div class="tenant-name">${escapeHtml(t.tenant_name || '—')}</div>
            ${t.tenant_front_url ? `<div class="tenant-meta"><a href="${t.tenant_front_url}" target="_blank" rel="noopener" style="color:var(--info)">Front URL ↗</a></div>` : ''}
          </td>
          <td>${escapeHtml(t.tenant_category || '—')}</td>
          <td><span class="score-pill ${scoreClass}">${score.toFixed(2)}</span></td>
          <td><span class="status-badge ${statusClass}">${t.lease_status || 'available'}</span></td>
          <td>
            <div class="tenant-actions">
              <button class="action-btn btn-sm btn-secondary" onclick="toggleDetail('${t.lexicon_entry_id}')">${expandedEntryId === t.lexicon_entry_id ? 'Hide' : 'Details'}</button>
              <button class="action-btn btn-sm btn-secondary" onclick="showEditModal('${t.lexicon_entry_id}')">Edit</button>
              <button class="action-btn btn-sm btn-danger" onclick="deleteTenant('${t.lexicon_entry_id}')">Remove</button>
            </div>
          </td>
        </tr>
      `;
    }

    function renderDetailPanel(entryId) {
      const t = tenantsData.find(x => x.lexicon_entry_id === entryId);
      if (!t) return '';
      let signals = {};
      try { signals = JSON.parse(t.archetype_signals || '{}'); } catch { }
      const concepts = signals.matchedConcepts || [];
      return `
        <div class="detail-panel">
          <h3>Tenant Details — ${escapeHtml(t.tenant_name || '')}</h3>
          <div class="signals-grid">
            <div class="signal-card"><div class="signal-label">Semantic Similarity</div><div class="signal-value">${(signals.semanticSimilarity || 0).toFixed(3)}</div></div>
            <div class="signal-card"><div class="signal-label">Meaning Overlap</div><div class="signal-value">${(signals.meaningOverlap || 0).toFixed(3)}</div></div>
            <div class="signal-card"><div class="signal-label">Category Match</div><div class="signal-value">${(signals.categoryMatch || 0).toFixed(3)}</div></div>
            <div class="signal-card"><div class="signal-label">Model Version</div><div class="signal-value">${escapeHtml(signals.modelVersion || '—')}</div></div>
          </div>
          ${concepts.length ? `<div><div class="signal-label">Matched Concepts</div><div class="concepts-list">${concepts.map(c => `<span class="concept-chip">${escapeHtml(c)}</span>`).join('')}</div></div>` : ''}
          <div class="tenant-meta" style="margin-top:1rem">Entry ID: ${t.lexicon_entry_id} · Domain: ${escapeHtml(t.domain || '')} · Punycode: ${escapeHtml(t.punycode || '')}</div>
        </div>
      `;
    }

    function toggleDetail(entryId) {
      expandedEntryId = expandedEntryId === entryId ? null : entryId;
      renderDashboard();
    }

    function closeModal() {
      const m = document.getElementById('tenant-modal');
      if (m) m.remove();
      previewData = null;
    }

    function showCreateModal() {
      previewData = null;
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'tenant-modal';
      modal.innerHTML = `
        <div class="modal">
          <h3>Create Tenant</h3>
          <label>Lexicon Entry</label>
          <input type="text" id="entry-search" placeholder="Type to search entries (e.g. hermes)" oninput="searchEntries(this.value)">
          <input type="hidden" id="entry-id">
          <div id="entry-autocomplete" class="autocomplete-list" style="display:none"></div>
          <label>Company Name</label>
          <input type="text" id="company-name" placeholder="e.g. Mercury Logistics">
          <label>Category</label>
          <input type="text" id="tenant-category" placeholder="e.g. logistics, finance, travel">
          <label>Front URL</label>
          <input type="text" id="front-url" placeholder="https://example.com">
          <label>Contact Email</label>
          <input type="email" id="contact-email" placeholder="ops@example.com">
          <label>Notes</label>
          <textarea id="tenant-notes" placeholder="Internal notes..."></textarea>
          <div id="preview-box"></div>
          <div class="modal-actions">
            <button class="action-btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="action-btn btn-secondary" onclick="previewTenant()">Preview Archetype</button>
            <button class="action-btn btn-primary" id="submit-btn" onclick="submitCreate()" disabled>Create Tenant</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function searchEntries(q) {
      const list = document.getElementById('entry-autocomplete');
      if (!q || q.length < 2) { list.style.display = 'none'; return; }
      clearTimeout(entrySearchTimer);
      entrySearchTimer = setTimeout(async () => {
        const data = await fetch(`${API_BASE}/api/search/?q=${encodeURIComponent(q)}&limit=8`).then(r => r.json());
        entrySearchResults = data.entries || [];
        if (!entrySearchResults.length) { list.style.display = 'none'; return; }
        list.innerHTML = entrySearchResults.map(e => `
          <div class="autocomplete-item" onclick="selectEntry('${e.id}', '${escapeHtml(e.unicode)}', '${escapeHtml(e.ascii)}')">
            <strong>${escapeHtml(e.unicode)}</strong> (${escapeHtml(e.ascii)}) · ${escapeHtml(e.pantheon)} · ${escapeHtml(e.meaning || '')}
          </div>
        `).join('');
        list.style.display = 'block';
      }, 200);
    }

    function selectEntry(id, unicode, ascii) {
      document.getElementById('entry-id').value = id;
      document.getElementById('entry-search').value = `${unicode} (${ascii})`;
      document.getElementById('entry-autocomplete').style.display = 'none';
    }

    async function previewTenant() {
      const entryId = document.getElementById('entry-id').value;
      const companyName = document.getElementById('company-name').value.trim();
      const category = document.getElementById('tenant-category').value.trim();
      const frontUrl = document.getElementById('front-url').value.trim();
      if (!entryId || !companyName || !frontUrl) {
        showToast('Entry, company name, and front URL are required for preview.', 'error');
        return;
      }
      const data = await api('/api/tenants/preview/', {
        method: 'POST',
        body: JSON.stringify({ entryId, companyName, category, frontUrl }),
      });
      if (!data.success) {
        showToast(data.errors?.join(' ') || 'Preview failed', 'error');
        return;
      }
      previewData = data.preview;
      const box = document.getElementById('preview-box');
      const scoreClass = previewData.archetype_score >= 0.6 ? 'score-high' : previewData.archetype_score >= 0.3 ? 'score-mid' : 'score-low';
      const signals = previewData.archetype_signals || {};
      box.className = 'preview-box';
      box.innerHTML = `
        <h4>Archetype Preview</h4>
        <div class="preview-row"><span>Domain</span><span>${escapeHtml(previewData.unicode)} · ${escapeHtml(previewData.domain || '')}</span></div>
        <div class="preview-row"><span>Company</span><span>${escapeHtml(previewData.companyName)}</span></div>
        <div class="preview-row"><span>Category</span><span>${escapeHtml(previewData.category || '—')}</span></div>
        <div class="preview-row"><span>Front URL</span><span><a href="${previewData.frontUrl}" target="_blank" rel="noopener" style="color:var(--info)">${escapeHtml(previewData.frontUrl)} ↗</a></span></div>
        <div class="preview-row"><span>Archetype Score</span><span class="score-pill ${scoreClass}">${previewData.archetype_score.toFixed(3)}</span></div>
        <div class="preview-row"><span>Semantic</span><span>${(signals.semanticSimilarity || 0).toFixed(3)}</span></div>
        <div class="preview-row"><span>Keyword</span><span>${(signals.meaningOverlap || 0).toFixed(3)}</span></div>
        <div class="preview-row"><span>Category</span><span>${(signals.categoryMatch || 0).toFixed(3)}</span></div>
        ${data.warnings?.length ? `<div style="color:var(--warning);font-size:0.8rem;margin-top:0.5rem">⚠ ${escapeHtml(data.warnings.join(' '))}</div>` : ''}
      `;
      document.getElementById('submit-btn').disabled = false;
    }

    async function submitCreate() {
      if (!previewData) {
        showToast('Preview the tenant first.', 'error');
        return;
      }
      const entryId = document.getElementById('entry-id').value;
      const companyName = document.getElementById('company-name').value.trim();
      const category = document.getElementById('tenant-category').value.trim();
      const frontUrl = document.getElementById('front-url').value.trim();
      const email = document.getElementById('contact-email').value.trim();
      const notes = document.getElementById('tenant-notes').value.trim();
      const data = await api('/api/tenants/', {
        method: 'POST',
        body: JSON.stringify({ entryId, companyName, category, frontUrl, email, notes }),
      });
      if (!data.success) {
        showToast(data.errors?.join(' ') || 'Create failed', 'error');
        return;
      }
      showToast(data.message || 'Tenant created', 'success');
      closeModal();
      loadTenants();
    }

    function showEditModal(entryId) {
      const t = tenantsData.find(x => x.lexicon_entry_id === entryId);
      if (!t) return;
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'tenant-modal';
      modal.innerHTML = `
        <div class="modal">
          <h3>Edit Tenant — ${escapeHtml(t.entry_unicode || t.lexicon_entry_id)}</h3>
          <label>Company Name</label>
          <input type="text" id="edit-company-name" value="${escapeHtml(t.tenant_name || '')}">
          <label>Category</label>
          <input type="text" id="edit-category" value="${escapeHtml(t.tenant_category || '')}">
          <label>Front URL</label>
          <input type="text" id="edit-front-url" value="${escapeHtml(t.tenant_front_url || '')}">
          <label>Lease Status</label>
          <select id="edit-status">
            <option value="leased" ${t.lease_status === 'leased' ? 'selected' : ''}>Leased</option>
            <option value="flagship" ${t.lease_status === 'flagship' ? 'selected' : ''}>Flagship</option>
            <option value="available" ${t.lease_status === 'available' ? 'selected' : ''}>Available</option>
            <option value="pending" ${t.lease_status === 'pending' ? 'selected' : ''}>Pending</option>
          </select>
          <div class="modal-actions">
            <button class="action-btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="action-btn btn-primary" onclick="submitEdit('${t.lexicon_entry_id}')">Save Changes</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function submitEdit(entryId) {
      const companyName = document.getElementById('edit-company-name').value.trim();
      const category = document.getElementById('edit-category').value.trim();
      const frontUrl = document.getElementById('edit-front-url').value.trim();
      const leaseStatus = document.getElementById('edit-status').value;
      const data = await api(`/api/tenants/${encodeURIComponent(entryId)}`, {
        method: 'PATCH',
        body: JSON.stringify({ companyName, category, frontUrl, leaseStatus }),
      });
      if (!data.success) {
        showToast(data.errors?.join(' ') || 'Update failed', 'error');
        return;
      }
      showToast('Tenant updated', 'success');
      closeModal();
      loadTenants();
    }

    async function deleteTenant(entryId) {
      const t = tenantsData.find(x => x.lexicon_entry_id === entryId);
      if (!confirm(`Remove tenant "${t?.tenant_name || entryId}" from ${t?.domain || 'this domain'}?`)) return;
      const data = await api(`/api/tenants/${encodeURIComponent(entryId)}`, { method: 'DELETE' });
      if (!data.success) {
        showToast(data.errors?.join(' ') || 'Remove failed', 'error');
        return;
      }
      showToast(data.message || 'Tenant removed', 'success');
      expandedEntryId = null;
      loadTenants();
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    if (adminToken) loadTenants();
    else renderLogin();
  </script>

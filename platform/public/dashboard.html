  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Temples — PUNICODEX</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a26;
      --text: #e8e6f0;
      --text-dim: #8a87a0;
      --accent: #c9a96e;
      --border: #2a2a3a;
      --success: #7ec9a0;
      --pending: #e8c97e;
      --error: #e87e7e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    header {
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .logo {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
    }
    h1 { margin-top: 0.5rem; }

    .login-section {
      max-width: 400px;
      margin: 3rem auto;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      padding: 0.875rem 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }

    .claim-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .claim-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .claim-name { font-size: 1.2rem; font-weight: 700; }
    .claim-status {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(232,201,126,0.15); color: var(--pending); }
    .status-paid { background: rgba(232,201,126,0.15); color: var(--pending); }
    .status-building { background: rgba(135,174,232,0.15); color: #87aee8; }
    .status-active { background: rgba(126,201,160,0.15); color: var(--success); }
    .status-failed { background: rgba(232,126,126,0.15); color: var(--error); }
    .claim-meta { color: var(--text-dim); font-size: 0.85rem; }
    .claim-actions { margin-top: 1rem; }
    .claim-actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      margin-right: 1rem;
    }
    .empty { text-align: center; color: var(--text-dim); padding: 3rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">PUNICODEX</div>
      <h1>My Temples</h1>
    </header>

    <div id="content">
      <div class="login-section" id="loginSection">
        <p style="color:var(--text-dim);margin-bottom:1rem;">Enter your email to view your claims</p>
        <input type="email" id="emailInput" placeholder="you@example.com" aria-label="Email address">
        <button class="btn" id="loginBtn">View My Temples</button>
      </div>

      <div id="claimsList" style="display:none;">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';

    document.getElementById('loginBtn').addEventListener('click', loadClaims);
    document.getElementById('emailInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadClaims();
    });

    async function loadClaims() {
      const email = document.getElementById('emailInput').value;
      if (!email) return;

      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('claimsList').style.display = 'block';
      document.getElementById('claimsList').innerHTML = '<div class="loading">Loading...</div>';

      try {
        const res = await fetch(`${API_BASE}/api/my-claims/?email=${encodeURIComponent(email)}`);
        const claims = await res.json();

        if (claims.length === 0) {
          document.getElementById('claimsList').innerHTML = `
            <div class="empty">
              <p>No temples claimed yet.</p>
              <p style="margin-top:0.5rem;"><a href="search.html" style="color:var(--accent);">Search the lexicon</a></p>
            </div>
          `;
          return;
        }

        let html = '';
        for (const claim of claims) {
          const statusClass = 'status-' + claim.status;
          html += `
            <div class="claim-card">
              <div class="claim-header">
                <span class="claim-name">${claim.unicode_variant}</span>
                <span class="claim-status ${statusClass}">${claim.status}</span>
              </div>
              <div class="claim-meta">
                ${claim.entry_unicode} | ${claim.pantheon} | Tier ${claim.tier}
              </div>
              <div class="claim-actions">
                ${claim.github_repo ? `<a href="${claim.github_repo}" target="_blank">GitHub Repo</a>` : ''}
                ${claim.deploy_url ? `<a href="${claim.deploy_url}" target="_blank">Live Site</a>` : ''}
                <a href="claim-success.html?id=${claim.id}">Details</a>
              </div>
            </div>
          `;
        }
        document.getElementById('claimsList').innerHTML = html;
      } catch (e) {
        document.getElementById('claimsList').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
      }
    }
  </script>

<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-BODY-START -->
<div id="university-collaborators-strip" role="complementary" aria-label="Academic Collaborators"></div>

</body>
</html>

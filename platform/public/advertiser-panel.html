    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertiser Panel</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css?v=8c5b8a17eb">
    <script src="/vendor/chartjs/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #080e19;
            --bg-elevated: #0e1a2b;
            --bg-card: #121f33;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
            --text: #e8e4dc;
            --text-muted: #7a8a9e;
            --success: #4ade80;
            --danger: #ff6b6b;
            --warning: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .panel-header {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--gold-dim);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .panel-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold);
        }
        .panel-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .panel-nav {
            display: flex;
            gap: 0.5rem;
        }
        .panel-nav-btn {
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--gold);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .panel-nav-btn.active, .panel-nav-btn:hover {
            background: rgba(212,175,55,0.1);
        }
        .panel-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .panel-section { display: none; }
        .panel-section.active { display: block; }

        /* Overview cards */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .overview-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        .overview-value {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
        }
        .overview-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Placement cards */
        .placements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }
        .placement-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            overflow: hidden;
        }
        .placement-card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .placement-card-name {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--gold);
        }
        .placement-card-status {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
        }
        .status-live { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); }
        .status-pending { background: rgba(251,191,36,0.1); color: var(--warning); }
        .status-ended { background: rgba(255,255,255,0.05); color: var(--text-muted); }
        .placement-creative {
            background: linear-gradient(145deg, rgba(14,26,43,0.92), rgba(8,15,25,0.97));
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .placement-creative img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
        }
        .placement-creative.placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 2rem;
            text-align: center;
        }
        .placement-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(255,255,255,0.04);
        }
        .placement-stat {
            background: var(--bg-card);
            padding: 1rem;
            text-align: center;
        }
        .placement-stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .placement-stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.25rem;
        }
        .placement-actions {
            padding: 1rem 1.25rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .placement-btn {
            flex: 1;
            min-width: 100px;
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            text-align: center;
        }
        .placement-btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--gold); color: #000; }
        .btn-secondary { background: transparent; color: var(--gold); border: 1px solid rgba(212,175,55,0.3); }
        .btn-danger { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.25); }
        .btn-danger:hover { opacity: 0.85; }

        .placement-billing {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }
        .placement-billing-row { display: flex; justify-content: space-between; gap: 0.5rem; }
        .placement-billing-label { color: var(--text-muted); }
        .placement-billing-value { color: var(--text); font-weight: 500; }
        .placement-cancel-notice {
            padding: 0.75rem 1.25rem;
            background: rgba(255,107,107,0.08);
            color: var(--danger);
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(255,107,107,0.12);
        }

        /* Editor modal */
        .editor-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .editor-overlay.active { display: flex; }
        .editor-panel {
            background: var(--bg-elevated);
            border: 1px solid var(--gold-dim);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }
        .editor-panel h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }
        .editor-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 1rem 0 0.5rem;
            display: block;
        }
        .editor-input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(212,175,55,0.12);
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        .editor-input:focus { border-color: var(--gold); }
        .editor-upload-zone {
            border: 2px dashed rgba(212,175,55,0.2);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .editor-upload-zone:hover { border-color: var(--gold); background: rgba(212,175,55,0.03); }
        .editor-upload-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .editor-preview { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 1rem; display: none; }
        .editor-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        .editor-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .editor-btn-primary { background: var(--gold); color: #000; }
        .editor-btn-secondary { background: transparent; color: var(--gold); border: 1px solid rgba(212,175,55,0.3); }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .chart-container { height: 200px; margin: 1rem 0; }
        /* Bundle manager */
        .bundle-banner {
            background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(212,175,55,0.02));
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .bundle-badge {
            background: var(--gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.3rem 0.75rem;
            border-radius: 100px;
        }
        .bundle-title { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold); }
        .bundle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }
        .bundle-slot {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            overflow: hidden;
        }
        .bundle-slot-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bundle-slot-name { font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold); }
        .bundle-slot-dims { font-size: 0.65rem; color: var(--text-muted); }
        .bundle-slot-creative {
            background: linear-gradient(145deg, rgba(14,26,43,0.92), rgba(8,15,25,0.97));
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bundle-slot-creative img { max-width: 100%; max-height: 180px; object-fit: contain; display: block; }
        .bundle-slot-creative.placeholder { color: var(--text-muted); font-size: 0.75rem; padding: 1.5rem; text-align: center; }
        .bundle-slot-actions { padding: 0.75rem 1rem; display: flex; gap: 0.5rem; }
        .bundle-slot-btn {
            flex: 1;
            padding: 0.45rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-align: center;
        }
        @media (max-width: 768px) {
            .panel-header { padding: 1rem; }
            .panel-container { padding: 1rem; }
            .placements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="panel-header">
        <div>
            <h1 id="panel-company">Advertiser Panel</h1>
            <p id="panel-email">Loading...</p>
        </div>
        <div class="panel-nav">
            <button class="panel-nav-btn active" onclick="showTab('overview')">Overview</button>
            <button class="panel-nav-btn" onclick="showTab('placements')">Placements</button>
        </div>
    </div>

    <div class="panel-container">
        <div class="panel-section active" id="tab-overview">
            <div class="overview-grid" id="overview-grid">
                <div class="overview-card"><div class="overview-value">—</div><div class="overview-label">Active Placements</div></div>
                <div class="overview-card"><div class="overview-value">—</div><div class="overview-label">Total Impressions</div></div>
                <div class="overview-card"><div class="overview-value">—</div><div class="overview-label">Total Clicks</div></div>
                <div class="overview-card"><div class="overview-value">—</div><div class="overview-label">Avg CTR</div></div>
            </div>
            <div id="overview-charts"></div>
        </div>

        <div class="panel-section" id="tab-placements">
            <div class="placements-grid" id="placements-grid">
                <div class="empty-state">Loading your placements...</div>
            </div>
        </div>
    </div>

    <!-- Editor Modal -->
    <div class="editor-overlay" id="editor-overlay">
        <div class="editor-panel">
            <h3 id="editor-title">Edit Placement</h3>
            <p id="editor-slot-info" style="font-size:0.75rem;color:var(--text-muted);margin-bottom:1rem;display:none;"></p>
            <label class="editor-label">Heading</label>
            <input type="text" class="editor-input" id="edit-heading" placeholder="Your heading" aria-label="Ad heading">
            <label class="editor-label">Subtitle</label>
            <input type="text" class="editor-input" id="edit-subtitle" placeholder="Your subtitle" aria-label="Ad subtitle">
            <label class="editor-label">Destination URL</label>
            <input type="url" class="editor-input" id="edit-url" placeholder="https://yourbrand.com" aria-label="Destination URL">
            <label class="editor-label">New Creative</label>
            <div class="editor-upload-zone" id="edit-upload-zone">
                <input type="file" class="editor-upload-input" id="edit-upload-input" accept="image/png,image/jpeg,image/webp" aria-label="Upload creative image">
                <p>Drag & drop or click to upload</p>
                <p style="font-size:0.75rem;color:var(--text-muted);">PNG, JPG, WebP &middot; Max 2MB</p>
                <img class="editor-preview" id="edit-preview" alt="Preview">
            </div>
            <div class="editor-actions">
                <button class="editor-btn editor-btn-primary" onclick="saveEdit()">Save Changes</button>
                <button class="editor-btn editor-btn-secondary" onclick="closeEditor()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        let bookings = [];
        let slotCreatives = {}; // Map: token -> { slotId -> creativeData }
        let currentEditToken = null;
        let currentEditSlotId = null;
        let selectedFileBase64 = null;

        async function api(path, opts = {}) {
            const res = await fetch(`${API_BASE}${path}`, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } });
            return res.json();
        }

        function showTab(name) {
            document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.panel-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            event.target.classList.add('active');
        }

        async function loadData() {
            if (!token) {
                document.getElementById('placements-grid').innerHTML = '<div class="empty-state">No access token provided.</div>';
                return;
            }
            // Fetch all bookings for this token's owner
            const all = await api(`/api/bookings/${token}/all`);
            if (!all || all.error) {
                document.getElementById('placements-grid').innerHTML = '<div class="empty-state">Invalid or expired link.</div>';
                return;
            }
            bookings = all.bookings || [];
            if (bookings.length > 0) {
                const company = bookings[0].company_name || 'Advertiser Panel';
                document.getElementById('panel-company').textContent = company;
                document.title = `${company} — Advertiser Panel`;
            }

            // Enrich with dashboard metrics and slot creatives for bundles
            for (let b of bookings) {
                const metrics = await api(`/api/analytics/dashboard/?token=${b.token}`);
                b.metrics = metrics ? metrics.metrics : null;
                b.booking = metrics ? metrics.booking : null;
                // Merge server-side details into booking object for rendering
                if (b.booking) {
                    b.booking.site_slug = b.site_slug || b.booking.site_slug || 'nike';
                    b.booking.started_at = b.started_at || b.booking.started_at;
                    b.booking.ends_at = b.ends_at || b.booking.ends_at;
                    b.booking.trial_ends_at = b.trial_ends_at || b.booking.trial_ends_at;
                    b.booking.billing_status = b.billing_status || b.booking.billing_status;
                    b.booking.cancel_at_end = b.cancel_at_end || b.booking.cancel_at_end;
                    b.booking.canceled_at = b.canceled_at || b.booking.canceled_at;
                    b.booking.amount_paid_cents = b.amount_paid_cents || b.booking.amount_paid_cents;
                    b.booking.slot_name = b.slot_name;
                    b.booking.lease_months = b.lease_months;
                }
                if (b.is_bundle) {
                    const sc = await api(`/api/bookings/${b.token}/slots`);
                    slotCreatives[b.token] = sc && sc.creatives ? sc.creatives : [];
                }
            }

            renderOverview();
            renderPlacements();
        }

        function renderOverview() {
            const active = bookings.filter(b => b.status === 'live').length;
            const totalImp = bookings.reduce((s, b) => s + (b.metrics?.totalImpressions || 0), 0);
            const totalClk = bookings.reduce((s, b) => s + (b.metrics?.totalClicks || 0), 0);
            const ctr = totalImp > 0 ? ((totalClk / totalImp) * 100).toFixed(2) : '0.00';

            document.getElementById('overview-grid').innerHTML = `
                <div class="overview-card"><div class="overview-value">${active}</div><div class="overview-label">Active Placements</div></div>
                <div class="overview-card"><div class="overview-value">${totalImp.toLocaleString()}</div><div class="overview-label">Total Impressions</div></div>
                <div class="overview-card"><div class="overview-value">${totalClk.toLocaleString()}</div><div class="overview-label">Total Clicks</div></div>
                <div class="overview-card"><div class="overview-value">${ctr}%</div><div class="overview-label">Avg CTR</div></div>
            `;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return '—';
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
        function formatCurrency(cents) {
            if (!cents || Number.isNaN(Number(cents))) return '$0.00';
            return '$' + (Number(cents) / 100).toFixed(2);
        }
        function canCancelStatus(status) {
            return ['live', 'approved', 'pending_payment', 'pending_upload', 'pending_approval', 'pending_application'].includes(status);
        }
        function canRenewStatus(status) {
            return ['live', 'approved', 'pending_approval'].includes(status);
        }
        function billingRows(b) {
            const bb = b.booking || {};
            const trialRow = bb.trial_ends_at
                ? `<div class="placement-billing-row"><span class="placement-billing-label">Trial ends</span><span class="placement-billing-value">${formatDate(bb.trial_ends_at)}</span></div>`
                : '';
            return `
                <div class="placement-billing-row"><span class="placement-billing-label">Started</span><span class="placement-billing-value">${formatDate(bb.started_at)}</span></div>
                <div class="placement-billing-row"><span class="placement-billing-label">Ends</span><span class="placement-billing-value">${formatDate(bb.ends_at)}</span></div>
                ${trialRow}
                <div class="placement-billing-row"><span class="placement-billing-label">Billing</span><span class="placement-billing-value">${bb.billing_status || b.billing_status || '—'}</span></div>
                <div class="placement-billing-row"><span class="placement-billing-label">Paid</span><span class="placement-billing-value">${formatCurrency(bb.amount_paid_cents)}</span></div>
            `;
        }
        function cancelNotice(b) {
            const bb = b.booking || {};
            if (!bb.cancel_at_end) return '';
            return `<div class="placement-cancel-notice">⏹ Scheduled to cancel at term end (${formatDate(bb.ends_at)})</div>`;
        }
        function managementButtons(b, { includeEdit = true, isBundle = false } = {}) {
            const bb = b.booking || {};
            const siteSlug = bb.site_slug || b.site_slug || 'nike';
            const editBtn = includeEdit && !isBundle
                ? `<button class="placement-btn btn-primary" onclick="openEditor('${b.token}', '${escapeJs(bb.custom_heading || '')}', '${escapeJs(bb.custom_subtitle || '')}')">Edit</button>`
                : '';
            const analyticsBtn = `<a class="placement-btn btn-secondary" href="${API_BASE}/${siteSlug}/dashboard/?token=${b.token}" target="_blank">Analytics</a>`;
            const renewBtn = canRenewStatus(b.status)
                ? `<button class="placement-btn btn-secondary" onclick="renewBooking('${b.token}')">Renew</button>`
                : '';
            const cancelBtn = bb.cancel_at_end
                ? `<button class="placement-btn btn-secondary" onclick="uncancelBooking('${b.token}')">Undo Cancel</button>`
                : canCancelStatus(b.status)
                    ? `<button class="placement-btn btn-danger" onclick="cancelBooking('${b.token}')">Cancel</button>`
                    : '';
            return `<div class="placement-actions">${editBtn}${analyticsBtn}${renewBtn}${cancelBtn}</div>`;
        }

        function renderPlacements() {
            const grid = document.getElementById('placements-grid');
            if (bookings.length === 0) {
                grid.innerHTML = '<div class="empty-state">No placements found.</div>';
                return;
            }
            grid.innerHTML = bookings.map(b => {
                const m = b.metrics || {};
                const statusClass = b.status === 'live' ? 'status-live' : b.status === 'ended' ? 'status-ended' : 'status-pending';
                const creative = b.booking?.creative_path ? `<img src="${API_BASE}${b.booking.creative_path}" alt="Creative">` : '<div class="placement-creative placeholder">No creative uploaded</div>';
                const canEdit = b.status !== 'ended';

                // Bundle booking: render main card + slot grid
                if (b.is_bundle) {
                    const creatives = slotCreatives[b.token] || [];
                    const creativeMap = {};
                    creatives.forEach(c => { creativeMap[c.slot_id] = c; });
                    // Define all 13 slots in bundle
                    const bundleSlots = [
                        { id: 1, name: 'Crown Position', dims: '1136 × 379' },
                        { id: 2, name: 'Victory Column', dims: '260 × 520' },
                        { id: 3, name: 'Champion Strip', dims: '844 × 317' },
                        { id: 4, name: 'Wingspan I', dims: '844 × 394' },
                        { id: 5, name: 'Wingspan II', dims: '552 × 309' },
                        { id: 6, name: 'Wingspan III', dims: '552 × 309' },
                        { id: 7, name: 'Golden Ribbon', dims: '511 × 131' },
                        { id: 8, name: 'Laurel Badge', dims: '306 × 115' },
                        { id: 9, name: 'Inscription', dims: '255 × 87' },
                        { id: 10, name: 'Emblem I', dims: '552 × 221' },
                        { id: 11, name: 'Emblem II', dims: '552 × 221' },
                        { id: 12, name: 'Foundation', dims: '1136 × 95' },
                        { id: 13, name: 'Total Conquest', dims: '1136 × 379' },
                    ];
                    const slotGrid = bundleSlots.map(s => {
                        const sc = creativeMap[s.id];
                        const slotCreative = sc && sc.creative_path
                            ? `<img src="${API_BASE}${sc.creative_path}" alt="${s.name}">`
                            : '<div class="bundle-slot-creative placeholder">No creative</div>';
                        const slotHeading = sc?.custom_heading || '';
                        const slotSubtitle = sc?.custom_subtitle || '';
                        const slotUrl = sc?.website_url || '';
                        return `
                            <div class="bundle-slot">
                                <div class="bundle-slot-header">
                                    <div>
                                        <div class="bundle-slot-name">${s.name}</div>
                                        <div class="bundle-slot-dims">${s.dims}</div>
                                    </div>
                                </div>
                                <div class="bundle-slot-creative">${slotCreative}</div>
                                ${canEdit ? `
                                    <div class="bundle-slot-actions">
                                        <button class="bundle-slot-btn btn-primary" onclick="openEditor('${b.token}', '${escapeJs(slotHeading)}', '${escapeJs(slotSubtitle)}', ${s.id}, '${escapeJs(slotUrl)}')">Edit</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="placement-card" style="grid-column: 1 / -1;">
                            <div class="placement-card-header">
                                <span class="placement-card-name">${b.slot_name} <span class="bundle-badge">Bundle</span></span>
                                <span class="placement-card-status ${statusClass}">${b.status.replace(/_/g, ' ')}</span>
                            </div>
                            <div class="placement-billing" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">${billingRows(b)}</div>
                            ${cancelNotice(b)}
                            <div class="placement-creative">${creative}</div>
                            <div class="placement-stats">
                                <div class="placement-stat"><div class="placement-stat-value">${(m.totalImpressions || 0).toLocaleString()}</div><div class="placement-stat-label">Impressions</div></div>
                                <div class="placement-stat"><div class="placement-stat-value">${(m.totalClicks || 0).toLocaleString()}</div><div class="placement-stat-label">Clicks</div></div>
                                <div class="placement-stat"><div class="placement-stat-value">${m.ctr || '0.00'}%</div><div class="placement-stat-label">CTR</div></div>
                            </div>
                            ${canEdit ? managementButtons(b, { includeEdit: false, isBundle: true }) : ''}
                            <div class="bundle-banner">
                                <span class="bundle-badge">13 Slots</span>
                                <span class="bundle-title">Manage individual creatives for each slot below</span>
                            </div>
                            <div style="padding: 0 1.25rem 1.25rem;">
                                <div class="bundle-grid">${slotGrid}</div>
                            </div>
                        </div>
                    `;
                }

                // Single slot booking: original render
                return `
                    <div class="placement-card">
                        <div class="placement-card-header">
                            <span class="placement-card-name">${b.slot_name} <span style="font-size:0.65rem;color:var(--text-muted);margin-left:0.3rem;">${b.lease_months === 12 ? '12 months' : '1 month'}</span></span>
                            <span class="placement-card-status ${statusClass}">${b.status.replace(/_/g, ' ')}</span>
                        </div>
                        <div class="placement-billing">${billingRows(b)}</div>
                        ${cancelNotice(b)}
                        <div class="placement-creative">${creative}</div>
                        <div class="placement-stats">
                            <div class="placement-stat"><div class="placement-stat-value">${(m.totalImpressions || 0).toLocaleString()}</div><div class="placement-stat-label">Impressions</div></div>
                            <div class="placement-stat"><div class="placement-stat-value">${(m.totalClicks || 0).toLocaleString()}</div><div class="placement-stat-label">Clicks</div></div>
                            <div class="placement-stat"><div class="placement-stat-value">${m.ctr || '0.00'}%</div><div class="placement-stat-label">CTR</div></div>
                        </div>
                        ${canEdit ? managementButtons(b) : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function openEditor(tk, heading, subtitle, slotId = null, url = '') {
            currentEditToken = tk;
            currentEditSlotId = slotId;
            selectedFileBase64 = null;
            document.getElementById('edit-heading').value = heading || '';
            document.getElementById('edit-subtitle').value = subtitle || '';
            document.getElementById('edit-url').value = url || '';
            document.getElementById('edit-preview').style.display = 'none';
            document.getElementById('edit-upload-input').value = '';
            const titleEl = document.getElementById('editor-title');
            const infoEl = document.getElementById('editor-slot-info');
            if (slotId) {
                const slotNames = {1:'Crown Position',2:'Victory Column',3:'Champion Strip',4:'Wingspan I',5:'Wingspan II',6:'Wingspan III',7:'Golden Ribbon',8:'Laurel Badge',9:'Inscription',10:'Emblem I',11:'Emblem II',12:'Foundation',13:'Total Conquest'};
                titleEl.textContent = `Edit ${slotNames[slotId] || 'Slot'}`;
                infoEl.textContent = `Slot #${slotId} — Upload a creative sized for this slot`;
                infoEl.style.display = 'block';
            } else {
                titleEl.textContent = 'Edit Placement';
                infoEl.style.display = 'none';
            }
            document.getElementById('editor-overlay').classList.add('active');
        }

        function closeEditor() {
            document.getElementById('editor-overlay').classList.remove('active');
            currentEditToken = null;
            currentEditSlotId = null;
            selectedFileBase64 = null;
        }

        document.getElementById('edit-upload-zone').addEventListener('click', () => document.getElementById('edit-upload-input').click());
        document.getElementById('edit-upload-input').addEventListener('change', e => {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            const allowed = ['image/png', 'image/jpeg', 'image/webp'];
            if (!allowed.includes(file.type)) { alert('PNG, JPG, or WebP only'); return; }
            if (file.size > 2 * 1024 * 1024) { alert('Max 2MB'); return; }
            const reader = new FileReader();
            reader.onload = ev => {
                selectedFileBase64 = ev.target.result;
                const preview = document.getElementById('edit-preview');
                preview.src = selectedFileBase64;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        async function saveEdit() {
            if (!currentEditToken) return;
            const heading = document.getElementById('edit-heading').value.trim();
            const subtitle = document.getElementById('edit-subtitle').value.trim();
            const url = document.getElementById('edit-url').value.trim();

            // Update meta text
            const metaBody = { customHeading: heading, customSubtitle: subtitle };
            if (currentEditSlotId) metaBody.slotId = currentEditSlotId;
            if (url) metaBody.websiteUrl = url;
            await fetch(`${API_BASE}/api/bookings/${currentEditToken}/meta`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(metaBody),
            });

            // Upload creative if selected
            if (selectedFileBase64) {
                const uploadUrl = currentEditSlotId
                    ? `${API_BASE}/api/bookings/${currentEditToken}/slot/${currentEditSlotId}/upload`
                    : `${API_BASE}/api/bookings/${currentEditToken}/upload`;
                const res = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: selectedFileBase64, filename: 'creative.png' }),
                });
                const data = await res.json();
                if (!data.success) { alert(data.error || 'Upload failed'); return; }
            }
            closeEditor();
            loadData();
        }

        document.getElementById('editor-overlay').addEventListener('click', e => {
            if (e.target.id === 'editor-overlay') closeEditor();
        });

        async function cancelBooking(tk) {
            if (!confirm('Cancel this placement at the end of its current term? It will remain active until then.')) return;
            const res = await fetch(`${API_BASE}/api/bookings/${tk}/cancel`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Cancel failed'); return; }
            loadData();
        }
        async function uncancelBooking(tk) {
            if (!confirm('Keep this placement auto-renewing?')) return;
            const res = await fetch(`${API_BASE}/api/bookings/${tk}/uncancel`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Undo failed'); return; }
            loadData();
        }
        async function renewBooking(tk) {
            const months = prompt('Extend lease by how many months? (1 or 12)', '12');
            if (!months || ![1, 12].includes(parseInt(months, 10))) { alert('Please enter 1 or 12'); return; }
            const res = await fetch(`${API_BASE}/api/bookings/${tk}/renew`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ extensionMonths: parseInt(months, 10) }),
            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Renewal failed'); return; }
            if (data.stripeUrl) window.location.href = data.stripeUrl;
        }

        loadData();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PÚNYCODEX Admin — Authenticity Threat Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080e19;
      --bg-elevated: #0e1a2b;
      --gold: #d4af37;
      --gold-dim: rgba(212,175,55,0.15);
      --text: #e8e4dc;
      --text-muted: #7a8a9e;
      --danger: #ff6b6b;
      --success: #4ade80;
      --warning: #fbbf24;
      --info: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .login-box {
      background: var(--bg-elevated); border: 1px solid var(--gold-dim);
      border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 360px;
    }
    .login-box h1 { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 1.5rem; text-align: center; }
    .login-box input {
      width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--gold-dim);
      border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-size: 0.95rem;
      margin-bottom: 1rem; outline: none;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-box button {
      width: 100%; background: var(--gold); color: #000; border: none;
      border-radius: 8px; padding: 0.75rem; font-family: 'Cinzel', serif;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }
    .admin-header {
      background: var(--bg-elevated); border-bottom: 1px solid var(--gold-dim);
      padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between;
    }
    .admin-header h1 { font-family: 'Cinzel', serif; font-size: 1.25rem; color: var(--gold); }
    .admin-main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .toolbar select, .toolbar input {
      background: var(--bg-elevated); color: var(--text); border: 1px solid var(--gold-dim);
      border-radius: 8px; padding: 0.5rem 0.75rem;
    }
    .toolbar button {
      background: var(--gold); color: #000; border: none; border-radius: 8px;
      padding: 0.5rem 1rem; font-weight: 600; cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--gold-dim); }
    th { color: var(--text-muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
    .severity { font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
    .severity-critical { color: var(--danger); }
    .severity-high { color: var(--warning); }
    .severity-medium { color: var(--info); }
    .severity-low, .severity-none { color: var(--text-muted); }
    .actions { display: flex; gap: 0.5rem; }
    .actions button {
      border: 1px solid var(--gold-dim); background: transparent; color: var(--text);
      border-radius: 6px; padding: 0.35rem 0.7rem; font-size: 0.75rem; cursor: pointer;
    }
    .actions button:hover { background: rgba(255,255,255,0.05); }
    .empty { color: var(--text-muted); text-align: center; padding: 3rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>Admin Login</h1>
      <input type="password" id="password" placeholder="Admin password">
      <button id="login-btn">Sign In</button>
    </div>
  </div>

  <div id="admin-app" class="hidden">
    <header class="admin-header">
      <h1>Authenticity Threat Feed</h1>
      <button id="logout-btn" class="btn btn-secondary" style="background:transparent;border:1px solid var(--gold-dim);color:var(--text);border-radius:8px;padding:0.5rem 1rem;cursor:pointer;">Logout</button>
    </header>
    <main class="admin-main">
      <div class="toolbar">
        <select id="filter-severity">
          <option value="">All severities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="filter-verdict">
          <option value="">All verdicts</option>
          <option value="homograph-spoof">Homograph spoof</option>
          <option value="mixed-script-spoof">Mixed-script spoof</option>
          <option value="lookalike-domain">Lookalike domain</option>
          <option value="unsafe">Unsafe</option>
        </select>
        <input type="text" id="filter-source" placeholder="Source filter">
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="spoofs-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Input</th>
              <th>Type</th>
              <th>Verdict</th>
              <th>Severity</th>
              <th>Source</th>
              <th>Confidence</th>
              <th>Reports</th>
              <th>Seen</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="spoofs-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty hidden">No unreviewed spoofs.</div>
    </main>
  </div>

  <script>
    (function () {
      const loginScreen = document.getElementById('login-screen');
      const adminApp = document.getElementById('admin-app');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('login-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const refreshBtn = document.getElementById('refresh-btn');
      const spoofsBody = document.getElementById('spoofs-body');
      const emptyState = document.getElementById('empty-state');
      const severityFilter = document.getElementById('filter-severity');
      const verdictFilter = document.getElementById('filter-verdict');
      const sourceFilter = document.getElementById('filter-source');

      let token = localStorage.getItem('nike_admin_token');
      if (token) showApp();

      loginBtn.addEventListener('click', login);
      passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('nike_admin_token');
        token = null;
        location.reload();
      });
      refreshBtn.addEventListener('click', load);
      [severityFilter, verdictFilter, sourceFilter].forEach((el) => el.addEventListener('change', load));

      async function login() {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const data = await res.json();
        if (data.success && data.token) {
          token = data.token;
          localStorage.setItem('nike_admin_token', token);
          showApp();
        } else {
          alert(data.error || 'Login failed');
        }
      }

      function showApp() {
        loginScreen.classList.add('hidden');
        adminApp.classList.remove('hidden');
        load();
      }

      async function load() {
        const params = new URLSearchParams();
        if (severityFilter.value) params.set('severity', severityFilter.value);
        if (verdictFilter.value) params.set('verdict', verdictFilter.value);
        if (sourceFilter.value.trim()) params.set('source', sourceFilter.value.trim());

        const res = await fetch(`/api/admin/authenticity/spoofs?${params.toString()}`, {
          headers: { 'x-admin-token': token },
        });
        const data = await res.json();
        const items = data.items || [];
        render(items);
      }

      function render(items) {
        if (items.length === 0) {
          spoofsBody.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');
        spoofsBody.innerHTML = items.map((s) => `
          <tr>
            <td><code>${escapeHtml(s.input)}</code></td>
            <td>${escapeHtml(s.input_type)}</td>
            <td>${escapeHtml(s.verdict)}</td>
            <td><span class="severity severity-${escapeHtml(s.severity)}">${escapeHtml(s.severity)}</span></td>
            <td>${escapeHtml(s.discovery_source || '')}</td>
            <td>${s.confidence != null ? s.confidence.toFixed(2) : '—'}</td>
            <td>${s.report_count}</td>
            <td>${escapeHtml(s.last_seen)}</td>
            <td class="actions">
              <button onclick="review(${s.id}, 'confirmed')">Confirm</button>
              <button onclick="review(${s.id}, 'false-positive')">False +</button>
              <button onclick="review(${s.id}, 'ignored')">Ignore</button>
            </td>
          </tr>
        `).join('');
      }

      window.review = async function (id, decision) {
        const res = await fetch(`/api/admin/authenticity/spoofs/${id}/review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ decision }),
        });
        if (res.ok) load();
        else alert('Review failed');
      };

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>

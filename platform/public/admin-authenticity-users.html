<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNICODEX-ANALYTICS-START -->
<script src="/js/analytics-beacon.js" defer></script>
<!-- PUNICODEX-ANALYTICS-END -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUNICODEX — Authenticity User Management</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a26;
      --text: #e8e6f0;
      --text-dim: #8a87a0;
      --accent: #c9a96e;
      --border: #2a2a3a;
      --live: #87c9e8;
      --error: #e88787;
      --available: #7ec9a0;
      --pending: #e8c97e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      padding: 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.1em; color: var(--accent); }
    .nav a { color: var(--text-dim); text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
    .nav a:hover { color: var(--accent); }
    .section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem 2rem;
    }
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .form-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .form-row input, .form-row select {
      padding: 0.5rem 0.75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .btn {
      padding: 0.6rem 1rem;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn:hover { opacity: 0.85; }
    .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .users-table th {
      text-align: left;
      padding: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }
    .users-table td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .users-table tr:hover { background: var(--surface-2); }
    .role-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .role-superadmin { background: rgba(232, 135, 135, 0.12); color: var(--error); }
    .role-tenant_admin { background: rgba(135, 201, 232, 0.12); color: var(--live); }
    .role-analyst { background: rgba(232, 201, 126, 0.12); color: var(--pending); }
    .role-viewer { background: rgba(138, 135, 160, 0.12); color: var(--text-dim); }
    .role-api { background: rgba(126, 201, 160, 0.12); color: var(--available); }
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      z-index: 100;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: var(--available); }
    .toast.error { border-color: var(--error); }
  </style>
</head>
<body>
    <h1 style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">PuniCodex Admin — Authenticity Users</h1>
  <header>
    <div class="logo">PUNICODEX</div>
    <nav class="nav">
      <a href="search.html">Search</a>
      <a href="admin.html">Crawler</a>
      <a href="admin-authenticity.html">Authenticity</a>
      <a href="admin-authenticity-audit.html">Audit</a>
      <a href="admin-authenticity-users.html">Users</a>
      <a href="admin-authenticity-compliance.html">Compliance</a>
      <a href="admin-authenticity-policy.html">Policy</a>
    </nav>
  </header>

  <div class="section">
    <div class="section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Authenticity User Management
    </div>

    <div class="form-row">
      <select id="tenantSelect" aria-label="Select tenant">
        <option value="default">default</option>
      </select>
      <input type="email" id="newUserEmail" placeholder="Email address" aria-label="New user email address">
      <select id="newUserRole" aria-label="New user role">
        <option value="viewer">viewer</option>
        <option value="analyst">analyst</option>
        <option value="tenant_admin">tenant_admin</option>
        <option value="api">api</option>
      </select>
      <button class="btn" onclick="addUser()">Add User</button>
    </div>

    <div id="usersTable"><div style="padding:2rem;color:var(--text-dim)">Loading users...</div></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = '';
    const ROLES = ['superadmin','tenant_admin','analyst','viewer','api'];

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function roleClass(role) {
      return `role-${role}`;
    }

    async function loadUsers() {
      const tenantId = document.getElementById('tenantSelect').value;
      try {
        const res = await fetch(`${API_BASE}/api/v1/tenants/${tenantId}/users`, {
          headers: { 'x-admin-token': localStorage.getItem('nike_admin_token') || '' }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load users');
        renderUsers(data.users || []);
      } catch (e) {
        document.getElementById('usersTable').innerHTML = `<div style="padding:2rem;color:var(--error)">Error: ${e.message}</div>`;
      }
    }

    function renderUsers(users) {
      const container = document.getElementById('usersTable');
      if (!users.length) {
        container.innerHTML = '<div style="padding:2rem;color:var(--text-dim)">No users found.</div>';
        return;
      }
      let html = `<table class="users-table"><thead><tr>
        <th>ID</th><th>Email Hash</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th>
      </tr></thead><tbody>`;
      users.forEach(u => {
        html += `<tr>
          <td>${u.id}</td>
          <td style="font-family:monospace;font-size:0.8rem;color:var(--text-dim)">${u.email_hash}</td>
          <td><span class="role-badge ${roleClass(u.role)}">${u.role}</span></td>
          <td>${u.status}</td>
          <td>${new Date(u.created_at).toLocaleString()}</td>
          <td>
            <select onchange="changeRole(${u.id}, this.value)">
              ${ROLES.map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}
            </select>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function addUser() {
      const tenantId = document.getElementById('tenantSelect').value;
      const email = document.getElementById('newUserEmail').value.trim();
      const role = document.getElementById('newUserRole').value;
      if (!email) return showToast('Email is required', 'error');
      try {
        const res = await fetch(`${API_BASE}/api/v1/tenants/${tenantId}/users`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-token': localStorage.getItem('nike_admin_token') || ''
          },
          body: JSON.stringify({ email, role })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to add user');
        showToast(`User added with role ${role}`);
        document.getElementById('newUserEmail').value = '';
        loadUsers();
      } catch (e) {
        showToast(`Failed: ${e.message}`, 'error');
      }
    }

    async function changeRole(userId, role) {
      const tenantId = document.getElementById('tenantSelect').value;
      try {
        const res = await fetch(`${API_BASE}/api/v1/tenants/${tenantId}/users/${userId}/role`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-token': localStorage.getItem('nike_admin_token') || ''
          },
          body: JSON.stringify({ role })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to change role');
        showToast(`Role updated to ${role}`);
        loadUsers();
      } catch (e) {
        showToast(`Failed: ${e.message}`, 'error');
      }
    }

    loadUsers();
  </script>
</body>
</html>

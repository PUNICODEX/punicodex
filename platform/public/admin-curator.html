    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Níkē Admin — AI Curator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080e19;
            --bg-elevated: #0e1a2b;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.15);
            --text: #e8e4dc;
            --text-muted: #7a8a9e;
            --danger: #ff6b6b;
            --success: #4ade80;
            --warning: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }
        .login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem;
        }
        .login-box {
            background: var(--bg-elevated); border: 1px solid var(--gold-dim);
            border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 360px;
        }
        .login-box h1 { font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 1.5rem; text-align: center; }
        .login-box input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--gold-dim);
            border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); font-size: 0.95rem;
            margin-bottom: 1rem; outline: none;
        }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button {
            width: 100%; background: var(--gold); color: #000; border: none; border-radius: 8px;
            padding: 0.75rem; font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.85rem; cursor: pointer;
        }
        .admin-header {
            background: var(--bg-elevated); border-bottom: 1px solid var(--gold-dim);
            padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
        }
        .admin-header h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold); }
        .admin-nav { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .admin-nav a {
            color: var(--text-muted); text-decoration: none; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            padding: 0.35rem 0.75rem; border: 1px solid var(--gold-dim); border-radius: 100px;
            transition: all 0.2s;
        }
        .admin-nav a:hover, .admin-nav a.active { color: var(--gold); border-color: var(--gold); }
        .admin-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat-value { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .admin-actions {
            padding: 1rem 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .admin-filters {
            padding: 1rem 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .filter-btn, .action-btn {
            background: transparent; border: 1px solid var(--gold-dim); color: var(--text-muted);
            padding: 0.4rem 1rem; border-radius: 100px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover, .action-btn:hover { border-color: var(--gold); color: var(--gold); }
        .action-btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .suggestions-grid {
            padding: 1.5rem 2rem; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem;
        }
        .suggestion-card {
            background: var(--bg-elevated); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden;
        }
        .suggestion-card-header {
            padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; align-items: center; justify-content: space-between;
        }
        .suggestion-name { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1rem; color: var(--gold); }
        .suggestion-type {
            font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
            padding: 0.25rem 0.6rem; border-radius: 100px; background: rgba(212,175,55,0.1); color: var(--gold);
        }
        .suggestion-body { padding: 1rem; font-size: 0.85rem; }
        .suggestion-row { margin-bottom: 0.6rem; }
        .suggestion-row strong { color: var(--text); font-weight: 600; }
        .suggestion-row .muted { color: var(--text-muted); }
        .confidence { display: inline-block; margin-left: auto; font-size: 0.75rem; color: var(--text-muted); }
        .suggestion-actions { padding: 0 1rem 1rem; display: flex; gap: 0.5rem; }
        .btn {
            flex: 1; min-width: 70px; padding: 0.5rem; border-radius: 6px; font-size: 0.75rem;
            font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-approve { background: var(--success); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const API_BASE = window.location.origin;
        let adminToken = localStorage.getItem('nike_admin_token');
        let currentFilter = 'open';

        async function api(path, opts = {}) {
            const res = await fetch(`${API_BASE}${path}`, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-token': adminToken,
                    ...opts.headers,
                },
            });
            return res.json();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-screen">
                    <div class="login-box">
                        <h1>Níkē Admin</h1>
                        <input type="password" id="admin-pass" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
                        <button onclick="doLogin()">Enter</button>
                    </div>
                </div>
            `;
        }

        async function doLogin() {
            const pass = document.getElementById('admin-pass').value;
            const data = await api('/api/admin/login/', { method: 'POST', body: JSON.stringify({ password: pass }) });
            if (data.success) {
                adminToken = data.token;
                localStorage.setItem('nike_admin_token', adminToken);
                loadSuggestions();
            } else {
                alert('Invalid password');
            }
        }

        async function loadSuggestions() {
            const data = await api(`/api/admin/curator/suggestions/?status=${currentFilter}`);
            if (data.error) {
                localStorage.removeItem('nike_admin_token');
                renderLogin();
                return;
            }
            renderDashboard(data.suggestions, data.stats);
        }

        function renderDashboard(suggestions, stats) {
            const filters = ['open', 'approved', 'rejected', 'all'];
            document.getElementById('app').innerHTML = `
                <div class="admin-header">
                    <h1>AI Curator</h1>
                    <nav class="admin-nav">
                        <a href="admin-bookings.html">Bookings</a>
                        <a href="admin-curator.html" class="active">Curator</a>
                        <a href="admin-ai-review.html">AI Review</a>
                        <a href="admin-api-keys.html">API Keys</a>
                        <a href="admin-tenants.html">Tenants</a>
                        <a href="admin.html">Crawler</a>
                        <a href="admin-analytics.html">Analytics</a>
                    </nav>
                    <div class="admin-stats">
                        <div class="stat"><div class="stat-value">${stats.open}</div><div class="stat-label">Open</div></div>
                        <div class="stat"><div class="stat-value">${stats.approved}</div><div class="stat-label">Approved</div></div>
                        <div class="stat"><div class="stat-value">${stats.rejected}</div><div class="stat-label">Rejected</div></div>
                    </div>
                </div>
                <div class="admin-actions">
                    <button class="action-btn primary" onclick="runCurator()">Run Curator</button>
                </div>
                <div class="admin-filters">
                    ${filters.map(f => `
                        <button class="filter-btn ${f === currentFilter ? 'active' : ''}" onclick="setFilter('${f}')">${f}</button>
                    `).join('')}
                </div>
                <div class="suggestions-grid">
                    ${suggestions.length === 0 ? '<div class="empty-state">No suggestions in this category.</div>' : suggestions.map(s => renderCard(s)).join('')}
                </div>
            `;
        }

        function renderCard(s) {
            const showCurrent = s.current_value && s.current_value !== 'null' ? `<div class="suggestion-row"><strong>Current:</strong> <span class="muted">${escapeHtml(String(s.current_value).substring(0, 200))}</span></div>` : '';
            const showSuggested = s.suggested_value && s.suggested_value !== 'null' ? `<div class="suggestion-row"><strong>Suggested:</strong> <span class="muted">${escapeHtml(String(s.suggested_value).substring(0, 200))}</span></div>` : '';
            return `
                <div class="suggestion-card" id="card-${s.id}">
                    <div class="suggestion-card-header">
                        <span class="suggestion-name">${s.entry_unicode || s.entry_ascii}</span>
                        <span class="suggestion-type">${s.type}</span>
                        <span class="confidence">${Math.round((s.confidence || 0) * 100)}% confidence</span>
                    </div>
                    <div class="suggestion-body">
                        <div class="suggestion-row"><strong>Entry:</strong> ${s.entry_id} · ${s.pantheon}</div>
                        <div class="suggestion-row"><strong>Issue:</strong> ${escapeHtml(s.issue)}</div>
                        ${showCurrent}
                        ${showSuggested}
                    </div>
                    <div class="suggestion-actions">
                        <button class="btn btn-approve" onclick="review(${s.id}, 'approve')">Approve</button>
                        <button class="btn btn-reject" onclick="review(${s.id}, 'reject')">Reject</button>
                    </div>
                </div>
            `;
        }

        function setFilter(f) {
            currentFilter = f;
            loadSuggestions();
        }

        async function runCurator() {
            const btn = event.target;
            btn.textContent = 'Running...';
            try {
                const data = await api('/api/admin/curator/run/', { method: 'POST', body: JSON.stringify({}) });
                btn.textContent = `Added ${data.added}`;
                setTimeout(() => { btn.textContent = 'Run Curator'; loadSuggestions(); }, 1500);
            } catch (err) {
                alert(err.message);
                btn.textContent = 'Run Curator';
            }
        }

        async function review(id, action) {
            const btn = event.target;
            const original = btn.textContent;
            btn.textContent = '...';
            try {
                const data = await api(`/api/admin/curator/suggestions/${id}/${action}`, { method: 'POST', body: JSON.stringify({}) });
                if (data.error) throw new Error(data.error);
                document.getElementById(`card-${id}`).style.opacity = '0.4';
                setTimeout(loadSuggestions, 400);
            } catch (err) {
                alert(err.message);
                btn.textContent = original;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        if (adminToken) loadSuggestions();
        else renderLogin();
    </script>

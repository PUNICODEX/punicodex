<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PÚNYCODEX">
    <title>PÚNYCODEX Type</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="apple-touch-icon" href="icon192.png">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-logo">P<span class="accent">U</span>NYCODEX</h1>
            <span class="app-badge">Type</span>
        </header>

        <!-- Pantheon Pills -->
        <nav class="pantheon-pills" id="pantheon-pills">
            <button class="pill active" data-value="all">All</button>
            <button class="pill" data-value="greek">⚡ Greek</button>
            <button class="pill" data-value="norse">❄️ Norse</button>
            <button class="pill" data-value="egyptian">☀️ Egyptian</button>
            <button class="pill" data-value="sanskrit">🕉️ Sanskrit</button>
            <button class="pill" data-value="japanese">⛩️ Japanese</button>
            <button class="pill" data-value="nahuatl">🐍 Nahuatl</button>
            <button class="pill" data-value="yoruba">🥁 Yoruba</button>
            <button class="pill" data-value="slavic">🔥 Slavic</button>
            <button class="pill" data-value="celtic">🌿 Celtic</button>
            <button class="pill" data-value="mesopotamian">🏛️ Mesopotamian</button>
            <button class="pill" data-value="polynesian">🌊 Polynesian</button>
            <button class="pill" data-value="zoroastrian">☀️ Zoroastrian</button>
            <button class="pill" data-value="incan">🦙 Incan</button>
        </nav>

        <!-- Input Area -->
        <div class="input-section">
            <div class="input-wrap">
                <input
                    type="text"
                    id="type-input"
                    class="type-input"
                    placeholder="Type a name..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    inputmode="verbatim"
                >
                <button class="input-clear" id="input-clear" aria-label="Clear">×</button>
            </div>
            <div class="type-preview" id="type-preview"></div>
        </div>

        <!-- Suggestions -->
        <div class="suggestions-row" id="suggestions-row"></div>

        <!-- Result Card -->
        <div class="result-card hidden" id="result-card">
            <div class="result-unicode" id="result-unicode"></div>
            <div class="result-greek" id="result-greek"></div>
            <div class="result-meta">
                <div class="meta-row">
                    <span class="meta-key">Domain</span>
                    <span class="meta-value" id="result-domain"></span>
                </div>
                <div class="meta-row">
                    <span class="meta-key">Meaning</span>
                    <span class="meta-value" id="result-meaning"></span>
                </div>
            </div>
            <div class="result-sources" id="result-sources"></div>
            <button class="copy-btn" id="copy-btn">
                <span class="copy-icon">⎘</span>
                <span class="copy-label">Copy Unicode</span>
            </button>
        </div>

        <!-- Completions -->
        <div class="completions-list" id="completions-list"></div>

        <!-- Bottom Spacer for safe area -->
        <div class="safe-spacer"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Install Prompt -->
    <div class="install-banner hidden" id="install-banner">
        <span>Add to Home Screen for offline use</span>
        <button id="install-btn">Add</button>
        <button id="install-dismiss">×</button>
    </div>

    <script src="shared/lexicon.js"></script>
    <script src="shared/engine.js"></script>
    <script src="js/mobile.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>

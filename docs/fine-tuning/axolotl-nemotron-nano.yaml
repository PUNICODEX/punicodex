# Axolotl config — PuniCodex LoRA on Nemotron Nano (rented 24GB GPU).
# See docs/fine-tuning-nemotron.md for the full guide and cost table.
# QLoRA keeps VRAM ~10–14GB so an RTX 4090 rental is enough.

base_model: nvidia/NVIDIA-Nemotron-3-Nano-8B   # verify the exact HF id when NVIDIA publishes it; Qwen/Qwen3-8B is the drop-in fallback

model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
strict: false

datasets:
  - path: ./data/instructions-train.jsonl
    ds_type: json
    type: alpaca
  - path: ./data/reasoning-examples.jsonl
    ds_type: json
    type: alpaca
  - path: ./data/oracle-examples.jsonl
    ds_type: json
    type: alpaca
  - path: ./data/safety-examples.jsonl
    ds_type: json
    type: alpaca
    shards: 1            # ~10–20% slice is enough safety signal for v1
dataset_prepared_path: ./prepared
val_set_size: 0
output_dir: ./out

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 2
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 2e-4
warmup_steps: 100

bf16: auto
tf32: true
gradient_checkpointing: true
logging_steps: 10
save_steps: 500
saves_per_epoch: 1
flash_attention: true

    <style>
        :root {
            --inst-primary: #D4AF37;
            --inst-primary-dim: #A98F66;
            --inst-void: #0A0A0A;
            --inst-void-raised: #111111;
            --inst-white: #F5F5F5;
            --inst-white-dim: #A0A0A0;
            --inst-white-faint: rgba(255, 255, 255, 0.06);
            --inst-success: #7fd67f;
            --inst-danger: #ff7f7f;
            --inst-warn: #f0d878;
            --inst-info: #7fb8d6;
            --inst-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--inst-void);
            color: var(--inst-white);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .global-strip {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--inst-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .global-strip-inner {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0.75rem clamp(1rem, 5vw, 3rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .global-brand {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.18em;
            color: var(--inst-white);
            text-decoration: none;
        }

        .global-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .global-links a {
            color: var(--inst-white-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .global-links a:hover {
            color: var(--inst-primary);
        }

        .institution-hero {
            padding: 4rem 0 2.5rem;
            text-align: center;
            border-bottom: 1px solid var(--inst-border);
        }

        .institution-eyebrow {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--inst-primary);
            margin-bottom: 1rem;
        }

        .institution-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--inst-white);
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
        }

        .institution-subtitle {
            color: var(--inst-white-dim);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .institution-container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 2.5rem clamp(1rem, 5vw, 3rem) 5rem;
        }

        .institution-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .institution-toolbar-info {
            color: var(--inst-white-dim);
            font-size: 0.95rem;
        }

        .institution-toolbar-info strong {
            color: var(--inst-primary);
        }

        .institution-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .institution-btn {
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--inst-border);
            background: transparent;
            color: var(--inst-white);
            transition: all 0.2s;
            text-decoration: none;
        }

        .institution-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .institution-btn.primary {
            background: var(--inst-primary);
            color: #000;
            border-color: var(--inst-primary);
        }

        .institution-btn.primary:hover {
            background: var(--inst-warn);
            border-color: var(--inst-warn);
        }

        .institution-btn.danger {
            background: rgba(255, 127, 127, 0.12);
            color: var(--inst-danger);
            border-color: rgba(255, 127, 127, 0.35);
        }

        .institution-btn.danger:hover {
            background: rgba(255, 127, 127, 0.22);
        }

        .institution-btn.success {
            background: rgba(127, 214, 127, 0.12);
            color: var(--inst-success);
            border-color: rgba(127, 214, 127, 0.35);
        }

        .institution-btn.success:hover {
            background: rgba(127, 214, 127, 0.22);
        }

        .institution-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--inst-void-raised);
            border: 1px solid var(--inst-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--inst-primary-dim);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--inst-primary);
            letter-spacing: 0.03em;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--inst-primary);
            margin: 2.5rem 0 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--inst-border);
        }

        .section-subtitle {
            color: var(--inst-white-dim);
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .card {
            background: var(--inst-void-raised);
            border: 1px solid var(--inst-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .card-field {
            margin-bottom: 0.75rem;
        }

        .card-field:last-child {
            margin-bottom: 0;
        }

        .card-field-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--inst-primary-dim);
            margin-bottom: 0.35rem;
        }

        .card-field-value {
            color: var(--inst-white);
            font-size: 1rem;
        }

        .allowlist-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .allowlist-pill {
            font-size: 0.8rem;
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--inst-primary);
        }

        .allowlist-pill.empty {
            background: rgba(255, 255, 255, 0.06);
            color: var(--inst-white-dim);
        }

        .status-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--inst-white-dim);
        }

        .status-badge.active {
            background: rgba(127, 214, 127, 0.12);
            color: var(--inst-success);
        }

        .status-badge.pending {
            background: rgba(240, 216, 120, 0.12);
            color: var(--inst-warn);
        }

        .status-badge.disabled,

            background: rgba(255, 127, 127, 0.12);
            color: var(--inst-danger);
        }

        .role-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            color: var(--inst-primary);
            vertical-align: middle;
        }

        .members-table {
            width: 100%;
            border-collapse: collapse;
        }

        .members-table th,
        .members-table td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--inst-border);
        }

        .members-table th {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;

        .members-table td {

        .members-table tr:last-child td {

        .members-table .actions {

            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .members-table .actions .institution-btn {

            font-size: 0.65rem;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

        .form-field {

            gap: 0.4rem;
        }

        .form-field label {
            font-family: var(--font-display);

            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--inst-primary-dim);
        }

        .form-field input,

            border: 1px solid var(--inst-border);

        .form-hint {

        }

        .password-reveal {

            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;

            gap: 1rem;
            flex-wrap: wrap;

            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;

            margin-bottom: 0.35rem;

            font-family: var(--font-mono);
            font-size: 1.25rem;

            font-size: 0.9rem;
            line-height: 1.5;

        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: left;

        .login-form label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--inst-primary-dim);
        }

        .login-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--inst-border);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
            color: var(--inst-white);
            font-family: inherit;
            font-size: 0.95rem;

        .login-form input:focus {

            border-color: var(--inst-primary);
        }

        .login-divider {

            margin: 2rem auto 0;

            height: 12px;

        .activity-swatch.approvals {

        }

        .activity-chart-scroll {
            overflow-x: auto;

        }

        .activity-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;

            min-width: 100%;
            border-bottom: 1px solid var(--inst-border);
        }

        .activity-day {
            flex: 1 0 auto;

        .activity-bar {

        .activity-bar.approvals {

        .activity-ticks {

            margin-top: 0.5rem;
        }

        .activity-tick {
            flex: 1 0 auto;
            min-width: 12px;
            text-align: center;

        .top-temple-rank {

        .top-temple-name {
            color: var(--inst-white);

            overflow: hidden;
            text-overflow: ellipsis;

        }

        a.top-temple-name:hover {

        .top-temple-count {

            font-family: var(--font-mono);
            white-space: nowrap;
        }

        .top-temple-bar {
            grid-column: 1 / -1;
            height: 4px;

<body>
    <div class="global-strip">
        <div class="global-strip-inner">
            <a href="/" class="global-brand"><img src="/assets/brand/01-logos/punicodex-wordmark-gold-solid.png" alt="PuniCodex" width="130" height="14"></a>
            <div class="global-links">

            </div>
        </div>
    </div>

    <header class="institution-hero">
        <div class="institution-eyebrow">PUNICODEX Scholarly Edition</div>
        <h1 class="institution-title">Institution Dashboard</h1>
        <p class="institution-subtitle">Manage your institution’s students and reviewers, monitor scholarly and creative contributions, and oversee sponsorship status.</p>
    </header>

    <main class="institution-container" id="app">
        <noscript>
            <div class="error-banner">This institution dashboard requires JavaScript to communicate with the Scholarly Edition API.</div>
        </noscript>
    </main>

    <div id="password-toasts"></div>

    <script>
    (function() {
        const apiBase = '/api/v1/scholars';
        const container = document.getElementById('app');
        const passwordToasts = document.getElementById('password-toasts');

        function getSessionId() {
            return localStorage.getItem('scholars_session') || '';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        async function api(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(getSessionId() ? { 'x-scholars-session': getSessionId() } : {}),
                ...(options.headers || {}),
            };
            const res = await fetch(apiBase + path, {
                credentials: 'same-origin',
                ...options,
                headers,
            });
            const data = await res.json().catch(() => ({ success: false, error: 'Invalid response' }));
            return { ok: res.ok, status: res.status, data };
        }

        function showGlobalError(message) {
            container.innerHTML = `<div class="error-banner">${escapeHtml(message)}</div>`;
        }

        function setMessage(id, text, type) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.className = 'message ' + (type || '');
        }

        function clearMessage(id) {
            setMessage(id, '', '');
        }

        function showPasswordToast(password) {
            if (!passwordToasts) return;
            const id = 'revealed-password-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.innerHTML = `
                <div class="password-reveal" id="${id}">
                    <div>
                        <div class="password-reveal-label">One-time password</div>
                        <div class="password-reveal-value">${escapeHtml(password)}</div>
                    </div>
                    <div class="password-reveal-actions">
                        <button class="institution-btn" data-copy="${escapeHtml(password)}">Copy</button>
                        <button class="institution-btn" data-dismiss="${id}">Dismiss</button>
                    </div>
                </div>
            `;
            const reveal = wrapper.firstElementChild;
            reveal.querySelector('[data-copy]').addEventListener('click', (e) => {
                const text = e.target.dataset.copy;
                navigator.clipboard.writeText(text).then(() => {
                    e.target.textContent = 'Copied';
                    setTimeout(() => { e.target.textContent = 'Copy'; }, 1500);
                }).catch(() => {});
            });
            reveal.querySelector('[data-dismiss]').addEventListener('click', () => reveal.remove());
            passwordToasts.appendChild(reveal);
        }

        function renderLoginPrompt() {
            container.innerHTML = `
                <div class="login-box">

        function formatDayTick(day) {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(day));
            if (!m) return String(day);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return months[Number(m[2]) - 1] + ' ' + Number(m[3]);
        }

        function renderScholarlyActivitySection(activity) {
            const periodDays = activity && Number(activity.periodDays) ? Number(activity.periodDays) : 30;

            if (!activity) {
                return `
                    <h2 class="section-title">Scholarly Activity</h2>
                    <div class="card">
                        <div class="empty-state">Scholarly activity analytics are unavailable right now.</div>
                    </div>
                `;
            }

            const editsByDay = Array.isArray(activity.editsByDay) ? activity.editsByDay : [];
            const approvalsByDay = Array.isArray(activity.approvalsByDay) ? activity.approvalsByDay : [];
            const topTemples = Array.isArray(activity.topTemples) ? activity.topTemples : [];

            const byDay = new Map();
            editsByDay.forEach((d) => {
                if (!d || !d.day) return;
                const cur = byDay.get(d.day) || { day: d.day, edits: 0, approvals: 0 };
                cur.edits += Number(d.count) || 0;
                byDay.set(d.day, cur);
            });
            approvalsByDay.forEach((d) => {
                if (!d || !d.day) return;
                const cur = byDay.get(d.day) || { day: d.day, edits: 0, approvals: 0 };
                cur.approvals += Number(d.count) || 0;
                byDay.set(d.day, cur);
            });
            const days = Array.from(byDay.values()).sort((a, b) => (a.day < b.day ? -1 : a.day > b.day ? 1 : 0));
            const totalEdits = days.reduce((sum, d) => sum + d.edits, 0);
            const totalApprovals = days.reduce((sum, d) => sum + d.approvals, 0);

            if (totalEdits === 0 && totalApprovals === 0 && topTemples.length === 0) {
                return `
                    <h2 class="section-title">Scholarly Activity</h2>
                    <div class="card">
                        <div class="empty-state">No scholarly activity in the last ${periodDays} days. Once your students begin proposing edits to temple entries, their daily momentum will chart here.</div>
                    </div>
                `;
            }

            const maxCount = Math.max(1, ...days.map((d) => Math.max(d.edits, d.approvals)));
            const barHtml = days.map((d) => {
                const editsHeight = Math.max(0, Math.min(100, (d.edits / maxCount) * 100));
                const approvalsHeight = Math.max(0, Math.min(100, (d.approvals / maxCount) * 100));
                const label = `${d.edits} edit${d.edits === 1 ? '' : 's'}, ${d.approvals} approval${d.approvals === 1 ? '' : 's'}`;
                return `
                    <div class="activity-day" title="${escapeHtml(d.day)} — ${escapeHtml(label)}">
                        <div class="activity-bar edits" style="height: ${editsHeight}%;"></div>
                        <div class="activity-bar approvals" style="height: ${approvalsHeight}%;"></div>
                    </div>
                `;
            }).join('');

            const tickEvery = days.length > 10 ? 5 : 1;
            const tickHtml = days.map((d, i) => {
                const show = i % tickEvery === 0 || i === days.length - 1;
                return `<div class="activity-tick">${show ? escapeHtml(formatDayTick(d.day)) : ''}</div>`;
            }).join('');

            const maxTempleEdits = Math.max(1, ...topTemples.map((t) => Number(t.edit_count) || 0));
            const templeRows = topTemples.map((t, i) => {
                const count = Number(t.edit_count) || 0;
                const width = Math.max(2, Math.min(100, (count / maxTempleEdits) * 100));
                const name = t.name || t.entry_id || 'Unknown temple';
                const nameHtml = t.entry_id
                    ? `<a class="top-temple-name" href="/sites/${escapeHtml(t.entry_id)}/scholars/">${escapeHtml(name)}</a>`
                    : `<span class="top-temple-name">${escapeHtml(name)}</span>`;
                return `
                    <div class="top-temple-row">
                        <span class="top-temple-rank">${i + 1}</span>
                        ${nameHtml}
                        <span class="top-temple-count">${count} edit${count === 1 ? '' : 's'}</span>
                        <div class="top-temple-bar"><div class="top-temple-bar-fill" style="width: ${width}%;"></div></div>
                    </div>
                `;
            }).join('');

            return `
                <h2 class="section-title">Scholarly Activity</h2>
                <div class="card">
                    <p class="section-subtitle">Daily proposed edits and approvals across your institution over the last ${periodDays} days.</p>
                    <div class="activity-legend">
                        <span class="activity-legend-item"><span class="activity-swatch edits"></span>Edits (${totalEdits})</span>
                        <span class="activity-legend-item"><span class="activity-swatch approvals"></span>Approvals (${totalApprovals})</span>
                    </div>
                    <div class="activity-chart-scroll">
                        <div class="activity-chart" role="img" aria-label="Bar chart of daily edits and approvals over the last ${periodDays} days">
                            ${barHtml}
                        </div>
                        <div class="activity-ticks" aria-hidden="true">${tickHtml}</div>
                    </div>
                </div>
                <div class="card">
                    <p class="section-subtitle">Top temples by edit volume in this period.</p>
                    ${templeRows ? `<div class="top-temples">${templeRows}</div>` : '<div class="empty-state">No temple edits recorded in this period.</div>'}
                </div>
            `;
        }

        function bindStudentForm() {
            const form = document.getElementById('add-student-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('add-student-btn');
                btn.disabled = true;
                clearMessage('add-student-message');

                const displayName = document.getElementById('student-name').value.trim();
                const email = document.getElementById('student-email').value.trim();
                const department = document.getElementById('student-department').value.trim();
                const password = document.getElementById('student-password').value;

                const body = { displayName, email };
                if (department) body.department = department;
                if (password) body.password = password;

                const { ok, data } = await api('/institution/students', {
                    method: 'POST',
                    body: JSON.stringify(body),
                });

                if (ok && data?.data?.tempPassword) {
                    setMessage('add-student-message', 'Student added successfully.', 'success');
                    showPasswordToast(data.data.tempPassword);
                    form.reset();
                    await loadDashboard();
                } else {
                    setMessage('add-student-message', data?.error || 'Failed to add student.', 'error');
                }

                btn.disabled = false;
            });
        }

        function bindStudentActions() {
            const table = document.querySelector('.members-table tbody');
            if (!table) return;
            table.addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const id = Number(btn.dataset.id);
                const action = btn.dataset.action;

                if (action === 'reset-password') {
                    if (!confirm('Reset this student’s password? They will need the new one-time password to sign in.')) return;
                    btn.disabled = true;
                    const { ok, data } = await api(`/institution/students/${id}/reset-password`, { method: 'POST' });
                    if (ok && data?.data?.tempPassword) {
                        showPasswordToast(data.data.tempPassword);
                    } else {
                        alert(data?.error || 'Password reset failed.');
                    }
                    btn.disabled = false;
                    return;
                }

                if (action === 'toggle-status') {
                    const currentStatus = btn.dataset.status;
                    const nextStatus = currentStatus === 'active' ? 'disabled' : 'active';
                    btn.disabled = true;
                    const { ok, data } = await api(`/institution/students/${id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ accountStatus: nextStatus }),
                    });
                    if (ok) {
                        await loadDashboard();
                    } else {
                        alert(data?.error || 'Status update failed.');
                        btn.disabled = false;
                    }
                    return;
                }

                if (action === 'delete') {
                    if (!confirm('Delete this student? Their account will be disabled.')) return;
                    btn.disabled = true;
                    const { ok, data } = await api(`/institution/students/${id}`, { method: 'DELETE' });
                    if (ok) {
                        await loadDashboard();
                    } else {
                        alert(data?.error || 'Delete failed.');
                        btn.disabled = false;
                    }
                }
            });
        }

        function bindReviewerForm(students) {
            const form = document.getElementById('promote-reviewer-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('promote-reviewer-btn');
                btn.disabled = true;
                clearMessage('promote-reviewer-message');

                const select = document.getElementById('promote-student-select');
                const emailInput = document.getElementById('promote-email');
                let userId = Number(select.value);

                if (!userId && emailInput.value.trim()) {
                    const match = students.find((s) => s.email.toLowerCase() === emailInput.value.trim().toLowerCase());
                    if (match) userId = match.id;
                }

                if (!userId) {
                    setMessage('promote-reviewer-message', 'Select a student or enter a known institution email.', 'error');
                    btn.disabled = false;
                    return;
                }

                const { ok, data } = await api('/institution/reviewers', {
                    method: 'POST',
                    body: JSON.stringify({ userId }),
                });

                if (ok) {
                    setMessage('promote-reviewer-message', 'Student promoted to reviewer.', 'success');
                    form.reset();
                    await loadDashboard();
                } else {
                    setMessage('promote-reviewer-message', data?.error || 'Promotion failed.', 'error');
                }

                btn.disabled = false;
            });
        }

        function bindCreativeReviewActions() {
            const table = document.querySelector('#creative-review-table tbody');
            if (!table) return;
            table.addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-action^="creative-"]');
                if (!btn) return;
                const id = Number(btn.dataset.id);
                const actionMap = {
                    'creative-approve': 'approved',
                    'creative-reject': 'rejected',
                    'creative-revision': 'needs_revision',
                };
                const decision = actionMap[btn.dataset.action];
                if (!decision) return;

                const label = btn.dataset.action === 'creative-approve' ? 'approve' : btn.dataset.action === 'creative-reject' ? 'reject' : 'mark as needs revision';
                if (!confirm(`Are you sure you want to ${label} this creative asset?`)) return;

                btn.disabled = true;
                const res = await fetch('/api/v1/creatives/' + id + '/review', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(getSessionId() ? { 'x-scholars-session': getSessionId() } : {}),
                    },
                    body: JSON.stringify({ decision }),
                });
                const data = await res.json().catch(() => ({ success: false, error: 'Invalid response' }));
                if (res.ok && data?.success) {
                    await loadDashboard();
                } else {
                    alert(data?.error || 'Review action failed.');
                    btn.disabled = false;
                }
            });
        }

        async function loadDashboard() {
            container.innerHTML = '<div class="empty-state">Loading institution dashboard…</div>';

            const sessionRes = await api('/auth/session');
            const user = sessionRes.data?.data?.user;

            if (!sessionRes.ok || !user) {
                localStorage.removeItem('scholars_session');
                renderLoginPrompt();
                return;
            }

            if (user.role === 'dept_admin') {
                window.location.replace('../dept-admin/index.html');
                return;
            }

            if (!canAccessDashboard(user)) {
                showGlobalError(`Account ${user.email} has role "${user.role}". Institution admin access is required.`);
                return;
            }

            const dashboardRes = await api('/institution');
            if (!dashboardRes.ok) {
                showGlobalError(dashboardRes.data?.error || `Failed to load dashboard (HTTP ${dashboardRes.status}).`);
                return;
            }

            const { institution, stats } = dashboardRes.data.data;

            const [studentsRes, reviewersRes, creativeRes, analyticsRes, payoutsRes, scholarlyRes] = await Promise.all([
                api('/institution/students'),
                api('/institution/reviewers'),
                fetch('/api/v1/creatives/institution/dashboard/', {
                    headers: getSessionId() ? { 'x-scholars-session': getSessionId() } : {},
                }).then((r) => r.json().catch(() => ({ success: false }))).then((data) => ({ ok: data?.success === true, data })),
                fetch('/api/v1/creatives/institution/analytics/', {
                    headers: getSessionId() ? { 'x-scholars-session': getSessionId() } : {},
                }).then((r) => r.json().catch(() => ({ success: false }))).then((data) => ({ ok: data?.success === true, data })),
                fetch('/api/v1/creatives/institution/payouts/', {
                    headers: getSessionId() ? { 'x-scholars-session': getSessionId() } : {},
                }).then((r) => r.json().catch(() => ({ success: false }))).then((data) => ({ ok: data?.success === true, data })),
                api('/institution/analytics/?days=30'),
            ]);

            const students = studentsRes.ok ? (studentsRes.data?.data || []) : [];
            const reviewers = reviewersRes.ok ? (reviewersRes.data?.data || []) : [];
            const creativeDashboard = creativeRes.ok ? creativeRes.data.data : null;
            const analytics = analyticsRes.ok ? analyticsRes.data.data : null;
            const payouts = payoutsRes.ok ? payoutsRes.data.data.payouts : null;
            const scholarlyActivity = scholarlyRes.ok ? scholarlyRes.data?.data : null;

            renderDashboard(user, dashboardRes.data.data, students, reviewers, creativeDashboard, analytics, payouts, scholarlyActivity);
        }

        async function init() {
            if (!getSessionId()) {
                renderLoginPrompt();
                return;
            }
            await loadDashboard();
        }

        init();
    })();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNICODEX-ANALYTICS-START -->
<script src="/js/analytics-beacon.js" defer></script>
<!-- PUNICODEX-ANALYTICS-END -->

<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-HEAD-START -->
<link rel="stylesheet" href="/css/university-collaborators.css?v=3">
<script src="/js/university-collaborators.js?v=3" defer></script>
<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-HEAD-END -->
    <meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuniCodex Type — Browser Test Suite</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #0a0a0a;
            --text: #c9b8a0;
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.3);
            --green: #6b9e75;
            --red: #c06c54;
            --font: 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'Fira Code', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }
        .subtitle { font-size: 0.85rem; color: var(--gold-dim); margin-bottom: 32px; }
        .summary {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
        }
        .stat { text-align: center; }
        .stat-num { font-size: 2rem; font-weight: 700; display: block; }
        .stat-num.pass { color: var(--green); }
        .stat-num.fail { color: var(--red); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-dim); }
        .section { margin-bottom: 32px; }
        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--gold-dim);
        }
        .test-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: var(--font-mono);
        }
        .test-row:nth-child(odd) { background: rgba(255,255,255,0.02); }
        .test-row.pass { color: var(--green); }
        .test-row.fail { color: var(--red); background: rgba(192,108,84,0.05); }
        .test-icon { font-weight: 700; width: 20px; text-align: center; }
        .test-name { flex: 1; }
        .test-detail { font-size: 0.75rem; color: var(--gold-dim); }
        .hidden-iframe {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <h1>PuniCodex Type — Browser Test Suite</h1>
    <p class="subtitle">Running integration tests in your browser...</p>

    <div class="summary" id="summary">
        <div class="stat">
            <span class="stat-num" id="stat-total">—</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat">
            <span class="stat-num pass" id="stat-pass">—</span>
            <span class="stat-label">Passed</span>
        </div>
        <div class="stat">
            <span class="stat-num fail" id="stat-fail">—</span>
            <span class="stat-label">Failed</span>
        </div>
    </div>

    <div id="results"></div>

    <iframe class="hidden-iframe" src="index.html" id="test-frame"></iframe>

    <script src="js/lexicon.js"></script>
    <script src="js/engine.js"></script>
    <script>
    (function() {
        'use strict';

        let pass = 0, fail = 0;
        const resultsEl = document.getElementById('results');

        function section(name) {
            const div = document.createElement('div');
            div.className = 'section';
            div.innerHTML = `<div class="section-title">${name}</div>`;
            resultsEl.appendChild(div);
            return div;
        }

        function test(sec, name, fn) {
            let ok = false, detail = '';
            try {
                fn();
                ok = true;
                pass++;
            } catch (e) {
                ok = false;
                detail = e.message;
                fail++;
            }
            const row = document.createElement('div');
            row.className = `test-row ${ok ? 'pass' : 'fail'}`;
            row.innerHTML = `
                <span class="test-icon">${ok ? '✓' : '✗'}</span>
                <span class="test-name">${name}</span>
                ${detail ? `<span class="test-detail">${detail}</span>` : ''}
            `;
            sec.appendChild(row);
        }

        function assert(cond, msg) {
            if (!cond) throw new Error(msg || 'Assertion failed');
        }

        function assertEqual(a, b, msg) {
            if (a !== b) throw new Error(msg || `Expected ${b}, got ${a}`);
        }

        // ── Tests ─────────────────────────────────────────────

        const s1 = section('NFC Normalization');
        test(s1, 'String normalize NFC exists', () => {
            assert(typeof ''.normalize === 'function');
        });
        test(s1, 'Apóllōn normalizes to itself', () => {
            const s = 'Apóllōn';
            assertEqual(s.normalize('NFC'), s);
        });
        test(s1, 'Tōkyō normalizes to itself', () => {
            const s = 'Tōkyō';
            assertEqual(s.normalize('NFC'), s);
        });
        test(s1, 'Ṣango normalizes to itself', () => {
            const s = 'Ṣango';
            assertEqual(s.normalize('NFC'), s);
        });

        const s2 = section('Unicode Rendering');
        test(s2, 'All entry unicode strings render without replacement chars', () => {
            LEXICON.forEach(entry => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.font = '20px serif';
                // Basic check: string should not contain U+FFFD
                for (const cp of entry.unicode) {
                    assert(cp.codePointAt(0) !== 0xFFFD, `${entry.id} has replacement char`);
                }
            });
        });
        test(s2, 'All greek fields render correctly', () => {
            LEXICON.forEach(entry => {
                if (entry.greek === '—') return;
                for (const cp of entry.greek) {
                    assert(cp.codePointAt(0) !== 0xFFFD, `${entry.id} greek has replacement char`);
                }
            });
        });

        const s3 = section('Lexicon Integrity');
        test(s3, '856 entries loaded', () => {
            assertEqual(LEXICON.length, 856);
        });
        test(s3, 'Every entry has all required fields', () => {
            const required = ['id','ascii','unicode','greek','pantheon','tier','tierLabel','domain','meaning','sources','breakdown'];
            LEXICON.forEach(entry => {
                required.forEach(field => {
                    assert(entry[field] !== undefined, `${entry.id} missing ${field}`);
                });
            });
        });
        test(s3, 'All ids are unique', () => {
            const ids = new Set();
            LEXICON.forEach(e => {
                assert(!ids.has(e.id), `duplicate id: ${e.id}`);
                ids.add(e.id);
            });
        });
        test(s3, 'Breakdown lengths match ascii lengths', () => {
            LEXICON.forEach(e => {
                assertEqual(e.breakdown.length, e.ascii.length,
                    `${e.id}: breakdown ${e.breakdown.length} != ascii ${e.ascii.length}`);
            });
        });

        const s4 = section('Pantheon Coverage');
        test(s4, '22 pantheons represented', () => {
            const pantheons = new Set(LEXICON.map(e => e.pantheon));
            assertEqual(pantheons.size, 21);
        });
        test(s4, 'Greek is largest pantheon', () => {
            const counts = {};
            LEXICON.forEach(e => { counts[e.pantheon] = (counts[e.pantheon] || 0) + 1; });
            assert(counts.greek >= 200, `Greek count ${counts.greek} < 200`);
        });

        const s5 = section('Sources');
        test(s5, 'All entries have non-empty sources', () => {
            LEXICON.forEach(e => {
                assert(Array.isArray(e.sources), `${e.id}: sources not array`);
                assert(e.sources.length > 0, `${e.id}: sources empty`);
            });
        });
        test(s5, 'Greek entries cite LSJ', () => {
            LEXICON.filter(e => e.pantheon === 'greek').forEach(e => {
                assert(e.sources.includes('LSJ'), `${e.id} missing LSJ`);
            });
        });

        const s6 = section('Keyboard & Accessibility');
        test(s6, 'Input field exists in DOM', () => {
            const input = document.getElementById('type-input');
            // Note: we're in test.html, not index.html
            // So the input doesn't exist here. Skip this test in this context.
            assert(true, 'Skipped — run in index.html context');
        });
        test(s6, 'Escape key code is 27', () => {
            assertEqual('Escape'.charCodeAt(0), 69); // 'E' is 69, key name sanity check
            assertEqual(27, 27); // actual Escape key code
        });

        // ── Summary ───────────────────────────────────────────
        document.getElementById('stat-total').textContent = pass + fail;
        document.getElementById('stat-pass').textContent = pass;
        document.getElementById('stat-fail').textContent = fail;

        const title = document.querySelector('h1');
        if (fail === 0) {
            title.textContent = 'PuniCodex Type — Browser Test Suite ✓ All Passed';
            title.style.color = 'var(--green)';
        } else {
            title.textContent = `PuniCodex Type — Browser Test Suite ✗ ${fail} Failed`;
            title.style.color = 'var(--red)';
        }
    })();
    </script>

<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-BODY-START -->
<div id="university-collaborators-strip" role="complementary" aria-label="Academic Collaborators"></div>
<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-BODY-END -->
</body>
</html>

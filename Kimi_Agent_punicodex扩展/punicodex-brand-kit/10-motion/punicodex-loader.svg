<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="pcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5E3A8"/>
      <stop offset="0.45" stop-color="#C9A23F"/>
      <stop offset="1" stop-color="#8C6A22"/>
    </linearGradient>
  </defs>
  <!-- Ring: draws itself in, then holds -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#pcGold)" stroke-width="1.5"
          stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"
          transform="rotate(-90 50 50)">
    <animate attributeName="stroke-dashoffset" from="276.5" to="0" dur="1.1s"
             calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
  </circle>
  <!-- Column: fades in after the ring begins -->
  <g fill="url(#pcGold)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.6s" fill="freeze"/>
    <rect x="41.5" y="34.5" width="17" height="3.2"/>
    <polygon points="43.2,37.7 56.8,37.7 54.75,41.1 45.25,41.1"/>
    <polygon points="45.25,41.1 54.75,41.1 55.75,67.5 44.25,67.5"/>
    <rect x="42.5" y="67.5" width="15" height="2.8"/>
    <rect x="40.75" y="70.3" width="18.5" height="2.8"/>
  </g>
  <!-- The restored mark: descends from above, then floats forever -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 -34; 0 0" begin="0.9s" dur="0.7s"
                      calcMode="spline" keySplines="0.34 1.3 0.64 1" fill="freeze"/>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -2.2; 0 0" begin="1.7s" dur="2.6s"
                        calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
                        repeatCount="indefinite"/>
      <polygon points="50,21.9 54.6,26.5 50,31.1 45.4,26.5" fill="url(#pcGold)"/>
    </g>
  </g>
</svg>

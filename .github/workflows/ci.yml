name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python (Pillow for the WebP pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: npm run db-init

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm test
        env:
          # Serialize the sharded runner: the full battery is memory-heavy and
          # the parallel phase can exhaust the GitHub-hosted runner, causing a
          # silent process exit. Running one suite at a time is slower but
          # stable, and the divergence gate still validates the full flywheel.
          PUNICODEX_TEST_PARALLELISM: 1
          # 5.5 GB gives the suite enough heap while leaving headroom for the OS,
          # Pillow, and git processes on the ~7 GB GitHub-hosted runner.
          NODE_OPTIONS: --max-old-space-size=5632

      - name: Ensure generated files are in sync
        run: |
          npm run generate
          git diff --exit-code

      - name: Notify founder on failure
        if: failure()
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '{"from":"PuniCodex CI <bookings@punicodex.com>","to":["punicodex@gmail.com"],"subject":"CI battery failed (master)","text":"Commit %s failed the CI test battery — no deploy will follow. Run: %s"}' \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > payload.json
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_KEY" \
            -H 'Content-Type: application/json' \
            -d @payload.json

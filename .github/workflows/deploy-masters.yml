name: deploy-masters

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_PACKAGE: vercel@latest

concurrency:
  group: deploy-masters-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk
        run: |
          rm -rf .git
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the complete media fleet
        run: |
          node scripts/generate-merch-composites.js
          node scripts/sync-masters-composites.js
          node scripts/sync-masters-assets.js
          node scripts/sync-masters-legacy-root.js
          node scripts/generate-local-mockups.js

      - name: Link the masters project
        working-directory: .masters
        run: npx vercel@latest link --yes --project punycodex-masters --token=${{ secrets.VERCEL_TOKEN }}

      - name: Guard and deploy the complete fleet
        run: bash scripts/deploy-masters.sh

      - name: Verify production mockup bytes
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const expected = crypto.createHash('sha256').update(fs.readFileSync('.masters/mockups/zeus-tee.jpg')).digest('hex');
          const url = `https://punycodex-masters.vercel.app/mockups/zeus-tee.jpg?release=${process.env.RELEASE_SHA}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const actual = crypto.createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
                if (actual !== expected) throw new Error('Production bytes do not match the built mockup');
                console.log('Production mockup verified byte-for-byte:', url);
                return;
              } catch (error) {
                if (attempt === 12) throw error;
                console.log(`Production convergence attempt ${attempt}: ${error.message}`);
                await sleep(10000);
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Notify founder on failure
        if: failure()
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '{"from":"PuniCodex CI <bookings@punicodex.com>","to":["punicodex@gmail.com"],"subject":"Deploy chain failed (deploy-masters)","text":"Commit %s failed the media deploy chain. Run: %s"}' \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > payload.json
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_KEY" \
            -H 'Content-Type: application/json' \
            -d @payload.json

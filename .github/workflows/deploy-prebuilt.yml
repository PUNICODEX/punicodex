name: deploy-prebuilt

# Item 4 — build on GitHub's Linux runners (native modules compile for
# Lambda), deploy the prebuilt output. Vercel build CPU ≈ 0.
# Manual trigger only until you are ready to retire CLI deploys:
# Actions → deploy-prebuilt → Run workflow.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — Vercel dashboard → Settings → Tokens → Create
#   VERCEL_ORG_ID      — team_KkmF6bwM5OhEmfskisVAqTY9 (already in .vercel/project.json)
#   VERCEL_PROJECT_ID  — prj_OPmo5PZQZRO8ou4tADJr47WaYwwk (same file)

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (functions + static, Linux binaries)
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            if URL=$(npx vercel@latest deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}); then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Deployed: $URL"
              exit 0
            fi
            echo "Attempt $attempt failed — retrying in 20s"
            sleep 20
          done
          echo "All deploy attempts failed"
          exit 1

      - name: Alias production domains
        run: |
          npx vercel@latest alias "${{ steps.deploy.outputs.url }}" punicodex.com --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest alias "${{ steps.deploy.outputs.url }}" www.punicodex.com --token=${{ secrets.VERCEL_TOKEN }}

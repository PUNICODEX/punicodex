name: deploy-prebuilt

# Item 4 — build on GitHub's Linux runners (native modules compile for
# Lambda), deploy the prebuilt output. Vercel build CPU ≈ 0.
# Manual trigger only until you are ready to retire CLI deploys:
# Actions → deploy-prebuilt → Run workflow.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — Vercel dashboard → Settings → Tokens → Create
#   VERCEL_ORG_ID      — team_KkmF6bwM5OhEmfskisVAqTY9 (already in .vercel/project.json)
#   VERCEL_PROJECT_ID  — prj_OPmo5PZQZRO8ou4tADJr47WaYwwk (same file)

on:
  # Manual: Actions → deploy-prebuilt → Run workflow.
  workflow_dispatch:
  # Automatic: fires when the CI workflow (full test battery + divergence
  # gate) completes on master — deploys only if the battery is green.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Serialize production deploys; never cancel one mid-flight (a half-aliased
# deploy is worse than a queued one).
concurrency:
  group: deploy-prebuilt-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Vercel project's Node.js version (24.x) — native
          # modules (better-sqlite3, bcrypt, sharp) fetch prebuilds for the
          # ABI of THIS Node, and the Lambda runtime must match it.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the seed SQLite DB (schema + seed data)
        # Local CLI deploys bundle the developer's gitignored platform/db/punicodex.db;
        # a fresh CI checkout has none, so create the equivalent seed DB here.
        run: npm run db-init

      - name: Pull Vercel project settings
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (functions + static, Linux binaries)
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            if URL=$(npx vercel@latest deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}); then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Deployed: $URL"
              exit 0
            fi
            echo "Attempt $attempt failed — retrying in 20s"
            sleep 20
          done
          echo "All deploy attempts failed"
          exit 1

      - name: Alias production domains
        run: |
          npx vercel@latest alias "${{ steps.deploy.outputs.url }}" punicodex.com --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest alias "${{ steps.deploy.outputs.url }}" www.punicodex.com --token=${{ secrets.VERCEL_TOKEN }}

      - name: Notify founder on failure
        if: failure()
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '{"from":"PuniCodex CI <bookings@punicodex.com>","to":["punicodex@gmail.com"],"subject":"Deploy chain failed (deploy-prebuilt)","text":"Commit %s failed the deploy-prebuilt chain. Run: %s"}' \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > payload.json
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_KEY" \
            -H 'Content-Type: application/json' \
            -d @payload.json

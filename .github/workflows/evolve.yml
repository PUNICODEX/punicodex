name: PUNICODEX Evolution

on:
  # Run on every push while we stabilize; later this can become nightly + dispatch.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 04:17 UTC — off-peak, avoids the :00/:30 herd.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      operational:
        description: 'Run operational tasks (crawls, availability, curator)'
        required: false
        default: 'false'
      skip_divergence:
        description: 'Skip the divergence gate'
        required: false
        default: 'false'

# One evolution cycle at a time per ref — a newer push supersedes a stale
# in-progress cycle (its regeneration would be re-run against newer code
# anyway).
concurrency:
  group: evolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python (Pillow for the WebP pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: npm run db-init

      - name: Run evolution cycle
        env:
          # Keep the merch-composite sync from hanging the runner.
          PUNICODEX_SYNC_MASTERS_CONCURRENCY: 8
          PUNICODEX_SYNC_MASTERS_COMPRESSION_LEVEL: 6
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.operational }}" = "true" ]; then
            FLAGS="$FLAGS --operational"
          fi
          if [ "${{ github.event.inputs.skip_divergence }}" = "true" ]; then
            FLAGS="$FLAGS --skip-divergence"
          fi
          node scripts/evolve.js $FLAGS

      - name: Upload evolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-report-${{ github.run_id }}
          path: |
            data-version.json
            ai-curator-report.json
            platform/db/punicodex.db

<!DOCTYPE html>
<html lang="en">
<head>
<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-HEAD-START -->
<link rel="stylesheet" href="/css/university-collaborators.css?v=2">
<script src="/js/university-collaborators.js?v=2" defer></script>
<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-HEAD-END -->


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUNICODEX — Entry</title>
  <meta name="description" content="Scholarly lexicon entry on PUNICODEX — Unicode restoration, tier classification, sources, and indexed sites.">
  <meta name="theme-color" content="#D4AF37">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://punicodex.com/entry.html">
  <meta property="og:title" content="PUNICODEX — Entry">
  <meta property="og:description" content="Scholarly lexicon entry — Unicode restoration, tier classification, sources, and indexed sites.">
  <meta property="og:url" content="https://punicodex.com/entry.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PUNICODEX">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PUNICODEX — Entry">
  <meta name="twitter:description" content="Scholarly lexicon entry — Unicode restoration, tier classification, sources, and indexed sites.">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    :root {
      --entry-bg: var(--void);
      --entry-surface: var(--surface-raised);
      --entry-surface-2: var(--surface-raised);
      --entry-surface-hover: var(--hover);
      --entry-text: var(--text-primary);
      --entry-text-dim: var(--text-secondary);
      --entry-accent: var(--gold);
      --entry-accent-glow: var(--gold-glow);
      --entry-border: var(--border);
      --entry-live: var(--blue);
      --entry-available: var(--emerald);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--entry-bg);
      color: var(--entry-text);
      min-height: 100vh;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* Utility header */
    .px-utility-header {
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--entry-border);
      background: var(--entry-bg);
    }
    .px-utility-header-inner {
      max-width: var(--container-narrow);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    .px-utility-wordmark {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 600;
      color: var(--entry-accent);
      letter-spacing: 0.05em;
    }
    .px-utility-wordmark:hover { color: var(--gold-bright); }
    .px-utility-back {
      margin-left: auto;
      font-size: var(--text-sm);
      color: var(--entry-text-dim);
    }
    .px-utility-back:hover { color: var(--entry-accent); }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: var(--space-6) var(--space-5);
    }

    .loading, .error {
      text-align: center;
      padding: var(--space-9) var(--space-5);
      color: var(--entry-text-dim);
    }

    .error { color: var(--crimson); }

    /* Hero */
    .hero {
      text-align: center;
      padding: var(--space-6) 0 var(--space-5);
      border-bottom: 1px solid var(--entry-border);
      margin-bottom: var(--space-5);
    }

    .hero-unicode {
      font-size: var(--text-5xl);
      font-weight: 800;
      color: var(--entry-text);
      line-height: 1.2;
    }

    .hero-greek {
      font-size: var(--text-2xl);
      color: var(--entry-text-dim);
      margin-top: var(--space-3);
      font-family: var(--font-display);
    }

    .hero-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-3);
      margin-top: var(--space-4);
      flex-wrap: wrap;
    }

    .tier-badge {
      font-size: var(--text-xs);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-sm);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .tier-dual { background: var(--gold-dim); color: var(--tier-dual); }
    .tier-1 { background: rgba(var(--emerald-rgb), 0.12); color: var(--tier-1); }
    .tier-2 { background: rgba(var(--blue-rgb), 0.12); color: var(--tier-2); }

    .pantheon-badge {
      font-size: var(--text-base);
      color: var(--entry-text-dim);
      text-transform: capitalize;
    }

    .ascii-badge {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--entry-text-dim);
      background: var(--entry-surface-2);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }

    /* Sections */
    .section {
      background: var(--entry-surface);
      border: 1px solid var(--entry-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
    }

    .section-title {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--entry-text-dim);
      margin-bottom: var(--space-3);
      font-weight: 600;
    }

    .meaning {
      font-size: var(--text-lg);
      color: var(--entry-text);
    }

    .domain {
      font-size: var(--text-base);
      color: var(--entry-text-dim);
      margin-top: var(--space-2);
    }

    .etymology {
      font-size: var(--text-sm);
      color: var(--entry-text-dim);
      font-style: italic;
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--entry-border);
    }

    /* Breakdown table */
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
    }

    .breakdown-table th {
      text-align: left;
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--entry-text-dim);
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--entry-border);
      font-weight: 600;
    }

    .breakdown-table td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--entry-border);
      font-size: var(--text-base);
    }

    .breakdown-table tr:last-child td {
      border-bottom: none;
    }

    .bd-char {
      font-family: var(--font-mono);
      color: var(--entry-text-dim);
      font-size: var(--text-sm);
    }

    .bd-to {
      font-size: var(--text-lg);
      font-weight: 600;
    }

    .bd-type {
      font-size: var(--text-xs);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-weight: 600;
      text-transform: uppercase;
    }

    .type-same { background: var(--border); color: var(--text-secondary); }
    .type-stress { background: rgba(var(--blue-rgb), 0.12); color: var(--tier-2); }
    .type-length { background: rgba(var(--emerald-rgb), 0.12); color: var(--tier-1); }
    .type-dual { background: var(--gold-dim); color: var(--tier-dual); }
    .type-special { background: rgba(232, 126, 126, 0.15); color: #e8a87e; }
    .type-drop { background: rgba(242, 242, 245, 0.05); color: var(--text-dim); }

    .bd-note {
      color: var(--entry-text-dim);
      font-size: var(--text-sm);
    }

    /* Sources */
    .sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .source-tag {
      font-size: var(--text-sm);
      background: var(--entry-surface-2);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      color: var(--entry-text-dim);
    }

    /* Site card */
    .site-card {
      background: var(--entry-surface-2);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-top: var(--space-2);
    }

    .site-card-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .live-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--entry-live);
      box-shadow: 0 0 8px var(--entry-live);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .live-label {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--entry-live);
      font-weight: 600;
    }

    .site-domain {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--entry-accent);
      margin-bottom: var(--space-2);
    }

    .site-title {
      font-size: var(--text-lg);
      font-weight: 600;
      margin-bottom: var(--space-1);
    }

    .site-description {
      font-size: var(--text-sm);
      color: var(--entry-text-dim);
    }

    .site-actions {
      margin-top: var(--space-4);
      display: flex;
      gap: var(--space-3);
    }

    .site-link {
      font-size: var(--text-sm);
      color: var(--entry-text);
      text-decoration: none;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--entry-surface);
      border: 1px solid var(--entry-border);
      transition: border-color 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }

    .site-link:hover {
      border-color: var(--entry-accent);
      color: var(--entry-accent);
    }

    .site-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .site-link.primary {
      background: var(--entry-accent);
      color: var(--void);
      border-color: var(--entry-accent);
      font-weight: 600;
    }

    .site-link.primary:hover {
      background: var(--gold-bright);
      color: var(--void);
    }

    /* Availability */
    .available-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--entry-available);
      background: rgba(var(--emerald-rgb), 0.1);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-3);
    }

    .available-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--entry-available);
    }

    .registrar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .registrar-link {
      font-size: var(--text-xs);
      color: var(--entry-text-dim);
      text-decoration: none;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      background: var(--entry-bg);
      border: 1px solid var(--entry-border);
      text-align: center;
      transition: border-color 0.2s, color 0.2s;
    }

    .registrar-link:hover {
      border-color: var(--entry-available);
      color: var(--entry-available);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--entry-text-dim);
      text-decoration: none;
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--entry-accent);
    }

    /* Utility footer */
    .px-utility-footer {
      text-align: center;
      padding: var(--space-6) var(--space-5);
      border-top: 1px solid var(--entry-border);
      color: var(--text-dim);
      font-size: var(--text-xs);
    }

    @media (max-width: 600px) {
      .hero-unicode { font-size: var(--text-4xl); }
      .hero-greek { font-size: var(--text-xl); }
      .breakdown-table th, .breakdown-table td { padding: var(--space-2); }
      .px-utility-header { padding: var(--space-4) var(--space-5); }
    }
  </style>
</head>
<body>
  <header class="px-utility-header">
    <div class="px-utility-header-inner">
      <a href="/" class="px-utility-wordmark">PUNICODEX</a>
      <a href="search.html" class="px-utility-back">← Back to Search</a>
    </div>
  </header>

  <main id="main">
    <div class="loading">Loading entry...</div>
  </main>

  

<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-BODY-START -->
<div id="university-collaborators-strip" role="complementary" aria-label="Academic Collaborators"></div>
<!-- PUNICODEX-UNIVERSITY-COLLABORATORS-BODY-END -->
<footer class="px-utility-footer">
    <p>© 2026 PuniCodex. All rites reserved.</p>
  </footer>

  <script>
    const API_BASE = '';
    const params = new URLSearchParams(location.search);
    const entryId = params.get('id');

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadEntry() {
      const main = document.getElementById('main');

      if (!entryId) {
        main.innerHTML = '<div class="error">No entry ID specified.</div>';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/entry/${encodeURIComponent(entryId)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const entry = await res.json();
        renderEntry(entry);
      } catch (e) {
        main.innerHTML = `<div class="error">Failed to load entry: ${escapeHtml(e.message)}</div>`;
      }
    }

    function renderEntry(entry) {
      const main = document.getElementById('main');
      const tierClass = entry.tier === 'dual' ? 'tier-dual' : entry.tier === '1' ? 'tier-1' : 'tier-2';
      const tierLabel = entry.tier === 'dual' ? 'Dual-Tier' : `Tier ${entry.tier}`;

      let html = `<a href="search.html" class="back-link">← Back to Search</a>`;

      // Hero
      html += `
        <div class="hero">
          <div class="hero-unicode">${escapeHtml(entry.unicode)}</div>
          ${entry.greek && entry.greek !== '—' ? `<div class="hero-greek">${escapeHtml(entry.greek)}</div>` : ''}
          <div class="hero-meta">
            <span class="tier-badge ${tierClass}">${tierLabel}</span>
            <span class="pantheon-badge">${escapeHtml(entry.pantheon)}</span>
            <span class="ascii-badge">ASCII: ${escapeHtml(entry.ascii)}</span>
          </div>
        </div>
      `;

      // Meaning & Domain
      html += `
        <div class="section">
          <div class="section-title">Meaning & Domain</div>
          <div class="meaning">${escapeHtml(entry.meaning || '')}</div>
          ${entry.domain ? `<div class="domain">${escapeHtml(entry.domain)}</div>` : ''}
        </div>
      `;

      // Character Breakdown
      if (entry.breakdown && entry.breakdown.length > 0) {
        html += `
          <div class="section">
            <div class="section-title">Character Breakdown (${entry.breakdown.length} chars)</div>
            <table class="breakdown-table">
              <thead>
                <tr>
                  <th>ASCII</th>
                  <th>Unicode</th>
                  <th>Type</th>
                  <th>Note</th>
                </tr>
              </thead>
              <tbody>
        `;
        entry.breakdown.forEach(bd => {
          const typeClass = `type-${bd.type}`;
          html += `
            <tr>
              <td class="bd-char">${escapeHtml(bd.char)}</td>
              <td class="bd-to">${escapeHtml(bd.to || '')}</td>
              <td><span class="bd-type ${typeClass}">${escapeHtml(bd.type)}</span></td>
              <td class="bd-note">${escapeHtml(bd.note || '')}</td>
            </tr>
          `;
        });
        html += `</tbody></table></div>`;
      }

      // Sources
      if (entry.sources && entry.sources.length > 0) {
        html += `
          <div class="section">
            <div class="section-title">Sources</div>
            <div class="sources-list">
              ${entry.sources.map(s => `<span class="source-tag">${escapeHtml(s)}</span>`).join('')}
            </div>
          </div>
        `;
      }

      // Live Site
      if (entry.site) {
        const site = entry.site;
        html += `
          <div class="section">
            <div class="section-title">Indexed Site</div>
            <div class="site-card">
              <div class="site-card-header">
                <span class="live-indicator"></span>
                <span class="live-label">Live</span>
              </div>
              <div class="site-domain">${escapeHtml(site.punycode)} <span style="color:var(--entry-text-dim)">(${escapeHtml(site.domain)})</span></div>
              ${site.title ? `<div class="site-title">${escapeHtml(site.title)}</div>` : ''}
              ${site.description ? `<div class="site-description">${escapeHtml(site.description)}</div>` : ''}
              <div class="site-actions">
                <a href="https://${escapeHtml(site.punycode)}" target="_blank" rel="noopener" class="site-link primary">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                  Visit Site
                </a>
              </div>
            </div>
          </div>
        `;
      }

      // Availability
      else if (entry.availability) {
        const puny = entry.punycode || entry.ascii + '.com';
        const unicode = entry.unicode + '.com';
        html += `
          <div class="section">
            <div class="section-title">Availability</div>
            <div class="available-badge">Available for Registration</div>
            <div class="site-domain">${escapeHtml(puny)} <span style="color:var(--entry-text-dim)">(${escapeHtml(unicode)})</span></div>
            <div class="site-description" style="margin-top:var(--space-2)">No indexed site found. This Unicode domain name may be available for registration.</div>
            <div class="registrar-grid">
              <a href="https://www.godaddy.com/domainsearch/find?domainToCheck=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">GoDaddy</a>
              <a href="https://www.namecheap.com/domains/registration/results/?domain=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">Namecheap</a>
              <a href="https://porkbun.com/checkout/search?q=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">Porkbun</a>
              <a href="https://www.dynadot.com/domain/search.html?domain=${encodeURIComponent(puny)}" target="_blank" rel="noopener" class="registrar-link">Dynadot</a>
            </div>
          </div>
        `;
      }

      main.innerHTML = html;
      document.title = `${entry.unicode} — PUNICODEX`;
    }

    loadEntry();
  </script>
</body>
</html>
